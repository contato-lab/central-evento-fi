  // ═══════════════════════════════════════════════════════════════
  // MODULO 3 — STORYMAKER
  // Checklist em dois niveis: bloco ("Show Matuê") e itens ("Story 1: público").
  // UM DOCUMENTO POR ITEM, com o bloco como campo. Assim dois storymakers
  // marcando itens do mesmo bloco ao mesmo tempo nao se atropelam.
  // ═══════════════════════════════════════════════════════════════
  // Casa por PEDACO do nome: "Michelly e Anna" conta pra Michelly e pra Anna,
  // porque o item e das duas. Sem isso o filtro esconderia justo o trabalho
  // compartilhado, que e o que mais se perde.
  function ehMeuItem(s){
    if(!meuNome) return true;
    return String(s.resp||"").toLowerCase().indexOf(meuNome.toLowerCase()) >= 0;
  }

  // ---- ORDEM DA LISTA (StoryMaker e Fotos) -----------------------
  // Pedido da Fernanda em 20/08: poder subir e descer os proprios checks.
  //
  // A ordem mora no campo "ord". Documento antigo nao tem esse campo e cai no
  // criadoEm, que e o que ja ordenava antes: ninguem precisa mexer no que ja
  // existe pra continuar na mesma sequencia de sempre.
  //
  // Por que nao guardar "ord" so na tela: sao 5 a 8 pessoas no mesmo checklist.
  // Ordem que so existe no celular de quem arrastou nao ajuda o time, e some no
  // primeiro F5. Fica no banco pra todo mundo ver a mesma lista.
  function ordDe(it){
    var n = (it && typeof it.ord === "number") ? it.ord : (it && it.criadoEm) || 0;
    return isNaN(n) ? 0 : n;
  }
  // Regrava a sequencia inteira a partir da lista JA na ordem desejada, e so
  // escreve onde o numero mudou. Sem isso, uma troca de posicao viraria escrita
  // em todos os itens do dia a cada clique.
  //
  // O passo de 10 deixa buraco entre um item e outro: item criado depois cai no
  // fim (criadoEm e casa dos trilhoes) sem embaralhar quem ja foi ordenado.
  function regravarOrdem(colecao, lista){
    var mudou = 0;
    for(var i=0;i<lista.length;i++){
      var alvo = (i+1)*10;
      if(lista[i] && lista[i].ord !== alvo){
        DBupdate(colecao, lista[i].id, { ord: alvo });
        mudou++;
      }
    }
    return mudou;
  }
  // Move o elemento da posicao i uma casa pra dir (-1 sobe, +1 desce) e devolve
  // a lista nova. Fora da faixa, devolve null: quem chamou nao grava nada.
  function trocarNaLista(lista, i, dir){
    var j = i + dir;
    if(i < 0 || i >= lista.length || j < 0 || j >= lista.length) return null;
    var copia = lista.slice();
    var t = copia[i]; copia[i] = copia[j]; copia[j] = t;
    return copia;
  }
  // Mesmo agrupamento que a tela desenha, so que sem o filtro "só as minhas".
  // Precisa ser o MESMO criterio do render: se as duas listas discordassem, a
  // seta moveria uma coisa e a tela mostraria outra subindo.
  function listaOrdenadaDoDia(dia){
    var doDia = story.filter(function(s){ return s.dia === dia; });
    doDia.sort(function(a,b){ return ordDe(a)-ordDe(b); });
    var ordem=[], grupos={}, i;
    for(i=0;i<doDia.length;i++){
      var g = doDia[i].grupo || "Sem bloco";
      if(!grupos[g]){ grupos[g]=[]; ordem.push(g); }
      grupos[g].push(doDia[i]);
    }
    ordem.sort(function(a,b){
      var fa = mesmoEstado(grupos[a]), fb = mesmoEstado(grupos[b]);
      if(fa !== fb) return fa ? 1 : -1;
      return 0;
    });
    return { ordem:ordem, grupos:grupos };
  }
  // bloco "fechado" = todo item marcado. E o que manda ele pro fim da lista.
  function mesmoEstado(itens){
    return (itens||[]).every(function(s){ return s.feito; });
  }
  // As duas setas de um item. "trava" desliga a seta na ponta da lista.
  function setasHTML(act, id, podeSubir, podeDescer, extra){
    return '<span class="mover">'+
      '<button class="mvbtn" data-act="'+act+'" data-dir="-1" data-id="'+esc(id)+'"'+
        (extra||'')+(podeSubir?'':' disabled')+' aria-label="Subir" title="Subir">&#9650;</button>'+
      '<button class="mvbtn" data-act="'+act+'" data-dir="1" data-id="'+esc(id)+'"'+
        (extra||'')+(podeDescer?'':' disabled')+' aria-label="Descer" title="Descer">&#9660;</button>'+
    '</span>';
  }

  function hojeISO(){
    var d = new Date(), m = String(d.getMonth()+1).padStart(2,"0"), x = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+x;
  }
  // Ancorado na edicao ABERTA, nunca na lista dos nove dias. Se ficasse na lista
  // inteira, trocar pra auto com "2026-08-16" guardado deixava StoryMaker e
  // Fotos desenhando vazio, com a fita sem nenhum dia aceso — e o time em campo
  // le isso como "o sistema perdeu tudo".
  function diaStoryAtual(){
    var dias = diasDaEdicao(edicaoPorId(edicaoVista));
    if(!dias.length) return "";
    var i;
    if(diaStory){
      for(i=0;i<dias.length;i++){ if(dias[i].dia === diaStory) return diaStory; }
      diaStory = null;   // era de outra edicao: esquece em vez de mostrar vazio
    }
    var hj = hojeISO();
    for(i=0;i<dias.length;i++){ if(dias[i].dia === hj) return hj; }
    // fora dos dias da edicao: antes dela abre no primeiro, depois no ultimo
    return hj < dias[0].dia ? dias[0].dia : dias[dias.length-1].dia;
  }
  function diaColetivaAtual(){
    var daEd = COLETIVAS.filter(function(g){ return (g.edicao||"moto") === edicaoVista; });
    if(!daEd.length) return null;              // grade da edicao ainda nao digitada
    var i;
    if(diaColetiva){
      for(i=0;i<daEd.length;i++){ if(daEd[i].dia === diaColetiva) return diaColetiva; }
    }
    var hj = hojeISO();
    for(i=0;i<daEd.length;i++){ if(daEd[i].dia === hj) return hj; }
    return daEd[0].dia;
  }
  // A barra de edicao, igual em todas as abas. Mostra a que esta na tela, a
  // faixa de datas, e um atalho apagado pra cada outra. A encerrada vem com
  // borda pontilhada pra nao convidar ao toque no meio do evento.
  function barraEdicaoHTML(contaPorEdicao){
    var atual = edicaoPorId(edicaoVista) || edicaoCorrente();
    var h = '';
    if(edicaoEncerrada(atual)){
      h += '<div class="avisoed"><span class="txt">Você está vendo a '+esc(atual.rotulo)+
        ', que já aconteceu. Aqui só dá para consultar.</span>'+
        '<button type="button" data-act="edicao" data-ed="'+edicaoCorrente().id+'">Voltar</button></div>';
    }
    h += '<div class="edbar"><span class="edtitulo">'+esc(atual.rotulo)+'</span>'+
         '<span class="edfaixa">'+faixaDe(atual)+'</span><span class="espaco"></span>';
    EDICOES.forEach(function(e){
      if(e.id === atual.id) return;
      var n = contaPorEdicao ? contaPorEdicao(e) : null;
      h += '<button type="button" class="edtrocar'+(edicaoEncerrada(e)?' encerrada':'')+'" '+
           'data-act="edicao" data-ed="'+e.id+'">'+esc(e.rotulo.replace("Edição ",""))+
           (edicaoEncerrada(e)?' · encerrada':'')+(n===null?'':' · '+n)+'</button>';
    });
    return h + '</div>';
  }
  // De que edicao e um documento, pelo campo dia. Nunca gravado, sempre deduzido.
  function edicaoDoItem(it){
    var ed = edicaoDoDia(it && it.dia);
    return ed ? ed.id : null;
  }
  function daEdicaoVista(lista){
    return daEdicaoVistaDe(lista, edicaoPorId(edicaoVista));
  }
  // uma so definicao de "quantas coletivas tem a edicao X", usada pelos dois
  // ramos da aba (grade existe / grade ainda nao digitada)
  function contaColetivasDaEdicao(e){
    return COLETIVAS.filter(function(g){ return (g.edicao||"moto") === e.id; })
                    .reduce(function(s,g){ return s + g.itens.length; }, 0);
  }
  function daEdicaoVistaDe(lista, ed){
    if(!ed) return [];
    return (lista||[]).filter(function(it){ return edicaoDoItem(it) === ed.id; });
  }

  function renderStory(){
    var el = $("#view-story");
    if(!podeVer("story")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div></div>';
      return;
    }
    var dia = diaStoryAtual(), i, h='';
    var doDia = story.filter(function(s){ return s.dia === dia; });
    var feitos = doDia.filter(function(s){ return s.feito; }).length;

    // quem ainda tem item em aberto: e pra isso que o campo responsavel existe
    var abertosPor = {};
    for(i=0;i<doDia.length;i++){
      if(!doDia[i].feito && doDia[i].resp){
        abertosPor[doDia[i].resp] = (abertosPor[doDia[i].resp]||0) + 1;
      }
    }
    var nomes = Object.keys(abertosPor).sort();

    h = barraEdicaoHTML(function(e){
      return daEdicaoVistaDe(story, e).length;
    }) + h;
    h += '<div class="subtabs">';
    var diasEd = diasDaEdicao(edicaoPorId(edicaoVista));
    for(i=0;i<diasEd.length;i++){
      h += '<button class="subtab'+(diasEd[i].dia===dia?" active":"")+'" data-act="diastory" data-dia="'+diasEd[i].dia+'">'+esc(diasEd[i].rotulo)+'</button>';
    }
    h += '</div>';

    h += '<div class="resumo">'+
      '<div class="rbox"><div class="rk">Itens do dia</div><div class="rv">'+doDia.length+'</div></div>'+
      '<div class="rbox destaque"><div class="rk">Feitos</div><div class="rv">'+feitos+'</div></div>'+
      '<div class="rbox'+((doDia.length-feitos)?" alerta":"")+'"><div class="rk">Em aberto</div><div class="rv">'+(doDia.length-feitos)+'</div></div>'+
    '</div>';

    if(nomes.length){
      var txt = nomes.map(function(n){ return esc(n)+" ("+abertosPor[n]+")"; }).join(" · ");
      h += '<div class="rulebox"><div class="ic">&#9679;</div><div class="tx"><b>Ainda em aberto:</b> '+txt+'</div></div>';
    }

    // "Só as minhas": com 24 itens em 4 blocos, quem esta em campo precisa achar
    // os proprios sem ler a lista toda. Casa por pedaco do nome, entao
    // "Michelly e Anna" aparece pra Michelly E pra Anna, que e o certo: e das duas.
    h += '<div class="fchips">'+
      '<button class="fchip destaque'+(fMinhasStory?" on":"")+'" data-act="fminhasstory">'+
      (meuNome ? "Só as minhas ("+esc(meuNome.split(" ")[0])+")" : "Só as minhas")+'</button>'+
      (fMinhasStory ? '<button class="fchip" data-act="fminhasstory">Ver todas</button>' : '')+
    '</div>';

    if(podeGerenciar("story")){
      if(criandoBloco)       h += formBlocoHTML();
      else if(criandoMarcas) h += formMarcasHTML();
      else h += '<div class="barrafiltro">'+
             '<button class="btn" data-act="novobloco">+ Novo bloco</button>'+
             (marcasDaEdicao().length
               ? '<button class="btn ghost" data-act="blocosmarcas">+ Blocos das marcas</button>'
               : '')+
           '</div>';
    }

    // agrupa por bloco, preservando a ordem de criacao do primeiro item
    var ordem=[], grupos={};
    doDia.sort(function(a,b){ return ordDe(a)-ordDe(b); });
    for(i=0;i<doDia.length;i++){
      if(fMinhasStory && !ehMeuItem(doDia[i])) continue;
      var g = doDia[i].grupo || "Sem bloco";
      if(!grupos[g]){ grupos[g]=[]; ordem.push(g); }
      grupos[g].push(doDia[i]);
    }

    // "Pronto desce pro fim": bloco fechado sai da frente e o proximo em aberto
    // sobe sozinho. Ordenacao por ESTADO, nao arrastada a mao de proposito: ordem
    // salva no banco brigaria entre as 5-8 pessoas usando ao mesmo tempo.
    ordem.sort(function(a,b){
      var fa = grupos[a].every(function(s){ return s.feito; });
      var fb = grupos[b].every(function(s){ return s.feito; });
      if(fa !== fb) return fa ? 1 : -1;
      return 0;   // dentro do mesmo estado, mantem a ordem do dia
    });

    if(!ordem.length){
      h += fMinhasStory
        ? '<div class="vazio"><div class="big">Nada seu neste dia</div>'+
          '<div class="sm">Nenhum item está no seu nome aqui. Toque em <b>Ver todas</b> para ver o checklist inteiro.</div></div>'
        : '<div class="vazio"><div class="big">Nenhum checklist para este dia</div>'+
          '<div class="sm">'+(podeGerenciar("story")
            ? "Toque em <b>+ Novo bloco</b>, dê um nome (por exemplo <b>Show Matuê</b>) e escreva um item por linha."
            : "A coordenação ainda não montou o checklist deste dia.")+'</div></div>';
    }

    for(i=0;i<ordem.length;i++){
      var nome = ordem[i], itens = grupos[nome];
      var okG = itens.filter(function(s){ return s.feito; }).length;
      var area = itens[0].area || "";
      var cheio = okG === itens.length;
      // Recolhe SOZINHO quando fecha (ideia da Isa), e o toque no cabecalho
      // abre e fecha qualquer bloco na mao. Quem reabriu um bloco fechado fica
      // marcado em reabertos: o automatico nao insiste em fechar de novo.
      var min = cheio ? !reabertos[nome] : !!recolhidos[nome];
      // Setas do BLOCO. Bloco fechado ja desce sozinho pro fim da lista, e essa
      // regra continua valendo: as setas movem dentro do mesmo estado, nunca
      // por cima dela. Se movessem, o clique subiria o bloco e a regra o jogaria
      // de volta pra baixo na mesma hora, e a seta pareceria quebrada.
      var vizinhoAcima = i > 0 && mesmoEstado(grupos[ordem[i-1]]) === cheio;
      var vizinhoAbaixo = i < ordem.length-1 && mesmoEstado(grupos[ordem[i+1]]) === cheio;
      h += '<div class="bloco'+(cheio?" completo":"")+(min?" recolhido":"")+'">'+
        '<div class="blocotopo">'+
        '<button class="cabeca" data-act="dobrar" data-bloco="'+esc(nome)+'" '+
          'aria-expanded="'+(min?"false":"true")+'">'+
          '<span class="cmeio"><span class="cnome">'+(cheio?"&#10003; ":"")+esc(nome)+'</span>'+
          (area && !min ?'<span class="cinflu">'+esc(area)+'</span>':'')+'</span>'+
          (cheio && min ? '<span class="tag st" data-st="publicado">Pronto</span>' : '')+
          '<span class="cprog'+(cheio?" ok":"")+'">'+okG+'/'+itens.length+'</span>'+
          '<span class="cmais">'+(min?"+":"&minus;")+'</span>'+
        '</button>'+
        (podeGerenciar("story") && !fMinhasStory
          ? setasHTML("movbloco", nome, vizinhoAcima, vizinhoAbaixo)
          : '')+
        '</div>';
      if(min){ h += '</div>'; continue; }
      h += '<div class="corpo">';
      for(var j=0;j<itens.length;j++){
        var s = itens[j];
        h += '<div class="chk'+(s.feito?" feito":"")+'">'+
          '<button class="chkbox'+(s.feito?" on":"")+'" data-act="chk" data-id="'+s.id+'" '+
            'aria-pressed="'+(s.feito?"true":"false")+'" aria-label="Marcar como feito">&#10003;</button>'+
          // o item do checklist tambem leva link colado (pasta do dia, referencia)
          '<span class="chktx">'+linkar(s.texto||"")+
            '<span class="chkresp">'+(s.resp?'<b>'+esc(s.resp)+'</b>':'<button class="chkdel" data-act="quem" data-id="'+s.id+'" style="font-size:.62rem;letter-spacing:.06em">definir responsável</button>')+
            (s.resp?' · <button class="chkdel" data-act="quem" data-id="'+s.id+'" style="font-size:.62rem">trocar</button>':'')+
            '</span>'+
          '</span>'+
          // Setas do ITEM. Somem com o filtro "só as minhas" ligado: ali a lista
          // na tela e um recorte, e subir dentro do recorte nao diz onde o item
          // cai na lista que o resto do time enxerga.
          (podeGerenciar("story") && !fMinhasStory
            ? setasHTML("movitem", s.id, j > 0, j < itens.length-1,
                        ' data-bloco="'+esc(nome)+'"')
            : '')+
          (podeApagar("story")?'<button class="chkdel" data-act="delstory" data-id="'+s.id+'" aria-label="Apagar item">&times;</button>':'')+
        '</div>';
      }
      if(podeGerenciar("story")){
        h += '<div class="acoes"><button class="btn ghost" data-act="additem" data-grupo="'+esc(nome)+'" data-area="'+esc(area)+'">+ Item neste bloco</button></div>';
      }
      h += '</div></div>';
    }
    el.innerHTML = h;
  }

  // ═══════════════════════════════════════════════════════════════
  // RENDER GERAL
  // ═══════════════════════════════════════════════════════════════
  function contadores(){
    // Os quatro numeros do topo passam a contar SO a edicao aberta. Antes o
    // badge dizia 23 pecas enquanto a tela mostrava outro conjunto, e ninguem
    // sabia de onde vinha a diferenca.
    var i, totalCol=0;
    for(i=0;i<COLETIVAS.length;i++){
      if((COLETIVAS[i].edicao||"moto") === edicaoVista) totalCol += COLETIVAS[i].itens.length;
    }
    var el;
    el=$("#cColetivas"); if(el) el.textContent = totalCol;
    el=$("#cPecas");     if(el) el.textContent = daEdicaoVista(pecas).length;
    el=$("#cFotos"); if(el){
      var dF = diaStoryAtual();
      // conta o que AINDA NAO esta tratado: e o que falta, nao o que ja foi
      el.textContent = fotos.filter(function(f){ return f.dia===dF && !f.tratado; }).length;
    }
    el=$("#cStory");     if(el){
      var dia = diaStoryAtual();
      el.textContent = story.filter(function(s){ return s.dia===dia && !s.feito; }).length;
    }
    // Igual aos outros: o numero e o QUE FALTA, nao o total. Serve pra saber
    // se ainda tem trabalho sem precisar abrir a aba.
    el=$("#cFotorel");   if(el){ try{ el.textContent = frContas().falta; }catch(e){} }
  }

  // ═══════════════════════════════════════════════════════════════
  // FOTORELATORIO
  // Checklist puro: marca e desmarca, nada de link, prazo ou responsavel.
  // Quem esta em campo vai usar isso de pe, no sol, com o celular numa mao.
  // Por isso: linha inteira clicavel, filtro "só o que falta" e progresso por
  // grupo. Sem formulario, sem confirmacao, sem passo extra.
  // ═══════════════════════════════════════════════════════════════
  // GRAVA POR FORA DE bloqueiaSeArquivo(), e isso e de proposito.
  //
  // Aquela trava existe pra impedir que alguem edite peca de uma edicao
  // ENCERRADA sem perceber, e ela olha a edicao que a tela esta mostrando
  // (edicaoVista), que e compartilhada pelas outras abas. O fotorelatorio nao
  // tem edicao: e uma lista so, da auto. Se a pessoa tivesse deixado a fita na
  // moto em outra aba, o check aqui seria RECUSADO EM SILENCIO, com o item
  // voltando a desmarcado sozinho e ninguem entendendo por que.
  function frGravar(id, marcar){
    if(!FB_ON){
      var a = lsGet("fotorel").filter(function(x){ return x.id !== id; });
      if(marcar) a.push({ id:id, por: meuNome || quemSou(), em: Date.now() });
      lsSet("fotorel", a);
      fotorel = lsGet("fotorel"); renderFotorel(); contadores();
      return;
    }
    var ref = db.collection(COL.fotorel).doc(id);
    var p = marcar
      ? ref.set({ por: meuNome || quemSou(), em: Date.now() })
      : ref["delete"]();
    p["catch"](function(e){ avisoDeFalha(e); toast(marcar ? "Não deu para marcar." : "Não deu para desmarcar."); });
  }

  // UMA COLECAO, DOIS TIPOS DE DOCUMENTO, e da pra distinguir sem campo de tipo:
  //   item da lista fixa  -> id fr_auto_<g>_<i>, guarda so { por, em }.
  //                          O documento EXISTIR ja quer dizer "marcado".
  //   item criado no dia  -> id automatico, guarda { texto, feito, por, em }.
  //                          Aqui o documento existe desde que foi criado, entao
  //                          quem diz se esta marcado e o campo feito.
  // Quem tem "texto" e do grupo Outros. Sem campo de tipo pra ninguem esquecer
  // de preencher, e sem uma segunda colecao pra escutar (que custaria leitura).
  function ehOutro(d){ return !!(d && typeof d.texto === "string"); }
  // Ordena por criadoEm, NAO por em. "em" e a data do ultimo toque, entao
  // ordenar por ele fazia o item PULAR DE LUGAR na hora em que era marcado:
  // a pessoa tocava numa linha e outra linha ficava embaixo do dedo dela.
  // criadoEm nao muda nunca, entao a lista fica parada.
  function frOutros(){
    return fotorel.filter(ehOutro).sort(function(a,b){
      return (a.criadoEm || a.em || 0) - (b.criadoEm || b.em || 0);
    });
  }
  // Salvar e LIMPAR O CAMPO, deixando ele aberto e com foco. Quem esta em campo
  // costuma lembrar de tres coisas de uma vez; fechar o formulario a cada item
  // transformaria isso em tres idas e voltas.
  function frSalvarNovo(){
    var cx = $("#fr_novo"); if(!cx) return;
    var txt = String(cx.value || "").trim();
    if(!txt){ cx.focus(); return; }
    if(txt.length > 160) txt = txt.slice(0,160);
    var agora = Date.now();
    // criadoEm fixa o lugar do item na lista; em guarda o ultimo toque
    var obj = { texto: txt, feito: false, por: meuNome || quemSou(), criadoEm: agora, em: agora };
    if(!FB_ON){
      obj.id = uid();
      var a = lsGet("fotorel"); a.push(obj); lsSet("fotorel", a);
      fotorel = lsGet("fotorel");
    } else {
      // add e nao set: id automatico, entao dois celulares cadastrando ao mesmo
      // tempo nunca gravam por cima um do outro
      db.collection(COL.fotorel).add(obj)["catch"](function(e){
        avisoDeFalha(e); toast("Não deu para adicionar.");
      });
    }
    cx.value = "";
    renderFotorel(); contadores();
    var novo = $("#fr_novo"); if(novo){ try{ novo.focus(); }catch(e){} }
    toast("Item adicionado.");
  }
  function frGravarOutro(id, patch){
    if(!FB_ON){
      var a = lsGet("fotorel");
      for(var i=0;i<a.length;i++){ if(a[i].id===id){ for(var k in patch) a[i][k]=patch[k]; } }
      lsSet("fotorel", a); fotorel = lsGet("fotorel"); renderFotorel(); contadores(); return;
    }
    db.collection(COL.fotorel).doc(id).update(patch)["catch"](function(e){
      avisoDeFalha(e); toast("Não deu para salvar.");
    });
  }
  function frApagarOutro(id){
    if(!FB_ON){
      lsSet("fotorel", lsGet("fotorel").filter(function(x){ return x.id!==id; }));
      fotorel = lsGet("fotorel"); renderFotorel(); contadores(); return;
    }
    db.collection(COL.fotorel).doc(id)["delete"]()["catch"](function(e){
      avisoDeFalha(e); toast("Não deu para apagar.");
    });
  }

  function frMarcados(){
    var m = {};
    for(var i=0;i<fotorel.length;i++){
      var d = fotorel[i];
      if(d && d.id && !ehOutro(d)) m[d.id] = d;
    }
    return m;
  }
  function frTodoMarcado(grupo){
    if(!grupo) return false;
    var g = FOTOREL.indexOf(grupo), m = frMarcados();
    for(var i=0;i<grupo.itens.length;i++){ if(!m[idFotorel(g,i)]) return false; }
    return true;
  }
  function frContas(){
    var m = frMarcados(), feito = 0, total = 0;
    for(var g=0; g<FOTOREL.length; g++){
      total += FOTOREL[g].itens.length;
      for(var i=0;i<FOTOREL[g].itens.length;i++){ if(m[idFotorel(g,i)]) feito++; }
    }
    // os itens criados no dia contam junto: o numero do topo e do badge tem que
    // ser o trabalho de verdade, nao so o que estava previsto no documento
    var o = frOutros();
    total += o.length;
    for(var k=0;k<o.length;k++){ if(o[k].feito) feito++; }
    return { feito: feito, total: total, falta: total - feito };
  }

  function renderFotorel(){
    var el = $("#view-fotorel"); if(!el) return;
    if(!podeVer("fotorel")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div></div>';
      return;
    }
    var m = frMarcados(), c = frContas(), h = '';

    h += '<div class="resumo">'+
      '<div class="rbox"><div class="rk">Total</div><div class="rv">'+c.total+'</div></div>'+
      '<div class="rbox destaque"><div class="rk">Feitos</div><div class="rv">'+c.feito+'</div></div>'+
      '<div class="rbox'+(c.falta?" alerta":"")+'"><div class="rk">Falta</div><div class="rv">'+c.falta+'</div></div>'+
    '</div>';

    // Com 136 itens, depois do primeiro dia a lista vira uma parede de riscados.
    // Este filtro e o que mantem a aba usavel no sabado.
    h += '<div class="fchips">'+
      '<button class="fchip destaque'+(frSoFalta?" on":"")+'" data-act="frfalta">Só o que falta</button>'+
      (frSoFalta ? '<button class="fchip" data-act="frfalta">Ver tudo</button>' : '')+
    '</div>';

    for(var g=0; g<FOTOREL.length; g++){
      var grupo = FOTOREL[g], itens = grupo.itens;
      var okG = 0, k;
      for(k=0;k<itens.length;k++){ if(m[idFotorel(g,k)]) okG++; }
      var cheio = okG === itens.length;
      var visiveis = [];
      for(k=0;k<itens.length;k++){
        if(frSoFalta && m[idFotorel(g,k)]) continue;
        visiveis.push(k);
      }
      // grupo fechado se recolhe sozinho, igual ao StoryMaker
      var min = (grupo.grupo in frRecolhidos) ? frRecolhidos[grupo.grupo] : cheio;
      if(frSoFalta && !visiveis.length) continue;

      h += '<div class="bloco'+(cheio?" completo":"")+(min?" recolhido":"")+'">'+
        '<button class="cabeca" data-act="frdobrar" data-grupo="'+esc(grupo.grupo)+'" aria-expanded="'+(min?"false":"true")+'">'+
          '<span class="cmeio"><span class="cnome">'+(cheio?"&#10003; ":"")+esc(grupo.grupo)+'</span></span>'+
          (cheio && min ? '<span class="tag st" data-st="publicado">Pronto</span>' : '')+
          '<span class="cprog'+(cheio?" ok":"")+'">'+okG+'/'+itens.length+'</span>'+
          '<span class="cmais">'+(min?"+":"&minus;")+'</span>'+
        '</button>';
      if(min){ h += '</div>'; continue; }
      h += '<div class="corpo">';
      h += '<div class="frbarra"><i style="width:'+Math.round(okG/itens.length*100)+'%"></i></div>';
      for(var vi=0; vi<visiveis.length; vi++){
        k = visiveis[vi];
        var id = idFotorel(g,k), doc = m[id], txt = itens[k];
        // no LED o texto vem "Marca · pontos": a marca fica grande, os pontos embaixo
        var corte = txt.indexOf(" · ");
        var nome = corte > 0 ? txt.slice(0, corte) : txt;
        var sub  = corte > 0 ? txt.slice(corte + 3) : "";
        h += '<button class="frlinha'+(doc?" on":"")+'" data-act="frchk" data-g="'+g+'" data-i="'+k+'" '+
             'aria-pressed="'+(doc?"true":"false")+'">'+
          '<span class="frbox">&#10003;</span>'+
          '<span class="frtx"><span class="frnome">'+esc(nome)+'</span>'+
            (sub ? '<span class="frsub">'+esc(sub)+'</span>' : '')+
            (doc && doc.por ? '<span class="frquem">'+esc(doc.por)+(doc.em?" · "+horaCurta(doc.em):"")+'</span>' : '')+
          '</span>'+
        '</button>';
      }
      h += '</div></div>';
    }

    // ---- OUTROS: o que aparece no dia e nao estava no documento ----
    // Fica sempre por ultimo e NUNCA se recolhe sozinho, mesmo completo: o
    // botao de criar precisa estar a um toque durante o evento. Se ele se
    // escondesse ao fechar tudo, criar item viraria dois toques na hora errada.
    var outros = frOutros();
    var okO = outros.filter(function(x){ return x.feito; }).length;
    var visO = frSoFalta ? outros.filter(function(x){ return !x.feito; }) : outros;
    h += '<div class="bloco'+((outros.length && okO===outros.length)?" completo":"")+'">'+
      // cabecalho e DIV, nao botao: este grupo nao recolhe, entao um botao aqui
      // seria um alvo que nao faz nada, e disso a pessoa desconfia do resto
      '<div class="cabeca" style="cursor:default">'+
        '<span class="cmeio"><span class="cnome">Outros</span>'+
        '<span class="cinflu">o que apareceu no dia</span></span>'+
        '<span class="cprog'+((outros.length && okO===outros.length)?" ok":"")+'">'+okO+'/'+outros.length+'</span>'+
      '</div>'+
      '<div class="corpo">';
    for(var oi=0; oi<visO.length; oi++){
      var it = visO[oi];
      h += '<div class="chk'+(it.feito?" feito":"")+'" style="align-items:center">'+
        '<button class="frlinha'+(it.feito?" on":"")+'" data-act="frchkoutro" data-id="'+esc(it.id)+'" '+
          'style="border-bottom:0;padding:8px 0;min-height:48px" aria-pressed="'+(it.feito?"true":"false")+'">'+
          '<span class="frbox">&#10003;</span>'+
          '<span class="frtx"><span class="frnome">'+esc(it.texto)+'</span>'+
            (it.por ? '<span class="frquem">'+esc(it.por)+(it.em?" · "+horaCurta(it.em):"")+'</span>' : '')+
          '</span>'+
        '</button>'+
        (podeApagar("fotorel") ? '<button class="chkdel" data-act="frdelout" data-id="'+esc(it.id)+'" aria-label="Apagar item">&times;</button>' : '')+
      '</div>';
    }
    if(!outros.length){
      h += '<div style="color:var(--ink-3);font-size:.82rem;padding:6px 0 10px">'+
           'Nada aqui ainda. Use para o que aparecer no dia e não estava na lista.</div>';
    }
    if(podeGerenciar("fotorel")){
      h += frCriando
        ? '<div class="fld" style="margin-top:6px">'+
            '<input id="fr_novo" type="text" maxlength="160" placeholder="O que precisa ser fotografado?" '+
              'autocomplete="off" enterkeyhint="done">'+
            '<div class="acoes" style="margin-top:8px">'+
              '<button class="btn" data-act="frsalvar">Adicionar</button>'+
              '<button class="btn ghost" data-act="frcancelar">Fechar</button>'+
            '</div>'+
            '<span style="font-size:.7rem;color:var(--ink-3);margin-top:4px;display:block">'+
              'O campo continua aberto: dá para emendar um atrás do outro.</span>'+
          '</div>'
        : '<div class="acoes"><button class="btn" data-act="frnovo">+ Novo item</button></div>';
    }
    h += '</div></div>';

    if(frSoFalta && !c.falta){
      h += '<div class="vazio"><div class="big">Acabou a lista</div>'+
           '<div class="sm">Os '+c.total+' itens do fotorelatório estão marcados. Toque em <b>Ver tudo</b> para conferir.</div></div>';
    }
    // GUARDA O QUE ESTA DIGITADO antes de trocar o HTML, e devolve depois.
    // Sem isto, o snapshot que chega quando outra pessoa marca um item apagaria
    // no meio da frase de quem esta cadastrando, e a pessoa nao teria como saber
    // por que. Vale tambem pra posicao do cursor: reescrever o valor joga o
    // cursor pro fim, e quem estava corrigindo o comeco da palavra se perde.
    var antes = $("#fr_novo");
    var txtAntes = antes ? antes.value : null;
    var posAntes = (antes && antes.selectionStart != null) ? antes.selectionStart : null;
    var tinhaFoco = !!(antes && document.activeElement === antes);

    el.innerHTML = h;

    if(frCriando){
      var cx = $("#fr_novo");
      if(cx){
        if(txtAntes != null) cx.value = txtAntes;
        if(tinhaFoco){
          try{
            cx.focus();
            if(posAntes != null) cx.setSelectionRange(posAntes, posAntes);
          }catch(e){}
        }
      }
    }
  }

  // A hora de quem marcou sai por horaCurta(), que JA EXISTIA neste arquivo
  // (usada pelo painel de novidades) e escreve no formato da casa, "11h34".
  // Cheguei a declarar uma segunda com o mesmo nome aqui: como declaracao de
  // funcao sobe pro topo, a de baixo vencia e a minha virava letra morta, com
  // o risco de trocar o formato do app inteiro se alguem reordenasse o arquivo.
  // Uma so, e e a de baixo.

  function renderAll(){
    try{ renderColetivas(); }catch(e){ if(window.console) console.error("[conteudo] coletivas", e); }
    try{ renderPecas();     }catch(e){ if(window.console) console.error("[conteudo] pecas", e); }
    try{ renderStory();     }catch(e){ if(window.console) console.error("[conteudo] story", e); }
    try{ renderFotos();     }catch(e){ if(window.console) console.error("[conteudo] fotos", e); }
    try{ renderFotorel();   }catch(e){ if(window.console) console.error("[conteudo] fotorelatorio", e); }
    try{ contadores();      }catch(e){}
    try{ renderNovidades(); }catch(e){ if(window.console) console.error("[conteudo] novidades", e); }
  }

  // ═══════════════════════════════════════════════════════════════
  // FAIXA DE NOVIDADE
  //
  // Avisa que entrou peca nova, item de checklist novo ou movimento nas
  // coletivas, sem ninguem precisar dizer ao sistema que publicou: compara o
  // carimbo de tempo de cada item com a ultima vez que ESTA PESSOA abriu
  // aquela aba. Quem publica so publica; quem le e avisado.
  //
  // O "visto" e por aba e por aparelho, entao o celular de cada um da equipe
  // tem a propria contagem. Isso importa aqui: sao 8 pessoas mexendo ao mesmo
  // tempo, e o que e novidade pra uma ja foi lido pela outra.
  // ═══════════════════════════════════════════════════════════════
  var VISTO = "cfi_visto_";
  var ROTULO_NOV = { pecas:"em Orgânicos e pagos", story:"no StoryMaker",
                     fotos:"em Fotos", coletivas:"nas Coletivas" };

  function vistoDe(aba){
    try{ var v = parseInt(localStorage.getItem(VISTO + aba), 10); return isNaN(v) ? null : v; }
    catch(e){ return null; }
  }
  // Nunca anda pra tras. Se alguem apaga a peca mais nova, o maior carimbo da
  // lista cai, e sem esta trava o "visto" cairia junto e itens ja lidos
  // voltariam a ser novidade.
  function marcarVisto(aba, quando){
    var q = parseInt(quando, 10); if(isNaN(q) || q <= 0) q = Date.now();
    try{
      var atual = vistoDe(aba);
      if(atual !== null && atual >= q) return;
      localStorage.setItem(VISTO + aba, String(q));
    }catch(e){}
  }

  // Eu mesmo acabei de publicar: nao faz sentido a faixa me avisar do que eu
  // digitei. Marca so este item como lido, sem mexer no resto.
  function naoAlertarProprio(aba, ts){ marcarVisto(aba, ts); }

  function listaDaAba(aba){
    if(aba === "pecas"     && podeVer("pecas"))     return pecas;
    if(aba === "story"     && podeVer("story"))     return story;
    if(aba === "fotos"     && podeVer("fotos"))     return fotos;
    if(aba === "coletivas" && podeVer("coletivas")) return coletivas;
    return null;
  }

  // NOVIDADE = NASCEU, nao "mudou". Por isso criadoEm manda, e em/ts so entram
  // quando o item nao tem criadoEm (registro antigo).
  //
  // Eu tinha feito o contrario, pegando o maior dos dois, com a ideia de que
  // "mudou tambem interessa". Nao interessa: peca leva dezenas de toques por
  // dia (status, link, editor), e cada toque reescreve em. A faixa acenderia o
  // tempo todo, inclusive pra quem acabou de mexer, e faixa que acende sempre
  // a pessoa para de ler.
  function carimbo(it){
    var n = parseInt(it.criadoEm, 10);
    if(!isNaN(n) && n > 0) return n;
    var maior = 0;
    ["em","ts"].forEach(function(c){
      var v = parseInt(it[c], 10);
      if(!isNaN(v) && v > maior) maior = v;
    });
    return maior;
  }

  // Ja cliquei neste item pelo painel. Fica na memoria da aba, nao no aparelho:
  // e so pra sumir da lista do painel enquanto a pessoa vai clicando um a um.
  var LIDOS = { pecas:{}, story:{}, fotos:{} };
  var painelNov = false;

  // Os itens que entraram depois do ultimo "visto", do mais novo pro mais velho.
  function novosDe(aba){
    var lista = listaDaAba(aba);
    if(!lista || !lista.length) return [];
    var visto = vistoDe(aba);
    // Primeiro acesso deste aparelho: so grava o marco. Sem isto o time inteiro
    // abriria a Central com "48 novidades", que e o historico, nao novidade.
    if(visto === null){ marcarVisto(aba, maiorCarimbo(lista)); return []; }
    var out = [];
    for(var i=0;i<lista.length;i++){ if(carimbo(lista[i]) > visto) out.push(lista[i]); }
    out.sort(function(a,b){ return carimbo(b) - carimbo(a); });
    return out;
  }
  // O que ainda esta pendente no painel (tirando o que a pessoa ja abriu).
  function pendentesDe(aba){
    return novosDe(aba).filter(function(it){ return !LIDOS[aba][it.id]; });
  }
  function ehNovo(aba, it){
    var visto = vistoDe(aba);
    return visto !== null && carimbo(it) > visto;
  }
  function contarNovos(aba){ return pendentesDe(aba).length; }

  // Marca a aba inteira como lida e apaga os destaques dela.
  function limparNov(aba){
    var lista = listaDaAba(aba);
    marcarVisto(aba, lista && lista.length ? maiorCarimbo(lista) : Date.now());
    LIDOS[aba] = {};
  }

  function horaCurta(ms){
    var d = new Date(ms);
    if(isNaN(d.getTime())) return "";
    return ("0"+d.getHours()).slice(-2) + "h" + ("0"+d.getMinutes()).slice(-2);
  }

  // Como o item aparece na lista do painel.
  function tituloNov(aba, it){
    if(aba === "pecas"){
      return (it.marca || it.tema || "Sem marca") +
             (it.formato ? " · " + it.formato : "");
    }
    return (it.grupo || "Checklist") + (it.texto ? " · " + it.texto : "");
  }
  function subNov(aba, it){
    var quem = it.por ? String(it.por) : "";
    var h = horaCurta(carimbo(it));
    var onde = aba === "pecas" ? "Orgânicos e pagos" : "StoryMaker";
    return [onde, quem, h].filter(Boolean).join(" · ");
  }

  function maiorCarimbo(lista){
    var m = 0;
    for(var i=0;i<lista.length;i++){ var c = carimbo(lista[i]); if(c > m) m = c; }
    return m || Date.now();
  }

  function renderNovidades(){
    var faixa = $("#novidades"); if(!faixa || !PERM) return;
    var partes = [], total = 0, primeira = null;

    // COLETIVAS FICA DE FORA de proposito. A grade e fixa; o que muda ali e
    // status e link, e cada toque de "Pronto" ou "No ar" atualizaria o carimbo.
    // Num teste isso gerou 42 "novidades" numa tarde. Faixa que acende o tempo
    // todo vira decoracao: a pessoa para de olhar e perde a que importava.
    // Aqui novidade = conteudo que NASCEU, nao andamento de trabalho.
    ["pecas","story","fotos"].forEach(function(aba){
      // A ABA ABERTA TAMBEM AVISA. Eu tinha zerado a contagem dela achando que
      // quem esta com a aba na frente ja ve o item chegar. Testei e e falso: a
      // peca nova entra no meio de uma lista longa, muitas vezes fora da tela,
      // e ninguem percebe. Pior: Organicos e pagos e justamente a tela onde o
      // time fica o dia inteiro, ou seja, o alerta morria bem em quem mais
      // precisa dele. Agora a faixa aparece, e some quando a pessoa clica.
      var n = contarNovos(aba);
      if(n > 0){
        total += n;
        if(!primeira) primeira = aba;
        partes.push(n + " " + (ROTULO_NOV[aba] || aba));
      }
      var b = document.querySelector('.tab[data-tab="' + aba + '"]');
      if(b) b.classList.toggle("temnovo", n > 0);
    });

    if(!total){ faixa.hidden = true; faixa.innerHTML = ""; painelNov = false; return; }
    faixa.hidden = false;

    var h =
      '<button class="novbar' + (painelNov ? ' aberta' : '') + '" type="button" data-act="novtoggle"' +
        ' aria-expanded="' + (painelNov ? 'true' : 'false') + '">' +
        '<span class="novpt"></span>' +
        '<span class="novtx"><b>' + total + (total === 1 ? ' novidade' : ' novidades') + '</b> ' +
          esc(partes.join(" · ")) + '</span>' +
        '<span class="novir">' + (painelNov ? 'fechar' : 'ver') + '</span>' +
      '</button>';

    if(painelNov){
      h += '<div class="novpanel">';
      // Teto de 8 por aba. Mais que isso vira rolagem no topo da pagina e
      // esconde o proprio conteudo; quem quiser o resto usa "marcar tudo".
      ["pecas","story","fotos"].forEach(function(aba){
        var lst = pendentesDe(aba).slice(0, 8);
        for(var i=0;i<lst.length;i++){
          var it = lst[i];
          h += '<button class="novrow" type="button" data-act="nov1"' +
                 ' data-aba="' + aba + '" data-id="' + esc(it.id) + '">' +
                 '<span class="nq">' +
                   '<span class="nn">' + esc(tituloNov(aba, it)) + '</span>' +
                   '<span class="ns">' + esc(subNov(aba, it)) + '</span>' +
                 '</span>' +
                 '<span class="nseta">&rsaquo;</span>' +
               '</button>';
        }
      });
      h += '<div class="novfoot"><button type="button" data-act="novtudo">' +
             'Marcar tudo como visto</button></div></div>';
    }
    faixa.innerHTML = h;
  }

  // Leva ate a peca (ou o bloco do checklist) e deixa ela piscando, senao a
  // pessoa cai numa lista de dezenas de cartoes sem saber qual era a nova.
  function irAteNovidade(aba, id){
    LIDOS[aba][id] = true;
    var lista = listaDaAba(aba) || [];
    var alvo = null;
    for(var i=0;i<lista.length;i++){ if(lista[i].id === id){ alvo = lista[i]; break; } }

    if(!pendentesDe("pecas").length && !pendentesDe("story").length && !pendentesDe("fotos").length){
      painelNov = false;
      limparNov("pecas"); limparNov("story"); limparNov("fotos");
    }
    mostrarAba(aba);

    // O desenho da aba acontece dentro do mostrarAba; o scroll precisa esperar
    // o navegador terminar de pintar, senao mede a posicao do layout antigo.
    var seletor = (aba === "pecas")
      ? '#pc_' + (window.CSS && CSS.escape ? CSS.escape(id) : id)
      : (alvo && alvo.grupo ? '[data-bloco="' + (window.CSS && CSS.escape ? CSS.escape(alvo.grupo) : alvo.grupo) + '"]' : null);
    setTimeout(function(){
      if(!seletor) return;
      var el;
      try{ el = document.querySelector(seletor); }catch(e){ return; }
      if(!el) return;
      var cartao = el.closest ? (el.closest(".bloco") || el) : el;
      try{ cartao.scrollIntoView({ behavior:"smooth", block:"center" }); }
      catch(e){ cartao.scrollIntoView(); }
      cartao.classList.add("piscando");
      setTimeout(function(){ cartao.classList.remove("piscando"); }, 2600);
    }, 60);
  }

  function mostrarAba(t){
    abaAtual = t;
    $$(".tab").forEach(function(x){ x.classList.remove("active"); });
    var b = document.querySelector('.tab[data-tab="'+t+'"]'); if(b) b.classList.add("active");
    $("#view-coletivas").hidden = t !== "coletivas";
    $("#view-pecas").hidden     = t !== "pecas";
    $("#view-story").hidden     = t !== "story";
    $("#view-fotos").hidden     = t !== "fotos";
    $("#view-fotorel").hidden   = t !== "fotorel";
    // NAO marca como visto so por abrir a aba. Antes marcava, e isso apagava o
    // aviso antes da pessoa ter visto qual peca era nova: bastava passar pela
    // aba pra perder a informacao. Agora quem apaga e a pessoa, clicando no
    // item dentro do painel ou em "marcar tudo como visto".
    // Redesenha a aba de destino. Os watchers so redesenham a aba ATIVA, entao
    // sem isto a pessoa volta pra uma aba pintada com o dado de quando saiu (ou
    // vazia, se o primeiro snapshot chegou depois do renderAll do login).
    try{
      if(t === "coletivas") renderColetivas();
      else if(t === "pecas"){ if(!editandoPeca) renderPecas(); }
      else if(t === "fotos") renderFotos();
      else if(t === "fotorel") renderFotorel();
      else { if(!criandoBloco && !criandoMarcas) renderStory(); }
      pendente[t] = false;
      renderNovidades();
    }catch(e){ if(window.console) console.error("[conteudo] render de aba", e); }
    ga("aba_conteudo", { aba:t, perfil: PERFIL || "desconhecido" });
  }

  function aplicarInterface(){
    if(!PERM) return;
    // Toda aba nova PRECISA entrar aqui. Esta lista e escrita a mao, entao
    // esquecer uma linha nao da erro: a aba simplesmente nunca aparece, pra
    // ninguem, e o sintoma e "sumiu" em vez de "quebrou".
    var abas = { coletivas: podeVer("coletivas"), pecas: podeVer("pecas"),
                 story: podeVer("story"), fotos: podeVer("fotos"),
                 fotorel: podeVer("fotorel") };
    var primeira = null;
    $$(".tab").forEach(function(b){
      var t = b.getAttribute("data-tab"), ok = !!abas[t];
      b.hidden = !ok; b.style.display = ok ? "" : "none";
      if(ok && !primeira) primeira = t;
    });
    var q = $("#quemSou"); if(q) q.textContent = quemSou();
    var mn = $("#meuNome");
    if(mn){
      mn.textContent = meuNome ? meuNome.split(" ")[0] : "Quem é você?";
      // storymaker nao tem lista de pecas pra filtrar; o botao so polui o topo dele
      mn.hidden = !podeVer("pecas");
    }
    mostrarAba(primeira || "story");
  }

  // ═══════════════════════════════════════════════════════════════
  // ACOES (delegacao de evento)
  // Toda acao que grava confere a permissao DE NOVO aqui. Esconder o botao
  // organiza a tela; nao e controle de acesso.
  // ═══════════════════════════════════════════════════════════════
  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if(!b) return;
    var act = b.dataset.act, id = b.dataset.id;

    // ---- navegacao (nao grava nada) ----
    // TROCAR DE EDICAO. Vale pras quatro abas de uma vez: trocar de aba nao pode
    // trocar de edicao no meio do caminho. Zera diaStory e diaColetiva de
    // proposito — eles guardam data da OUTRA edicao e, sem zerar, StoryMaker e
    // Fotos desenhavam vazio com a fita sem nenhum dia aceso.
    if(act === "edicao"){
      var alvo = edicaoPorId(b.dataset.ed);
      if(alvo){
        edicaoVista = alvo.id;
        diaStory = null;
        diaColetiva = null;
        fDia = "todos";        // filtro de dia guardava data da outra edicao
        renderAll();
      }
      return;
    }
    if(act === "diacol"){ diaColetiva = b.dataset.dia; renderColetivas(); return; }
    if(act === "diastory"){ diaStory = b.dataset.dia; renderStory(); contadores(); return; }
    if(act === "abrircol"){ var k=b.dataset.key; abertos[k] = !abertos[k]; renderColetivas(); return; }
    if(act === "abrirpeca"){ abertos["p_"+id] = !abertos["p_"+id]; renderPecas(); return; }
    if(act === "filtro"){
      var g=b.dataset.grupo, v=b.dataset.valor;
      if(g==="tipo") fTipo=v; else if(g==="status") fStatus=v; else if(g==="dia") fDia=v;
      else if(g==="formato") fFormato=v;
      renderPecas(); return;
    }
    if(act === "fboost"){ fBoost = !fBoost; renderPecas(); return; }
    if(act === "fminhas"){
      if(!meuNome){ pedirNome(true); return; }   // sem nome o filtro nao tem o que filtrar
      fMinhas = !fMinhas; renderPecas(); return;
    }
    if(act === "segm"){
      var quer = b.dataset.v === "minhas";
      // sem nome nao da pra saber o que e "minhas": pergunta antes em vez de
      // ligar um filtro que devolveria lista vazia
      if(quer && !meuNome){ pedirNome(true); return; }
      // escolha da pessoa manda: sem isto, o dado chegando depois do toque
      // ainda aplicaria o padrao e viraria a chave na cara dela
      padraoMinhasFeito = true;
      fMinhas = quer; renderPecas(); return;
    }
    if(act === "ativarpush"){ ativarPush(); return; }
    if(act === "dispensarpush"){
      try{ localStorage.setItem(PUSH_OFF, "1"); }catch(e){}
      renderPushbar(); return;
    }
    if(act === "abrirstats"){ statsAbertas = !statsAbertas; renderPecas(); return; }
    if(act === "abrirbusca"){
      buscaAberta = !buscaAberta;
      // fechar a lupa limpa o termo de proposito: caixa escondida com busca
      // ativa deixaria a lista filtrada por um campo que ninguem ve
      if(!buscaAberta) fBusca = "";
      renderPecas();
      if(buscaAberta){ var cb = $("#buscaPeca"); if(cb) cb.focus(); }
      return;
    }
    if(act === "limparbusca"){
      fBusca = ""; buscaAberta = true; renderPecas();
      var cb2 = $("#buscaPeca"); if(cb2) cb2.focus();
      return;
    }
    if(act === "abrirfiltros"){ filtrosAbertos = !filtrosAbertos; renderPecas(); return; }
    if(act === "limparfiltros"){
      fTipo="todos"; fStatus="todos"; fDia="todos"; fFormato="todos"; fBoost=false;
      renderPecas(); toast("Filtros limpos."); return;
    }
    if(act === "etapa"){
      var ek = b.dataset.etapa;
      etapaFechada[ek] = !etapaFechada[ek];
      renderPecas(); return;
    }
    if(act === "fminhasstory"){
      if(!meuNome){ pedirNome(true); return; }
      fMinhasStory = !fMinhasStory; renderStory(); return;
    }
    if(act === "dobrar"){
      var bn = b.dataset.bloco;
      var itensBl = story.filter(function(s){ return s.dia===diaStoryAtual() && (s.grupo||"Sem bloco")===bn; });
      var chBl = itensBl.length && itensBl.every(function(s){ return s.feito; });
      // bloco completo nasce fechado, entao o toque nele e "reabrir";
      // bloco em aberto nasce aberto, e o toque e "recolher"
      if(chBl){ if(reabertos[bn]) delete reabertos[bn]; else reabertos[bn] = true; }
      else    { if(recolhidos[bn]) delete recolhidos[bn]; else recolhidos[bn] = true; }
      renderStory(); return;
    }
    if(act === "meunome"){ pedirNome(false); return; }
    if(act === "cancelarpeca"){ editandoPeca=null; limparRascunho(); renderPecas(); return; }
    if(act === "copialeg"){
      var pl = pecas.filter(function(x){ return x.id===id; })[0];
      if(!pl || !pl.legenda) return;
      var txt = pl.legenda;
      var ok = function(){ toast("Legenda copiada."); };
      // navigator.clipboard so existe em https (ou localhost) e pode estar
      // bloqueado; o textarea escondido e o plano B que funciona em tudo
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok)["catch"](function(){ copiaNaMarra(txt, ok); });
      } else { copiaNaMarra(txt, ok); }
      return;
    }

    // ---- coletivas ----
    if(act === "stcol" || act === "boostcol" || act === "boostokcol" || act === "redecol"){
      if(!podeGerenciar("coletivas")){ toast("Seu acesso não edita as coletivas."); return; }
      var st = estadoDe(id) || {};
      if(act === "stcol"){
        var novo = st.status === b.dataset.st ? "" : b.dataset.st;   // tocar de novo desmarca
        DBset("coletivas", id, { status:novo, em:Date.now(), por:quemSou() });
      } else if(act === "boostcol"){
        // desmarcar "vai impulsionar" tem que limpar o "ja impulsionei" junto,
        // senao a peca sai da conta mas o feito continua gravado e o "2 de 5" mente
        var lig = !st.impulsionar;
        DBset("coletivas", id, { impulsionar: lig, impulsionado: lig ? !!st.impulsionado : false,
                                 em:Date.now(), por:quemSou() });
      } else if(act === "boostokcol"){
        DBset("coletivas", id, { impulsionado: !st.impulsionado, em:Date.now(), por:quemSou() });
      } else {
        // arrayUnion/arrayRemove em vez de reescrever o array inteiro: dois
        // toques rapidos (aqui ou de outra pessoa) liam o mesmo array antigo e
        // o segundo apagava a marcacao do primeiro.
        var jaTem = (st.redes||[]).indexOf(b.dataset.rede) >= 0;
        DBset("coletivas", id, { redes: setaRede(b.dataset.rede, jaTem, st.redes),
                                 em:Date.now(), por:quemSou() });
      }
      return;
    }

    // ---- pecas ----
    if(act === "novafoto"){
      if(!podeGerenciar("fotos")){ toast("Seu acesso nao cria entrega."); return; }
      criandoFoto = true; renderFotos(); var fm=$("#ft_momento"); if(fm) fm.focus(); return;
    }
    if(act === "cancelarfoto"){ criandoFoto = false; renderFotos(); return; }
    if(act === "salvarfoto"){
      if(!podeGerenciar("fotos")){ toast("Seu acesso nao cria entrega."); return; }
      salvarFoto(); return;
    }
    if(act === "diafoto"){ diaStory = b.dataset.dia; renderFotos(); contadores(); return; }
    // UMA ENTREGA DE FOTOS POR MARCA, mesma grade do StoryMaker.
    // Aqui nao tem formulario: a entrega nasce so com o titulo (marca, onde e
    // quando), e link, responsavel e quantidade sao preenchidos no dia, que e
    // como o time ja usa a aba. Perguntar isso agora seria inventar resposta.
    if(act === "entregasmarcas"){
      if(!podeGerenciar("fotos")){ toast("Seu acesso não cria entregas."); return; }
      var marcasF = marcasDaEdicao();
      if(!marcasF.length){ toast("A grade desta edição ainda não foi publicada."); return; }
      // ja existe = titulo comeca com o nome da marca, no mesmo dia. Compara so
      // o comeco porque o resto do titulo (box, hora) pode ter mudado na grade.
      var pendentes = [], jaF = {};
      fotos.forEach(function(f){ jaF[(f.dia||"") + "|" + String(f.momento||"").split(" · ")[0]] = true; });
      for(var i=0;i<marcasF.length;i++){
        if(!jaF[marcasF[i].dia + "|" + marcasF[i].marca]) pendentes.push(marcasF[i]);
      }
      if(!pendentes.length){ toast("Todas as marcas já têm entrega."); return; }
      var porDiaF = {}, k;
      for(i=0;i<pendentes.length;i++) porDiaF[pendentes[i].dia] = (porDiaF[pendentes[i].dia]||0) + 1;
      var resumoF = [];
      for(k in porDiaF) resumoF.push(rotuloDia(k) + ": " + porDiaF[k] + (porDiaF[k]===1?" entrega":" entregas"));
      if(!confirm("Criar "+pendentes.length+(pendentes.length===1?" entrega":" entregas")+
                  " de fotos, uma por marca?\n\n"+resumoF.join("\n")+
                  "\n\nLink e responsável ficam em branco para preencher no dia.")) return;
      var baseF = Date.now();
      for(i=0;i<pendentes.length;i++){
        DBadd("fotos", { dia:pendentes[i].dia,
                         momento: pendentes[i].marca + " · " + ondeEQuando(pendentes[i]),
                         resp:"", link:"", qtd:0, enviado:false, tratado:false,
                         criadoEm: baseF + i, em: baseF + i, por:quemSou() });
      }
      naoAlertarProprio("fotos", baseF + pendentes.length);
      toast(pendentes.length + (pendentes.length===1 ? " entrega criada." : " entregas criadas."));
      renderFotos();
      return;
    }
    if(act === "movfoto"){
      if(!podeGerenciar("fotos")){ toast("Seu acesso não muda a ordem."); return; }
      var listaF = fotosDoDia(), iF = -1;
      for(var kf=0;kf<listaF.length;kf++){ if(listaF[kf].id === id) iF = kf; }
      var novaF = trocarNaLista(listaF, iF, parseInt(b.dataset.dir,10) || 0);
      if(!novaF) return;
      if(regravarOrdem("fotos", novaF)) renderFotos();
      return;
    }
    if(act === "ftenviado" || act === "fttratado"){
      if(!podeGerenciar("fotos")){ toast("Seu acesso nao edita fotos."); return; }
      var alvoF = fotos.filter(function(x){ return x.id===id; })[0] || {};
      var campoF = (act === "ftenviado") ? "enviado" : "tratado";
      var patchF = { em:Date.now(), por:quemSou() };
      patchF[campoF] = !alvoF[campoF];
      DBupdate("fotos", id, patchF);
      return;
    }
    if(act === "ftdel"){
      if(!podeApagar("fotos")){ toast("Seu acesso não apaga entregas."); return; }
      var f2 = fotos.filter(function(x){ return x.id===id; })[0] || {};
      if(confirm("Apagar a entrega \"" + (f2.momento||"sem momento") + "\"?")) DBremove("fotos", id);
      return;
    }
    if(act === "novapeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não cria peças."); return; }
      editandoPeca = "novo"; limparRascunho(); renderPecas();
      var f=$("#f_marca"); if(f) f.focus();
      return;
    }
    if(act === "editarpeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não edita peças."); return; }
      editandoPeca = id; limparRascunho(); renderPecas();
      var fm=$("#f_marca"); if(fm) fm.focus();
      return;
    }
    if(act === "salvarpeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não salva peças."); return; }
      salvarPeca(); return;
    }
    if(act === "apagarpeca"){
      if(!podeApagar("pecas")){ toast("Seu acesso não apaga peças."); return; }
      var alvo = pecas.filter(function(x){ return x.id===id; })[0] || {};
      if(!confirm("Apagar esta peça?\n\n"+(alvo.marca||"Sem marca")+" · "+(alvo.tema||alvo.formato||"")+"\n\nIsso não volta.")) return;
      DBremove("pecas", id); toast("Peça apagada."); return;
    }
    if(act === "stpeca" || act === "boostpeca" || act === "boostokpeca" || act === "redepeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não edita peças."); return; }
      var pc = pecas.filter(function(x){ return x.id===id; })[0]; if(!pc) return;
      if(act === "stpeca"){
        DBupdate("pecas", id, { status: pc.status === b.dataset.st ? "" : b.dataset.st, em:Date.now(), por:quemSou() });
      } else if(act === "boostpeca"){
        var lg = !pc.impulsionar;
        DBupdate("pecas", id, { impulsionar: lg, impulsionado: lg ? !!pc.impulsionado : false,
                                em:Date.now(), por:quemSou() });
      } else if(act === "boostokpeca"){
        DBupdate("pecas", id, { impulsionado: !pc.impulsionado, em:Date.now(), por:quemSou() });
      } else {
        var jaTinha = (pc.redes||[]).indexOf(b.dataset.rede) >= 0;
        DBupdate("pecas", id, { redes: setaRede(b.dataset.rede, jaTinha, pc.redes),
                                em:Date.now(), por:quemSou() });
      }
      return;
    }

    // ---- storymaker ----
    // ---- fotorelatorio ----
    if(act === "frfalta"){ frSoFalta = !frSoFalta; renderFotorel(); return; }
    if(act === "frdobrar"){
      var gr = b.dataset.grupo;
      // guarda o ESTADO EXPLICITO, nao um toggle sobre o automatico: sem isto,
      // um grupo que se recolheu sozinho por estar completo nao abre no
      // primeiro toque, so no segundo.
      var achatado = FOTOREL.filter(function(x){ return x.grupo === gr; })[0];
      var visivelAgora = (gr in frRecolhidos) ? !frRecolhidos[gr] : !frTodoMarcado(achatado);
      frRecolhidos[gr] = visivelAgora;   // estava visivel -> passa a recolhido
      renderFotorel();
      return;
    }
    if(act === "frnovo"){
      if(!podeGerenciar("fotorel")){ toast("Seu acesso não cria item aqui."); return; }
      frCriando = true; renderFotorel();
      var cn = $("#fr_novo"); if(cn){ try{ cn.focus(); }catch(e){} }
      return;
    }
    if(act === "frcancelar"){ frCriando = false; renderFotorel(); return; }
    if(act === "frsalvar"){ frSalvarNovo(); return; }
    if(act === "frchkoutro"){
      if(!podeGerenciar("fotorel")){ toast("Seu acesso não marca o fotorelatório."); return; }
      var alvo = fotorel.filter(function(x){ return x.id === id; })[0];
      if(!alvo) return;
      // aqui e update do campo feito, e nao apagar o documento: apagar sumiria
      // com o item da lista, e desmarcar nao pode significar perder o que
      // alguem cadastrou no meio do evento
      frGravarOutro(id, { feito: !alvo.feito, em: Date.now(), por: meuNome || quemSou() });
      return;
    }
    if(act === "frdelout"){
      if(!podeApagar("fotorel")){ toast("Seu acesso não apaga item."); return; }
      var av = fotorel.filter(function(x){ return x.id === id; })[0];
      if(!av) return;
      if(!confirm('Apagar "'+(av.texto||"")+'" do fotorelatório?')) return;
      frApagarOutro(id);
      return;
    }
    if(act === "frchk"){
      if(!podeGerenciar("fotorel")){ toast("Seu acesso não marca o fotorelatório."); return; }
      var fg = parseInt(b.dataset.g,10), fi = parseInt(b.dataset.i,10);
      if(isNaN(fg) || isNaN(fi)) return;
      var fid = idFotorel(fg, fi);
      frGravar(fid, !frMarcados()[fid]);
      return;
    }
    if(act === "chk"){
      if(!podeGerenciar("story")){ toast("Seu acesso não marca o checklist."); return; }
      var s = story.filter(function(x){ return x.id===id; })[0]; if(!s) return;
      DBupdate("story", id, { feito: !s.feito, em:Date.now(), por:quemSou() });
      return;
    }
    if(act === "quem"){
      if(!podeGerenciar("story")){ toast("Seu acesso não altera o checklist."); return; }
      var at = story.filter(function(x){ return x.id===id; })[0] || {};
      var nome = prompt("Quem é o responsável por este item?", at.resp || "");
      if(nome === null) return;
      DBupdate("story", id, { resp: String(nome).trim(), em:Date.now(), por:quemSou() });
      return;
    }
    if(act === "delstory"){
      if(!podeApagar("story")){ toast("Seu acesso não apaga itens."); return; }
      var si = story.filter(function(x){ return x.id===id; })[0] || {};
      if(!confirm("Apagar este item?\n\n"+(si.texto||"")+"\n\nIsso não volta.")) return;
      DBremove("story", id); return;
    }
    // ---- mover de lugar (bloco e item) ----
    // Os dois regravam o DIA INTEIRO, nao so os dois que trocaram. E o que
    // impede a lista de embaralhar com o tempo: item de um bloco nunca cai no
    // meio da faixa de numeros de outro.
    if(act === "movbloco" || act === "movitem"){
      if(!podeGerenciar("story")){ toast("Seu acesso não muda a ordem."); return; }
      var dirM = parseInt(b.dataset.dir, 10) || 0;
      var estado = listaOrdenadaDoDia(diaStoryAtual());
      var novaOrdem = estado.ordem, gruposM = estado.grupos, k;

      if(act === "movbloco"){
        var nomeB = b.dataset.id;
        var iB = novaOrdem.indexOf(nomeB);
        novaOrdem = trocarNaLista(novaOrdem, iB, dirM);
        if(!novaOrdem) return;
      } else {
        var nomeI = b.dataset.bloco;
        var doBloco = gruposM[nomeI] || [];
        var iI = -1;
        for(k=0;k<doBloco.length;k++){ if(doBloco[k].id === id) iI = k; }
        var trocado = trocarNaLista(doBloco, iI, dirM);
        if(!trocado) return;
        gruposM[nomeI] = trocado;
      }

      // achata bloco a bloco: a sequencia gravada e exatamente a que aparece
      var plana = [];
      for(k=0;k<novaOrdem.length;k++) plana = plana.concat(gruposM[novaOrdem[k]]);
      if(regravarOrdem("story", plana)) renderStory();
      return;
    }
    if(act === "novobloco"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      criandoBloco = true; criandoMarcas = false; renderStory();
      var bn = $("#b_nome"); if(bn) bn.focus();
      return;
    }
    if(act === "novtoggle"){ painelNov = !painelNov; renderNovidades(); return; }
    if(act === "nov1"){ irAteNovidade(b.dataset.aba, b.dataset.id); return; }
    if(act === "novtudo"){
      painelNov = false; limparNov("pecas"); limparNov("story"); limparNov("fotos");
      renderNovidades();
      // redesenha pra tirar os selos NOVA; o storymaker nao tem a aba de pecas,
      // entao cada um por si e sem derrubar a tela se um deles reclamar
      try{ if(podeVer("pecas") && !editandoPeca) renderPecas(); }catch(e){}
      try{ if(podeVer("story")) renderStory(); }catch(e){}
      return;
    }
    if(act === "cancelarbloco"){ criandoBloco = false; renderStory(); return; }
    if(act === "blocosmarcas"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      criandoMarcas = true; criandoBloco = false; renderStory(); return;
    }
    if(act === "cancelarmarcas"){ criandoMarcas = false; renderStory(); return; }
    // marcar/desmarcar todas mexe so nas caixas na tela, sem redesenhar: o
    // redesenho jogaria fora o que a pessoa ja tinha digitado nos itens
    if(act === "marcastodas" || act === "marcasnenhuma"){
      var todas = document.querySelectorAll(".mkchk");
      for(var mc=0;mc<todas.length;mc++) todas[mc].checked = (act === "marcastodas");
      return;
    }
    if(act === "salvarmarcas"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      salvarMarcas(); return;
    }
    if(act === "salvarbloco"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      salvarBloco(); return;
    }
    if(act === "additem"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria itens."); return; }
      var txt = prompt("O que precisa ser gravado?");
      if(txt === null) return;
      txt = String(txt).trim(); if(!txt) return;
      var nasceu = Date.now();
      DBadd("story", { dia:diaStoryAtual(), grupo:b.dataset.grupo, area:b.dataset.area||"",
                       texto:txt, resp:"", feito:false, criadoEm:nasceu, por:quemSou() });
      naoAlertarProprio("story", nasceu);
      return;
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // BLOCOS DAS MARCAS
  // ═══════════════════════════════════════════════════════════════
  // Pedido da Fernanda em 20/08: "seguindo esse padrão das marcas em storymaker,
  // tipo o que você fez na aba de coletivas, mas com esses itens em story".
  //
  // A aba de Coletivas ja tem a lista oficial das marcas da edicao, digitada em
  // COLETIVAS. Esta tela reaproveita ESSA lista em vez de pedir pra alguem
  // redigitar 19 nomes: nome errado aqui vira bloco que ninguem acha depois.
  //
  // O padrao de itens veio do bloco que o time montou a mao (Omoda Jaecoo), mas
  // fica editavel: a cobertura de uma marca no Boulevard nao e igual todo dia.
  var ITENS_MARCA = [
    "Influencer convidando",
    "Lançamento",
    "Livre (vibe/foto/ambientação)",
    "Saída de pista"
  ];
  // CADA MARCA NO DIA DA COLETIVA DELA, nao no dia que estiver aberto na tela.
  // Foi assim que o time montou os dois primeiros blocos a mao (Omoda Jaecoo e
  // GWM, os dois em 26/08, que e o dia da coletiva das duas). Jogar as 19 no
  // mesmo dia daria uma lista que nao existe: ninguem cobre marca que so chega
  // no dia seguinte.
  //
  // Marca com coletiva nos dois dias entra duas vezes, uma por dia, porque ai
  // sao dois trabalhos diferentes e nao uma repeticao.
  // ONDE A MARCA FICA, escrito do jeito que serve pra quem esta andando com a
  // camera na mao. Vem da mesma grade que a aba de Coletivas usa:
  //   box preenchido  -> "Box 1/2"   (predio virado pro pit lane)
  //   local           -> "Arena", "Race Village"  (sem o prefixo Box, que seria mentira)
  //   box vazio       -> "Box a confirmar"  (MG, iCAUR e BAIC nao estao em planta nenhuma)
  // Chutar um numero aqui e pior que admitir que falta: quem le isto e quem
  // esta indo gravar.
  function ondeFica(it){
    var box = String((it && it.box) || "").trim();
    if(box) return "Box " + box;
    var local = String((it && it.local) || "").trim();
    if(local) return local;
    return "Box a confirmar";
  }
  // "Box 1/2 · coletiva 08h00". A hora e a DA COLETIVA, e vem escrita assim de
  // propositivo: o box e onde o estande fica o dia todo, a hora e um compromisso
  // pontual. Sem a palavra "coletiva" alguem leria como horario do estande.
  function ondeEQuando(m){
    return m.hora ? (m.onde + " · coletiva " + m.hora) : m.onde;
  }
  function marcasDaEdicao(){
    var vistas = {}, saida = [];
    for(var i=0;i<COLETIVAS.length;i++){
      if((COLETIVAS[i].edicao||"moto") !== edicaoVista) continue;
      for(var j=0;j<COLETIVAS[i].itens.length;j++){
        var m = String(COLETIVAS[i].itens[j].marca || "").trim();
        if(!m) continue;
        var chave = COLETIVAS[i].dia + "|" + m;
        if(vistas[chave]) continue;      // a mesma marca duas vezes no mesmo dia
        vistas[chave] = true;
        saida.push({ marca:m, dia:COLETIVAS[i].dia, rotulo:COLETIVAS[i].rotulo || COLETIVAS[i].dia,
                     onde:ondeFica(COLETIVAS[i].itens[j]), hora:COLETIVAS[i].itens[j].hora || "" });
      }
    }
    return saida;
  }
  function formMarcasHTML(){
    // a checagem de "ja existe" e por DIA + NOME, nao so por nome: a mesma marca
    // pode ter bloco num dia e nao ter no outro
    var jaTem = {};
    story.forEach(function(s){ jaTem[(s.dia||"") + "|" + (s.grupo||"")] = true; });

    var marcas = marcasDaEdicao(), i;
    var h = '<div class="form"><h3>Blocos das marcas</h3>';
    h += '<p class="sub" style="margin:-4px 0 12px">Cada marca vira um bloco com a mesma lista de itens, '+
         '<b>no dia da coletiva dela</b>. Não importa qual dia está aberto agora. '+
         'Quem já tem bloco vem desmarcada, para não duplicar.</p>';
    h += '<div class="grid2">';
    // Nao tem campo de area aqui de proposito: o lugar de cada marca ja esta na
    // grade (box, Arena, Race Village) e e diferente de marca pra marca. Um
    // seletor unico obrigaria a escolher uma area so pras 19, que seria errada
    // pra maioria delas.
    h += '<div class="fld full"><label>Marcas</label>'+
         '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
         '<button type="button" class="fchip" data-act="marcastodas">Marcar todas</button>'+
         '<button type="button" class="fchip" data-act="marcasnenhuma">Desmarcar todas</button>'+
         '</div></div>';
    h += '<div class="fld full"><label>Itens de cada bloco, um por linha</label>'+
         '<textarea id="m_itens" rows="4" style="min-height:104px">'+esc(ITENS_MARCA.join("\n"))+'</textarea>'+
         '<span style="font-size:.7rem;color:var(--ink-3);margin-top:4px">Vale para todas as marcas marcadas.</span></div>';

    // agrupado por dia, na ordem da grade: e assim que a pessoa confere se a
    // lista bate com a agenda que ela tem na mao
    var diaAnterior = null;
    h += '<div class="fld full"><label>Quais marcas</label>';
    for(i=0;i<marcas.length;i++){
      var m = marcas[i], tem = !!jaTem[m.dia + "|" + m.marca];
      if(m.dia !== diaAnterior){
        if(diaAnterior !== null) h += '</div>';
        h += '<div class="mkdia">'+esc(m.rotulo)+'</div><div class="mklista">';
        diaAnterior = m.dia;
      }
      h += '<label class="mkitem'+(tem?" ja":"")+'">'+
        '<input type="checkbox" class="mkchk" value="'+esc(m.marca)+'" '+
          'data-dia="'+esc(m.dia)+'" data-onde="'+esc(ondeEQuando(m))+'"'+(tem?"":" checked")+'>'+
        '<span>'+esc(m.marca)+
          '<i style="display:block;margin-top:2px">'+esc(ondeEQuando(m))+'</i>'+
          (tem?'<i style="display:block">já tem bloco</i>':'')+
        '</span></label>';
    }
    if(diaAnterior !== null) h += '</div>';
    h += '</div>';
    h += '</div><div class="acoes">'+
      '<button class="btn" data-act="salvarmarcas">Criar blocos</button>'+
      '<button class="btn ghost" data-act="cancelarmarcas">Cancelar</button>'+
    '</div></div>';
    return h;
  }
  function salvarMarcas(){
    var txt  = String(($("#m_itens")||{}).value || "");
    var lista = txt.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    if(!lista.length){ toast("Escreva ao menos um item."); return; }
    for(var j=0;j<lista.length;j++){
      if(lista[j].length > 600){ toast("Um dos itens passou de 600 caracteres. Encurte."); return; }
    }
    var marcadas = [];
    var caixas = document.querySelectorAll(".mkchk");
    for(var c=0;c<caixas.length;c++){
      if(caixas[c].checked) marcadas.push({ marca:caixas[c].value,
                                            dia:caixas[c].getAttribute("data-dia"),
                                            onde:caixas[c].getAttribute("data-onde") || "" });
    }
    if(!marcadas.length){ toast("Marque ao menos uma marca."); return; }

    // Confirma com o numero na frente E com os dias, porque o que vai ser criado
    // nao esta todo na tela que a pessoa esta vendo: sao ate 19 blocos
    // espalhados por dois dias, e desfazer seria apagar item por item.
    var total = marcadas.length * lista.length, porDia = {}, i, k;
    for(i=0;i<marcadas.length;i++) porDia[marcadas[i].dia] = (porDia[marcadas[i].dia]||0) + 1;
    var resumo = [];

  // ═══════════════════════════════════════════════════════════════
  // MINI GUIA — uma unica vez por aparelho, e o "?" reabre quando quiser
  // ═══════════════════════════════════════════════════════════════
  // ═══════════════════════════════════════════════════════════════
  // AVISO NO CELULAR (Web Push)
  //
  // Sem Telegram, sem app de loja: e a propria Central instalada na tela de
  // inicio mandando notificacao, igual app.
  //
  // AS REGRAS DO IPHONE, que mandam no projeto porque o time e quase todo iOS:
  //   1. So funciona com a Central ADICIONADA A TELA DE INICIO. No Safari
  //      normal nao existe, nem aparece a opcao.
  //   2. O pedido de permissao tem que sair de um TOQUE da pessoa dentro do
  //      app instalado. Pedir sozinho ao abrir e ignorado pelo sistema.
  //   3. Se a pessoa recusar, acabou: nao da pra perguntar de novo. Ela teria
  //      que apagar o app da tela de inicio e adicionar outra vez.
  // Por isso a barra explica ANTES o que vai acontecer, em vez de disparar o
  // pedido no primeiro toque: com uma chance so, vale gastar uma frase.
  // ═══════════════════════════════════════════════════════════════
  // Chave publica VAPID. Publica mesmo, pode ficar no codigo: ela so serve pra
  // o navegador amarrar a inscricao a este remetente. Quem assina o envio e a
  // privada, que vive como secret na Cloudflare e nunca entra no repositorio.
  var VAPID_PUB = "BGpVLKMV09mK8-elVjc7xgDKZVvwZAgZc1t_fVDGtNIHks_dE6On1zvRELrAlXaykrJnLD4qJrsH26IUjr8q73Q";
  var PUSH_OFF  = "cfi_push_off";     // pessoa dispensou a barra
  var swReg = null;

  function pushSuportado(){
    return !!(window.navigator && "serviceWorker" in navigator &&
              "PushManager" in window && "Notification" in window);
  }
  function ehIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function instaladoNaTela(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
           navigator.standalone === true;
  }
  function pushDispensado(){
    try{ return localStorage.getItem(PUSH_OFF) === "1"; }catch(e){ return false; }
  }

  function registrarSW(){
    if(!pushSuportado()) return Promise.resolve(null);
    return navigator.serviceWorker.register("sw.js")
      .then(function(r){ swReg = r; return r; })
      ["catch"](function(){ return null; });
  }

  // a chave vai pro navegador como bytes, nao como texto
  function chaveEmBytes(b64){
    var s = (b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g,"+").replace(/_/g,"/");
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  // id fixo por aparelho: sem ele, cada vez que a pessoa reativasse entraria uma
  // inscricao nova e o mesmo celular receberia o aviso repetido
  function idDaInscricao(endpoint){
    var h = 5381;
    for(var i=0;i<endpoint.length;i++){ h = ((h*33) ^ endpoint.charCodeAt(i)) >>> 0; }
    return "s" + h.toString(36) + endpoint.length.toString(36);
  }

  function salvarInscricao(sub){
    if(!FB_ON || !sub) return;
    var j = sub.toJSON ? sub.toJSON() : sub;
    var k = j.keys || {};
    db.collection("cont_push").doc(idDaInscricao(j.endpoint)).set({
      endpoint: j.endpoint,
      p256dh: k.p256dh || "",
      auth:   k.auth   || "",
      quem:   meuNome || quemSou(),
      perfil: PERFIL || "",
      em:     Date.now()
    })["catch"](function(e){ avisoDeFalha(e); });
  }

  function ativarPush(){
    if(!pushSuportado()){ toast("Este navegador não faz notificação."); return; }
    registrarSW().then(function(reg){
      if(!reg){ toast("Não deu para preparar a notificação."); return; }
      return Notification.requestPermission().then(function(p){
        if(p !== "granted"){
          toast(p === "denied"
            ? "Notificação bloqueada nas configurações do aparelho."
            : "Notificação não foi ativada.");
          renderPushbar(); return;
        }
        return reg.pushManager.getSubscription().then(function(s){
          return s || reg.pushManager.subscribe({
            userVisibleOnly: true,                       // exigido no iOS
            applicationServerKey: chaveEmBytes(VAPID_PUB)
          });
        }).then(function(sub){
          salvarInscricao(sub);
          toast("Pronto. Você vai receber aviso de peça nova.");
          renderPushbar();
        });
      });
    })["catch"](function(){ toast("Não deu para ativar a notificação."); });
  }

  function renderPushbar(){
    var bar = $("#pushbar"); if(!bar || !PERM) return;
    var esconder = function(){ bar.hidden = true; bar.innerHTML = ""; };

    if(!pushSuportado() || pushDispensado()) return esconder();
    if(window.Notification && Notification.permission === "granted") return esconder();
    if(window.Notification && Notification.permission === "denied") return esconder();

    var texto, botao;
    if(ehIOS() && !instaladoNaTela()){
      // No iPhone nao adianta oferecer o botao: o pedido nem aparece fora do
      // app instalado. Melhor ensinar o caminho do que dar um botao que falha.
      texto = "Para receber aviso de peça nova no celular, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>. Abra a Central por lá e ative aqui.";
      botao = "";
    } else {
      texto = "Quer receber aviso no celular quando entrar peça nova?";
      botao = '<button class="btn pushok" data-act="ativarpush">Ativar</button>';
    }

    bar.hidden = false;
    bar.innerHTML = '<div class="pushbar">'+
      '<span class="pushtx">'+texto+'</span>'+
      botao+
      '<button class="pushx" data-act="dispensarpush" aria-label="Dispensar">&times;</button>'+
    '</div>';
  }

  // ═══════════════════════════════════════════════════════════════
  // AVISO DE VERSAO NOVA
  // O celular guarda a pagina em cache, e no iPhone salvo na tela de inicio ele
  // segura por muito mais que os 10 minutos que o servidor pede. Isso ja deu
  // confusao no meio do evento: correcao publicada e funcionando no computador,
  // e o time no celular jurando que nada mudou, cada um numa versao diferente.
  // Ninguem vai lembrar de "limpar o cache" com o festival rodando, entao a
  // propria tela avisa e atualiza no toque.
  // ═══════════════════════════════════════════════════════════════
  function checarVersao(){
    if(navigator.onLine === false || !window.fetch) return;
    var base = location.pathname.replace(/[^/]*$/, "");
    fetch(base + "index.html?v=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(txt){
        if(!txt) return;
        var m = txt.match(/var VERSAO = "([^"]+)"/);
        if(m && m[1] && m[1] !== VERSAO) mostrarAvisoVersao();
      })["catch"](function(){});   // sem rede nao e erro, e so nao checar agora
  }

  function mostrarAvisoVersao(){
    if(document.getElementById("novaVersao")) return;
    var d = document.createElement("div");
    d.id = "novaVersao";
    d.innerHTML = '<span>Saiu uma versão mais nova desta tela.</span>'+
                  '<button type="button">Atualizar</button>';
    document.body.appendChild(d);
    d.querySelector("button").addEventListener("click", function(){
      // o ?v= e o que obriga o celular a buscar de novo em vez de servir o cache
      location.replace(location.pathname + "?v=" + Date.now());
    });
  }
