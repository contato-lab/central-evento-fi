<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Conteúdo · Suhai Festival Interlagos</title>
<!-- modo app: instalado na tela de inicio abre sem a barra do navegador -->
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conteúdo FI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Mesma propriedade GA4 da Central (ferramenta de equipe, nao site de venda).
     O perfil entra como user_property, entao da pra separar conteudo de producao. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NRX7DEGC47"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NRX7DEGC47');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  :root{
    --bg:#0B0C0A; --panel:#141613; --panel-2:#1B1E18; --raise:#23271F;
    --line:#2B3026; --line-soft:#232720;
    --ink:#F4F6EF; --ink-2:#A9AFA2; --ink-3:#767C6E;
    --lime:#A6EC4D; --lime-d:#8CD230; --lime-ink:#0B0C0A;
    --cyan:#4CC3F0; --amber:#FBBF24; --red:#F5453F; --roxo:#B98BFF;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:'Barlow Condensed',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  /* NAO TIRAR. O atributo hidden do HTML vira display:none pela folha do
     navegador, e QUALQUER display no CSS nosso ganha dele. O #gate usa
     display:grid, entao sem esta linha a tela de senha continua cobrindo
     tudo depois do login e o sistema fica inutilizavel. Pego no teste de
     tela em 11/08/2026: o hidden marcava true e o login seguia na frente. */
  [hidden]{display:none!important}
  html{overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
  body{margin:0;overflow-x:hidden;overscroll-behavior-x:none}
  .fi{background:radial-gradient(900px 500px at 85% -10%,rgba(166,236,77,.09),transparent 60%),var(--bg);
    color:var(--ink);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
  .fi ::selection{background:var(--lime);color:var(--lime-ink)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  /* no celular, campo com fonte menor que 16px faz o iPhone dar zoom sozinho ao tocar */
  @media(max-width:820px){ input,select,textarea{font-size:16px !important} }
  .mono{font-family:var(--mono)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ---------- LOGIN ---------- */
  #gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
    background:radial-gradient(700px 400px at 50% 0%,rgba(166,236,77,.12),transparent 60%),var(--bg)}
  .gatecard{width:100%;max-width:380px;text-align:center}
  .gatecard img.marca{height:110px;width:auto;margin:0 auto 24px;display:block}
  .gatecard .hi{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.01em}
  .gatecard .sub{color:var(--ink-3);font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  .gatecard form{margin-top:24px;display:flex;flex-direction:column;gap:10px}
  .gatecard input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    padding:14px 16px;font-size:1rem;text-align:center;letter-spacing:.05em}
  .gatecard input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(166,236,77,.15)}
  .gatecard button[type=submit]{background:var(--lime);color:var(--lime-ink);border:0;border-radius:11px;padding:14px;
    font-weight:700;font-size:1rem}
  .gatecard button[type=submit]:hover{background:var(--lime-d)}
  .gate-err{color:var(--red);font-size:.82rem;min-height:1.1em;font-weight:600}
  .pwwrap{position:relative;display:block}
  .pwwrap input{padding-right:96px !important;padding-left:96px !important}
  .pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--ink-3);font-family:var(--mono);
    font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
    min-height:44px;padding:0 10px;border-radius:9px}
  .pweye:hover{color:var(--ink)}
  .pweye:focus-visible{outline:2px solid var(--lime);outline-offset:2px;color:var(--ink)}
  @media(max-width:420px){
    .pwwrap input{padding-right:84px !important;padding-left:14px !important;text-align:left}
    .pweye{font-size:.62rem}
  }
  .gate-note{color:var(--ink-3);font-size:.74rem;margin-top:18px;line-height:1.5}
  .porlime{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
    color:var(--ink-3);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase}
  .porlime img{height:26px;width:auto}

  /* ---------- TOPO ---------- */
  /* safe-area: no iPhone com o app instalado a barra de status fica TRANSLUCIDA
     por cima da pagina (apple-mobile-web-app-status-bar-style black-translucent).
     Sem estes env() o relogio e a bateria cobrem os logos do topo. */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg),rgba(11,12,10,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
    padding-top:env(safe-area-inset-top)}
  .top .bar{display:flex;align-items:center;gap:14px;height:74px}
  .top img.logo{height:46px;width:auto}
  .top .sep{width:1px;height:30px;background:var(--line)}
  .top img.logolime{height:50px;width:auto;display:block}
  @media(max-width:420px){ .top img.logolime{height:40px} .top img.logo{height:38px} }
  .top .spacer{flex:1}
  .top .out{background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:9px;
    padding:8px 12px;font-size:.78rem;font-weight:600}
  .top .out:hover{color:var(--ink)}
  .top .ajuda{background:transparent;border:1px solid var(--line);color:var(--ink-2);
    border-radius:50%;width:36px;height:36px;font-size:.9rem;font-weight:700;flex-shrink:0;font-family:inherit}
  .top .ajuda:hover{border-color:var(--lime);color:var(--lime)}
  .quemsou{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-soft);
    padding:4px 10px;border-radius:99px;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  /* o "quem sou" (perfil) some no celular; o "quem é você" (nome da pessoa) FICA,
     porque e o que liga o filtro Minhas peças, que e justamente de quem esta em campo */
  @media(max-width:620px){.quemsou{display:none} .quemsou.eununo{display:inline-block}}
  .quemsou.eununo{cursor:pointer;border-color:var(--line);color:var(--lime);
    min-height:34px;max-width:30vw}
  .quemsou.eununo:hover{border-color:var(--lime)}
  .fchip.destaque:not(.on){border-color:rgba(166,236,77,.4);color:var(--lime)}
  .syncdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .syncdot.on{background:var(--lime);box-shadow:0 0 0 3px rgba(166,236,77,.18)}
  .syncdot.off{background:var(--ink-3);box-shadow:0 0 0 3px rgba(118,124,110,.15)}
  .syncdot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.2);animation:sdpulse 1s infinite}
  @keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* abas */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line-soft)}
  .tabs .wrap2{display:flex;gap:6px;max-width:1240px;margin:0 auto;padding:0 20px;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs .wrap2::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:0;color:var(--ink-3);font-family:var(--display);
    font-weight:700;font-size:1.12rem;padding:13px 6px;position:relative;letter-spacing:-.01em;
    display:inline-flex;align-items:center;gap:9px}
  .tab .n{font-family:var(--mono);font-size:.68rem;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink-3);padding:2px 7px;border-radius:100px}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime);border-radius:2px}
  .tab.active .n{color:var(--lime);border-color:rgba(166,236,77,.35)}
  /* bolinha na aba: enxergavel de qualquer lugar, entao a pessoa sabe que tem
     coisa nova em outra aba sem sair de onde esta */
  .tab.temnovo{position:relative}
  .tab.temnovo::before{content:"";position:absolute;top:9px;right:-2px;width:7px;height:7px;
    border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--bg)}

  /* ---------- FAIXA DE NOVIDADE ---------- */
  .novbar{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;
    background:rgba(166,236,77,.09);border:1px solid rgba(166,236,77,.35);
    border-radius:12px;padding:11px 14px;color:var(--ink);font-family:inherit;
    font-size:.86rem;text-align:left;cursor:pointer;min-height:46px}
  .novbar:hover{background:rgba(166,236,77,.15)}
  .novbar:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .novpt{width:9px;height:9px;border-radius:50%;background:var(--lime);flex:0 0 auto;
    animation:novpulse 1.8s ease-in-out infinite}
  @keyframes novpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .novtx{flex:1;min-width:0;line-height:1.4}
  .novtx b{color:var(--lime)}
  .novir{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--lime);border:1px solid rgba(166,236,77,.5);border-radius:7px;padding:4px 10px;flex:0 0 auto}
  @media(prefers-reduced-motion:reduce){ .novpt{animation:none} }

  /* ATENCAO: env() NAO pode ir dentro do atalho "padding". Se o navegador nao
     entender o env(), ele joga fora a declaracao INTEIRA e o padding vira 0.
     Aconteceu aqui: o topo colou na regua de abas. Valor normal primeiro,
     safe-area so como acrescimo, em propriedade separada. */
  /* PRECISA ser "main.wrap": o <main> tem class="wrap", e .wrap{padding:0 20px}
     e seletor de classe, que ganha do seletor de tag. Escrito so como "main"
     esta regra NUNCA valeu — o respiro do topo vinha por acidente da margem
     das sub-abas, e sumiu quando eu ajustei ela. */
  main.wrap{padding-top:16px;padding-bottom:100px}
  @supports(padding:env(safe-area-inset-bottom)){
    main.wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  }

  /* sub-abas (dias) */
  .subtabs{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .subtab{background:transparent;border:1px solid var(--line);color:var(--ink-2);
    border-radius:20px;padding:8px 16px;font-size:.82rem;font-weight:600;min-height:38px}
  .subtab.active{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .subtab:not(.active):hover{border-color:var(--lime);color:var(--ink)}

  /* faixa de resumo no topo de cada modulo */
  .resumo{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  /* flex:1 com base pequena: as 3 caixas dividem a largura e cabem numa linha
     so no celular, em vez de quebrar pra duas e empurrar o conteudo pra baixo */
  .rbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;flex:1 1 90px;min-width:90px;max-width:200px}
  .rbox .rk{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)}
  .rbox .rv{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1;margin-top:2px}
  .rbox.destaque .rv{color:var(--lime)}
  .rbox.alerta .rv{color:var(--amber)}

  /* ===== PASTILHAS DE CONTAGEM =====
     Os 3 numeros que mandam ficam em caixa grande; os outros 8 (status por
     etapa, redes e impulsionamento) viram pastilha. Em caixa grande nao caberia
     no celular sem virar parede de numeros. */
  .tiras{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 6px}
  .tira{display:inline-flex;align-items:baseline;gap:5px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:5px 9px;white-space:nowrap}
  .tira .tk{font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-3)}
  .tira .tv{font-family:var(--display);font-weight:700;font-size:.98rem;color:var(--ink)}
  .tira[data-st=gravando] .tv{color:var(--amber)}
  .tira[data-st=edicao] .tv{color:var(--cyan)}
  .tira[data-st=pronto] .tv{color:var(--roxo)}
  .tira[data-st=publicado] .tv{color:var(--lime)}
  .tira.rede .tv{color:var(--ink-2)}
  .tira.apagada{opacity:.55}
  .tira.boostt{border-color:rgba(251,191,36,.3)}
  .tira.boostt .tv{color:var(--amber)}
  /* pendente = tem peca marcada pra impulsionar que ainda nao subiu */
  .tira.boostt.pendente{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.5)}

  .nalista{font-size:.76rem;color:var(--ink-3);margin:0 0 10px}
  .nalista b{color:var(--lime)}
  .dica{font-size:.75rem;color:var(--ink-3);line-height:1.45;
    padding:9px 11px;background:var(--panel-2);border:1px dashed var(--line);
    border-radius:9px;margin:2px 0 4px}

  /* ---------- BLOCO (cartao dobravel) ---------- */
  .bloco{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .bloco.completo{border-color:rgba(166,236,77,.32)}
  /* bloco fechado fica mais apagado e ocupa uma linha: e trabalho concluido,
     nao precisa competir por atencao com o que ainda falta */
  .bloco.recolhido{background:var(--panel-2)}
  .bloco.recolhido .cnome{font-size:.9rem;color:var(--ink-2)}
  .bloco.completo.recolhido .cnome{color:var(--ink)}
  .cabeca{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;
    background:transparent;border:0;color:var(--ink);text-align:left}
  .cabeca:hover{background:var(--panel-2)}
  .chora{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--lime);
    min-width:56px;flex:0 0 auto}
  /* display:block obrigatorio: sao <span>, e sem isso marca e influenciador
     saem grudados na mesma linha ("CFMOTOSeku Mello"). */
  .cnome{display:block;font-weight:700;font-size:.96rem;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cinflu{display:block;font-size:.78rem;color:var(--ink-2);margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmeio{flex:1;min-width:0}
  /* quem grava e quem edita no cartao FECHADO: e assim que o fotografo e o
     editor acham a peca deles sem abrir uma por uma */
  .cgente{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.03em;
    color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cgente.vazia{font-style:italic;opacity:.65}
  .cgente .eu{color:var(--lime);font-weight:700}
  .cbox{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:700;
    letter-spacing:.04em;color:var(--lime);background:rgba(166,236,77,.12);
    border:1px solid rgba(166,236,77,.3);border-radius:5px;padding:1px 6px;
    vertical-align:1px;flex:0 0 auto}
  .cbox.local{color:var(--cyan);background:rgba(76,195,240,.12);border-color:rgba(76,195,240,.35)}
  .cbox.pend{color:var(--ink-3);background:transparent;border-style:dashed;
    border-color:var(--line);font-weight:400;text-transform:lowercase}
  .cprog{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--ink-3);
    white-space:nowrap;flex:0 0 auto}
  .cprog.ok{color:var(--lime)}
  .cmais{font-family:var(--mono);font-size:1rem;color:var(--ink-3);width:22px;text-align:center;flex:0 0 auto}
  .corpo{padding:0 15px 14px;border-top:1px solid var(--line-soft)}

  /* ---------- PECA DE CONTEUDO ---------- */
  .peca{padding:13px 0;border-bottom:1px solid var(--line-soft)}
  .peca:last-child{border-bottom:0}
  .pnome{font-weight:700;font-size:.88rem;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  /* 42px de altura: esses chips sao tocados de pe, no sol, com uma mao so.
     Abaixo disso o dedo erra e marca o status errado. */
  .stchip{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);
    border-radius:8px;padding:9px 13px;font-size:.78rem;font-weight:600;min-height:42px}
  .stchip:hover{color:var(--ink);border-color:var(--ink-3)}
  .stchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .stchip.on[data-st=gravando]{background:var(--amber);border-color:var(--amber)}
  .stchip.on[data-st=edicao]{background:var(--cyan);border-color:var(--cyan)}
  .stchip.on[data-st=pronto]{background:var(--roxo);border-color:var(--roxo)}

  .linhaflex{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .mini{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);
    border-radius:8px;padding:8px 12px;font-size:.74rem;font-weight:600;min-height:40px}
  .mini:hover{color:var(--ink)}
  .mini.on{background:rgba(166,236,77,.14);border-color:rgba(166,236,77,.5);color:var(--lime)}
  .mini.boost.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.55);color:var(--amber)}
  /* "já impulsionei": so aparece depois de marcar Impulsionar. Fica ambar
     tracejado enquanto esta pendente pra puxar o olho de quem cuida da mídia. */
  .mini.feito{border-style:dashed;border-color:rgba(251,191,36,.45);color:var(--amber)}
  .mini.feito.on{background:rgba(251,191,36,.22);border-style:solid;
    border-color:var(--amber);color:var(--amber);font-weight:700}

  .campo{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .campo input[type=text],.campo input[type=url],.campo input[type=time]{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:.82rem}
  .campo input:focus{outline:none;border-color:var(--lime)}
  .campo .cl{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);width:64px;flex:0 0 auto}

  /* ---------- LEGENDA DO POST ---------- */
  .legbox{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;margin:8px 0}
  .legtop{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .legtit{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);flex:1}
  .legcopy{background:var(--raise);border:1px solid var(--line);color:var(--lime);
    border-radius:8px;padding:7px 13px;font:inherit;font-size:.72rem;font-weight:700;
    min-height:36px;flex:0 0 auto}
  .legcopy:hover{border-color:var(--lime)}
  /* pre-wrap preserva as quebras de linha da legenda como foram escritas:
     legenda de Instagram tem paragrafo e bloco de hashtag, e virar texto
     corrido faria a pessoa colar errado */
  .legtx{white-space:pre-wrap;word-break:break-word;font-size:.84rem;line-height:1.55;
    color:var(--ink)}
  .abrir{background:var(--panel-2);border:1px solid var(--line);color:var(--lime);
    border-radius:9px;padding:9px 11px;font-size:.72rem;font-weight:700;text-decoration:none;
    display:inline-flex;align-items:center;min-height:36px;flex:0 0 auto}
  .abrir:hover{border-color:var(--lime)}
  .abrir.off{color:var(--ink-3);pointer-events:none;opacity:.4}

  /* ---------- BUSCA E FILTRO ---------- */
  .barrafiltro{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .busca{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:11px 14px;font-size:.88rem}
  .busca:focus{outline:none;border-color:var(--lime)}
  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .fchip{background:var(--panel);border:1px solid var(--line);color:var(--ink-3);
    border-radius:20px;padding:7px 14px;font-size:.76rem;font-weight:600;min-height:36px}
  .fchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .fchip:not(.on):hover{color:var(--ink);border-color:var(--ink-3)}

  .btn{background:var(--lime);color:var(--lime-ink);border:0;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:.86rem;min-height:42px}
  .btn:hover{background:var(--lime-d)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
  .btn.perigo{background:transparent;border:1px solid rgba(245,69,63,.4);color:var(--red)}
  .btn.perigo:hover{background:rgba(245,69,63,.1)}

  /* ---------- FORMULARIO ---------- */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .form h3{margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:1.15rem;

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr} }
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .fld input,.fld select,.fld textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);

  .fld.full{grid-column:1/-1}
  .acoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  /* ---------- TAGS ---------- */
  .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:6px;white-space:nowrap;flex:0 0 auto}
  .tag.organico{background:rgba(76,195,240,.14);color:var(--cyan);border:1px solid rgba(76,195,240,.35)}
  .tag.pago{background:rgba(185,139,255,.14);color:var(--roxo);border:1px solid rgba(185,139,255,.35)}
  .tag.st{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
  .tag.st[data-st=gravando]{color:var(--amber);border-color:rgba(251,191,36,.4)}
  .tag.st[data-st=edicao]{color:var(--cyan);border-color:rgba(76,195,240,.4)}
  .tag.st[data-st=pronto]{color:var(--roxo);border-color:rgba(185,139,255,.4)}
  .tag.st[data-st=publicado]{color:var(--lime);border-color:rgba(166,236,77,.45)}
  .tag.boost{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
  .tag.area{background:var(--raise);color:var(--ink-2);border:1px solid var(--line)}

  /* ---------- CHECKLIST ---------- */
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .chk:last-child{border-bottom:0}
  /* o quadradinho e o controle mais tocado do StoryMaker, e quem toca esta
     andando pelo autodromo. 34px e o minimo que o dedo acerta sem olhar. */
  .chkbox{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:transparent;font-size:1.05rem;font-weight:700;
    flex:0 0 auto;display:grid;place-items:center;padding:0;line-height:1}
  .chkbox.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .chktx{flex:1;min-width:0;font-size:.88rem;line-height:1.45}
  .chk.feito .chktx{color:var(--ink-3);text-decoration:line-through}
  .chkresp{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--ink-3);
    margin-top:3px;display:block}
  .chkresp b{color:var(--ink-2);font-weight:600}
  /* "definir responsável", "trocar" e o × são o fluxo mais usado pelo storymaker
     andando pelo autódromo. Estavam com ~18px de altura: menos que a ponta do dedo. */
  .chkdel{background:transparent;border:0;color:var(--ink-3);font-size:1rem;
    padding:8px 10px;margin:-4px 0;min-height:36px;flex:0 0 auto}
  .chkdel:hover{color:var(--red)}
  .chkresp .chkdel{color:var(--lime);text-decoration:underline;text-underline-offset:3px}
  .chkresp .chkdel:hover{color:var(--lime-d)}

  /* ---------- ESTADOS ---------- */
  .vazio{text-align:center;padding:46px 20px;color:var(--ink-3)}
  .vazio .big{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink-2);margin-bottom:6px}
  .vazio .sm{font-size:.85rem;line-height:1.5;max-width:400px;margin:0 auto}
  #offline{background:rgba(251,191,36,.13);border-bottom:1px solid rgba(251,191,36,.4);
    color:var(--amber);font-size:.8rem;padding:9px 20px;text-align:center;font-weight:600}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    padding:12px 18px;font-size:.86rem;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;z-index:80;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* safe-area em propriedade separada, pelo mesmo motivo do main */
  @supports(padding:env(safe-area-inset-bottom)){
    #toast{bottom:calc(26px + env(safe-area-inset-bottom))}
    #gate{padding-top:calc(24px + env(safe-area-inset-top));
          padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  }

  .rulebox{display:flex;gap:10px;align-items:flex-start;background:rgba(166,236,77,.07);
    border:1px solid rgba(166,236,77,.28);border-radius:11px;padding:11px 13px;margin:2px 0 12px}
  .rulebox .ic{color:var(--lime);font-weight:700;flex:0 0 auto;line-height:1.45}
  .rulebox .tx{font-size:.85rem;line-height:1.45;color:var(--ink-2)}
  .rulebox .tx b{color:var(--ink)}

  /* ---------- MINI GUIA ---------- */
  #guiaOverlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;
    display:flex;align-items:flex-end;justify-content:center;padding:14px}
  .guiacard{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px;width:100%;max-width:420px;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
  .guiaquem{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .guiaperfil{font-family:var(--display);font-weight:700;font-size:1.7rem;color:var(--lime);margin:2px 0 12px}
  .guialista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .guialista li{font-size:.9rem;line-height:1.5;color:var(--ink);padding-left:14px;border-left:2px solid var(--lime)}
  .guiacard .btn{width:100%;margin-top:18px}
  @media(min-width:560px){ #guiaOverlay{align-items:center} }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var VERSAO = "2026-08-12.1";

  // ═══════════════════════════════════════════════════════════════
  // PERFIS
  // A matriz de permissao vive AQUI, no codigo, nunca no banco. O banco
  // so diz quem tem qual perfil; o codigo diz o que cada perfil pode.
  //
  // Dois niveis de proposito:
  //   conteudo  = direcao e edicao (Nil, Isa, coordenacao, editores). Ve tudo.
  //   story     = storymaker de campo. So o checklist do dia dele.
  // O storymaker nao precisa (nem deve) mexer na grade das coletivas no
  // meio do corre. Menos tela = menos engano.
  // ═══════════════════════════════════════════════════════════════
  var PERFIS = {
    conteudo: { rotulo:"Conteúdo",   coletivas:"gerenciar", pecas:"gerenciar", story:"gerenciar" },
    story:    { rotulo:"StoryMaker", coletivas:"nenhum",    pecas:"nenhum",    story:"gerenciar" }
  };

  // Caminho de recuperacao: estas senhas funcionam SEMPRE, mesmo com o banco
  // fora do ar. Impede o time ficar trancado pra fora no dia do evento.
  var ACESSOS_PADRAO = [
    { nome:"Time de Conteúdo", senha:"conteudo2026", perfil:"conteudo" },
    { nome:"StoryMaker",       senha:"story2026",    perfil:"story"    }
  ];

  // ═══════════════════════════════════════════════════════════════
  // FIREBASE — mesmo projeto da Central do Evento, colecoes proprias.
  // Arquivo separado de proposito: se este modulo quebrar no meio do
  // evento, o mural do locutor e os avisos da imprensa continuam de pe.
  // ═══════════════════════════════════════════════════════════════
  var firebaseConfig = {
    apiKey: "AIzaSyD1spoy847dEtccSGJflKtG4-EYZMe23OQ",
    authDomain: "central-evento-fi.firebaseapp.com",
    projectId: "central-evento-fi",
    storageBucket: "central-evento-fi.firebasestorage.app",
    messagingSenderId: "343908101394",
    appId: "1:343908101394:web:ae260e08858b43e70dd7cb"
  };
  var FB_ON = !!(firebaseConfig.projectId && window.firebase);
  var db = null;
  if(FB_ON){
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      // cache no aparelho: o autodromo cheio derruba dados de celular. Com isso
      // a pessoa marca "publicado" sem sinal e sobe sozinho quando a rede volta.
      try{ db.enablePersistence({ synchronizeTabs:true })["catch"](function(){}); }catch(e){}
    }catch(e){ FB_ON = false; }
  }

  // ---- helpers ----
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var uid = function(){ return Math.random().toString(36).slice(2,9); };
  function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); },1800); }

  // Link so vira link se for http(s). Sem isso alguem cola "javascript:..." ou
  // um caminho relativo e o cartao passa a apontar pra qualquer coisa.
  // Marcar/desmarcar rede sem corrida. Com Firestore usa o operador atomico do
  // proprio banco; no modo local (sem Firebase) nao existe corrida, entao vale
  // o array normal — o sentinel do FieldValue nao funciona no localStorage.
  function setaRede(rede, jaTem, atual){
    if(FB_ON){
      return jaTem ? firebase.firestore.FieldValue.arrayRemove(rede)
                   : firebase.firestore.FieldValue.arrayUnion(rede);
    }
    var r = (atual||[]).slice(), p = r.indexOf(rede);
    if(p<0) r.push(rede); else r.splice(p,1);
    return r;
  }

  // Conta tudo que a faixa de cima mostra. Serve pras duas abas porque slot de
  // coletiva e peca avulsa tem os mesmos campos de status/redes/impulsionamento.
  function contarPainel(lista){
    var c = { total:lista.length, gravando:0, edicao:0, pronto:0, publicado:0,
              semStatus:0, boost:0, boostFeito:0, ig:0, tt:0, yt:0 };
    for(var i=0;i<lista.length;i++){
      var x = lista[i] || {};
      if(x.status && c[x.status] !== undefined) c[x.status]++;
      else if(!x.status) c.semStatus++;
      if(x.impulsionar){ c.boost++; if(x.impulsionado) c.boostFeito++; }
      var r = x.redes || [];
      if(r.indexOf("ig") >= 0) c.ig++;
      if(r.indexOf("tt") >= 0) c.tt++;
      if(r.indexOf("yt") >= 0) c.yt++;
    }
    return c;
  }

  // Faixa compacta com TODOS os numeros. Os 3 que mandam ficam em caixa grande;
  // o resto vira pastilha, senao nao cabe no celular sem virar parede de numeros.
  function painelHTML(c, rotuloTotal){
    var h = '<div class="resumo">'+
      '<div class="rbox"><div class="rk">'+esc(rotuloTotal)+'</div><div class="rv">'+c.total+'</div></div>'+
      '<div class="rbox destaque"><div class="rk">Publicadas</div><div class="rv">'+c.publicado+'</div></div>'+
      // rotulo curto de proposito: "Prontas p/ subir" fazia a caixa estourar a
      // largura e as 3 caixas quebravam em duas linhas no celular
      '<div class="rbox'+(c.pronto?" alerta":"")+'"><div class="rk">Prontas</div><div class="rv">'+c.pronto+'</div></div>'+
    '</div>';

    var pill = function(rot, val, st, extra){
      return '<span class="tira'+(extra||"")+'"'+(st?' data-st="'+st+'"':'')+'>'+
        '<span class="tk">'+esc(rot)+'</span><span class="tv">'+val+'</span></span>';
    };
    // ORDEM = a fila de producao: nao comecou -> gravando -> edicao -> pronto -> no ar.
    // "Sem status" vem primeiro de proposito: alem de ser o inicio da fila, evita
    // que ele sobre sozinho numa linha quando as pastilhas quebram no celular.
    h += '<div class="tiras">';
    if(c.semStatus) h += pill("Não começou", c.semStatus, "", " apagada");
    h += pill("Gravando",  c.gravando,  "gravando");
    h += pill("Em edição", c.edicao,    "edicao");
    h += pill("Pronto",    c.pronto,    "pronto");
    h += pill("No ar",     c.publicado, "publicado");
    h += '</div>';
    h += '<div class="tiras">';
    h += pill("Instagram", c.ig, "", " rede");
    h += pill("TikTok",    c.tt, "", " rede");
    h += pill("YouTube",   c.yt, "", " rede");
    // "2 de 5" e a leitura que o time pediu: quantos ja subiram do que foi marcado
    h += '<span class="tira boostt'+(c.boost && c.boostFeito < c.boost ? " pendente":"")+'">'+
         '<span class="tk">Impulso</span>'+
         '<span class="tv">'+c.boostFeito+'/'+c.boost+'</span></span>';
    h += '</div>';
    return h;
  }

  // Plano B de copia pra quando o navegador nao dá clipboard. Precisa estar no
  // DOM e visível o suficiente pro execCommand funcionar em iOS, por isso o
  // textarea fica fora da tela em vez de display:none.
  function copiaNaMarra(txt, ok){
    var t = document.createElement("textarea");
    t.value = txt;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
    document.body.appendChild(t);
    t.select(); t.setSelectionRange(0, txt.length);
    var deu = false;
    try{ deu = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t);
    if(deu && ok) ok();
    else toast("Não consegui copiar. Selecione o texto e copie na mão.");
  }

  function linkSeguro(u){
    var s = String(u||"").trim();
    if(!s) return "";
    if(!/^https?:\/\//i.test(s)) return "";
    return s;
  }

  // ═══════════════════════════════════════════════════════════════
  // CAMADA DE DADOS
  // TODAS as colecoes usam estrategia "collection": UM DOCUMENTO POR ITEM.
  //
  // Isso e diferente da Central, que guarda o mural inteiro num documento so.
  // La funciona porque quem escreve e so a producao. Aqui vao ser Nil, Isa,
  // coordenacao e os editores mexendo AO MESMO TEMPO durante o evento. Com
  // documento unico, quem salva por ultimo apaga a edicao do outro sem avisar
  // ninguem. Um documento por peca elimina isso na raiz.
  // ═══════════════════════════════════════════════════════════════
  var COL = { coletivas:"cont_coletivas", pecas:"cont_pecas", story:"cont_story" };

  var watchers = {};
  function lsGet(c){ try{ return JSON.parse(localStorage.getItem("cfi_"+c)) || []; }catch(e){ return []; } }
  function lsSet(c,a){ try{ localStorage.setItem("cfi_"+c, JSON.stringify(a)); }catch(e){}
    if(watchers[c]) watchers[c](a); }

  var connState = FB_ON ? "on" : "off";
  var offTimer = null;
  function setStatus(st){
    if(st) connState = st;
    var s=$("#syncDot"); if(!s) return;
    s.className = "syncdot " + connState;
    s.title = (connState==="on" ? "Sincronizado em tempo real"
            : connState==="warn" ? "Reconectando, mostrando a última informação"
            : "Modo local (só neste aparelho)") + "  ·  versão " + VERSAO;
    var b = $("#offline"); if(!b) return;
    if(connState === "warn"){
      // 4s de tolerancia: piscada de rede nao merece faixa amarela na tela
      if(!offTimer && b.hidden){
        offTimer = setTimeout(function(){ offTimer=null; if(connState==="warn") b.hidden=false; },4000);
      }
    } else {
      if(offTimer){ clearTimeout(offTimer); offTimer=null; }
      b.hidden = true;
    }
  }

  // Erro que NAO e queda de rede precisa aparecer com todas as letras, senao o
  // time fica achando que e sinal ruim enquanto o sistema esta fora do ar.
  function avisoDeFalha(err){
    var b = $("#offline"); if(!b) return;
    var code = err && err.code ? String(err.code) : "";
    if(code === "resource-exhausted"){
      b.textContent = "O limite diário do banco foi atingido. A tela mostra a última versão salva. Fale com o Eric.";
      b.hidden = false; if(offTimer){ clearTimeout(offTimer); offTimer=null; }
    } else if(code === "permission-denied" || code === "unauthenticated"){
      // As regras JA estao publicadas (11/08/2026), entao hoje a causa mais
      // provavel de recusa e texto acima do teto, nao regra faltando.
      b.textContent = "O banco recusou a gravação. Pode ser texto longo demais num campo. Fale com o Eric.";
      b.hidden = false; if(offTimer){ clearTimeout(offTimer); offTimer=null; }
    }
    if(window.console) console.error("[conteudo] firestore", code, err);
  }

  function DBwatch(c, cb){
    watchers[c] = cb;
    if(!FB_ON){
      cb(lsGet(c));
      window.addEventListener("storage", function(ev){ if(ev.key==="cfi_"+c) cb(lsGet(c)); });
      return function(){};
    }
    var onErr = function(err){ setStatus("warn"); avisoDeFalha(err); };
    // includeMetadataChanges e obrigatorio: sem ele, quando o servidor confirma o
    // MESMO dado que ja estava no cache nao chega aviso, e o amarelo fica preso.
    return db.collection(COL[c]).onSnapshot({ includeMetadataChanges:true }, function(snap){
      setStatus(snap.metadata && snap.metadata.fromCache ? "warn" : "on");
      var a=[]; snap.forEach(function(d){ var o=d.data()||{}; o.id=d.id; a.push(o); });
      cb(a);
    }, onErr);
  }

  function DBadd(c, obj){
    if(!FB_ON){ obj.id=uid(); var a=lsGet(c); a.push(obj); lsSet(c,a); return; }
    db.collection(COL[c]).add(obj)["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  function DBupdate(c, id, patch){
    if(!FB_ON){
      var a=lsGet(c), i;
      for(i=0;i<a.length;i++){ if(a[i].id===id){ for(var k in patch) a[i][k]=patch[k]; } }
      lsSet(c,a); return;
    }
    db.collection(COL[c]).doc(id).update(patch)["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  // set com merge: usado pelas coletivas, que tem id fixo e podem nao existir ainda
  function DBset(c, id, patch){
    if(!FB_ON){
      var a=lsGet(c), achou=false, i;
      for(i=0;i<a.length;i++){ if(a[i].id===id){ achou=true; for(var k in patch) a[i][k]=patch[k]; } }
      if(!achou){ var o={id:id}; for(var k2 in patch) o[k2]=patch[k2]; a.push(o); }
      lsSet(c,a); return;
    }
    db.collection(COL[c]).doc(id).set(patch,{merge:true})["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  function DBremove(c, id){
    if(!FB_ON){ lsSet(c, lsGet(c).filter(function(x){ return x.id!==id; })); return; }
    db.collection(COL[c]).doc(id).delete()["catch"](function(e){ avisoDeFalha(e); toast("Não deu para apagar."); });
  }

  // ---- permissoes: checadas ao DESENHAR e de novo ao EXECUTAR ----
  function definirPerfil(p){ PERFIL = PERFIS[p] ? p : null; PERM = PERFIL ? PERFIS[PERFIL] : null; return !!PERM; }

  // ═══════════════════════════════════════════════════════════════
  // MODULO 1 — COLETIVAS
  // A grade e fixa; o banco guarda so o que muda (status, links, impulsionar).
  // O id do documento e derivado da grade, entao nada precisa ser semeado:
  // o documento nasce na primeira vez que alguem toca naquela peca.
  // ═══════════════════════════════════════════════════════════════
  function slotId(dia, hora, idx){
    return "c_" + dia.slice(5).replace("-","") + "_" + hora.replace(/[h:]/g,"") + "_" + idx;
  }
  function estadoDe(id){
    for(var i=0;i<coletivas.length;i++){ if(coletivas[i].id===id) return coletivas[i]; }
    return null;
  }

  function renderColetivas(){
    var el = $("#view-coletivas");
    if(!podeVer("coletivas")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div>'+
        '<div class="sm">Seu login é de StoryMaker. Use a aba StoryMaker.</div></div>';
      return;
    }
    var grade = null, i, j, k;
    for(i=0;i<COLETIVAS.length;i++){ if(COLETIVAS[i].dia===diaColetiva) grade = COLETIVAS[i]; }
    if(!grade) grade = COLETIVAS[0];

    // junta o estado das 27 pecas do dia pra faixa de numeros do topo
    var doDia = [];
    for(i=0;i<grade.itens.length;i++){
      for(j=0;j<FORMATOS_COLETIVA.length;j++){
        doDia.push(estadoDe(slotId(grade.dia, grade.itens[i].hora, j)) || {});
      }
    }

    var h = '';
    h += '<div class="subtabs">';
    for(i=0;i<COLETIVAS.length;i++){
      h += '<button class="subtab'+(COLETIVAS[i].dia===diaColetiva?" active":"")+'" data-act="diacol" data-dia="'+COLETIVAS[i].dia+'">'+esc(COLETIVAS[i].rotulo)+'</button>';
    }
    h += '</div>';

    h += painelHTML(contarPainel(doDia), "Peças do dia");

    // texto curto: em tela de celular esse aviso comia 100px antes do primeiro cartao
    h += '<div class="rulebox"><div class="ic">&#9679;</div><div class="tx">'+
      'A grade é a agenda oficial. Você mexe em <b>status, links e impulsionamento</b>. Salva sozinho.'+
      '</div></div>';

    for(i=0;i<grade.itens.length;i++){
      var it = grade.itens[i];
      var pub=0, pecasHtml='';
      for(j=0;j<FORMATOS_COLETIVA.length;j++){
        var id = slotId(grade.dia, it.hora, j);
        var st = estadoDe(id) || {};
        if(st.status === "publicado") pub++;
        pecasHtml += pecaColetivaHTML(id, FORMATOS_COLETIVA[j], st);
      }
      var aberto = !!abertos[grade.dia+"_"+i];
      var completo = pub === FORMATOS_COLETIVA.length;
      h += '<div class="bloco'+(completo?" completo":"")+'">'+
        '<button class="cabeca" data-act="abrircol" data-key="'+grade.dia+'_'+i+'">'+
          '<span class="chora">'+esc(it.hora)+'</span>'+
          // O box vai na linha do influenciador, NAO na do nome da marca. Testei
          // no celular com ele junto da marca: em "BMW Motorrad" e "Fun Motors"
          // o .cnome (nowrap + ellipsis) cortava justo a etiqueta do box, que e o
          // dado mais util do cartao pra quem esta indo gravar. E vem ANTES do
          // nome do influenciador de proposito: se faltar espaco, quem encurta e
          // o nome da pessoa, nao o numero do box.
          '<span class="cmeio"><span class="cnome">'+esc(it.marca)+'</span>'+
          '<span class="cinflu">'+

             : it.box ? '<span class="cbox">Box '+esc(it.box)+'</span> '
                      : '<span class="cbox pend">box a definir</span> ')+
            esc(it.influ)+'</span></span>'+

        '</button>'+
        (aberto ? '<div class="corpo">'+pecasHtml+'</div>' : '')+

  function pecaColetivaHTML(id, formato, st){
    var i, h='';
    var status = st.status || "";
    h += '<div class="peca">';
    h += '<div class="pnome">'+esc(formato);
    if(st.impulsionar) h += ' <span class="tag boost">Impulsionar</span>';
    h += '</div>';

    h += '<div class="stchips">';
    for(i=0;i<STATUS.length;i++){
      h += '<button class="stchip'+(status===STATUS[i]?" on":"")+'" data-st="'+STATUS[i]+'" '+
           'data-act="stcol" data-id="'+id+'" title="'+esc(ST_LABEL[STATUS[i]])+'">'+esc(ST_CURTO[STATUS[i]])+'</button>';
    }
    h += '</div>';

    h += '<div class="linhaflex">';
    h += '<button class="mini boost'+(st.impulsionar?" on":"")+'" data-act="boostcol" data-id="'+id+'">Impulsionar</button>';
    // o "ja impulsionado" so aparece depois de marcar que VAI impulsionar:
    // sem isso seriam dois botoes concorrentes pra quem nem vai usar mídia paga
    if(st.impulsionar){
      h += '<button class="mini feito'+(st.impulsionado?" on":"")+'" data-act="boostokcol" data-id="'+id+'">'+
           (st.impulsionado ? "&#10003; Impulsionado" : "Já impulsionei")+'</button>';
    }
    for(i=0;i<REDES.length;i++){
      var on = st.redes && st.redes.indexOf(REDES[i].k) >= 0;
      h += '<button class="mini'+(on?" on":"")+'" data-act="redecol" data-id="'+id+'" data-rede="'+REDES[i].k+'">'+esc(REDES[i].n)+'</button>';
    }
    h += '</div>';

    h += campoLink("Pronto", id, "linkPronto", st.linkPronto, "stcol-link", "Link do Drive");
    h += linksDeRedeHTML(id, st, "stcol-link");
    h += '</div>';
    return h;
  }

  // Um campo de link POR REDE MARCADA. Abrir os tres sempre deixaria 9 campos
  // por coletiva na tela; marcando a rede, aparece o campo dela e so.
  function linksDeRedeHTML(id, st, act){
    var i, h = '', marcadas = st.redes || [], achou = false;
    for(i=0;i<REDES.length;i++){
      if(marcadas.indexOf(REDES[i].k) < 0) continue;
      achou = true;
      h += campoLink(REDES[i].n, id, REDES[i].campo, st[REDES[i].campo], act, "Link no "+REDES[i].n);
    }
    if(!achou){
      h += '<div class="dica">Marque acima em qual rede vai publicar e o campo do link dela aparece aqui.</div>';
    }
    // link salvo antes desta mudanca (campo unico): continua visivel pra ninguem perder nada
    if(st.linkPublicado) h += campoLink("No ar", id, "linkPublicado", st.linkPublicado, act, "");
    return h;
  }

  function campoLink(rotulo, id, campo, valor, act, ph){
    var seguro = linkSeguro(valor);
    return '<div class="campo">'+
      '<span class="cl">'+esc(rotulo)+'</span>'+
      // maxlength espelha o teto da regra do Firestore (600). Sem ele o banco
      // recusa a gravacao depois e a pessoa acha que salvou.
      '<input type="url" inputmode="url" maxlength="600" autocapitalize="off" '+
        'autocorrect="off" spellcheck="false" placeholder="'+esc(ph)+'" value="'+esc(valor||"")+'" '+
        'data-act="'+act+'" data-id="'+id+'" data-campo="'+campo+'">'+
      '<a class="abrir'+(seguro?"":" off")+'" '+(seguro?'href="'+esc(seguro)+'" target="_blank" rel="noopener noreferrer"':'href="#" tabindex="-1" aria-disabled="true"')+'>Abrir</a>'+
    '</div>';
  }

  function renderPecas(){
    var el = $("#view-pecas");
    if(!podeVer("pecas")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div>'+

    var i, h='';

    var vis = pecas.filter(passaFiltro);
    h += painelHTML(contarPainel(pecas), "Total");

    h += '<div class="barrafiltro">'+
      '<input class="busca" id="buscaPeca" type="search" placeholder="Buscar por marca, tema, formato, editor..." value="'+esc(fBusca)+'">'+

    h += '<div class="fchips">';

    h += '<button class="fchip destaque'+(fMinhas?" on":"")+'" data-act="fminhas">'+
         (meuNome ? "Minhas ("+esc(meuNome.split(" ")[0])+")" : "Minhas peças")+'</button>';
    h += '</div><div class="fchips">';
    h += chip("status","todos","Todos os status", fStatus==="todos");
    for(i=0;i<STATUS.length;i++) h += chip("status",STATUS[i],ST_LABEL[STATUS[i]], fStatus===STATUS[i]);
    h += '</div><div class="fchips">';
    h += chip("dia","todos","Todos os dias", fDia==="todos");
    for(i=0;i<DIAS_PECA.length;i++) h += chip("dia",DIAS_PECA[i].dia,DIAS_PECA[i].rotulo, fDia===DIAS_PECA[i].dia);
    h += '<button class="fchip'+(fBoost?" on":"")+'" data-act="fboost">Só impulsionar</button>';
    h += '</div>';

    if(vis.length !== pecas.length){
      h += '<div class="nalista">Mostrando <b>'+vis.length+'</b> de '+pecas.length+' peças</div>';
    }

    if(editandoPeca) h += formPecaHTML();

    if(!vis.length){
      h += '<div class="vazio"><div class="big">'+(pecas.length ? "Nada com esse filtro" : "Nenhuma peça ainda")+'</div>'+
        '<div class="sm">'+(pecas.length
          ? "Limpe a busca ou escolha outro filtro para ver o resto."
          : "Toque em <b>+ Nova peça</b> para cadastrar o primeiro conteúdo orgânico ou pago.")+'</div></div>';
    } else {
      vis.sort(function(a,b){
        if((a.dia||"") !== (b.dia||"")) return (a.dia||"") < (b.dia||"") ? -1 : 1;
        return (a.criadoEm||0) - (b.criadoEm||0);
      });
      for(i=0;i<vis.length;i++) h += blocoPecaHTML(vis[i]);
    }
    el.innerHTML = h;
  }

  function chip(grupo, valor, rotulo, on){
    return '<button class="fchip'+(on?" on":"")+'" data-act="filtro" data-grupo="'+grupo+'" data-valor="'+esc(valor)+'">'+esc(rotulo)+'</button>';
  }

  function passaFiltro(p){
    if(fTipo   !== "todos" && p.tipo   !== fTipo)   return false;
    if(fStatus !== "todos" && p.status !== fStatus) return false;
    if(fDia    !== "todos" && p.dia    !== fDia)    return false;
    if(fBoost && !p.impulsionar) return false;
    if(fMinhas && meuNome){
      var eu = meuNome.toLowerCase();
      if(String(p.quemGrava||"").toLowerCase().indexOf(eu) < 0 &&
         String(p.editor||"").toLowerCase().indexOf(eu) < 0) return false;
    }
    var q = fBusca.trim().toLowerCase();
    if(q){
      var alvo = [p.marca,p.tema,p.formato,p.editor,p.quemGrava,p.referencia,p.roteiro,p.resumo,p.legenda]
        .join(" ").toLowerCase();
      if(alvo.indexOf(q) < 0) return false;
    }
    return true;
  }

  function rotuloDia(d){
    for(var i=0;i<DIAS_STORY.length;i++){ if(DIAS_STORY[i].dia===d) return DIAS_STORY[i].rotulo; }
    return d ? d.slice(8)+"/"+d.slice(5,7) : "—";
  }

  // Quem gravou e quem edita ficam VISIVEIS no cartao fechado. Com dezenas de
  // pecas, o fotografo e o editor tem que bater o olho e achar a dele sem abrir
  // uma por uma. Se o nome bate com o de quem esta logado, acende em lime.
  function gentePecaHTML(p){
    var eu = meuNome ? meuNome.toLowerCase() : "";
    var partes = [];
    var meu = function(v){
      return eu && String(v||"").toLowerCase().indexOf(eu) >= 0;
    };
    if(p.quemGrava) partes.push('<span class="'+(meu(p.quemGrava)?"eu":"")+'">Grava: '+esc(p.quemGrava)+'</span>');
    if(p.editor)    partes.push('<span class="'+(meu(p.editor)?"eu":"")+'">Edita: '+esc(p.editor)+'</span>');
    if(!partes.length) return '<span class="cgente vazia">Sem responsável definido</span>';
    return '<span class="cgente">'+partes.join(' · ')+'</span>';
  }

  function blocoPecaHTML(p){
    var aberto = !!abertos["p_"+p.id];

      '<span class="cmeio">'+
        '<span class="cnome">'+esc(p.marca||"Sem marca")+'</span>'+
        '<span class="cinflu">'+esc(p.formato||"—")+(p.tema?' · '+esc(p.tema):"")+'</span>'+
        gentePecaHTML(p)+
      '</span>'+
      '<span class="tag '+(p.tipo==="pago"?"pago":"organico")+'">'+(p.tipo==="pago"?"Pago":"Orgânico")+'</span>'+
      (p.status ? '<span class="tag st" data-st="'+p.status+'">'+esc(ST_CURTO[p.status])+'</span>' : '')+
      '<span class="cmais">'+(aberto?"&minus;":"+")+'</span>'+
    '</button>';

    if(aberto){
      h += '<div class="corpo">';
      h += '<div class="peca">';
      h += '<div class="stchips">';
      for(var i=0;i<STATUS.length;i++){
        h += '<button class="stchip'+(p.status===STATUS[i]?" on":"")+'" data-st="'+STATUS[i]+'" '+
             'data-act="stpeca" data-id="'+p.id+'">'+esc(ST_CURTO[STATUS[i]])+'</button>';
      }
      h += '</div>';

      h += '<div class="linhaflex">';
      h += '<button class="mini boost'+(p.impulsionar?" on":"")+'" data-act="boostpeca" data-id="'+p.id+'">Impulsionar</button>';
      if(p.impulsionar){
        h += '<button class="mini feito'+(p.impulsionado?" on":"")+'" data-act="boostokpeca" data-id="'+p.id+'">'+
             (p.impulsionado ? "&#10003; Impulsionado" : "Já impulsionei")+'</button>';
      }
      for(i=0;i<REDES.length;i++){
        var on = p.redes && p.redes.indexOf(REDES[i].k) >= 0;
        h += '<button class="mini'+(on?" on":"")+'" data-act="redepeca" data-id="'+p.id+'" data-rede="'+REDES[i].k+'">'+esc(REDES[i].n)+'</button>';
      }
      h += '</div>';

      h += ficha("Referência", p.referencia);
      h += ficha("Roteiro", p.roteiro);
      h += ficha("Quem grava", p.quemGrava);
      h += ficha("Resumo da gravação", p.resumo);
      // A legenda tem tratamento proprio, nao entra no ficha() generico: ela
      // existe pra ser COLADA no Instagram. Texto corrido pre-formatado preserva
      // as quebras de linha como foram escritas, e o botao copia sem a pessoa
      // ter que selecionar com o dedo num paragrafo de 15 linhas.
      if(p.legenda){
        h += '<div class="legbox">'+
          '<div class="legtop"><span class="legtit">Legenda do post</span>'+
            '<button class="legcopy" data-act="copialeg" data-id="'+p.id+'">Copiar</button></div>'+
          '<div class="legtx">'+esc(p.legenda)+'</div>'+
        '</div>';
      }
      h += ficha("Editor", p.editor);
      h += ficha("Horário de veiculação", p.horario);

      h += campoLink("Pronto", p.id, "linkPronto", p.linkPronto, "peca-link", "Link do Drive");
      h += linksDeRedeHTML(p.id, p, "peca-link");

      if(podeGerenciar("pecas")){
        h += '<div class="acoes">'+
          '<button class="btn ghost" data-act="editarpeca" data-id="'+p.id+'">Editar campos</button>'+
          '<button class="btn perigo" data-act="apagarpeca" data-id="'+p.id+'">Apagar</button>'+
        '</div>';
      }
      h += '</div></div>';
    }
    h += '</div>';
    return h;
  }

      '<span style="flex:1;font-size:.84rem;line-height:1.5;color:var(--ink-2);white-space:pre-wrap">'+esc(valor)+'</span></div>';
