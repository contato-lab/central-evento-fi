  // ═══════════════════════════════════════════════════════════════
  // MODULO 3 — STORYMAKER
  // Checklist em dois niveis: bloco ("Show Matuê") e itens ("Story 1: público").
  // UM DOCUMENTO POR ITEM, com o bloco como campo. Assim dois storymakers
  // marcando itens do mesmo bloco ao mesmo tempo nao se atropelam.
  // ═══════════════════════════════════════════════════════════════
  // Casa por PEDACO do nome: "Michelly e Anna" conta pra Michelly e pra Anna,
  // porque o item e das duas. Sem isso o filtro esconderia justo o trabalho
  // compartilhado, que e o que mais se perde.
  function ehMeuItem(s){
    if(!meuNome) return true;
    return String(s.resp||"").toLowerCase().indexOf(meuNome.toLowerCase()) >= 0;
  }

  function hojeISO(){
    var d = new Date(), m = String(d.getMonth()+1).padStart(2,"0"), x = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+x;
  }
  function diaStoryAtual(){
    if(diaStory) return diaStory;
    var hj = hojeISO(), i;
    for(i=0;i<DIAS_STORY.length;i++){ if(DIAS_STORY[i].dia === hj) return hj; }
    // fora dos 5 dias: antes do evento abre no primeiro, depois abre no ultimo
    return hj < DIAS_STORY[0].dia ? DIAS_STORY[0].dia : DIAS_STORY[DIAS_STORY.length-1].dia;
  }

  function renderStory(){
    var el = $("#view-story");
    if(!podeVer("story")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div></div>';
      return;
    }
    var dia = diaStoryAtual(), i, h='';
    var doDia = story.filter(function(s){ return s.dia === dia; });
    var feitos = doDia.filter(function(s){ return s.feito; }).length;

    // quem ainda tem item em aberto: e pra isso que o campo responsavel existe
    var abertosPor = {};
    for(i=0;i<doDia.length;i++){
      if(!doDia[i].feito && doDia[i].resp){
        abertosPor[doDia[i].resp] = (abertosPor[doDia[i].resp]||0) + 1;
      }
    }
    var nomes = Object.keys(abertosPor).sort();

    h += '<div class="subtabs">';
    for(i=0;i<DIAS_STORY.length;i++){
      h += '<button class="subtab'+(DIAS_STORY[i].dia===dia?" active":"")+'" data-act="diastory" data-dia="'+DIAS_STORY[i].dia+'">'+esc(DIAS_STORY[i].rotulo)+'</button>';
    }
    h += '</div>';

    h += '<div class="resumo">'+
      '<div class="rbox"><div class="rk">Itens do dia</div><div class="rv">'+doDia.length+'</div></div>'+
      '<div class="rbox destaque"><div class="rk">Feitos</div><div class="rv">'+feitos+'</div></div>'+
      '<div class="rbox'+((doDia.length-feitos)?" alerta":"")+'"><div class="rk">Em aberto</div><div class="rv">'+(doDia.length-feitos)+'</div></div>'+
    '</div>';

    if(nomes.length){
      var txt = nomes.map(function(n){ return esc(n)+" ("+abertosPor[n]+")"; }).join(" · ");
      h += '<div class="rulebox"><div class="ic">&#9679;</div><div class="tx"><b>Ainda em aberto:</b> '+txt+'</div></div>';
    }

    // "Só as minhas": com 24 itens em 4 blocos, quem esta em campo precisa achar
    // os proprios sem ler a lista toda. Casa por pedaco do nome, entao
    // "Michelly e Anna" aparece pra Michelly E pra Anna, que e o certo: e das duas.
    h += '<div class="fchips">'+
      '<button class="fchip destaque'+(fMinhasStory?" on":"")+'" data-act="fminhasstory">'+
      (meuNome ? "Só as minhas ("+esc(meuNome.split(" ")[0])+")" : "Só as minhas")+'</button>'+
      (fMinhasStory ? '<button class="fchip" data-act="fminhasstory">Ver todas</button>' : '')+
    '</div>';

    if(podeGerenciar("story")){
      h += criandoBloco ? formBlocoHTML()
         : '<div class="barrafiltro"><button class="btn" data-act="novobloco">+ Novo bloco</button></div>';
    }

    // agrupa por bloco, preservando a ordem de criacao do primeiro item
    var ordem=[], grupos={};
    doDia.sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
    for(i=0;i<doDia.length;i++){
      if(fMinhasStory && !ehMeuItem(doDia[i])) continue;
      var g = doDia[i].grupo || "Sem bloco";
      if(!grupos[g]){ grupos[g]=[]; ordem.push(g); }
      grupos[g].push(doDia[i]);
    }

    // "Pronto desce pro fim": bloco fechado sai da frente e o proximo em aberto
    // sobe sozinho. Ordenacao por ESTADO, nao arrastada a mao de proposito: ordem
    // salva no banco brigaria entre as 5-8 pessoas usando ao mesmo tempo.
    ordem.sort(function(a,b){
      var fa = grupos[a].every(function(s){ return s.feito; });
      var fb = grupos[b].every(function(s){ return s.feito; });
      if(fa !== fb) return fa ? 1 : -1;
      return 0;   // dentro do mesmo estado, mantem a ordem do dia
    });

    if(!ordem.length){
      h += fMinhasStory
        ? '<div class="vazio"><div class="big">Nada seu neste dia</div>'+
          '<div class="sm">Nenhum item está no seu nome aqui. Toque em <b>Ver todas</b> para ver o checklist inteiro.</div></div>'
        : '<div class="vazio"><div class="big">Nenhum checklist para este dia</div>'+
          '<div class="sm">'+(podeGerenciar("story")
            ? "Toque em <b>+ Novo bloco</b>, dê um nome (por exemplo <b>Show Matuê</b>) e escreva um item por linha."
            : "A coordenação ainda não montou o checklist deste dia.")+'</div></div>';
    }

    for(i=0;i<ordem.length;i++){
      var nome = ordem[i], itens = grupos[nome];
      var okG = itens.filter(function(s){ return s.feito; }).length;
      var area = itens[0].area || "";
      var cheio = okG === itens.length;
      // Recolhe SOZINHO quando fecha (ideia da Isa), e o toque no cabecalho
      // abre e fecha qualquer bloco na mao. Quem reabriu um bloco fechado fica
      // marcado em reabertos: o automatico nao insiste em fechar de novo.
      var min = cheio ? !reabertos[nome] : !!recolhidos[nome];
      h += '<div class="bloco'+(cheio?" completo":"")+(min?" recolhido":"")+'">'+
        '<button class="cabeca" data-act="dobrar" data-bloco="'+esc(nome)+'" '+
          'aria-expanded="'+(min?"false":"true")+'">'+
          '<span class="cmeio"><span class="cnome">'+(cheio?"&#10003; ":"")+esc(nome)+'</span>'+
          (area && !min ?'<span class="cinflu">'+esc(area)+'</span>':'')+'</span>'+
          (cheio && min ? '<span class="tag st" data-st="publicado">Pronto</span>' : '')+
          '<span class="cprog'+(cheio?" ok":"")+'">'+okG+'/'+itens.length+'</span>'+
          '<span class="cmais">'+(min?"+":"&minus;")+'</span>'+
        '</button>';
      if(min){ h += '</div>'; continue; }
      h += '<div class="corpo">';
      for(var j=0;j<itens.length;j++){
        var s = itens[j];
        h += '<div class="chk'+(s.feito?" feito":"")+'">'+
          '<button class="chkbox'+(s.feito?" on":"")+'" data-act="chk" data-id="'+s.id+'" '+
            'aria-pressed="'+(s.feito?"true":"false")+'" aria-label="Marcar como feito">&#10003;</button>'+
          '<span class="chktx">'+esc(s.texto||"")+
            '<span class="chkresp">'+(s.resp?'<b>'+esc(s.resp)+'</b>':'<button class="chkdel" data-act="quem" data-id="'+s.id+'" style="font-size:.62rem;letter-spacing:.06em">definir responsável</button>')+
            (s.resp?' · <button class="chkdel" data-act="quem" data-id="'+s.id+'" style="font-size:.62rem">trocar</button>':'')+
            '</span>'+
          '</span>'+
          (podeGerenciar("story")?'<button class="chkdel" data-act="delstory" data-id="'+s.id+'" aria-label="Apagar item">&times;</button>':'')+
        '</div>';
      }
      if(podeGerenciar("story")){
        h += '<div class="acoes"><button class="btn ghost" data-act="additem" data-grupo="'+esc(nome)+'" data-area="'+esc(area)+'">+ Item neste bloco</button></div>';
      }
      h += '</div></div>';
    }
    el.innerHTML = h;
  }

  // ═══════════════════════════════════════════════════════════════
  // RENDER GERAL
  // ═══════════════════════════════════════════════════════════════
  function contadores(){
    var i, totalCol=0;
    for(i=0;i<COLETIVAS.length;i++) totalCol += COLETIVAS[i].itens.length;
    var el;
    el=$("#cColetivas"); if(el) el.textContent = totalCol;
    el=$("#cPecas");     if(el) el.textContent = pecas.length;
    el=$("#cStory");     if(el){
      var dia = diaStoryAtual();
      el.textContent = story.filter(function(s){ return s.dia===dia && !s.feito; }).length;
    }
  }

  function renderAll(){
    try{ renderColetivas(); }catch(e){ if(window.console) console.error("[conteudo] coletivas", e); }
    try{ renderPecas();     }catch(e){ if(window.console) console.error("[conteudo] pecas", e); }
    try{ renderStory();     }catch(e){ if(window.console) console.error("[conteudo] story", e); }
    try{ contadores();      }catch(e){}
    try{ renderNovidades(); }catch(e){ if(window.console) console.error("[conteudo] novidades", e); }
  }

  // ═══════════════════════════════════════════════════════════════
  // FAIXA DE NOVIDADE
  //
  // Avisa que entrou peca nova, item de checklist novo ou movimento nas
  // coletivas, sem ninguem precisar dizer ao sistema que publicou: compara o
  // carimbo de tempo de cada item com a ultima vez que ESTA PESSOA abriu
  // aquela aba. Quem publica so publica; quem le e avisado.
  //
  // O "visto" e por aba e por aparelho, entao o celular de cada um da equipe
  // tem a propria contagem. Isso importa aqui: sao 8 pessoas mexendo ao mesmo
  // tempo, e o que e novidade pra uma ja foi lido pela outra.
  // ═══════════════════════════════════════════════════════════════
  var VISTO = "cfi_visto_";
  var ROTULO_NOV = { pecas:"em Orgânicos e pagos", story:"no StoryMaker",
                     coletivas:"nas Coletivas" };

  function vistoDe(aba){
    try{ var v = parseInt(localStorage.getItem(VISTO + aba), 10); return isNaN(v) ? null : v; }
    catch(e){ return null; }
  }
  function marcarVisto(aba, quando){
    try{ localStorage.setItem(VISTO + aba, String(quando || Date.now())); }catch(e){}
  }

  function listaDaAba(aba){
    if(aba === "pecas"     && podeVer("pecas"))     return pecas;
    if(aba === "story"     && podeVer("story"))     return story;
    if(aba === "coletivas" && podeVer("coletivas")) return coletivas;
    return null;
  }

  // Peca usa criadoEm quando nasce e em quando muda; coletiva e checklist so
  // tem em/criadoEm. Pego o MAIOR dos dois: assim "mudou" tambem conta como
  // novidade, que e o que o time quer saber num evento ao vivo.
  function carimbo(it){
    var maior = 0;
    ["criadoEm","em","ts"].forEach(function(c){
      var v = parseInt(it[c], 10);
      if(!isNaN(v) && v > maior) maior = v;
    });
    return maior;
  }

  function contarNovos(aba){
    var lista = listaDaAba(aba);
    if(!lista || !lista.length) return 0;
    var visto = vistoDe(aba);
    if(visto === null){ marcarVisto(aba, maiorCarimbo(lista)); return 0; }
    var n = 0;
    for(var i=0;i<lista.length;i++){ if(carimbo(lista[i]) > visto) n++; }
    return n;
  }

  function maiorCarimbo(lista){
    var m = 0;
    for(var i=0;i<lista.length;i++){ var c = carimbo(lista[i]); if(c > m) m = c; }
    return m || Date.now();
  }

  function renderNovidades(){
    var faixa = $("#novidades"); if(!faixa || !PERM) return;
    var partes = [], total = 0, primeira = null;

    // COLETIVAS FICA DE FORA de proposito. A grade e fixa; o que muda ali e
    // status e link, e cada toque de "Pronto" ou "No ar" atualizaria o carimbo.
    // Num teste isso gerou 42 "novidades" numa tarde. Faixa que acende o tempo
    // todo vira decoracao: a pessoa para de olhar e perde a que importava.
    // Aqui novidade = conteudo que NASCEU, nao andamento de trabalho.
    ["pecas","story"].forEach(function(aba){
      // a aba aberta nunca e novidade (a pessoa esta lendo), mas o toggle da
      // bolinha roda igual pras duas, senao a bolinha da aba que voce acabou
      // de abrir fica acesa pra sempre
      var n = (aba === abaAtual) ? 0 : contarNovos(aba);
      if(n > 0){
        total += n;
        if(!primeira) primeira = aba;
        partes.push(n + " " + (ROTULO_NOV[aba] || aba));
      }
      var b = document.querySelector('.tab[data-tab="' + aba + '"]');
      if(b) b.classList.toggle("temnovo", n > 0);
    });

    if(!total){ faixa.hidden = true; faixa.innerHTML = ""; return; }
    faixa.hidden = false;
    faixa.innerHTML =
      '<button class="novbar" type="button" data-act="irnov" data-ir="' + primeira + '">' +
        '<span class="novpt"></span>' +
        '<span class="novtx"><b>' + total + (total === 1 ? ' novidade' : ' novidades') + '</b> ' +
          esc(partes.join(" · ")) + '</span>' +
        '<span class="novir">ver</span>' +
      '</button>';
  }

  function mostrarAba(t){
    abaAtual = t;
    $$(".tab").forEach(function(x){ x.classList.remove("active"); });
    var b = document.querySelector('.tab[data-tab="'+t+'"]'); if(b) b.classList.add("active");
    $("#view-coletivas").hidden = t !== "coletivas";
    $("#view-pecas").hidden     = t !== "pecas";
    $("#view-story").hidden     = t !== "story";
    // abriu a aba = leu. Marca com o carimbo do item mais novo, nao com "agora":
    // se um item chegar entre o desenho da tela e o clique, "agora" o engoliria
    // e a pessoa nunca saberia que ele entrou.
    var lst = listaDaAba(t);
    if(lst && lst.length) marcarVisto(t, maiorCarimbo(lst));
    // Redesenha a aba de destino. Os watchers so redesenham a aba ATIVA, entao
    // sem isto a pessoa volta pra uma aba pintada com o dado de quando saiu (ou
    // vazia, se o primeiro snapshot chegou depois do renderAll do login).
    try{
      if(t === "coletivas") renderColetivas();
      else if(t === "pecas"){ if(!editandoPeca) renderPecas(); }
      else { if(!criandoBloco) renderStory(); }
      pendente[t] = false;
      renderNovidades();
    }catch(e){ if(window.console) console.error("[conteudo] render de aba", e); }
    ga("aba_conteudo", { aba:t, perfil: PERFIL || "desconhecido" });
  }

  function aplicarInterface(){
    if(!PERM) return;
    var abas = { coletivas: podeVer("coletivas"), pecas: podeVer("pecas"), story: podeVer("story") };
    var primeira = null;
    $$(".tab").forEach(function(b){
      var t = b.getAttribute("data-tab"), ok = !!abas[t];
      b.hidden = !ok; b.style.display = ok ? "" : "none";
      if(ok && !primeira) primeira = t;
    });
    var q = $("#quemSou"); if(q) q.textContent = quemSou();
    var mn = $("#meuNome");
    if(mn){
      mn.textContent = meuNome ? meuNome.split(" ")[0] : "Quem é você?";
      // storymaker nao tem lista de pecas pra filtrar; o botao so polui o topo dele
      mn.hidden = !podeVer("pecas");
    }
    mostrarAba(primeira || "story");
  }

  // ═══════════════════════════════════════════════════════════════
  // ACOES (delegacao de evento)
  // Toda acao que grava confere a permissao DE NOVO aqui. Esconder o botao
  // organiza a tela; nao e controle de acesso.
  // ═══════════════════════════════════════════════════════════════
  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if(!b) return;
    var act = b.dataset.act, id = b.dataset.id;

    // ---- navegacao (nao grava nada) ----
    if(act === "diacol"){ diaColetiva = b.dataset.dia; renderColetivas(); return; }
    if(act === "diastory"){ diaStory = b.dataset.dia; renderStory(); contadores(); return; }
    if(act === "abrircol"){ var k=b.dataset.key; abertos[k] = !abertos[k]; renderColetivas(); return; }
    if(act === "abrirpeca"){ abertos["p_"+id] = !abertos["p_"+id]; renderPecas(); return; }
    if(act === "filtro"){
      var g=b.dataset.grupo, v=b.dataset.valor;
      if(g==="tipo") fTipo=v; else if(g==="status") fStatus=v; else if(g==="dia") fDia=v;
      renderPecas(); return;
    }
    if(act === "fboost"){ fBoost = !fBoost; renderPecas(); return; }
    if(act === "fminhas"){
      if(!meuNome){ pedirNome(true); return; }   // sem nome o filtro nao tem o que filtrar
      fMinhas = !fMinhas; renderPecas(); return;
    }
    if(act === "fminhasstory"){
      if(!meuNome){ pedirNome(true); return; }
      fMinhasStory = !fMinhasStory; renderStory(); return;
    }
    if(act === "dobrar"){
      var bn = b.dataset.bloco;
      var itensBl = story.filter(function(s){ return s.dia===diaStoryAtual() && (s.grupo||"Sem bloco")===bn; });
      var chBl = itensBl.length && itensBl.every(function(s){ return s.feito; });
      // bloco completo nasce fechado, entao o toque nele e "reabrir";
      // bloco em aberto nasce aberto, e o toque e "recolher"
      if(chBl){ if(reabertos[bn]) delete reabertos[bn]; else reabertos[bn] = true; }
      else    { if(recolhidos[bn]) delete recolhidos[bn]; else recolhidos[bn] = true; }
      renderStory(); return;
    }
    if(act === "meunome"){ pedirNome(false); return; }
    if(act === "cancelarpeca"){ editandoPeca=null; renderPecas(); return; }
    if(act === "copialeg"){
      var pl = pecas.filter(function(x){ return x.id===id; })[0];
      if(!pl || !pl.legenda) return;
      var txt = pl.legenda;
      var ok = function(){ toast("Legenda copiada."); };
      // navigator.clipboard so existe em https (ou localhost) e pode estar
      // bloqueado; o textarea escondido e o plano B que funciona em tudo
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok)["catch"](function(){ copiaNaMarra(txt, ok); });
      } else { copiaNaMarra(txt, ok); }
      return;
    }

    // ---- coletivas ----
    if(act === "stcol" || act === "boostcol" || act === "boostokcol" || act === "redecol"){
      if(!podeGerenciar("coletivas")){ toast("Seu acesso não edita as coletivas."); return; }
      var st = estadoDe(id) || {};
      if(act === "stcol"){
        var novo = st.status === b.dataset.st ? "" : b.dataset.st;   // tocar de novo desmarca
        DBset("coletivas", id, { status:novo, em:Date.now(), por:quemSou() });
      } else if(act === "boostcol"){
        // desmarcar "vai impulsionar" tem que limpar o "ja impulsionei" junto,
        // senao a peca sai da conta mas o feito continua gravado e o "2 de 5" mente
        var lig = !st.impulsionar;
        DBset("coletivas", id, { impulsionar: lig, impulsionado: lig ? !!st.impulsionado : false,
                                 em:Date.now(), por:quemSou() });
      } else if(act === "boostokcol"){
        DBset("coletivas", id, { impulsionado: !st.impulsionado, em:Date.now(), por:quemSou() });
      } else {
        // arrayUnion/arrayRemove em vez de reescrever o array inteiro: dois
        // toques rapidos (aqui ou de outra pessoa) liam o mesmo array antigo e
        // o segundo apagava a marcacao do primeiro.
        var jaTem = (st.redes||[]).indexOf(b.dataset.rede) >= 0;
        DBset("coletivas", id, { redes: setaRede(b.dataset.rede, jaTem, st.redes),
                                 em:Date.now(), por:quemSou() });
      }
      return;
    }

    // ---- pecas ----
    if(act === "novapeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não cria peças."); return; }
      editandoPeca = "novo"; renderPecas();
      var f=$("#f_marca"); if(f) f.focus();
      return;
    }
    if(act === "editarpeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não edita peças."); return; }
      editandoPeca = id; renderPecas();
      var fm=$("#f_marca"); if(fm) fm.focus();
      return;
    }
    if(act === "salvarpeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não salva peças."); return; }
      salvarPeca(); return;
    }
    if(act === "apagarpeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não apaga peças."); return; }
      var alvo = pecas.filter(function(x){ return x.id===id; })[0] || {};
      if(!confirm("Apagar esta peça?\n\n"+(alvo.marca||"Sem marca")+" · "+(alvo.tema||alvo.formato||"")+"\n\nIsso não volta.")) return;
      DBremove("pecas", id); toast("Peça apagada."); return;
    }
    if(act === "stpeca" || act === "boostpeca" || act === "boostokpeca" || act === "redepeca"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não edita peças."); return; }
      var pc = pecas.filter(function(x){ return x.id===id; })[0]; if(!pc) return;
      if(act === "stpeca"){
        DBupdate("pecas", id, { status: pc.status === b.dataset.st ? "" : b.dataset.st, em:Date.now(), por:quemSou() });
      } else if(act === "boostpeca"){
        var lg = !pc.impulsionar;
        DBupdate("pecas", id, { impulsionar: lg, impulsionado: lg ? !!pc.impulsionado : false,
                                em:Date.now(), por:quemSou() });
      } else if(act === "boostokpeca"){
        DBupdate("pecas", id, { impulsionado: !pc.impulsionado, em:Date.now(), por:quemSou() });
      } else {
        var jaTinha = (pc.redes||[]).indexOf(b.dataset.rede) >= 0;
        DBupdate("pecas", id, { redes: setaRede(b.dataset.rede, jaTinha, pc.redes),
                                em:Date.now(), por:quemSou() });
      }
      return;
    }

    // ---- storymaker ----
    if(act === "chk"){
      if(!podeGerenciar("story")){ toast("Seu acesso não marca o checklist."); return; }
      var s = story.filter(function(x){ return x.id===id; })[0]; if(!s) return;
      DBupdate("story", id, { feito: !s.feito, em:Date.now(), por:quemSou() });
      return;
    }
    if(act === "quem"){
      if(!podeGerenciar("story")){ toast("Seu acesso não altera o checklist."); return; }
      var at = story.filter(function(x){ return x.id===id; })[0] || {};
      var nome = prompt("Quem é o responsável por este item?", at.resp || "");
      if(nome === null) return;
      DBupdate("story", id, { resp: String(nome).trim(), em:Date.now(), por:quemSou() });
      return;
    }
    if(act === "delstory"){
      if(!podeGerenciar("story")){ toast("Seu acesso não apaga itens."); return; }
      var si = story.filter(function(x){ return x.id===id; })[0] || {};
      if(!confirm("Apagar este item?\n\n"+(si.texto||"")+"\n\nIsso não volta.")) return;
      DBremove("story", id); return;
    }
    if(act === "novobloco"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      criandoBloco = true; renderStory();
      var bn = $("#b_nome"); if(bn) bn.focus();
      return;
    }
    if(act === "irnov"){ mostrarAba(b.dataset.ir); return; }
    if(act === "cancelarbloco"){ criandoBloco = false; renderStory(); return; }
    if(act === "salvarbloco"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria blocos."); return; }
      salvarBloco(); return;
    }
    if(act === "additem"){
      if(!podeGerenciar("story")){ toast("Seu acesso não cria itens."); return; }
      var txt = prompt("O que precisa ser gravado?");
      if(txt === null) return;
      txt = String(txt).trim(); if(!txt) return;
      DBadd("story", { dia:diaStoryAtual(), grupo:b.dataset.grupo, area:b.dataset.area||"",
                       texto:txt, resp:"", feito:false, criadoEm:Date.now(), por:quemSou() });
      return;
    }
  });

  // Formulario, nao prompt(). window.prompt e campo de UMA linha em todo
  // navegador: Enter confirma o dialogo e texto colado perde as quebras. Pedir
  // "um item por linha" ali dentro nunca ia funcionar, e montar os 5 dias item
  // a item daria umas 60 caixinhas de dialogo. Com textarea a coordenacao cola
  // o checklist inteiro de uma vez.
  function formBlocoHTML(){
    var i, h = '<div class="form"><h3>Novo bloco de '+esc(rotuloDia(diaStoryAtual()))+'</h3><div class="grid2">';
    h += '<div class="fld"><label>Nome do bloco</label>'+
         '<input id="b_nome" type="text" placeholder="Show Matuê, Abertura dos portões..."></div>';
    h += '<div class="fld"><label>Área</label><select id="b_area"><option value="">Sem área</option>';
    for(i=0;i<AREAS.length;i++) h += '<option value="'+esc(AREAS[i])+'">'+esc(AREAS[i])+'</option>';
    h += '</select></div>';
    h += '<div class="fld full"><label>Itens, um por linha</label>'+
         '<textarea id="b_itens" rows="5" style="min-height:120px" placeholder="Story 1: mostrar o público&#10;Story 2: o show&#10;Story 3: a vibe da galera"></textarea>'+
         '<span style="font-size:.7rem;color:var(--ink-3);margin-top:4px">Pode colar uma lista inteira. Cada linha vira um item para marcar.</span></div>';
    h += '</div><div class="acoes">'+
      '<button class="btn" data-act="salvarbloco">Criar bloco</button>'+
      '<button class="btn ghost" data-act="cancelarbloco">Cancelar</button>'+
    '</div></div>';
    return h;
  }

  function salvarBloco(){
    var nome = String(($("#b_nome")||{}).value || "").trim();
    var area = String(($("#b_area")||{}).value || "").trim();
    var txt  = String(($("#b_itens")||{}).value || "");
    if(!nome){ toast("Dê um nome ao bloco."); var n=$("#b_nome"); if(n) n.focus(); return; }
    var lista = txt.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    if(!lista.length){ toast("Escreva ao menos um item."); var t=$("#b_itens"); if(t) t.focus(); return; }
    // teto de 600 e o mesmo da regra do Firestore: melhor barrar aqui do que o
    // banco recusar depois e a pessoa achar que salvou
    for(var j=0;j<lista.length;j++){
      if(lista[j].length > 600){ toast("Um dos itens passou de 600 caracteres. Encurte."); return; }
    }
    var dia = diaStoryAtual(), base = Date.now();
    for(var i=0;i<lista.length;i++){
      // criadoEm com deslocamento pra lista sair na ordem que a pessoa escreveu
      DBadd("story", { dia:dia, grupo:nome, area:area, texto:lista[i], resp:"", feito:false,
                       criadoEm: base + i, por:quemSou() });
    }
    criandoBloco = false;
    toast(lista.length + (lista.length===1 ? " item criado." : " itens criados."));
    renderStory();
  }

  function pedirNome(ligarFiltro){
    var n = prompt("Qual o seu nome?\n\nEle serve pra você achar rápido as peças que você grava ou edita. Fica só neste aparelho.", meuNome);
    if(n === null) return;
    meuNome = String(n).trim();
    try{ localStorage.setItem(MEU_KEY, meuNome); }catch(e){}
    if(ligarFiltro && meuNome) fMinhas = true;
    if(!meuNome) fMinhas = false;
    var el = $("#meuNome");
    if(el) el.textContent = meuNome ? meuNome.split(" ")[0] : "Quem é você?";
    renderAll();
  }

  function salvarPeca(){
    var v = function(id){ var e=$("#"+id); return e ? String(e.value||"").trim() : ""; };
    var dados = {
      dia: v("f_dia"), tipo: v("f_tipo"), marca: v("f_marca"), formato: v("f_formato"),
      tema: v("f_tema"), referencia: v("f_referencia"), roteiro: v("f_roteiro"),
      quemGrava: v("f_quemGrava"), resumo: v("f_resumo"), editor: v("f_editor"),
      legenda: v("f_legenda"), horario: v("f_horario"), status: v("f_status"),
      em: Date.now(), por: quemSou()
    };
    if(!dados.marca && !dados.tema && !dados.formato){
      toast("Preencha ao menos marca, formato ou tema."); return;
    }
    if(editandoPeca === "novo"){
      dados.criadoEm = Date.now();
      dados.redes = []; dados.impulsionar = false;
      dados.linkPronto = ""; dados.linkPublicado = "";
      DBadd("pecas", dados);
      toast("Peça criada.");
    } else {
      DBupdate("pecas", editandoPeca, dados);
      toast("Peça salva.");
    }
    editandoPeca = null;
    renderPecas();
  }

  // campos de link e busca: gravam ao sair do campo, nao a cada tecla
  document.addEventListener("change", function(ev){
    var el = ev.target, act = el.dataset && el.dataset.act;
    if(act === "stcol-link"){
      if(!podeGerenciar("coletivas")){ toast("Seu acesso não edita as coletivas."); return; }
      var patch = {}; patch[el.dataset.campo] = String(el.value||"").trim();
      patch.em = Date.now(); patch.por = quemSou();
      DBset("coletivas", el.dataset.id, patch);
      return;
    }
    if(act === "peca-link"){
      if(!podeGerenciar("pecas")){ toast("Seu acesso não edita peças."); return; }
      var p2 = {}; p2[el.dataset.campo] = String(el.value||"").trim();
      p2.em = Date.now(); p2.por = quemSou();
      DBupdate("pecas", el.dataset.id, p2);
      return;
    }
  });

  // No iPhone o "ok" do teclado nao tira o foco do campo, entao o "change" nunca
  // dispara: a pessoa cola o link, fecha o teclado, sai da tela e o link se perde
  // apesar do aviso "tudo salva sozinho". Enter forca o blur, que dispara o change.
  document.addEventListener("keydown", function(ev){
    if(ev.key !== "Enter") return;
    var a = ev.target, act = a && a.dataset && a.dataset.act;
    if(act === "stcol-link" || act === "peca-link"){ ev.preventDefault(); a.blur(); }
  });

  // busca: filtra enquanto digita, sem perder o foco do campo
  document.addEventListener("input", function(ev){
    if(ev.target.id !== "buscaPeca") return;
    // sem trim aqui: com trim, o espaco some a cada tecla e e impossivel
    // digitar "Royal Enfield" ou "Fun Motors". O trim vai no passaFiltro.
    fBusca = String(ev.target.value||"");
    var pos = ev.target.selectionStart;
    renderPecas();
    var novo = $("#buscaPeca");
    if(novo){ novo.focus(); try{ novo.setSelectionRange(pos,pos); }catch(e){} }
  });

  // ═══════════════════════════════════════════════════════════════
  // MINI GUIA — uma unica vez por aparelho, e o "?" reabre quando quiser
  // ═══════════════════════════════════════════════════════════════
  var GUIA_KEY = "cfi_guia_v1";
  function mostrarGuiaUmaVez(){
    if(!PERFIL || !PERM) return;
    try{
      if(localStorage.getItem(GUIA_KEY) === "1") return;
      localStorage.setItem(GUIA_KEY, "1");
      if(localStorage.getItem(GUIA_KEY) !== "1") return;   // gravou mesmo?
    }catch(e){ return; }   // sem armazenamento confiavel = nao mostra
    abrirGuia();
  }

  function abrirGuia(){
    if(!PERFIL || !PERM) return;
    if(document.getElementById("guiaOverlay")) return;
    var linhas;
    if(PERFIL === "conteudo"){
      linhas = [
        "<b>Coletivas</b> já vem com marca, hora e influenciador prontos. Toque no cartão e mexa só em status e link.",
        "<b>Orgânicos e pagos</b> é uma lista só. Use a busca para achar por marca, tema ou editor.",
        "O status <b>Pronto</b> é o material parado esperando a hora de subir. Marque <b>Impulsionar</b> no que vira mídia paga."
      ];
    } else {
      linhas = [
        "Escolha o <b>dia</b> lá em cima. O checklist já abre no dia de hoje.",
        "Toque no quadradinho para marcar o que já gravou.",
        "Coloque seu nome em <b>definir responsável</b> para o time saber que o item é seu."
      ];
    }
    var ov = document.createElement("div");
    ov.id = "guiaOverlay";
    ov.innerHTML = '<div class="guiacard" role="dialog" aria-modal="true" aria-label="Como usar">'+
      '<div class="guiaquem">Você entrou como</div>'+
      '<div class="guiaperfil">'+esc(quemSou())+'</div>'+
      '<ul class="guialista"><li>'+linhas.join("</li><li>")+'</li></ul>'+
      '<button class="btn" id="guiaOk">Entendi</button></div>';
    document.body.appendChild(ov);
    var fecha = function(){ var o=document.getElementById("guiaOverlay"); if(o) o.remove(); };
    ov.addEventListener("click", function(e){ if(e.target === ov) fecha(); });
    var ok = document.getElementById("guiaOk");
    ok.addEventListener("click", fecha);
    ok.focus();
    document.addEventListener("keydown", function esc2(e){
      if(e.key === "Escape"){ fecha(); document.removeEventListener("keydown", esc2); }
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // LOGIN E BOOT
  // ═══════════════════════════════════════════════════════════════
  // ═══════════════════════════════════════════════════════════════
  // NAO REDESENHAR POR CIMA DE QUEM ESTA DIGITANDO
  //
  // O render aqui e innerHTML da secao inteira. Se um colega gravar qualquer
  // coisa enquanto a pessoa preenche os 12 campos de uma peca, a tela remonta
  // com os valores SALVOS e tudo que estava digitado evapora sem aviso. Com
  // includeMetadataChanges cada gravacao gera dois eventos (cache + servidor),
  // entao ate o proprio toque da pessoa noutra peca dispara isso.
  //
  // Solucao: se tem campo em foco na secao (ou o formulario de peca aberto),
  // o render fica PENDENTE e roda quando o foco sair.
  // ═══════════════════════════════════════════════════════════════
  var pendente = { coletivas:false, pecas:false, story:false };

  function digitandoEm(sel){
    var a = document.activeElement;
    if(!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
    if(a.id === "buscaPeca") return false;   // a busca tem restauracao propria
    var sec = document.querySelector(sel);
    return !!sec && sec.contains(a);
  }

  function renderOuAdiar(qual, fn, sel, travaExtra){
    if(abaAtual !== qual) return;             // aba escondida: mostrarAba redesenha
    if(travaExtra || digitandoEm(sel)){ pendente[qual] = true; return; }
    pendente[qual] = false;
    fn();
  }

  // setTimeout 0 de proposito: deixa o "change" do campo gravar antes, e da tempo
  // do proximo campo pegar o foco (trocar de campo dentro da secao nao redesenha).
  document.addEventListener("focusout", function(){
    setTimeout(function(){
      if(pendente.coletivas) renderOuAdiar("coletivas", renderColetivas, "#view-coletivas", false);
      if(pendente.pecas)     renderOuAdiar("pecas",     renderPecas,     "#view-pecas", !!editandoPeca);
      if(pendente.story)     renderOuAdiar("story",     renderStory,     "#view-story", !!criandoBloco);
    }, 0);
  });

  function ligarEscutas(){
    // renderNovidades TEM que rodar aqui, nao so no renderAll do login: o dado
    // do Firestore chega depois da tela montar, e sem isto a faixa so apareceria
    // se a pessoa recarregasse a pagina. Ou seja, justamente na hora em que
    // alguem publica algo com a Central ja aberta, que e o caso que importa.
    desligar.push(DBwatch("coletivas", function(a){ coletivas=a;
      renderOuAdiar("coletivas", renderColetivas, "#view-coletivas", false);
      try{ renderNovidades(); }catch(e){} }));
    desligar.push(DBwatch("pecas", function(a){ pecas=a;
      renderOuAdiar("pecas", renderPecas, "#view-pecas", !!editandoPeca); contadores();
      try{ renderNovidades(); }catch(e){} }));
    desligar.push(DBwatch("story", function(a){ story=a;
      renderOuAdiar("story", renderStory, "#view-story", !!criandoBloco); contadores();
      try{ renderNovidades(); }catch(e){} }));
  }

  function openApp(){
    $("#gate").hidden = true; $("#app").hidden = false;
    try{ if(typeof gtag === "function" && PERFIL) gtag("set", "user_properties", { perfil:"cont_"+PERFIL }); }catch(e){}
    ga("acesso_conteudo", { perfil: PERFIL || "desconhecido" });
    // cada etapa isolada: desenhar a tela nunca pode depender do banco responder
    try{ aplicarInterface(); }catch(e){ if(window.console) console.error("[conteudo] interface", e); }
    try{ ligarEscutas();     }catch(e){ if(window.console) console.error("[conteudo] escutas", e); setStatus("warn"); }
    renderAll();
    try{ mostrarGuiaUmaVez(); }catch(e){}
  }

  $("#gateForm").addEventListener("submit", function(e){
    e.preventDefault();
    var ac = acharAcesso($("#pw").value);
    if(!ac || !definirPerfil(ac.perfil)){
      $("#gateErr").textContent = "Senha não confere.";
      $("#pw").select();
      return;
    }
    $("#gateErr").textContent = "";
    try{ localStorage.setItem("cfi_sessao", ac.perfil); }catch(e){}
    openApp();
  });

  $("#verSenha").addEventListener("click", function(){
    var i = $("#pw"), most = i.type === "password";
    i.type = most ? "text" : "password";
    this.textContent = most ? "Ocultar" : "Mostrar";
    this.setAttribute("aria-label", most ? "Ocultar senha" : "Mostrar senha");
    i.focus();
  });

  $("#logout").addEventListener("click", function(){
    try{ localStorage.removeItem("cfi_sessao"); }catch(e){}
    for(var i=0;i<desligar.length;i++){ try{ desligar[i](); }catch(e){} }
    location.reload();
  });

  $("#btnGuia").addEventListener("click", abrirGuia);

  $$(".tab").forEach(function(b){
    b.addEventListener("click", function(){ mostrarAba(b.getAttribute("data-tab")); });
  });

  // sessao salva no aparelho: quem ja entrou nao digita senha de novo
  (function(){
    var s = null;
    try{ s = localStorage.getItem("cfi_sessao"); }catch(e){}
    if(s && definirPerfil(s)) openApp();
    setStatus();
  })();

})();
</script>
</body>
</html>
