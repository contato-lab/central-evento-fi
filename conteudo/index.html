<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<!-- maximum-scale=1 foi tirado de proposito: ele bloqueia o zoom de pinca, e
     boa parte desta tela e texto de 9 a 11px lido no sol, no meio do autodromo.
     Quem nao consegue ler nao tem como aumentar. O zoom automatico do iPhone ao
     tocar num campo, que era o motivo de estar ali, ja e resolvido pelos 16px
     de fonte nos campos (regra la embaixo no CSS). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conteúdo · Suhai Festival Interlagos</title>
<!-- modo app: instalado na tela de inicio abre sem a barra do navegador -->
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conteúdo FI">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Mesma propriedade GA4 da Central (ferramenta de equipe, nao site de venda).
     O perfil entra como user_property, entao da pra separar conteudo de producao. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NRX7DEGC47"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NRX7DEGC47');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  :root{
    --bg:#0B0C0A; --panel:#141613; --panel-2:#1B1E18; --raise:#23271F;
    --line:#2B3026; --line-soft:#232720;
    --ink:#F4F6EF; --ink-2:#A9AFA2; --ink-3:#767C6E;
    --lime:#A6EC4D; --lime-d:#8CD230; --lime-ink:#0B0C0A;
    --cyan:#4CC3F0; --amber:#FBBF24; --red:#F5453F; --roxo:#B98BFF;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:'Barlow Condensed',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  /* NAO TIRAR. O atributo hidden do HTML vira display:none pela folha do
     navegador, e QUALQUER display no CSS nosso ganha dele. O #gate usa
     display:grid, entao sem esta linha a tela de senha continua cobrindo
     tudo depois do login e o sistema fica inutilizavel. Pego no teste de
     tela em 11/08/2026: o hidden marcava true e o login seguia na frente. */
  [hidden]{display:none!important}
  html{overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
  body{margin:0;overflow-x:hidden;overscroll-behavior-x:none}
  .fi{background:radial-gradient(900px 500px at 85% -10%,rgba(166,236,77,.09),transparent 60%),var(--bg);
    color:var(--ink);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
  .fi ::selection{background:var(--lime);color:var(--lime-ink)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  /* no celular, campo com fonte menor que 16px faz o iPhone dar zoom sozinho ao tocar */
  @media(max-width:820px){ input,select,textarea{font-size:16px !important} }
  .mono{font-family:var(--mono)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ---------- LOGIN ---------- */
  /* place-items:center travava a tela de senha: com o teclado aberto no celular
     a area visivel encolhe pra menos da metade, e o botao Entrar (e a mensagem
     de senha errada) ficavam por baixo do teclado, sem rolagem nenhuma pra
     alcancar. Agora rola, e o alinhamento so centraliza quando cabe. */
  #gate{position:fixed;inset:0;z-index:100;display:grid;justify-items:center;
    align-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(700px 400px at 50% 0%,rgba(166,236,77,.12),transparent 60%),var(--bg)}
  .gatecard{width:100%;max-width:380px;text-align:center}
  .gatecard img.marca{height:110px;width:auto;margin:0 auto 24px;display:block}
  .gatecard .hi{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.01em}
  .gatecard .sub{color:var(--ink-3);font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  .gatecard form{margin-top:24px;display:flex;flex-direction:column;gap:10px}
  .gatecard input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    padding:14px 16px;font-size:1rem;text-align:center;letter-spacing:.05em}
  .gatecard input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(166,236,77,.15)}
  .gatecard button[type=submit]{background:var(--lime);color:var(--lime-ink);border:0;border-radius:11px;padding:14px;
    font-weight:700;font-size:1rem}
  .gatecard button[type=submit]:hover{background:var(--lime-d)}
  .gate-err{color:var(--red);font-size:.82rem;min-height:1.1em;font-weight:600}
  .pwwrap{position:relative;display:block}
  .pwwrap input{padding-right:96px !important;padding-left:96px !important}
  .pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--ink-3);font-family:var(--mono);
    font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
    min-height:44px;padding:0 10px;border-radius:9px}
  .pweye:hover{color:var(--ink)}
  .pweye:focus-visible{outline:2px solid var(--lime);outline-offset:2px;color:var(--ink)}
  @media(max-width:420px){
    .pwwrap input{padding-right:84px !important;padding-left:14px !important;text-align:left}
    .pweye{font-size:.62rem}
  }
  .gate-note{color:var(--ink-3);font-size:.74rem;margin-top:18px;line-height:1.5}
  .porlime{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
    color:var(--ink-3);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase}
  .porlime img{height:26px;width:auto}

  /* ---------- TOPO ---------- */
  /* safe-area: no iPhone com o app instalado a barra de status fica TRANSLUCIDA
     por cima da pagina (apple-mobile-web-app-status-bar-style black-translucent).
     Sem estes env() o relogio e a bateria cobrem os logos do topo. */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg),rgba(11,12,10,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
    padding-top:env(safe-area-inset-top)}
  .top .bar{display:flex;align-items:center;gap:14px;height:74px}
  .top img.logo{height:46px;width:auto}
  .top .sep{width:1px;height:30px;background:var(--line)}
  .top img.logolime{height:50px;width:auto;display:block}
  @media(max-width:420px){ .top img.logolime{height:40px} .top img.logo{height:38px} }
  .top .spacer{flex:1}
  .top .out{background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:9px;
    padding:8px 12px;font-size:.78rem;font-weight:600}
  .top .out:hover{color:var(--ink)}
  .top .ajuda{background:transparent;border:1px solid var(--line);color:var(--ink-2);
    border-radius:50%;width:36px;height:36px;font-size:.9rem;font-weight:700;flex-shrink:0;font-family:inherit}
  .top .ajuda:hover{border-color:var(--lime);color:var(--lime)}
  .quemsou{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-soft);
    padding:4px 10px;border-radius:99px;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  /* o "quem sou" (perfil) some no celular; o "quem é você" (nome da pessoa) FICA,
     porque e o que liga o filtro Minhas peças, que e justamente de quem esta em campo */
  @media(max-width:620px){.quemsou{display:none} .quemsou.eununo{display:inline-block}}
  .quemsou.eununo{cursor:pointer;border-color:var(--line);color:var(--lime);
    min-height:34px;max-width:30vw}
  .quemsou.eununo:hover{border-color:var(--lime)}
  .fchip.destaque:not(.on){border-color:rgba(166,236,77,.4);color:var(--lime)}
  .syncdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .syncdot.on{background:var(--lime);box-shadow:0 0 0 3px rgba(166,236,77,.18)}
  .syncdot.off{background:var(--ink-3);box-shadow:0 0 0 3px rgba(118,124,110,.15)}
  .syncdot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.2);animation:sdpulse 1s infinite}
  @keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* abas */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line-soft)}
  .tabs .wrap2{display:flex;gap:6px;max-width:1240px;margin:0 auto;padding:0 20px;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs .wrap2::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:none;border:0;color:var(--ink-3);font-family:var(--display);
    font-weight:700;font-size:1.12rem;padding:13px 6px;position:relative;letter-spacing:-.01em;
    display:inline-flex;align-items:center;gap:9px}
  .tab .n{font-family:var(--mono);font-size:.68rem;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink-3);padding:2px 7px;border-radius:100px}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime);border-radius:2px}
  .tab.active .n{color:var(--lime);border-color:rgba(166,236,77,.35)}
  /* bolinha na aba: enxergavel de qualquer lugar, entao a pessoa sabe que tem
     coisa nova em outra aba sem sair de onde esta */
  .tab.temnovo{position:relative}
  .tab.temnovo::before{content:"";position:absolute;top:9px;right:-2px;width:7px;height:7px;
    border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--bg)}

  /* ---------- FAIXA DE NOVIDADE ---------- */
  .novbar{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0;
    background:rgba(166,236,77,.09);border:1px solid rgba(166,236,77,.35);
    border-radius:12px;padding:11px 14px;color:var(--ink);font-family:inherit;
    font-size:.86rem;text-align:left;cursor:pointer;min-height:46px}
  .novbar:hover{background:rgba(166,236,77,.15)}
  .novbar:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .novpt{width:9px;height:9px;border-radius:50%;background:var(--lime);flex:0 0 auto;
    animation:novpulse 1.8s ease-in-out infinite}
  @keyframes novpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .novtx{flex:1;min-width:0;line-height:1.4}
  .novtx b{color:var(--lime)}
  .novir{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--lime);border:1px solid rgba(166,236,77,.5);border-radius:7px;padding:4px 10px;flex:0 0 auto}
  @media(prefers-reduced-motion:reduce){ .novpt{animation:none} }

  /* painel que desce: empurra a pagina, nao cobre. Camada flutuante no celular
     e ruim de fechar com uma mao so, e o time usa isso andando pelo autodromo */
  /* O teto de 8 itens e POR ABA, entao com pendencia nas duas o painel chegava
     a 16 linhas, quase 930px: numa tela de 780px abrir a faixa jogava a lista
     inteira pra fora da vista. O teto de altura resolve independente da conta. */
  .novpanel{border:1px solid rgba(166,236,77,.35);border-top:none;
    border-radius:0 0 12px 12px;background:rgba(166,236,77,.05);
    overflow-y:auto;max-height:46vh;-webkit-overflow-scrolling:touch}
  .novbar.aberta{border-radius:12px 12px 0 0}
  .novrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    border-top:1px solid rgba(166,236,77,.16);padding:10px 14px;text-align:left;
    color:var(--ink);font-family:inherit;font-size:.82rem;cursor:pointer;min-height:46px}
  .novrow:hover{background:rgba(166,236,77,.1)}
  .novrow:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
  .novrow .nq{flex:1;min-width:0}
  .novrow .nn{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .novrow .ns{display:block;font-size:.72rem;color:var(--ink-3);margin-top:1px}
  .novrow .nseta{color:var(--lime);flex:0 0 auto;font-size:1rem}
  .novfoot{display:flex;justify-content:flex-end;padding:8px 10px;
    border-top:1px solid rgba(166,236,77,.16)}
  .novfoot button{background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--ink-2);font-family:inherit;font-size:.72rem;padding:7px 12px;cursor:pointer;min-height:38px}
  .novfoot button:hover{color:var(--ink);border-color:var(--ink-3)}

  /* opcao 5: a peca nova continua marcada DENTRO da lista. Sem isto a pessoa
     chega na aba e perde de vista qual era a nova no meio de dezenas */
  .bloco.ehnovo{border-color:rgba(166,236,77,.55)}
  .tagnova{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;background:var(--lime);
    color:#0b0f06;border-radius:5px;padding:2px 6px;flex:0 0 auto;align-self:center}
  .bloco.piscando{animation:novflash 2.4s ease-out 1}
  @keyframes novflash{0%,22%{box-shadow:0 0 0 3px rgba(166,236,77,.55)}100%{box-shadow:0 0 0 3px rgba(166,236,77,0)}}
  @media(prefers-reduced-motion:reduce){ .bloco.piscando{animation:none;box-shadow:0 0 0 3px rgba(166,236,77,.55)} }

  /* ATENCAO: env() NAO pode ir dentro do atalho "padding". Se o navegador nao
     entender o env(), ele joga fora a declaracao INTEIRA e o padding vira 0.
     Aconteceu aqui: o topo colou na regua de abas. Valor normal primeiro,
     safe-area so como acrescimo, em propriedade separada. */
  /* PRECISA ser "main.wrap": o <main> tem class="wrap", e .wrap{padding:0 20px}
     e seletor de classe, que ganha do seletor de tag. Escrito so como "main"
     esta regra NUNCA valeu — o respiro do topo vinha por acidente da margem
     das sub-abas, e sumiu quando eu ajustei ela. */
  main.wrap{padding-top:16px;padding-bottom:100px}
  @supports(padding:env(safe-area-inset-bottom)){
    main.wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  }

  /* sub-abas (dias) */
  /* barra de edicao: mesma linguagem da Central das marcas, pra quem usa os
     dois sistemas nao ter que aprender duas gramaticas */
  .edbar{display:flex;align-items:baseline;gap:9px;margin:0 0 10px;flex-wrap:wrap}
  .edbar .espaco{flex:1 1 auto}
  .edtitulo{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--lime)}
  .edfaixa{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .edtrocar{min-height:36px;padding:0 12px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .edtrocar:hover{border-color:var(--ink-3);color:var(--ink)}
  .edtrocar:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  /* edicao encerrada: apagada de proposito, pra nao convidar ao toque no meio
     do evento. Quem procura acervo acha; quem esta com pressa nao esbarra */
  .edtrocar.encerrada{border-style:dashed;color:var(--ink-3);opacity:.72}
  .edtrocar.encerrada:hover{opacity:1;color:var(--ink-2)}
  .avisoed{display:flex;align-items:center;gap:9px;margin:0 0 10px;padding:8px 11px;
    border:1px dashed var(--line);border-radius:10px;background:transparent}
  .avisoed .txt{flex:1;min-width:0;font-size:.82rem;color:var(--ink-2)}
  .avisoed button{min-height:36px;padding:0 12px;border-radius:9px;cursor:pointer;
    border:1px solid var(--lime);background:transparent;color:var(--lime);
    font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

  .subtabs{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .subtab{background:transparent;border:1px solid var(--line);color:var(--ink-2);
    border-radius:20px;padding:8px 16px;font-size:.82rem;font-weight:600;min-height:38px}
  .subtab.active{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .subtab:not(.active):hover{border-color:var(--lime);color:var(--ink)}

  /* faixa de resumo no topo de cada modulo */
  .resumo{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  /* flex:1 com base pequena: as 3 caixas dividem a largura e cabem numa linha
     so no celular, em vez de quebrar pra duas e empurrar o conteudo pra baixo */
  .rbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;flex:1 1 90px;min-width:90px;max-width:200px}
  .rbox .rk{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)}
  .rbox .rv{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1;margin-top:2px}
  .rbox.destaque .rv{color:var(--lime)}
  .rbox.alerta .rv{color:var(--amber)}

  /* ===== PASTILHAS DE CONTAGEM =====
     Os 3 numeros que mandam ficam em caixa grande; os outros 8 (status por
     etapa, redes e impulsionamento) viram pastilha. Em caixa grande nao caberia
     no celular sem virar parede de numeros. */
  .tiras{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 6px}
  .tira{display:inline-flex;align-items:baseline;gap:5px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:5px 9px;white-space:nowrap}
  .tira .tk{font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-3)}
  .tira .tv{font-family:var(--display);font-weight:700;font-size:.98rem;color:var(--ink)}
  .tira[data-st=gravando] .tv{color:var(--amber)}
  .tira[data-st=edicao] .tv{color:var(--cyan)}
  .tira[data-st=pronto] .tv{color:var(--roxo)}
  .tira[data-st=publicado] .tv{color:var(--lime)}
  .tira.rede .tv{color:var(--ink-2)}
  .tira.apagada{opacity:.55}
  .tira.boostt{border-color:rgba(251,191,36,.3)}
  .tira.boostt .tv{color:var(--amber)}
  /* pendente = tem peca marcada pra impulsionar que ainda nao subiu */
  .tira.boostt.pendente{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.5)}

  .nalista{font-size:.76rem;color:var(--ink-3);margin:0 0 10px}
  .nalista b{color:var(--lime)}
  .dica{font-size:.75rem;color:var(--ink-3);line-height:1.45;
    padding:9px 11px;background:var(--panel-2);border:1px dashed var(--line);
    border-radius:9px;margin:2px 0 4px}

  /* ---------- BLOCO (cartao dobravel) ---------- */
  .bloco{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .bloco.completo{border-color:rgba(166,236,77,.32)}
  /* bloco fechado fica mais apagado e ocupa uma linha: e trabalho concluido,
     nao precisa competir por atencao com o que ainda falta */
  .bloco.recolhido{background:var(--panel-2)}
  .bloco.recolhido .cnome{font-size:.9rem;color:var(--ink-2)}
  .bloco.completo.recolhido .cnome{color:var(--ink)}
  .cabeca{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;
    background:transparent;border:0;color:var(--ink);text-align:left}
  .cabeca:hover{background:var(--panel-2)}
  /* ---------- MOVER (ordem da lista) ----------
     Setas, nao arrastar. Quem usa esta andando pelo autodromo com o celular numa
     mao: arrastar exige segurar e mirar ao mesmo tempo, e no toque briga com a
     rolagem da pagina. Duas setas resolvem o mesmo e nao erram.
     Fica FORA da .cabeca porque .cabeca ja e um <button> e botao dentro de botao
     nao vale em HTML: o navegador desmonta e o clique de cima come o de dentro. */
  .blocotopo{display:flex;align-items:stretch}
  .blocotopo > .cabeca{flex:1;min-width:0}
  .mover{display:flex;flex-direction:column;justify-content:center;gap:1px;
    padding:4px 7px;flex:0 0 auto;border-left:1px solid var(--line-soft)}
  .mvbtn{background:transparent;border:0;color:var(--ink-3);font-size:.78rem;line-height:1;
    padding:5px 6px;min-height:26px;border-radius:6px;cursor:pointer}
  .mvbtn:hover{color:var(--lime);background:var(--panel-2)}
  /* extremo da lista: fica no lugar, apagado. Sumir mudaria a altura do cartao
     e faria a lista inteira pular a cada troca de ordem. */
  .mvbtn[disabled]{opacity:.22;cursor:default}
  .mvbtn[disabled]:hover{color:var(--ink-3);background:transparent}
  /* dentro do item do checklist as setas ficam lado a lado, nao empilhadas:
     a linha do item e baixa e nao comporta duas alturas de botao */
  .chk .mover{flex-direction:row;border-left:0;padding:0;gap:0;align-items:center}
  .chora{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--lime);
    min-width:56px;flex:0 0 auto}
  /* QUANTO FALTA. Vem antes de tudo no cartao porque e a unica informacao que
     responde "faco isso agora?". A hora exata fica do lado, menor, pra quem
     precisa do numero. */
  .cfalta{font-family:var(--display);font-weight:700;font-size:.95rem;
    color:var(--ink-2);flex:0 0 auto;white-space:nowrap}
  .cfalta.perto{color:var(--amber)}
  .cfalta.atraso{color:var(--red)}
  .cquando{font-family:var(--mono);font-size:.66rem;color:var(--ink-3);
    flex:0 0 auto;white-space:nowrap}
  .bloco.atrasada{border-color:rgba(245,69,63,.45)}
  /* display:block obrigatorio: sao <span>, e sem isso marca e influenciador
     saem grudados na mesma linha ("CFMOTOSeku Mello"). */
  .cnome{display:block;font-weight:700;font-size:.96rem;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cinflu{display:block;font-size:.78rem;color:var(--ink-2);margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmeio{flex:1;min-width:0}
  /* quem grava e quem edita no cartao FECHADO: e assim que o fotografo e o
     editor acham a peca deles sem abrir uma por uma */
  .cgente{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.03em;
    color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cgente.vazia{font-style:italic;opacity:.65}
  .cgente .eu{color:var(--lime);font-weight:700}
  .cbox{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:700;
    letter-spacing:.04em;color:var(--lime);background:rgba(166,236,77,.12);
    border:1px solid rgba(166,236,77,.3);border-radius:5px;padding:1px 6px;
    vertical-align:1px;flex:0 0 auto}
  .cbox.local{color:var(--cyan);background:rgba(76,195,240,.12);border-color:rgba(76,195,240,.35)}
  .cbox.pend{color:var(--ink-3);background:transparent;border-style:dashed;
    border-color:var(--line);font-weight:400;text-transform:lowercase}
  .cprog{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--ink-3);
    white-space:nowrap;flex:0 0 auto}
  .cprog.ok{color:var(--lime)}
  .cmais{font-family:var(--mono);font-size:1rem;color:var(--ink-3);width:22px;text-align:center;flex:0 0 auto}
  .corpo{padding:0 15px 14px;border-top:1px solid var(--line-soft)}

  /* ---------- PECA DE CONTEUDO ---------- */
  .peca{padding:13px 0;border-bottom:1px solid var(--line-soft)}
  .peca:last-child{border-bottom:0}
  .pnome{font-weight:700;font-size:.88rem;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  /* 42px de altura: esses chips sao tocados de pe, no sol, com uma mao so.
     Abaixo disso o dedo erra e marca o status errado. */
  .stchip{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);
    border-radius:8px;padding:9px 13px;font-size:.78rem;font-weight:600;min-height:42px}
  .stchip:hover{color:var(--ink);border-color:var(--ink-3)}
  .stchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .stchip.on[data-st=gravando]{background:var(--amber);border-color:var(--amber)}
  .stchip.on[data-st=edicao]{background:var(--cyan);border-color:var(--cyan)}
  .stchip.on[data-st=pronto]{background:var(--roxo);border-color:var(--roxo)}

  .linhaflex{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .mini{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);
    border-radius:8px;padding:8px 12px;font-size:.74rem;font-weight:600;min-height:40px}
  .mini:hover{color:var(--ink)}
  .mini.on{background:rgba(166,236,77,.14);border-color:rgba(166,236,77,.5);color:var(--lime)}
  .mini.boost.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.55);color:var(--amber)}
  /* "já impulsionei": so aparece depois de marcar Impulsionar. Fica ambar
     tracejado enquanto esta pendente pra puxar o olho de quem cuida da mídia. */
  .mini.feito{border-style:dashed;border-color:rgba(251,191,36,.45);color:var(--amber)}
  .mini.feito.on{background:rgba(251,191,36,.22);border-style:solid;
    border-color:var(--amber);color:var(--amber);font-weight:700}

  .campo{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .campo input[type=text],.campo input[type=url],.campo input[type=time]{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:.82rem}
  .campo input:focus{outline:none;border-color:var(--lime)}
  .campo .cl{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);width:64px;flex:0 0 auto}

  /* ---------- LEGENDA DO POST ---------- */
  .legbox{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;margin:8px 0}
  .legtop{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .legtit{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);flex:1}
  .legcopy{background:var(--raise);border:1px solid var(--line);color:var(--lime);
    border-radius:8px;padding:7px 13px;font:inherit;font-size:.72rem;font-weight:700;
    min-height:36px;flex:0 0 auto}
  .legcopy:hover{border-color:var(--lime)}
  /* pre-wrap preserva as quebras de linha da legenda como foram escritas:
     legenda de Instagram tem paragrafo e bloco de hashtag, e virar texto
     corrido faria a pessoa colar errado */
  .legtx{white-space:pre-wrap;word-break:break-word;font-size:.84rem;line-height:1.55;
    color:var(--ink)}
  /* Referencia e Roteiro quase sempre levam um link colado. Sem min-width:0 o
     item flex nao encolhe, e sem overflow-wrap a URL e uma "palavra" gigante:
     o texto saia da linha e ficava cortado sem jeito de ler. */
  .fval{flex:1;min-width:0;font-size:.84rem;line-height:1.5;color:var(--ink-2);
    white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  /* link dentro de texto digitado. Alvo generoso no vertical (padding + margem
     negativa) porque endereco quebra em duas linhas no celular e a linha nua
     de texto e fina demais pro dedo acertar. */
  .lk{color:var(--lime);text-decoration:underline;text-underline-offset:2px;
    overflow-wrap:anywhere;word-break:break-word;
    padding:3px 0;margin:-3px 0;display:inline}
  .lk:hover{color:var(--lime-d)}
  .lk:active{opacity:.7}
  .lk:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:3px}
  .abrir{background:var(--panel-2);border:1px solid var(--line);color:var(--lime);
    border-radius:9px;padding:9px 11px;font-size:.72rem;font-weight:700;text-decoration:none;
    display:inline-flex;align-items:center;min-height:36px;flex:0 0 auto}
  .abrir:hover{border-color:var(--lime)}
  .abrir.off{color:var(--ink-3);pointer-events:none;opacity:.4}

  /* ---------- BUSCA E FILTRO ---------- */
  .barrafiltro{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .busca{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:11px 14px;font-size:.88rem}
  .busca:focus{outline:none;border-color:var(--lime)}
  /* ---------- RESUMO EM UMA LINHA ---------- */
  .resumo1{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:0 0 8px;
    color:var(--ink);font-family:inherit;font-size:.82rem;text-align:left;min-height:46px}
  .resumo1:hover{border-color:var(--ink-3)}
  .r1t{flex:0 0 auto}
  .r1t b{font-family:var(--display);font-size:1.15rem;color:var(--lime)}
  .r1s{flex:1;min-width:0;color:var(--ink-2);font-size:.76rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r1atraso{color:var(--red)}
  .r1seta{font-family:var(--mono);font-size:1rem;color:var(--ink-3);flex:0 0 auto;width:18px;text-align:center}

  /* ---------- CHAVE MINHAS / TODAS ---------- */
  .segm{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin:0 0 8px}
  .sg{flex:1;background:transparent;border:0;border-radius:9px;color:var(--ink-3);
    font-family:inherit;font-weight:700;font-size:.82rem;padding:9px 6px;min-height:42px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .sg.on{background:var(--lime);color:var(--lime-ink)}
  .sg:not(.on):hover{color:var(--ink)}
  .sgn{font-family:var(--mono);font-weight:400;font-size:.7rem;opacity:.75}

  /* ---------- LINHA DE ACOES: lupa, filtros, nova peca ---------- */
  .acoes1{display:flex;gap:7px;margin:0 0 8px;align-items:stretch}
  .lupa{flex:0 0 auto;width:46px;min-height:46px;background:transparent;
    border:1px solid var(--line);border-radius:12px;color:var(--ink-2);
    display:inline-flex;align-items:center;justify-content:center;padding:0}
  .lupa:hover{border-color:var(--ink-3);color:var(--ink)}
  .lupa.aberta{border-color:rgba(166,236,77,.5);color:var(--lime)}
  /* buscando: a lupa fica acesa, senao a pessoa esquece que a lista esta cortada */
  .lupa.tem{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .acoes1 .btn.nova{flex:0 0 auto;border-radius:12px;min-height:46px;white-space:nowrap}
  .buscabox{display:flex;gap:7px;margin:0 0 8px}
  .buscabox .busca{flex:1;min-width:0}
  .buscabox .btn{flex:0 0 auto;min-height:46px;border-radius:12px}

  /* ---------- FILTROS RECOLHIDOS ---------- */
  .filtrobtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:transparent;
    border:1px solid var(--line);border-radius:12px;padding:10px 13px;
    color:var(--ink-2);font-family:inherit;font-size:.82rem;font-weight:600;
    text-align:left;min-height:46px}
  .filtrobtn:hover{border-color:var(--ink-3);color:var(--ink)}
  .filtrobtn.aberto{border-color:rgba(166,236,77,.5);color:var(--ink)}
  .fbr{flex:1}
  .fbn{font-family:var(--mono);font-size:.66rem;background:var(--lime);color:var(--lime-ink);
    border-radius:100px;padding:2px 8px;font-weight:700}
  .fbseta{font-family:var(--mono);font-size:1rem;color:var(--ink-3);width:18px;text-align:center}
  .fbox{border:1px solid rgba(166,236,77,.4);border-radius:12px;
    padding:10px 12px 4px;margin:0 0 8px;background:var(--panel-2)}
  .fgr{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);margin:2px 0 5px}
  .fchip.lim{border-style:dashed;color:var(--ink-3)}
  .fchip.lim:hover{color:var(--red);border-color:rgba(245,69,63,.5)}

  /* ---------- CABECALHO DE ETAPA ---------- */
  .etapa{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
    border-bottom:1px solid var(--line-soft);color:var(--ink-2);font-family:var(--display);
    font-weight:700;font-size:1.02rem;letter-spacing:-.01em;padding:14px 2px 8px;
    margin-top:6px;text-align:left;min-height:44px}
  .etapa:hover{color:var(--ink)}
  .etapa.fechada{color:var(--ink-3)}
  .etp{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
  .etapa[data-st=gravando] .etp{background:var(--amber)}
  .etapa[data-st=edicao] .etp{background:var(--cyan)}
  .etapa[data-st=pronto] .etp{background:var(--roxo)}
  .etapa[data-st=publicado] .etp{background:var(--lime)}
  .etr{flex:1;min-width:0}
  .etn{font-family:var(--mono);font-weight:400;font-size:.68rem;color:var(--ink-3);
    background:var(--panel-2);border:1px solid var(--line);border-radius:100px;padding:2px 8px}
  .etseta{font-family:var(--mono);font-size:1rem;color:var(--ink-3);width:20px;text-align:center}

  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .fchip{background:var(--panel);border:1px solid var(--line);color:var(--ink-3);
    border-radius:20px;padding:7px 14px;font-size:.76rem;font-weight:600;min-height:36px}
  .fchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .fchip:not(.on):hover{color:var(--ink);border-color:var(--ink-3)}

  .btn{background:var(--lime);color:var(--lime-ink);border:0;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:.86rem;min-height:42px}
  .btn:hover{background:var(--lime-d)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
  .btn.perigo{background:transparent;border:1px solid rgba(245,69,63,.4);color:var(--red)}
  .btn.perigo:hover{background:rgba(245,69,63,.1)}

  /* ---------- FORMULARIO ---------- */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .form h3{margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:1.15rem;
    letter-spacing:.02em;text-transform:uppercase}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr} }
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .fld input,.fld select,.fld textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-size:.86rem;width:100%}
  .fld textarea{min-height:74px;resize:vertical;line-height:1.5}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--lime)}
  .fld.full{grid-column:1/-1}
  .acoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  /* ---------- TAGS ---------- */
  .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:6px;white-space:nowrap;flex:0 0 auto}
  .tag.organico{background:rgba(76,195,240,.14);color:var(--cyan);border:1px solid rgba(76,195,240,.35)}
  .tag.pago{background:rgba(185,139,255,.14);color:var(--roxo);border:1px solid rgba(185,139,255,.35)}
  .tag.st{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
  .tag.st[data-st=gravando]{color:var(--amber);border-color:rgba(251,191,36,.4)}
  .tag.st[data-st=edicao]{color:var(--cyan);border-color:rgba(76,195,240,.4)}
  .tag.st[data-st=pronto]{color:var(--roxo);border-color:rgba(185,139,255,.4)}
  .tag.st[data-st=publicado]{color:var(--lime);border-color:rgba(166,236,77,.45)}
  .tag.boost{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
  .tag.area{background:var(--raise);color:var(--ink-2);border:1px solid var(--line)}

  /* ---------- CHECKLIST ---------- */
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .chk:last-child{border-bottom:0}
  /* o quadradinho e o controle mais tocado do StoryMaker, e quem toca esta
     andando pelo autodromo. 34px e o minimo que o dedo acerta sem olhar. */
  .chkbox{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:transparent;font-size:1.05rem;font-weight:700;
    flex:0 0 auto;display:grid;place-items:center;padding:0;line-height:1}
  .chkbox.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  /* FOTORELATORIO — 136 itens marcados a dedo, andando pelo autodromo com a
     camera na outra mao. A LINHA INTEIRA e o botao, nao so o quadradinho:
     alvo de 34px e o que faz a pessoa errar, desistir e marcar no papel. */
  .frlinha{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--line-soft);
    padding:13px 2px;min-height:58px;color:var(--ink);cursor:pointer;font:inherit}
  .frlinha:last-child{border-bottom:0}
  .frlinha:active{background:var(--panel-2)}
  .frbox{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:transparent;font-size:1rem;font-weight:700;
    flex:0 0 auto;display:grid;place-items:center;line-height:1;margin-top:1px}
  .frlinha.on .frbox{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .frtx{flex:1;min-width:0;font-size:.9rem;line-height:1.4}
  .frlinha.on .frnome{color:var(--ink-3);text-decoration:line-through}
  .frsub{display:block;font-size:.72rem;line-height:1.35;color:var(--ink-3);margin-top:3px}
  .frquem{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;
    color:var(--ink-3);margin-top:4px}
  /* barra de progresso do grupo: o dado que a coordenacao olha de longe */
  .frbarra{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
  .frbarra i{display:block;height:100%;background:var(--lime);border-radius:4px}
  @media(max-width:520px){
    .frlinha{min-height:62px;padding:14px 2px}
    .frtx{font-size:.92rem}
  }
  .chktx{flex:1;min-width:0;font-size:.88rem;line-height:1.45}
  .chk.feito .chktx{color:var(--ink-3);text-decoration:line-through}
  .chkresp{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--ink-3);
    margin-top:3px;display:block}
  .chkresp b{color:var(--ink-2);font-weight:600}
  /* "definir responsável", "trocar" e o × são o fluxo mais usado pelo storymaker
     andando pelo autódromo. Estavam com ~18px de altura: menos que a ponta do dedo. */
  .chkdel{background:transparent;border:0;color:var(--ink-3);font-size:1rem;
    padding:8px 10px;margin:-4px 0;min-height:36px;flex:0 0 auto}
  .chkdel:hover{color:var(--red)}
  .chkresp .chkdel{color:var(--lime);text-decoration:underline;text-underline-offset:3px}
  .chkresp .chkdel:hover{color:var(--lime-d)}

  /* ---------- LISTA DE MARCAS (gerador de blocos) ----------
     Grade que vira uma coluna no celular. Cada linha e um <label>, entao o toque
     em qualquer lugar dela marca a caixa: no autodromo ninguem acerta um
     checkbox de 13px. */
  .mklista{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:4px;margin-top:2px}
  /* o dia vem escrito acima do grupo: sem isso a pessoa marca 19 caixas sem
     perceber que metade delas vai cair no dia seguinte */
  .mkdia{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--lime);margin:12px 0 5px}
  .mkdia:first-of-type{margin-top:4px}
  .mkitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line);font-size:.84rem;cursor:pointer}
  .mkitem:hover{border-color:var(--line-soft)}
  .mkitem input{width:17px;height:17px;flex:0 0 auto;accent-color:var(--lime)}
  /* marca que ja tem bloco no dia: continua clicavel, mas apagada, pra ficar
     claro que criar de novo ia duplicar o bloco em vez de completar o que existe */
  .mkitem.ja{opacity:.55}
  .mkitem i{font-style:normal;font-family:var(--mono);font-size:.6rem;
    letter-spacing:.05em;color:var(--ink-3)}

  /* ---------- ESTADOS ---------- */
  .vazio{text-align:center;padding:46px 20px;color:var(--ink-3)}
  .vazio .big{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink-2);margin-bottom:6px}
  .vazio .sm{font-size:.85rem;line-height:1.5;max-width:400px;margin:0 auto}

  @media(min-width:560px){ #guiaOverlay{align-items:center} }

  /* ═══════════ CELULAR ═══════════
     O time usa isto de pe, andando pelo autodromo, com uma mao so. O problema
     que o Eric pegou na tela dele: antes da PRIMEIRA peca aparecer, a pessoa
     rolava topo + abas + 3 caixas de numero + 8 pastilhas + busca + 3 fileiras
     de filtro. Quase uma tela inteira de enfeite antes do trabalho.

     A regra aqui: numero e filtro viram UMA linha que desliza pro lado. O chip
     cortado na borda direita ja avisa sozinho que tem mais coisa, entao nao
     precisa de seta nem de instrucao. */
  @media(max-width:620px){
    /* --- topo ---
       Eram 8 itens disputando 350px de largura util. O flex espremia o chip do
       nome ate sobrar "Q...", justo o botao que liga o filtro Minhas pecas.
       Tirando o risquinho separador e apertando os vaos, o nome volta a caber. */
    /* 14px de margem em vez de 20px: no celular esses 12px de largura fazem
       falta de verdade, e sao eles que fazem as 3 abas caberem sem arrastar */
    .wrap{padding:0 14px}
    .tabs .wrap2{padding:0 14px}

    .top .bar{height:60px;gap:7px}
    .top .sep{display:none}
    .top img.logo{height:32px}
    .top img.logolime{height:34px}
    /* 36px e o piso de alvo de dedo aqui. Cheguei a deixar 32 pra ganhar
       largura e voltei atras: botao de 32px na mao de quem esta em pe, no sol,
       com o celular numa mao so, e toque errado na certa. A largura veio da
       margem da pagina, nao do tamanho do alvo. */
    .top .ajuda{width:36px;height:36px;font-size:.84rem}
    .top .out{padding:8px 10px;font-size:.74rem;min-height:36px}
    .quemsou.eununo{max-width:none;flex:0 1 auto;min-width:0;min-height:36px}

    /* abas: as tres cabem sem precisar arrastar */
    .tab{font-size:1rem;padding:12px 5px;gap:7px}

    /* --- numeros ---
       As 3 caixas continuam grandes porque sao as que mandam. As outras 8
       viram uma fileira unica que desliza, em vez de tres fileiras empilhadas. */
    .resumo{gap:6px;margin-bottom:6px}
    .rbox{padding:7px 10px;flex:1 1 0;min-width:0;max-width:none}
    .rbox .rk{font-size:.54rem;letter-spacing:.08em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rbox .rv{font-size:1.3rem}

    .tiras{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px;margin-bottom:8px}
    .tiras::-webkit-scrollbar{display:none}
    .tira{flex:0 0 auto;border-radius:10px}

    /* --- filtros ---
       Cada grupo numa linha so. Antes viravam sete fileiras somadas. */
    .fchips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin-bottom:6px;padding-bottom:2px}
    .fchips::-webkit-scrollbar{display:none}
    /* 40px: filtro errado no celular custa caro, a pessoa acha que a peca dela
       sumiu. Os 4px a mais por fileira sao baratos perto disso. */
    .fchip{flex:0 0 auto;min-height:40px;padding:8px 14px}
    .subtabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .subtabs::-webkit-scrollbar{display:none}
    .subtab{flex:0 0 auto}

    /* busca e Nova peca na mesma linha, sem a busca encolher a ponto de sumir */
    .barrafiltro{gap:7px;margin-bottom:8px}
    .busca{min-width:0;flex:1 1 140px;padding:10px 12px}
    .barrafiltro .btn{flex:0 0 auto;padding:10px 13px;font-size:.8rem}

    /* --- cartoes ---
       Canto mais macio e menos respiro interno: cabe mais peca na tela sem
       apertar o alvo do dedo, que continua acima de 44px pela altura do texto. */
    .bloco{border-radius:14px;margin-bottom:8px}

    /* O CARTAO FECHADO EM DUAS LINHAS.
       Era o pior problema da tela: na .cabeca so o .cmeio encolhe, e hora,
       selo NOVA, tag de tipo, tag de status e o "+" sao todos rigidos. Em
       390px sobravam 90px pro nome da marca, em 360px sobravam 12px. Resultado
       medido: "CFMOTO Brasil" virava "CF…" e, com o selo NOVA junto, o nome
       sumia inteiro. E o "Grava: / Edita:" NUNCA cabia em largura nenhuma de
       celular, sendo que ele so existe pra o fotografo e o editor acharem a
       peca deles sem abrir uma por uma.
       Agora hora e etiquetas ficam na primeira linha e o nome ocupa a largura
       toda na segunda. Nada foi escondido: o status continua a um relance. */
    .cabeca{padding:12px 13px;gap:9px;flex-wrap:wrap;row-gap:7px}
    .cabeca > .cmeio{flex:1 1 100%;order:2}
    .cabeca > .chora,.cabeca > .tag,.cabeca > .tagnova,
    .cabeca > .cfalta,.cabeca > .cquando,
    .cabeca > .cbox,.cabeca > .cprog{order:1}
    .cabeca > .cmais{order:1;margin-left:auto}
    .chora{min-width:44px;font-size:.98rem}
    .cnome{white-space:normal;font-size:1rem;line-height:1.25}
    .cinflu{white-space:normal}
    .cgente{white-space:normal;line-height:1.4}
    .stchip{border-radius:10px;padding:9px 12px}
    /* desmarcar uma rede sem querer esconde o campo com o link ja colado, entao
       este chip merece alvo maior e mais folga entre um e outro */
    .mini{min-height:46px;padding:11px 14px;border-radius:10px}
    .linhaflex{gap:10px}
    .abrir{border-radius:10px}
    .dica{border-radius:10px}
    .novbar{padding:11px 12px;font-size:.82rem}
    .novrow{padding:11px 12px}
  }

  /* telas bem estreitas (iPhone SE e afins) */
  @media(max-width:380px){
    .top .out{padding:7px 8px}
    .rbox .rv{font-size:1.18rem}
    .tab{font-size:.94rem}
  }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var VERSAO = "2026-08-25.1";

  // ═══════════════════════════════════════════════════════════════
  // PERFIS
  // A matriz de permissao vive AQUI, no codigo, nunca no banco. O banco
  // so diz quem tem qual perfil; o codigo diz o que cada perfil pode.
  //
  // Dois niveis de proposito:
  //   conteudo  = direcao e edicao (Nil, Isa, coordenacao, editores). Ve tudo.
  //   story     = storymaker de campo. So o checklist do dia dele.
  // O storymaker nao precisa (nem deve) mexer na grade das coletivas no
  // meio do corre. Menos tela = menos engano.
  // ═══════════════════════════════════════════════════════════════
  // "gerenciar" = mexe em tudo, inclusive APAGAR.
  // "editar"    = cria, edita e marca, mas NAO APAGA nada.
  // "nenhum"    = nem ve a aba.
  var PERFIS = {
    // EQUIPE INTERNA: e quem apaga. Se algo for apagado por engano, e alguem
    // desta lista, e por isso ela e curta de proposito.
    conteudo: { rotulo:"Equipe interna", coletivas:"gerenciar", pecas:"gerenciar", story:"gerenciar", fotos:"gerenciar", fotorel:"gerenciar" },

    // EQUIPE EXTERNA: enxerga o mesmo, produz o mesmo, e a unica diferenca e
    // que nao apaga. Freelancer e parceiro entram por aqui. Nao e desconfianca:
    // durante o evento uma exclusao errada nao tem desfazer, e quem esta de fora
    // nao tem como saber que aquela peca era a unica copia de alguma coisa.
    externo:  { rotulo:"Equipe externa", coletivas:"editar",    pecas:"editar",    story:"editar",    fotos:"editar",    fotorel:"editar" },

    // o storymaker de campo tambem entrega foto, entao a aba Fotos entra pra ele.
    // Fotorelatorio entra pros tres: quem esta em campo marca, a coordenacao acompanha.
    story:    { rotulo:"StoryMaker",     coletivas:"nenhum",    pecas:"nenhum",    story:"gerenciar", fotos:"gerenciar", fotorel:"gerenciar" }
  };

  // Caminho de recuperacao: estas senhas funcionam SEMPRE, mesmo com o banco
  // fora do ar. Impede o time ficar trancado pra fora no dia do evento.
  var ACESSOS_PADRAO = [
    { nome:"Equipe interna",   senha:"conteudo2026", perfil:"conteudo" },
    // Entrou em 20/08/2026. Mesma tela da interna, mesma capacidade de criar e
    // editar, sem os botoes de apagar. A senha antiga da interna NAO mudou de
    // proposito: o time ja tem ela decorada e trocar as duas de uma vez, a dias
    // do evento, e receita de gente trancada pra fora no dia.
    { nome:"Equipe externa",   senha:"externa2026",  perfil:"externo"  },
    { nome:"StoryMaker",       senha:"story2026",    perfil:"story"    }
  ];

  // ═══════════════════════════════════════════════════════════════
  // FIREBASE — PROJETO PROPRIO (conteudo-fi), separado da Central das marcas.
  //
  // MESMO PROJETO da Central das marcas: festival-interlagos-2026.
  //
  // Em 18/08 o conteudo tinha sido separado num projeto proprio porque o limite
  // gratis e de 50 mil leituras por DIA e por PROJETO, e os dois juntos
  // estouravam o mesmo balde. Em 19/08 tudo voltou pra um projeto so, agora numa
  // conta com o teste sem custo do Google Cloud (R$1.745 de credito ate
  // 18/11/2026). Com credito, a cota deixou de ser a trava e a separacao deixou
  // de valer a complexidade de dois consoles e duas chaves.
  //
  // O QUE CONTINUA VALENDO E NAO PODE SER DESFEITO: os cortes de leitura de
  // 19/08. Escuta por perfil aqui, recados filtrado por edicao na Central,
  // worker e service worker pedindo 1 documento em vez da colecao inteira.
  // Nao foram "apertar pra caber no gratis", foram defeitos: o worker sozinho
  // gastava 213 mil leituras por dia pra responder "tem coisa nova?".
  //
  // O endereco nao muda: isto mora no GitHub Pages, o Firebase e so onde o dado
  // fica guardado.
  //
  // Os 310 documentos dos dois projetos antigos foram copiados em 19/08/2026 e
  // conferidos campo a campo. central-evento-fi e conteudo-fi NAO foram
  // apagados: sao o backup ate o time confirmar que esta tudo certo.
  // ═══════════════════════════════════════════════════════════════
  var firebaseConfig = {
    apiKey: "AIzaSyBMY82Mcp1rhNXHt6gQhTvyV4VAjIkU0bI",
    authDomain: "festival-interlagos-2026.firebaseapp.com",
    projectId: "festival-interlagos-2026",
    storageBucket: "festival-interlagos-2026.firebasestorage.app",
    messagingSenderId: "31705575491",
    appId: "1:31705575491:web:fcf7ef1b01d05b71c9a4f6"
  };
  var FB_ON = !!(firebaseConfig.projectId && window.firebase);
  var db = null;
  if(FB_ON){
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      // cache no aparelho: o autodromo cheio derruba dados de celular. Com isso
      // a pessoa marca "publicado" sem sinal e sobe sozinho quando a rede volta.
      try{ db.enablePersistence({ synchronizeTabs:true })["catch"](function(){}); }catch(e){}
    }catch(e){ FB_ON = false; }
  }

  // ---- helpers ----
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  // ENDERECO DIGITADO VIRA LINK CLICAVEL.
  // O time cola link de referencia do Instagram, de Drive, de pasta, dentro de
  // campos de texto. Antes ficava so escrito: a pessoa tinha que selecionar a
  // mao, no celular, um endereco que quebra em duas linhas. Praticamente
  // ninguem conseguia.
  //
  // ESCAPA PRIMEIRO, PROCURA O ENDERECO DEPOIS. Na ordem contraria, qualquer
  // um poderia colar HTML num campo e ele viraria marcacao de verdade na tela
  // de todo mundo. Por isso tambem so http e https viram link: javascript: e
  // data: ficam como texto morto.
  var linkar = function(s){
    return esc(s).replace(/https?:\/\/[^\s<]+/g, function(u){
      // pontuacao no fim quase sempre e da frase, nao do endereco. Sem isto o
      // "Veja aqui: https://site.com." levaria pra uma pagina com ponto no fim.
      var fim = "", m = u.match(/[.,;:!?)\]}>]+$/);
      if(m){ fim = m[0]; u = u.slice(0, u.length - fim.length); }
      if(!u) return fim;
      return '<a class="lk" href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'+fim;
    });
  };
  var uid = function(){ return Math.random().toString(36).slice(2,9); };
  function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); },1800); }

  // Link so vira link se for http(s). Sem isso alguem cola "javascript:..." ou
  // um caminho relativo e o cartao passa a apontar pra qualquer coisa.
  // Marcar/desmarcar rede sem corrida. Com Firestore usa o operador atomico do
  // proprio banco; no modo local (sem Firebase) nao existe corrida, entao vale
  // o array normal — o sentinel do FieldValue nao funciona no localStorage.
  function setaRede(rede, jaTem, atual){
    if(FB_ON){
      return jaTem ? firebase.firestore.FieldValue.arrayRemove(rede)
                   : firebase.firestore.FieldValue.arrayUnion(rede);
    }
    var r = (atual||[]).slice(), p = r.indexOf(rede);
    if(p<0) r.push(rede); else r.splice(p,1);
    return r;
  }

  // Conta tudo que a faixa de cima mostra. Serve pras duas abas porque slot de
  // coletiva e peca avulsa tem os mesmos campos de status/redes/impulsionamento.
  function contarPainel(lista){
    var c = { total:lista.length, gravando:0, edicao:0, pronto:0, publicado:0,
              semStatus:0, boost:0, boostFeito:0, ig:0, tt:0, yt:0 };
    for(var i=0;i<lista.length;i++){
      var x = lista[i] || {};
      if(x.status && c[x.status] !== undefined) c[x.status]++;
      else if(!x.status) c.semStatus++;
      if(x.impulsionar){ c.boost++; if(x.impulsionado) c.boostFeito++; }
      var r = x.redes || [];
      if(r.indexOf("ig") >= 0) c.ig++;
      if(r.indexOf("tt") >= 0) c.tt++;
      if(r.indexOf("yt") >= 0) c.yt++;
    }
    return c;
  }

  // Faixa compacta com TODOS os numeros. Os 3 que mandam ficam em caixa grande;
  // o resto vira pastilha, senao nao cabe no celular sem virar parede de numeros.
  function painelHTML(c, rotuloTotal){
    var h = '<div class="resumo">'+
      '<div class="rbox"><div class="rk">'+esc(rotuloTotal)+'</div><div class="rv">'+c.total+'</div></div>'+
      '<div class="rbox destaque"><div class="rk">Publicadas</div><div class="rv">'+c.publicado+'</div></div>'+
      // rotulo curto de proposito: "Prontas p/ subir" fazia a caixa estourar a
      // largura e as 3 caixas quebravam em duas linhas no celular

        '<span class="tk">'+esc(rot)+'</span><span class="tv">'+val+'</span></span>';

    // ORDEM = a fila de producao: nao comecou -> gravando -> edicao -> pronto -> no ar.
    // "Sem status" vem primeiro de proposito: alem de ser o inicio da fila, evita
    // que ele sobre sozinho numa linha quando as pastilhas quebram no celular.
    h += '<div class="tiras">';
    if(c.semStatus) h += pill("Não começou", c.semStatus, "", " apagada");
    h += pill("Gravando",  c.gravando,  "gravando");

    h += '<span class="tira boostt'+(c.boost && c.boostFeito < c.boost ? " pendente":"")+'">'+

         '<span class="tv">'+c.boostFeito+'/'+c.boost+'</span></span>';
    h += '</div>';
    return h;
  }

  // textarea fica fora da tela em vez de display:none.
  function copiaNaMarra(txt, ok){
    var t = document.createElement("textarea");
    t.value = txt;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
    document.body.appendChild(t);
    t.select(); t.setSelectionRange(0, txt.length);
    var deu = false;
    try{ deu = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t);
    if(deu && ok) ok();
    else toast("Não consegui copiar. Selecione o texto e copie na mão.");
  }

  var connState = FB_ON ? "on" : "off";
  var offTimer = null;
  function setStatus(st){
    if(st) connState = st;
    var s=$("#syncDot"); if(!s) return;
    s.className = "syncdot " + connState;
    s.title = (connState==="on" ? "Sincronizado em tempo real"

            : "Modo local (só neste aparelho)") + "  ·  versão " + VERSAO;
    var b = $("#offline"); if(!b) return;
    if(connState === "warn"){
      // 4s de tolerancia: piscada de rede nao merece faixa amarela na tela
      if(!offTimer && b.hidden){

  // Erro que NAO e queda de rede precisa aparecer com todas as letras, senao o
  // time fica achando que e sinal ruim enquanto o sistema esta fora do ar.
  function avisoDeFalha(err){
    var b = $("#offline"); if(!b) return;
    var code = err && err.code ? String(err.code) : "";
    if(code === "resource-exhausted"){
      b.textContent = "O limite diário do banco foi atingido. A tela mostra a última versão salva. Fale com o Eric.";
      b.hidden = false; if(offTimer){ clearTimeout(offTimer); offTimer=null; }
    } else if(code === "permission-denied" || code === "unauthenticated"){
      // As regras JA estao publicadas (11/08/2026), entao hoje a causa mais
      // provavel de recusa e texto acima do teto, nao regra faltando.
      b.textContent = "O banco recusou a gravação. Pode ser texto longo demais num campo. Fale com o Eric.";
      b.hidden = false; if(offTimer){ clearTimeout(offTimer); offTimer=null; }
    }
    if(window.console) console.error("[conteudo] firestore", code, err);
  }

  function DBwatch(c, cb){
    watchers[c] = cb;
    if(!FB_ON){
      cb(lsGet(c));
      window.addEventListener("storage", function(ev){ if(ev.key==="cfi_"+c) cb(lsGet(c)); });
      return function(){};
    }
    var onErr = function(err){ setStatus("warn"); avisoDeFalha(err); };
    // includeMetadataChanges e obrigatorio: sem ele, quando o servidor confirma o
    // MESMO dado que ja estava no cache nao chega aviso, e o amarelo fica preso.
    return db.collection(COL[c]).onSnapshot({ includeMetadataChanges:true }, function(snap){
      setStatus(snap.metadata && snap.metadata.fromCache ? "warn" : "on");
      var a=[]; snap.forEach(function(d){ var o=d.data()||{}; o.id=d.id; a.push(o); });
      cb(a);
    }, onErr);
  }

  // A TRAVA DO ARQUIVO fica aqui, no ponto unico por onde TUDO grava, e nao
  // espalhada por quinze botoes: edicao encerrada e acervo, abre e le, nao
  // escreve. Sem isso o acidente mais comum do evento seria trocar pra moto pra
  // conferir um link, esquecer de voltar, e criar peca nova nascendo em agosto.
  // A tela tambem esconde os botoes; sao as duas checagens de sempre.
  function DBadd(c, obj){
    if(bloqueiaSeArquivo()) return;
    if(!FB_ON){ obj.id=uid(); var a=lsGet(c); a.push(obj); lsSet(c,a); return; }
    db.collection(COL[c]).add(obj)["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  function DBupdate(c, id, patch){
    if(bloqueiaSeArquivo()) return;
    if(!FB_ON){
      var a=lsGet(c), i;
      for(i=0;i<a.length;i++){ if(a[i].id===id){ for(var k in patch) a[i][k]=patch[k]; } }
      lsSet(c,a); return;
    }
    db.collection(COL[c]).doc(id).update(patch)["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  // set com merge: usado pelas coletivas, que tem id fixo e podem nao existir ainda
  function DBset(c, id, patch){
    if(bloqueiaSeArquivo()) return;
    if(!FB_ON){
      var a=lsGet(c), achou=false, i;
      for(i=0;i<a.length;i++){ if(a[i].id===id){ achou=true; for(var k in patch) a[i][k]=patch[k]; } }
      if(!achou){ var o={id:id}; for(var k2 in patch) o[k2]=patch[k2]; a.push(o); }
      lsSet(c,a); return;
    }
    db.collection(COL[c]).doc(id).set(patch,{merge:true})["catch"](function(e){ avisoDeFalha(e); toast("Não deu para salvar."); });
  }
  function DBremove(c, id){
    if(bloqueiaSeArquivo()) return;
    if(!FB_ON){ lsSet(c, lsGet(c).filter(function(x){ return x.id!==id; })); return; }
    db.collection(COL[c]).doc(id).delete()["catch"](function(e){ avisoDeFalha(e); toast("Não deu para apagar."); });
  }

  function diasDaEdicao(ed){ return (ed && ed.dias) ? ed.dias : []; }
  function diasPecaDaEdicao(ed){ return diasDaEdicao(ed).filter(function(d){ return !d.semPeca; }); }
  function edicaoDoDia(iso){
    for(var i=0;i<EDICOES.length;i++){
      for(var j=0;j<EDICOES[i].dias.length;j++){ if(EDICOES[i].dias[j].dia===iso) return EDICOES[i]; }
    }
    return null;   // dia fora das duas grades (dado de teste, erro de digitacao)
  }
  function primeiroDia(ed){ var d=diasDaEdicao(ed); return d.length ? d[0].dia : ""; }
  function ultimoDia(ed){ var d=diasDaEdicao(ed); return d.length ? d[d.length-1].dia : ""; }
  function faixaDe(ed){
    var a=primeiroDia(ed), b=ultimoDia(ed);
    return a && b ? (a.slice(8)+"/"+a.slice(5,7)+" a "+b.slice(8)+"/"+b.slice(5,7)) : "";
  }
  // A que esta acontecendo, ou a proxima. Depois que tudo passou, fica na ultima.
  function edicaoCorrente(){
    var h = hojeISO();
    for(var i=0;i<EDICOES.length;i++){
      if(h >= primeiroDia(EDICOES[i]) && h <= ultimoDia(EDICOES[i])) return EDICOES[i];
    }
    for(var j=0;j<EDICOES.length;j++){ if(h < primeiroDia(EDICOES[j])) return EDICOES[j]; }
    return EDICOES[EDICOES.length-1];
  }
  function edicaoEncerrada(ed){ return !!ed && ultimoDia(ed) < hojeISO(); }

  // A TRAVA. Edicao que ja aconteceu e ACERVO: abre, le, copia link, e so.
  // Sem isso o caminho mais comum do evento vira acidente: a pessoa troca pra
  // moto pra conferir um link, esquece de voltar, cria peca nova e ela nasce
  // em agosto. Toda funcao que grava confere isto ANTES, e a tela tambem
  // esconde os botoes — as duas checagens, como no resto do sistema.
  function soLeitura(){ return edicaoEncerrada(edicaoPorId(edicaoVista)); }
  function bloqueiaSeArquivo(){
    if(!soLeitura()) return false;
    toast("Edição encerrada: aqui só dá para consultar. Volte para a " + edicaoCorrente().rotulo + " para editar.");
    return true;
  }

  // Todos os dias das duas edicoes, pra rotular cartao antigo e pros seletores
  // de dia dos formularios, que precisam enxergar as duas (senao abrir uma peca
  // de moto estando na auto reescreve a data dela sozinho ao salvar).
  function todosOsDias(){
    var out=[];
    EDICOES.forEach(function(e){ e.dias.forEach(function(d){ out.push(d); }); });
    return out;
  }
  // compatibilidade: o codigo antigo usa estes dois nomes em varios lugares
  var DIAS_STORY = todosOsDias();
  var DIAS_PECA  = DIAS_STORY.filter(function(d){ return !d.semPeca; });

  // Seletor de dia dos FORMULARIOS: sempre as duas edicoes, em grupos com o
  // nome de cada uma. Se o dia que ja esta gravado nao existir em grade nenhuma
  // (dado antigo, erro de digitacao), ele entra num grupo "Fora das grades" em
  // vez de sumir — sumir e o que fazia o navegador escolher outro dia sozinho.
  // "quaisDias" e diasDaEdicao ou diasPecaDaEdicao, conforme o formulario.
  function optgroupDias(quaisDias, diaAtual){
    var h = "", achou = false;
    EDICOES.forEach(function(e){
      var dias = quaisDias(e);
      if(!dias.length) return;
      h += '<optgroup label="'+esc(e.rotulo)+'">';
      dias.forEach(function(d){
        var sel = (d.dia === diaAtual);
        if(sel) achou = true;
        h += '<option value="'+d.dia+'"'+(sel?' selected':'')+'>'+esc(d.rotulo)+'</option>';
      });
      h += '</optgroup>';
    });
    if(diaAtual && !achou){
      h += '<optgroup label="Fora das grades"><option value="'+esc(diaAtual)+'" selected>'+esc(diaAtual)+'</option></optgroup>';
    }
    return h;
  }

  // Os QUATRO PRIMEIROS sao os do filtro. Vem na frente pra quem digita escolher
  // um deles e a peca cair num grupo, em vez de virar "Outro". Os demais ficam
  // porque o time ja usa, e o campo continua aceitando texto livre.
  var FORMATOS_SUGERIDOS = ["Carrossel","Reel","GIF","Estático","Reels","Story","Foto","Vídeo edit","Entrevista","Cobertura","YouTube"];

  // ===== FILTRO DE FORMATO =====
  // O campo formato e texto livre e sempre foi: o banco tem "Carrossel", "Reels",
  // "GIF" e "Plano Sequência" escritos a mao. Entao o filtro NAO compara igualdade,
  // procura o pedaco da palavra no texto ja normalizado (sem acento, minusculo).
  // "Reel" e "Reels" caem no mesmo grupo, que e o que a pessoa espera.
  // "Outro" existe pra nada sumir da tela: peca com formato que nao casa com
  // nenhum dos quatro continua alcancavel, e peca sem formato tambem.
  var FORMATOS_FILTRO = [
    { k:"carrossel", rot:"Carrossel", casa:["carross","carrosel"] },
    { k:"reel",      rot:"Reel",      casa:["reel"] },
    { k:"gif",       rot:"GIF",       casa:["gif"] },
    { k:"estatico",  rot:"Estático",  casa:["estatic"] }
  ];
  function semAcento(s){
    s = String(s || "").toLowerCase();
    return s.normalize ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : s;
  }
  // devolve a chave do grupo, ou "outro" quando nao casa com nenhum (inclusive vazio)
  function tituloPeca(p){
    return String(p.tema||"").trim() || String(p.marca||"").trim() || "Sem tema";
  }
  function subPeca(p){
    var partes = [];
    if(String(p.tema||"").trim()) partes.push(String(p.marca||"").trim() || "Sem marca");
    partes.push(String(p.formato||"").trim() || "—");
    return partes.join(" · ");
  }

  function grupoDoFormato(txt){
    var t = semAcento(txt);
    for(var i=0;i<FORMATOS_FILTRO.length;i++){
      var c = FORMATOS_FILTRO[i].casa;
      for(var j=0;j<c.length;j++){ if(t.indexOf(c[j]) >= 0) return FORMATOS_FILTRO[i].k; }
    }
    return "outro";
  }

  // ---- estado ----
  var PERFIL=null, PERM=null;
  var coletivas=[], pecas=[], story=[];
  // So os itens JA MARCADOS do fotorelatorio. Item em aberto nao tem documento.
  var fotorel=[], frRecolhidos={};

  // Qual edicao a tela esta mostrando. Vale para as QUATRO abas ao mesmo tempo:
  // trocar de aba nao pode trocar de edicao no meio do caminho. Nasce na que
  // esta em cartaz, entao em 27/08 o sistema vira auto sozinho.
  var edicaoVista = edicaoCorrente().id;
  // diaColetiva deixa de nascer com data escrita na mao: com duas edicoes, o
  // literal "2026-08-12" prenderia a tela na moto pra sempre.
  var diaColetiva = null, diaStory = null;
  var abertos={};                      // id -> true (cartoes expandidos)
  var fBusca="", fTipo="todos", fStatus="todos", fDia="todos", fBoost=false, fMinhas=false;

  // toque, mas fora do caminho: eles empurravam a primeira peca pra 455px de
  // rolagem, e quem esta em campo liga o celular pra ver peca, nao painel.
  var statsAbertas = false;

  var etapaFechada = { publicado:true };
  var padraoMinhasFeito = false;

  // O login e compartilhado (uma senha pro time inteiro), entao o sistema nao
  // sabe quem esta do outro lado. A pessoa diz o nome uma vez e fica gravado no
  // aparelho: e o que faz o "Minhas peças" e o destaque em lime funcionarem.
  var MEU_KEY = "cfi_nome";
  var meuNome = "";
  try{ meuNome = localStorage.getItem(MEU_KEY) || ""; }catch(e){}
  var editandoPeca=null;               // id da peca em edicao, ou "novo"
  var criandoBloco=false;              // formulario de novo bloco do StoryMaker aberto
  var criandoMarcas=false;             // formulario que gera um bloco por marca de uma vez
  var fMinhasStory=false;              // filtro "só as minhas" no checklist
  var frSoFalta=false;                 // fotorelatorio: esconde o que ja foi marcado
  var frCriando=false;                 // campo de novo item do grupo Outros aberto
  var recolhidos={};                   // bloco EM ABERTO que a pessoa fechou na mao
  var reabertos={};                    // bloco COMPLETO que a pessoa reabriu na mao
  var desligar=[];                     // funcoes que param as escutas

  // ---- permissoes: checadas ao DESENHAR e de novo ao EXECUTAR ----
  function definirPerfil(p){ PERFIL = PERFIS[p] ? p : null; PERM = PERFIL ? PERFIS[PERFIL] : null; return !!PERM; }
  // TRES NIVEIS por modulo, do menor pro maior:
  //   "nenhum"    nao ve a aba
  //   "editar"    ve, cria, edita e marca. NAO APAGA. (equipe externa)
  //   "gerenciar" tudo, inclusive apagar.   (equipe interna)
  //
  // podeGerenciar aceita os dois de cima de proposito: ele guarda dezenas de
  // acoes que sao de EDICAO (criar peca, marcar item, trocar status), e se ele
  // exigisse "gerenciar" a equipe externa nao conseguiria trabalhar. Quem
  // separa apagar de editar e podeApagar, e so ele.
  function podeVer(m){       return !!PERM && PERM[m] && PERM[m] !== "nenhum"; }
  function podeGerenciar(m){ return !!PERM && (PERM[m] === "gerenciar" || PERM[m] === "editar"); }
  function podeApagar(m){    return !!PERM && PERM[m] === "gerenciar"; }
  function quemSou(){ return (PERM && PERM.rotulo) || "—"; }

  function acharAcesso(senha){
    var s = String(senha||"").trim();
    if(!s) return null;
    for(var i=0;i<ACESSOS_PADRAO.length;i++){ if(ACESSOS_PADRAO[i].senha === s) return ACESSOS_PADRAO[i]; }
    return null;
  }

  function ga(evento, params){
    try{ if(typeof gtag !== "function") return; gtag("event", evento, params||{}); }catch(e){}
  }

  // ═══════════════════════════════════════════════════════════════
  // MODULO 1 — COLETIVAS
  // A grade e fixa; o banco guarda so o que muda (status, links, impulsionar).
  // O id do documento e derivado da grade, entao nada precisa ser semeado:
  // o documento nasce na primeira vez que alguem toca naquela peca.
  // ═══════════════════════════════════════════════════════════════
  function slotId(dia, hora, idx){
    return "c_" + dia.slice(5).replace("-","") + "_" + hora.replace(/[h:]/g,"") + "_" + idx;
  }
  function estadoDe(id){
    for(var i=0;i<coletivas.length;i++){ if(coletivas[i].id===id) return coletivas[i]; }
    return null;
  }

  // ═══════════════════════════════════════════════════════════════
  // MODULO 4 — FOTOS
  //
  // Entrega de foto e diferente de peca: nao tem hora de veiculacao, tem PASTA.
  // E pasta e o pior tipo de entrega pra acompanhar, porque o link existe desde
  // o inicio e nao diz nada sobre o que tem dentro. Por isso a aba pede tres
  // coisas alem do link:
  //   momento  -> "Coletiva Honda", "Show Matue". Sem isso viram 20 links iguais
  //               e ninguem lembra qual e qual dois dias depois.
  //   qtd      -> sem numero, "pronto" pode ser 5 ou 500 fotos.
  //   DOIS checks -> enviado (subiu pro Drive) e tratado (da pra publicar).
  //               Com um check so, o editor nao sabe se pode usar.
  // ═══════════════════════════════════════════════════════════════
  var fotos = [];
  var criandoFoto = false;

  function fotosDoDia(){
    var d = diaStoryAtual();
    return fotos.filter(function(f){ return (f.dia || "") === d; })
                .sort(function(a,b){ return ordDe(a) - ordDe(b); });
  }

  function formFotoHTML(){
    var i, h = '<div class="form"><h3>Nova entrega de fotos</h3><div class="grid2">';
    h += '<div class="fld"><label>Momento</label>'+
         '<input id="ft_momento" type="text" placeholder="Coletiva Honda, Show Matuê, público no portão..."></div>';
    h += '<div class="fld"><label>Responsável</label>'+
         '<input id="ft_resp" type="text" placeholder="Quem fotografou"></div>';
    h += '<div class="fld full"><label>Link da pasta no Drive</label>'+
         '<input id="ft_link" type="url" inputmode="url" autocapitalize="off" autocorrect="off" '+
         'spellcheck="false" maxlength="600" placeholder="https://drive.google.com/..."></div>';
    h += '<div class="fld"><label>Quantas fotos</label>'+
         '<input id="ft_qtd" type="number" inputmode="numeric" min="0" placeholder="0"></div>';
    // Duas edicoes agrupadas, mesma razao do formulario de peca: a data que ja
    // esta gravada tem que continuar na lista, senao salvar reescreve ela.
    h += '<div class="fld"><label>Dia</label><select id="ft_dia">'+
         optgroupDias(diasDaEdicao, diaStoryAtual())+'</select></div>';
    h += '</div><div class="acoes">'+
      '<button class="btn" data-act="salvarfoto">Criar entrega</button>'+
      '<button class="btn ghost" data-act="cancelarfoto">Cancelar</button>'+
    '</div></div>';
    return h;
  }

  function salvarFoto(){
    var v = function(id){ var e=$("#"+id); return e ? String(e.value||"").trim() : ""; };
    var momento = v("ft_momento");
    if(!momento){ toast("Diga o momento, senão vira link sem nome."); var m=$("#ft_momento"); if(m) m.focus(); return; }
    var n = parseInt(v("ft_qtd"), 10);
    DBadd("fotos", {
      dia: v("ft_dia") || diaStoryAtual(),
      momento: momento,
      resp: v("ft_resp"),
      link: v("ft_link"),
      qtd: isNaN(n) ? 0 : n,
      enviado: false, tratado: false,
      criadoEm: Date.now(), em: Date.now(), por: quemSou()
    });
    naoAlertarProprio("fotos", Date.now());
    criandoFoto = false;
    toast("Entrega criada.");
    renderFotos();
  }

  function blocoFotoHTML(f, pos, total){
    var pronto = !!f.tratado;
    var nova = ehNovo("fotos", f);
    var link = String(f.link || "").trim();
    var seguro = /^https?:\/\//i.test(link) ? link : "";
    return '<div class="bloco'+(pronto?" completo":"")+(nova?" ehnovo":"")+'" id="ft_'+esc(f.id)+'">'+
      '<div class="cabeca" style="cursor:default">'+
        (nova ? '<span class="tagnova">NOVA</span>' : '')+
        '<span class="cmeio">'+
          '<span class="cnome">'+esc(f.momento || "Sem momento")+'</span>'+
          '<span class="cinflu">'+
            (f.resp ? esc(f.resp) : "Sem responsável")+
            (f.qtd ? ' · '+f.qtd+(f.qtd===1?" foto":" fotos") : "")+

        // Aqui a .cabeca e uma div, nao um button como no StoryMaker, entao as
        // setas entram direto dentro dela sem precisar de linha separada.
        (podeGerenciar("fotos")
          ? setasHTML("movfoto", f.id, pos > 0, pos < total-1)
          : '')+
      '</div>'+
      '<div class="corpo">'+
        '<div class="stchips">'+
          '<button class="stchip'+(f.enviado?" on":"")+'" data-act="ftenviado" data-id="'+f.id+'">'+

        (seguro

          '<input type="url" inputmode="url" maxlength="600" autocapitalize="off" autocorrect="off" '+
            'spellcheck="false" placeholder="Cole o link do Drive" value="'+esc(link)+'" '+
            'data-act="ftlink" data-id="'+f.id+'">'+
          '<a class="abrir'+(seguro?"":" off")+'" '+(seguro
              ? 'href="'+esc(seguro)+'" target="_blank" rel="noopener noreferrer"'
              : 'href="#" tabindex="-1" aria-disabled="true"')+'>Abrir</a>'+
        '</div>'+
        '<div class="linhaflex">'+
          '<input class="busca" style="flex:1 1 140px" type="text" placeholder="Responsável" '+
            'value="'+esc(f.resp||"")+'" data-act="ftresp" data-id="'+f.id+'">'+
          '<input class="busca" style="flex:0 0 110px" type="number" inputmode="numeric" min="0" '+
            'placeholder="Qtd" value="'+(f.qtd||"")+'" data-act="ftqtd" data-id="'+f.id+'">'+
          (podeApagar("fotos") ? '<button class="btn perigo" data-act="ftdel" data-id="'+f.id+'">Apagar</button>' : '')+

  function renderFotos(){
    var el = $("#view-fotos"); if(!el) return;
    if(!podeVer("fotos")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div></div>';
