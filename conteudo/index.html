  function renderColetivas(){
    var el = $("#view-coletivas");
    if(!podeVer("coletivas")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div>'+
        '<div class="sm">Seu login é de StoryMaker. Use a aba StoryMaker.</div></div>';
      return;
    }
    var i, j, k;
    var edAtual = edicaoPorId(edicaoVista) || edicaoCorrente();
    var gradesDaEd = COLETIVAS.filter(function(g){ return (g.edicao||"moto") === edAtual.id; });
    // Grade da edicao ainda nao digitada no codigo: diz isso, em vez de cair na
    // grade da outra edicao. O fallback mudo pra COLETIVAS[0] fazia a aba abrir
    // na moto sem ninguem entender por que.
    if(!gradesDaEd.length){
      // conta COLETIVAS, nao dias de grade: o outro ramo desta mesma aba conta
      // itens, e os dois numeros apareciam no mesmo botao querendo dizer coisas
      // diferentes (2 dias virava "Moto · 2" onde o normal diz "Moto · 14")
      el.innerHTML = barraEdicaoHTML(contaColetivasDaEdicao) +
        '<div class="vazio"><div class="big">Grade da '+esc(edAtual.rotulo)+' ainda não publicada</div>'+
        '<div class="sm">A agenda oficial de coletivas é digitada no código. Assim que a produção mandar a da auto, ela aparece aqui.</div></div>';
      return;
    }
    var diaAtivo = diaColetivaAtual();
    var grade = null;
    for(i=0;i<gradesDaEd.length;i++){ if(gradesDaEd[i].dia===diaAtivo) grade = gradesDaEd[i]; }
    if(!grade) grade = gradesDaEd[0];
    diaColetiva = grade.dia;

    // junta o estado das 27 pecas do dia pra faixa de numeros do topo
    var doDia = [];
    for(i=0;i<grade.itens.length;i++){
      for(j=0;j<FORMATOS_COLETIVA.length;j++){
        doDia.push(estadoDe(slotId(grade.dia, grade.itens[i].hora, j)) || {});
      }
    }

    var h = barraEdicaoHTML(contaColetivasDaEdicao);
    h += '<div class="subtabs">';
    for(i=0;i<gradesDaEd.length;i++){
      h += '<button class="subtab'+(gradesDaEd[i].dia===diaColetiva?" active":"")+'" data-act="diacol" data-dia="'+gradesDaEd[i].dia+'">'+esc(gradesDaEd[i].rotulo)+'</button>';
    }
    h += '</div>';

    h += painelHTML(contarPainel(doDia), "Peças do dia");

    // texto curto: em tela de celular esse aviso comia 100px antes do primeiro cartao
    h += '<div class="rulebox"><div class="ic">&#9679;</div><div class="tx">'+
      'A grade é a agenda oficial. Você mexe em <b>status, links e impulsionamento</b>. Salva sozinho.'+
      '</div></div>';

    for(i=0;i<grade.itens.length;i++){
      var it = grade.itens[i];
      var pub=0, pecasHtml='';
      for(j=0;j<FORMATOS_COLETIVA.length;j++){
        var id = slotId(grade.dia, it.hora, j);
        var st = estadoDe(id) || {};
        if(st.status === "publicado") pub++;
        pecasHtml += pecaColetivaHTML(id, FORMATOS_COLETIVA[j], st);
      }
      var aberto = !!abertos[grade.dia+"_"+i];
      var completo = pub === FORMATOS_COLETIVA.length;
      h += '<div class="bloco'+(completo?" completo":"")+'">'+
        '<button class="cabeca" data-act="abrircol" data-key="'+grade.dia+'_'+i+'">'+
          '<span class="chora">'+esc(it.hora)+'</span>'+
          // O box vai na linha do influenciador, NAO na do nome da marca. Testei
          // no celular com ele junto da marca: em "BMW Motorrad" e "Fun Motors"
          // o .cnome (nowrap + ellipsis) cortava justo a etiqueta do box, que e o
          // dado mais util do cartao pra quem esta indo gravar. E vem ANTES do
          // nome do influenciador de proposito: se faltar espaco, quem encurta e
          // o nome da pessoa, nao o numero do box.
          '<span class="cmeio"><span class="cnome">'+esc(it.marca)+'</span>'+
          '<span class="cinflu">'+
            (it.local ? '<span class="cbox local">'+esc(it.local)+'</span> '
             : it.box ? '<span class="cbox">Box '+esc(it.box)+'</span> '
                      : '<span class="cbox pend">box a definir</span> ')+
            esc(it.influ)+'</span></span>'+
          '<span class="cprog'+(completo?" ok":"")+'">'+pub+'/'+FORMATOS_COLETIVA.length+'</span>'+
          '<span class="cmais">'+(aberto?"&minus;":"+")+'</span>'+
        '</button>'+
        (aberto ? '<div class="corpo">'+pecasHtml+'</div>' : '')+
      '</div>';
    }
    el.innerHTML = h;
  }

  function pecaColetivaHTML(id, formato, st){
    var i, h='';
    var status = st.status || "";
    h += '<div class="peca">';
    h += '<div class="pnome">'+esc(formato);
    if(st.impulsionar) h += ' <span class="tag boost">Impulsionar</span>';
    h += '</div>';

    h += '<div class="stchips">';
    for(i=0;i<STATUS.length;i++){
      h += '<button class="stchip'+(status===STATUS[i]?" on":"")+'" data-st="'+STATUS[i]+'" '+
           'data-act="stcol" data-id="'+id+'" title="'+esc(ST_LABEL[STATUS[i]])+'">'+esc(ST_CURTO[STATUS[i]])+'</button>';
    }
    h += '</div>';

    h += '<div class="linhaflex">';
    h += '<button class="mini boost'+(st.impulsionar?" on":"")+'" data-act="boostcol" data-id="'+id+'">Impulsionar</button>';
    // o "ja impulsionado" so aparece depois de marcar que VAI impulsionar:
    // sem isso seriam dois botoes concorrentes pra quem nem vai usar mídia paga
    if(st.impulsionar){
      h += '<button class="mini feito'+(st.impulsionado?" on":"")+'" data-act="boostokcol" data-id="'+id+'">'+
           (st.impulsionado ? "&#10003; Impulsionado" : "Já impulsionei")+'</button>';
    }
    for(i=0;i<REDES.length;i++){
      var on = st.redes && st.redes.indexOf(REDES[i].k) >= 0;
      h += '<button class="mini'+(on?" on":"")+'" data-act="redecol" data-id="'+id+'" data-rede="'+REDES[i].k+'">'+esc(REDES[i].n)+'</button>';
    }
    h += '</div>';

    h += campoLink("Pronto", id, "linkPronto", st.linkPronto, "stcol-link", "Link do Drive");
    h += linksDeRedeHTML(id, st, "stcol-link");
    h += '</div>';
    return h;
  }

  // Um campo de link POR REDE MARCADA. Abrir os tres sempre deixaria 9 campos
  // por coletiva na tela; marcando a rede, aparece o campo dela e so.
  function linksDeRedeHTML(id, st, act){
    var i, h = '', marcadas = st.redes || [], achou = false;
    for(i=0;i<REDES.length;i++){
      if(marcadas.indexOf(REDES[i].k) < 0) continue;
      achou = true;
      h += campoLink(REDES[i].n, id, REDES[i].campo, st[REDES[i].campo], act, "Link no "+REDES[i].n);
    }
    if(!achou){
      h += '<div class="dica">Marque acima em qual rede vai publicar e o campo do link dela aparece aqui.</div>';
    }
    // link salvo antes desta mudanca (campo unico): continua visivel pra ninguem perder nada
    if(st.linkPublicado) h += campoLink("No ar", id, "linkPublicado", st.linkPublicado, act, "");
    return h;
  }

  function campoLink(rotulo, id, campo, valor, act, ph){
    var seguro = linkSeguro(valor);
    return '<div class="campo">'+
      '<span class="cl">'+esc(rotulo)+'</span>'+
      // maxlength espelha o teto da regra do Firestore (600). Sem ele o banco
      // recusa a gravacao depois e a pessoa acha que salvou.
      '<input type="url" inputmode="url" maxlength="600" autocapitalize="off" '+
        'autocorrect="off" spellcheck="false" placeholder="'+esc(ph)+'" value="'+esc(valor||"")+'" '+
        'data-act="'+act+'" data-id="'+id+'" data-campo="'+campo+'">'+
      '<a class="abrir'+(seguro?"":" off")+'" '+(seguro?'href="'+esc(seguro)+'" target="_blank" rel="noopener noreferrer"':'href="#" tabindex="-1" aria-disabled="true"')+'>Abrir</a>'+
    '</div>';
  }

  // ═══════════════════════════════════════════════════════════════
  // MODULO 2 — ORGANICOS E PAGOS
  // Lista unica com filtro, como o time pediu (nao dois blocos separados).
  // Ordem dos campos exatamente como fechada no briefing.
  // ═══════════════════════════════════════════════════════════════
  // O QUE A PESSOA DIGITOU E AINDA NAO SALVOU.
  // renderPecas redesenha a secao inteira por innerHTML, e o formulario mora
  // dentro dela. Entao qualquer toque em filtro, em chip de dia ou em cartao
  // apagava a peca inteira que estava sendo escrita, inclusive a legenda, sem
  // aviso nenhum. No celular isso e facil demais de acontecer: a pessoa esbarra
  // num chip com o polegar e perde o texto todo.
  // Guardar o rascunho e melhor que travar os filtros: ninguem fica preso e
  // nada se perde. O rascunho vive so na tela, nao vai pro banco.
  var rascunhoPeca = null;
  var CAMPOS_PECA = ["dia","tipo","marca","formato","tema","referencia","roteiro",
                     "quemGrava","resumo","editor","legenda","horario","status"];

  function guardarRascunho(){
    if(!editandoPeca){ return; }
    var r = null;
    for(var i=0;i<CAMPOS_PECA.length;i++){
      var e = $("#f_" + CAMPOS_PECA[i]);
      if(e){ (r = r || {})[CAMPOS_PECA[i]] = String(e.value || ""); }
    }
    // so troca se realmente havia formulario na tela; senao um redesenho com o
    // form ainda nao montado zeraria o que ja estava guardado
    if(r) rascunhoPeca = r;
  }
  function limparRascunho(){ rascunhoPeca = null; }

  function renderPecas(){
    var el = $("#view-pecas");
    guardarRascunho();
    if(!podeVer("pecas")){
      el.innerHTML = '<div class="vazio"><div class="big">Sem acesso a esta aba</div>'+
        '<div class="sm">Seu login é de StoryMaker. Use a aba StoryMaker.</div></div>';
      return;
    }
    var i, h='';

    // ABRE JA NO NOME DA PESSOA. Quem esta em campo liga o celular pra ver o
    // que e DELA, nao a lista das 27 do time. So liga se ela realmente tiver
    // peca no nome: abrir vazio faria parecer que o sistema perdeu tudo.
    // pecas.length no teste NAO e detalhe: o primeiro desenho da tela acontece
    // ANTES do Firestore responder, com a lista vazia. Sem essa condicao o
    // "abre no meu nome" era decidido contra lista vazia, dava zero, gastava a
    // unica chance e a pessoa caia em "Todas" pra sempre. Peguei no teste com
    // uma peca no nome e a chave abrindo do lado errado.
    if(!padraoMinhasFeito && meuNome && pecas.length){
      padraoMinhasFeito = true;
      if(contarMinhas(pecas) > 0) fMinhas = true;
    }

    // So as pecas da edicao aberta. Sem este recorte a lista, os contadores e o
    // "Mostrando X de Y" misturavam as duas edicoes.
    var pecasDaEd = daEdicaoVista(pecas);
    var vis = pecasDaEd.filter(passaFiltro);
    h += barraEdicaoHTML(function(e){ return daEdicaoVistaDe(pecas, e).length; });
    var cTudo = contarPainel(pecasDaEd);

    h += resumoLinhaHTML(cTudo);
    if(statsAbertas) h += painelHTML(cTudo, "Total");

    // MINHAS / TODAS vira chave de duas posicoes em vez de mais um chip solto.
    // E a escolha que a pessoa mais faz no dia, e estava perdida na quarta
    // posicao da primeira fileira, com a mesma cara dos outros seis filtros.
    h += '<div class="segm">'+
      '<button class="sg'+(fMinhas?" on":"")+'" data-act="segm" data-v="minhas">'+
        'Minhas <span class="sgn">'+contarMinhas(pecasDaEd)+'</span></button>'+
      '<button class="sg'+(fMinhas?"":" on")+'" data-act="segm" data-v="todas">'+
        'Todas <span class="sgn">'+pecasDaEd.length+'</span></button>'+
    '</div>';

    // UMA LINHA SO PRA TUDO QUE E ACAO: buscar, filtrar, criar.
    // A busca era uma caixa larga parada na tela o dia inteiro, e o time quase
    // nunca busca: quando busca, sabe o que quer. Virou lupa. Junto com isso os
    // filtros sairam da propria fileira e vieram pra ca, o que apagou uma faixa
    // inteira antes da lista.
    var nAtivos = filtrosAtivos();
    var temBusca = !!fBusca.trim();
    h += '<div class="acoes1">'+
      '<button class="lupa'+(temBusca?" tem":"")+(buscaAberta?" aberta":"")+'" data-act="abrirbusca"'+
        ' aria-label="Buscar peça" aria-expanded="'+(buscaAberta?"true":"false")+'">'+
        '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"'+
          ' stroke-width="2.1" stroke-linecap="round" aria-hidden="true">'+
          '<circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-4.7-4.7"></path></svg>'+
      '</button>'+
      '<button class="filtrobtn'+(filtrosAbertos?" aberto":"")+'" data-act="abrirfiltros"'+
        ' aria-expanded="'+(filtrosAbertos?"true":"false")+'">'+
        '<span class="fbr">Filtros</span>'+
        (nAtivos ? '<span class="fbn">'+nAtivos+'</span>' : '')+
        '<span class="fbseta">'+(filtrosAbertos?"&minus;":"+")+'</span></button>'+
      (podeGerenciar("pecas") ? '<button class="btn nova" data-act="novapeca">+ Nova peça</button>' : '')+
    '</div>';

    // A caixa aparece aberta tambem quando ha termo digitado: lista filtrada
    // por um campo invisivel e o tipo de coisa que faz a pessoa achar que a
    // peca dela sumiu do sistema.
    if(buscaAberta || temBusca){
      h += '<div class="buscabox">'+
        '<input class="busca" id="buscaPeca" type="search" placeholder="Marca, tema, editor..." value="'+esc(fBusca)+'">'+
        (temBusca ? '<button class="btn ghost" data-act="limparbusca">Limpar</button>' : '')+
      '</div>';
    }

    if(filtrosAbertos){
      h += '<div class="fbox">';
      h += '<div class="fgr">Tipo</div><div class="fchips">';
      h += chip("tipo","todos","Todas", fTipo==="todos");
      h += chip("tipo","organico","Orgânico", fTipo==="organico");
      h += chip("tipo","pago","Pago", fTipo==="pago");
      h += '</div>';
      h += '<div class="fgr">Etapa</div><div class="fchips">';
      h += chip("status","todos","Todas", fStatus==="todos");
      for(i=0;i<STATUS.length;i++) h += chip("status",STATUS[i],ST_LABEL[STATUS[i]], fStatus===STATUS[i]);
      h += '</div>';
      h += '<div class="fgr">Formato</div><div class="fchips">';
      h += chip("formato","todos","Todos", fFormato==="todos");
      for(i=0;i<FORMATOS_FILTRO.length;i++){
        h += chip("formato",FORMATOS_FILTRO[i].k,FORMATOS_FILTRO[i].rot, fFormato===FORMATOS_FILTRO[i].k);
      }
      h += chip("formato","outro","Outro", fFormato==="outro");
      h += '</div>';
      h += '<div class="fgr">Dia</div><div class="fchips">';
      h += chip("dia","todos","Todos", fDia==="todos");
      var diasFiltro = diasPecaDaEdicao(edicaoPorId(edicaoVista));
      for(i=0;i<diasFiltro.length;i++) h += chip("dia",diasFiltro[i].dia,diasFiltro[i].rotulo, fDia===diasFiltro[i].dia);
      h += '</div>';
      h += '<div class="fchips">'+
        '<button class="fchip'+(fBoost?" on":"")+'" data-act="fboost">Só impulsionar</button>'+
        (nAtivos ? '<button class="fchip lim" data-act="limparfiltros">Limpar filtros</button>' : '')+
      '</div></div>';
    }

    if(vis.length !== pecasDaEd.length){
      h += '<div class="nalista">Mostrando <b>'+vis.length+'</b> de '+pecasDaEd.length+' peças</div>';
    }

    if(editandoPeca) h += formPecaHTML();

    if(!vis.length){
      h += '<div class="vazio"><div class="big">'+(pecasDaEd.length ? "Nada com esse filtro" : "Nenhuma peça ainda")+'</div>'+
        '<div class="sm">'+(pecas.length
          ? "Limpe a busca ou escolha outro filtro para ver o resto."
          : "Toque em <b>+ Nova peça</b> para cadastrar o primeiro conteúdo orgânico ou pago.")+'</div></div>';
    } else {
      // ORDEM = QUANDO VAI AO AR, nao quando foi cadastrada.
      // Antes era dia + ordem de cadastro, entao a peca das 15h aparecia antes
      // da de 13h so por ter sido criada primeiro. Quem esta em campo abre a
      // lista pra saber o que e agora, nao quem chegou antes.
      // Sem hora vai pro fim do dia: nao da pra afirmar que e urgente, e chutar
      // 00:00 colocaria ela em cima de tudo.
      vis.sort(function(a,b){
        if((a.dia||"") !== (b.dia||"")) return (a.dia||"") < (b.dia||"") ? -1 : 1;
        var ma = minutosDe(a.horario), mb = minutosDe(b.horario);
        if(ma === null && mb !== null) return 1;
        if(mb === null && ma !== null) return -1;
        if(ma !== null && mb !== null && ma !== mb) return ma - mb;
        return (a.criadoEm||0) - (b.criadoEm||0);
      });
      h += listaPorEtapaHTML(vis);
    }
    el.innerHTML = h;
  }

  function contarMinhas(lista){
    if(!meuNome) return 0;
    var eu = meuNome.toLowerCase(), n = 0;
    for(var i=0;i<lista.length;i++){
      var p = lista[i] || {};
      if(String(p.quemGrava||"").toLowerCase().indexOf(eu) >= 0 ||
         String(p.editor||"").toLowerCase().indexOf(eu) >= 0) n++;
    }
    return n;
  }

  // Minhas/Todas NAO entra na conta: ela tem chave propria na tela, e contar
  // ali faria o botao dizer "Filtros 1" com nenhum filtro escolhido.
  function filtrosAtivos(){
    var n = 0;
    if(fTipo   !== "todos") n++;
    if(fStatus !== "todos") n++;
    if(fDia    !== "todos") n++;
    if(fFormato!== "todos") n++;
    if(fBoost) n++;
    return n;
  }

  function resumoLinhaHTML(c){
    var p = [];
    // atrasada vem PRIMEIRO e em vermelho: e a unica linha do resumo que pede
    // acao agora. O resto e retrato da situacao.
    var nAtraso = 0;
    for(var i=0;i<pecas.length;i++){ if(atrasada(pecas[i])) nAtraso++; }
    // as partes ja entram como HTML pronto e escapado uma a uma; nao da pra
    // escapar o join inteiro, senao a marcacao do atraso viraria texto na tela
    if(nAtraso) p.push('<b class="r1atraso">' + nAtraso +
      (nAtraso === 1 ? " atrasada" : " atrasadas") + '</b>');
    if(c.semStatus) p.push(esc(c.semStatus + " sem status"));
    if(c.gravando)  p.push(esc(c.gravando + " gravando"));
    if(c.edicao)    p.push(esc(c.edicao + " em edição"));
    if(c.pronto)    p.push(esc(c.pronto + (c.pronto === 1 ? " pronta" : " prontas")));
    if(c.publicado) p.push(esc(c.publicado + " no ar"));
    if(!p.length)   p.push("nenhuma cadastrada ainda");
    return '<button class="resumo1'+(statsAbertas?" aberto":"")+'" data-act="abrirstats"'+
      ' aria-expanded="'+(statsAbertas?"true":"false")+'">'+
      '<span class="r1t"><b>'+c.total+'</b> '+(c.total===1?"peça":"peças")+'</span>'+
      '<span class="r1s">'+p.join(" · ")+'</span>'+
      '<span class="r1seta">'+(statsAbertas?"&minus;":"+")+'</span></button>';
  }

  // ORDEM = a fila de producao. O que ainda da trabalho fica em cima; "No ar"
  // e trabalho concluido e comeca fechado, senao 26 publicadas enterrariam as
  // 3 que ainda precisam de alguem.
  var ETAPAS = [
    { k:"",          rot:"Não começou" },
    { k:"gravando",  rot:"Gravando" },
    { k:"edicao",    rot:"Em edição" },
    { k:"pronto",    rot:"Pronto para subir" },
    { k:"publicado", rot:"No ar" }
  ];

  function listaPorEtapaHTML(vis){
    var h = "", i, j;
    for(i=0;i<ETAPAS.length;i++){
      var et = ETAPAS[i], chave = et.k || "sem";
      var doGrupo = vis.filter(function(p){ return (p.status||"") === et.k; });
      // grupo vazio nao vira cabecalho: linha de titulo sem nada embaixo so
      // ocupa tela e faz a pessoa achar que perdeu alguma coisa
      if(!doGrupo.length) continue;
      var fechado = !!etapaFechada[chave];
      h += '<button class="etapa'+(fechado?" fechada":"")+'" data-act="etapa" data-etapa="'+chave+'"'+
             (et.k ? ' data-st="'+et.k+'"' : '')+' aria-expanded="'+(fechado?"false":"true")+'">'+
             '<span class="etp"></span>'+
             '<span class="etr">'+esc(et.rot)+'</span>'+
             '<span class="etn">'+doGrupo.length+'</span>'+
             '<span class="etseta">'+(fechado?"+":"&minus;")+'</span>'+
           '</button>';
      if(fechado) continue;
      for(j=0;j<doGrupo.length;j++) h += blocoPecaHTML(doGrupo[j]);
    }
    return h;
  }

  function chip(grupo, valor, rotulo, on){
    return '<button class="fchip'+(on?" on":"")+'" data-act="filtro" data-grupo="'+grupo+'" data-valor="'+esc(valor)+'">'+esc(rotulo)+'</button>';
  }

  function passaFiltro(p){
    if(fTipo   !== "todos" && p.tipo   !== fTipo)   return false;
    if(fStatus !== "todos" && p.status !== fStatus) return false;
    if(fDia    !== "todos" && p.dia    !== fDia)    return false;
    if(fFormato!== "todos" && grupoDoFormato(p.formato) !== fFormato) return false;
    if(fBoost && !p.impulsionar) return false;
    if(fMinhas && meuNome){
      var eu = meuNome.toLowerCase();
      if(String(p.quemGrava||"").toLowerCase().indexOf(eu) < 0 &&
         String(p.editor||"").toLowerCase().indexOf(eu) < 0) return false;
    }
    var q = fBusca.trim().toLowerCase();
    if(q){
      var alvo = [p.marca,p.tema,p.formato,p.editor,p.quemGrava,p.referencia,p.roteiro,p.resumo,p.legenda]
        .join(" ").toLowerCase();
      if(alvo.indexOf(q) < 0) return false;
    }
    return true;
  }

  // ═══════════════════════════════════════════════════════════════
  // HORA DA PECA
  // O campo era texto livre com exemplo "19h30", e o time digitou "13:00".
  // Os dois formatos convivem no banco, entao qualquer coisa que dependa da
  // hora (ordem, atraso) precisa entender os dois. Le "13:00", "13h30", "13h",
  // "1330" e "9h5". Devolve minutos desde a meia-noite, ou null quando nao da
  // pra ter certeza: chutar 00:00 jogaria a peca pro topo da fila como se
  // fosse a mais urgente do dia.
  // ═══════════════════════════════════════════════════════════════
  function minutosDe(horario){
    var s = String(horario || "").trim();
    if(!s) return null;
    var m = s.match(/^(\d{1,2})\s*[:hH]\s*(\d{1,2})?/);
    if(!m){
      m = s.match(/^(\d{2})(\d{2})$/);        // "1330"
      if(!m) return null;
      return parseInt(m[1],10)*60 + parseInt(m[2],10);
    }
    var hh = parseInt(m[1],10), mm = m[2] ? parseInt(m[2],10) : 0;
    if(isNaN(hh) || hh > 23 || mm > 59) return null;
    return hh*60 + mm;
  }

  // Sempre HH:MM na tela, venha como vier do banco.
  function horaBonita(horario){
    var min = minutosDe(horario);
    if(min === null) return String(horario || "").trim();
    return ("0"+Math.floor(min/60)).slice(-2) + ":" + ("0"+(min%60)).slice(-2);
  }

  // Passou da hora e ainda nao esta no ar. E ESTE o sinal de prioridade que o
  // time precisa: a ordem por horario ja bota o mais proximo em cima, mas quem
  // esta em cima nao necessariamente esta atrasado.
  // Momento exato em que a peca deveria ir ao ar. Monto com new Date(ano, mes,
  // dia, h, m) em vez de new Date("2026-08-14T13:00") porque a string com T e
  // interpretada como UTC por alguns navegadores, e o time todo estaria vendo
  // "3h atrasada" no lugar de "no horario".
  function quandoVaiAoAr(p){
    var min = minutosDe(p && p.horario);
    if(min === null || !p.dia) return null;
    var d = String(p.dia).split("-");
    if(d.length !== 3) return null;
    var q = new Date(+d[0], +d[1]-1, +d[2], Math.floor(min/60), min%60, 0, 0);
    return isNaN(q.getTime()) ? null : q;
  }

  function atrasada(p){
    if(!p || p.status === "publicado") return false;
    var q = quandoVaiAoAr(p);
    return !!q && q.getTime() < Date.now();
  }

  // "2h atrasada", "em 40 min", "em 4h". O time esta correndo pelo autodromo e
  // nao vai comparar "13:00" com o relogio do celular pra descobrir se ja
  // passou. Peca publicada nao mostra nada: ja foi, tempo perdeu a graca.
  function faltaQuanto(p){
    var vazio = { texto:"", nivel:"" };
    if(!p || p.status === "publicado") return vazio;
    var q = quandoVaiAoAr(p);
    if(!q) return vazio;

    var diff = Math.round((q.getTime() - Date.now()) / 60000);   // em minutos
    var abs = Math.abs(diff);

    if(abs <= 1) return { texto:"agora", nivel:"perto" };

    // ATRASO LONGO FALA A DATA, NAO A DURACAO.
    // A primeira versao mostrava "19h30 atrasada" pra uma peca de ontem as 16h.
    // Esta certo na conta e horrivel de ler: parece o HORARIO 19:30, ainda mais
    // numa tela onde tudo mais e "13:00". Passando de 12h a pessoa nao quer a
    // conta, quer saber de quando era.
    if(diff < 0 && abs >= 12*60){
      return { texto:"atrasada de " + rotuloDia(p.dia).replace(/^\S+\s/,""),
               nivel:"atraso" };
    }

    var txt;
    if(abs < 60){
      txt = abs + " min";
    } else {
      var hh = Math.floor(abs/60), mm = abs%60;
      txt = hh + "h" + (mm ? ("0"+mm).slice(-2) : "");
    }

    if(diff < 0)   return { texto:txt + " atrasada", nivel:"atraso" };
    if(diff <= 60) return { texto:"em " + txt,       nivel:"perto"  };
    return           { texto:"em " + txt,            nivel:""       };
  }

  function rotuloDia(d){
    for(var i=0;i<DIAS_STORY.length;i++){ if(DIAS_STORY[i].dia===d) return DIAS_STORY[i].rotulo; }
    return d ? d.slice(8)+"/"+d.slice(5,7) : "—";
  }

  // Quem gravou e quem edita ficam VISIVEIS no cartao fechado. Com dezenas de
  // pecas, o fotografo e o editor tem que bater o olho e achar a dele sem abrir

  // ficha e por onde passam Referencia, Roteiro, Resumo, Editor e afins. Ligar
