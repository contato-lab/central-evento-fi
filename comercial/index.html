  /* O app.css e o CSS compilado do app original (Tailwind). Aqui so entra o que
     no original vinha de biblioteca em tempo de execucao: toasts (sonner),
     posicao do menu de selecao e trava de rolagem do dialogo. */
  .toaster{position:fixed;top:24px;right:24px;z-index:999999;display:flex;flex-direction:column;gap:14px;width:356px;max-width:calc(100vw - 32px);pointer-events:none}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:16px;border-radius:8px;border:1px solid;font-size:13px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.1);font-family:inherit;animation:toast-in .35s cubic-bezier(.21,1.02,.73,1)}
  .toast svg{width:20px;height:20px;flex-shrink:0}
  .toast.sucesso{background:#ecfdf3;color:#008a2e;border-color:#bffcd9}
  .toast.erro{background:#fff0f0;color:#e60000;border-color:#ffe0e1}
  .toast.saindo{opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
  @keyframes toast-in{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
  @media (max-width:600px){.toaster{top:16px;right:16px;left:16px;width:auto}}
  .menu-selecao{position:fixed}
  body.dialogo-aberto{overflow:hidden}
  /* classes que o app original nao usava e por isso nao estao no app.css */
  .overflow-x-auto{overflow-x:auto}
  .justify-end{justify-content:flex-end}
  .h-64{height:16rem}
  .bg-destructive\/10{background-color:color-mix(in oklab,var(--destructive) 10%,transparent)}
  @media (min-width:640px){.sm\:p-3{padding:.75rem}}
  /* mapa de espacos: cores por status, mesmas dos selos da lista */
  .mapa-svg{display:block;width:100%;min-width:1100px;height:auto;font-family:inherit}
  .mapa-svg .zona{fill:var(--muted);stroke:var(--border)}
  .mapa-svg .cel{cursor:pointer}
  .mapa-svg .cel rect{stroke-width:1.5;transition:opacity .15s}
  .mapa-svg .cel:hover rect,.mapa-svg .cel:focus-visible rect{opacity:.8}
  .mapa-svg .cel:focus-visible{outline:none}
  .mapa-svg .cel:focus-visible rect{stroke:var(--ring);stroke-width:3}
  .mapa-svg .st-disponivel rect{fill:color-mix(in oklab,var(--success) 16%,white);stroke:var(--success)}
  .mapa-svg .st-reservado rect{fill:color-mix(in oklab,var(--warning) 45%,white);stroke:var(--warning-foreground)}
  .mapa-svg .st-vendido rect{fill:var(--foreground);stroke:var(--foreground)}
  .mapa-svg .st-vendido text{fill:var(--background)}
  .mapa-svg .st-nenhum rect{fill:var(--card);stroke:var(--border);stroke-dasharray:3 2}
  .mapa-svg .st-nenhum text{fill:var(--muted-foreground)}
  .mapa-svg .risco rect{stroke:var(--destructive);stroke-width:2.5;stroke-dasharray:4 2}
  .mapa-svg text{fill:var(--foreground);pointer-events:none}
  .mapa-svg .t-cod{font-weight:800;font-size:11px}
  .mapa-svg .t-rot{font-size:9px}
  .mapa-svg .t-m2{font-size:8px;opacity:.75}
  .mapa-svg .t-zona{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .mapa-svg .t-nota{font-size:10px;fill:var(--muted-foreground)}
</style>
</head>

function icone(nome, cls) {
  return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide ' + (cls || "") + '" aria-hidden="true">' + ICONES[nome] + "</svg>";
}

/* ---------------------------------------------------------------- utilidades */
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
// O original junta classes com tailwind-merge (a ultima classe conflitante vence,
// ex.: "h-9 ... h-11" vira so "h-11"). Mesma biblioteca e versao aqui.
var twMerge = null;
try { twMerge = (await import("https://cdn.jsdelivr.net/npm/tailwind-merge@3.6.0/+esm")).twMerge; } catch (e) {}
function cn() {
  var s = Array.prototype.filter.call(arguments, Boolean).join(" ");
  return twMerge ? twMerge(s) : s;
}
function agoraIso() { return new Date().toISOString(); }
function novoId() {
  return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
}
function formatCurrency(value) {
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }).format(value);
}
function formatDateTime(value) {
  return new Intl.DateTimeFormat("pt-BR", { dateStyle: "medium", timeStyle: "short", timeZone: "America/Sao_Paulo" }).format(new Date(value));
}
function formatDateOnly(value) {
  // Datas de vencimento chegam como "AAAA-MM-DD"; montar ao meio-dia evita virar o dia por fuso.
  return new Intl.DateTimeFormat("pt-BR", { dateStyle: "medium", timeZone: "America/Sao_Paulo" }).format(new Date(value + "T12:00:00-03:00"));
}
function hojeMais(dias) {
  var hoje = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  var d = new Date(hoje + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + dias);
  return d.toISOString().slice(0, 10);
}
function porNome(a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); }
function porDataDesc(a, b) { return new Date(b.data) - new Date(a.data); }

/* ------------------------------------------------------------------ toasts */
function toast(tipo, texto) {
  var el = document.createElement("div");
  el.className = "toast " + (tipo === "success" ? "sucesso" : "erro");
  el.setAttribute("role", "status");
  var svg = tipo === "success"
    ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/></svg>'
    : '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>';
  el.innerHTML = svg + "<span>" + esc(texto) + "</span>";
  var box = document.getElementById("toasts");
  box.prepend(el);
  setTimeout(function () { el.classList.add("saindo"); setTimeout(function () { el.remove(); }, 260); }, 4000);
}
toast.success = function (t) { toast("success", t); };
toast.error = function (t) { toast("error", t); };

/* ----------------------------------------------------------- backend (Firebase) */
var API = null;

async function criarApiFirebase() {
  var appMod = await import(SDK + "firebase-app.js");
  var authMod = await import(SDK + "firebase-auth.js");
  var fsMod = await import(SDK + "firebase-firestore.js");
  var app = appMod.initializeApp(FIREBASE_CONFIG);
  var auth = authMod.getAuth(app);
  auth.languageCode = "pt-BR";
  var db = fsMod.getFirestore(app);
  var modeloIa = null;

  async function listar(col) {
    var snap = await fsMod.getDocs(fsMod.collection(db, col));
    return snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
  }

  return {
    aoMudarLogin: function (cb) { return authMod.onAuthStateChanged(auth, cb); },
    usuario: function () { return auth.currentUser; },
    entrar: async function (email, senha) {
      var cred = await authMod.signInWithEmailAndPassword(auth, email, senha);
      if (!cred.user.emailVerified) {
        await authMod.signOut(auth);
        var e = new Error("email-nao-confirmado");
        e.code = "email-nao-confirmado";
        throw e;
      }
      return cred.user;
    },
    criarConta: async function (nome, email, senha) {
      var cred = await authMod.createUserWithEmailAndPassword(auth, email, senha);
      try { await authMod.updateProfile(cred.user, { displayName: nome }); } catch (e) {}
      try {
        await fsMod.setDoc(fsMod.doc(db, "profiles", cred.user.uid), { nome: nome, created_at: agoraIso(), updated_at: agoraIso() });
      } catch (e) {}
      await authMod.sendEmailVerification(cred.user, { url: URL_APP });
      await authMod.signOut(auth);
      return { confirmar: true };
    },
    sair: function () { return authMod.signOut(auth); },
    nomePerfil: async function (user) {
      try {
        var s = await fsMod.getDoc(fsMod.doc(db, "profiles", user.uid));
        if (s.exists() && s.data().nome) return s.data().nome;
      } catch (e) {}
      return user.displayName || (user.email ? user.email.split("@")[0] : "Usuário");
    },
    listar: listar,
    criar: async function (col, dados, idFixo) {
      var id = idFixo || novoId();
      var agora = agoraIso();
      var doc = Object.assign({}, dados, { criado_por: auth.currentUser.uid, created_at: agora, updated_at: agora });
      await fsMod.setDoc(fsMod.doc(db, col, id), doc);
      return Object.assign({}, doc, { id: id });
    },
    atualizar: async function (col, id, dados) {
      await fsMod.updateDoc(fsMod.doc(db, col, id), Object.assign({}, dados, { updated_at: agoraIso() }));
    },
    atualizarVarios: async function (lista) {
      if (!lista.length) return;
      var lote = fsMod.writeBatch(db);
      var agora = agoraIso();
      lista.forEach(function (it) { lote.update(fsMod.doc(db, it.col, it.id), Object.assign({}, it.dados, { updated_at: agora })); });
      await lote.commit();
    },
    gerarTexto: async function (sistema, prompt) {
      if (!modeloIa) {
        var aiMod = await import(SDK + "firebase-ai.js");
        var ai = aiMod.getAI(app, { backend: new aiMod.GoogleAIBackend() });
        modeloIa = aiMod.getGenerativeModel(ai, { model: MODELO_IA, systemInstruction: sistema });
      }
      var r = await modeloIa.generateContent(prompt);
      return r.response.text();
    },
  };
}

/* Banco de mentira so para conferir as telas em localhost (?teste=1). */
async function criarApiTeste() {
  var semente = await (await fetch("../seed.json")).json();
  var dados = { espacos: semente.espacos, patrocinadores: semente.patrocinadores, interacoes: semente.interacoes };
  // espacos do mapa, com status variados so para enxergar o desenho
  todosEspacos().forEach(function (e, i) {
    var st = i % 7 === 0 ? "reservado" : (i % 3 === 0 ? "vendido" : "disponivel");
    if (i % 11 === 0) return; // alguns ficam sem cadastro, para ver o estado "sem cadastro"
    dados.espacos.push(Object.assign({}, e, { id: e.mapa, status: st, criado_por: "teste", created_at: agoraIso(), updated_at: agoraIso() }));
  });
  dados.patrocinadores[2].espaco_vinculado_id = "moto:box:07"; // Nexo Motors (em risco) aponta para um box do mapa
  var ouvinte = null;
  var user = { uid: "teste", email: "eric@teste.local", displayName: "Eric Pereira Felix", emailVerified: true };
  var logado = !/[?&]deslogado=1/.test(location.search);
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  return {
    aoMudarLogin: function (cb) { ouvinte = cb; setTimeout(function () { cb(logado ? user : null); }, 300); return function () {}; },
    usuario: function () { return logado ? user : null; },
    entrar: async function () { await espera(400); logado = true; ouvinte(user); return user; },
    criarConta: async function () { await espera(400); return { confirmar: true }; },
    sair: async function () { logado = false; ouvinte(null); },
    nomePerfil: async function () { return "Eric Pereira Felix"; },
    listar: async function (col) { await espera(700); return JSON.parse(JSON.stringify(dados[col])); },
    criar: async function (col, d, idFixo) { await espera(300); var doc = Object.assign({}, d, { id: idFixo || novoId(), criado_por: "teste", created_at: agoraIso(), updated_at: agoraIso() }); dados[col].push(doc); return doc; },
    atualizar: async function (col, id, d) { await espera(300); var it = dados[col].find(function (x) { return x.id === id; }); Object.assign(it, d, { updated_at: agoraIso() }); },
    atualizarVarios: async function (lista) { lista.forEach(function (it) { var x = dados[it.col].find(function (y) { return y.id === it.id; }); Object.assign(x, it.dados); }); },
    gerarTexto: async function () { await espera(900); return "Ligar para o contato até sexta, 18/09, e confirmar a proposta revisada."; },
  };
}

/* ------------------------------------------------------ regras de negocio */
var ERRO_ESPACOS = "Não foi possível carregar os espaços.";

// Equivale ao atualizar_contratos_em_risco() do banco original.
async function aplicarRegraContratos() {
  var limite = hojeMais(30);
  var patrocinadores = await API.listar("patrocinadores");
  var espacos = await API.listar("espacos");
  var mudancas = [];
  var emRisco = {};
  patrocinadores.forEach(function (p) {
    var vence = p.data_vencimento_contrato && p.data_vencimento_contrato <= limite;
    if (p.status !== "encerrado" && vence && p.status !== "em_risco_de_renovacao") {
      mudancas.push({ col: "patrocinadores", id: p.id, dados: { status: "em_risco_de_renovacao" } });
      p.status = "em_risco_de_renovacao";
    }
    if (p.status === "em_risco_de_renovacao" && vence && p.espaco_vinculado_id) emRisco[p.espaco_vinculado_id] = true;
  });
  espacos.forEach(function (e) {
    if (emRisco[e.id] && e.status !== "disponivel") mudancas.push({ col: "espacos", id: e.id, dados: { status: "disponivel" } });
  });
  await API.atualizarVarios(mudancas);
}

async function getSpaces() {
  var r;
  try { r = await Promise.all([API.listar("espacos"), API.listar("patrocinadores")]); }
  catch (e) { throw new Error(ERRO_ESPACOS); }
  var risco = {}, vinculado = {};
  r[1].forEach(function (s) {
    if (!s.espaco_vinculado_id) return;
    if (s.status !== "encerrado" || !vinculado[s.espaco_vinculado_id]) vinculado[s.espaco_vinculado_id] = { nome: s.nome, status: s.status };
    if (s.status === "em_risco_de_renovacao") risco[s.espaco_vinculado_id] = s.nome;
  });
  return r[0].sort(porNome).map(function (space) {
    return {
      id: space.id, nome: space.nome, categoria: space.categoria, valor: Number(space.valor), status: space.status, updated_at: space.updated_at,
      patrocinadorEmRisco: space.status === "disponivel" ? (risco[space.id] || null) : null,
      patrocinador: vinculado[space.id] || null,
      mapa: space.mapa || null, edicao: space.edicao || null, zona: space.zona || null, codigo: space.codigo || null, tipo: space.tipo || null,
      metragem: space.metragem == null ? null : Number(space.metragem),
      ocupante2026: space.ocupante_2026 || "",
    };
  });
}

async function getSpacesOverview() {
  var r;
  try { r = await Promise.all([API.listar("patrocinadores"), API.listar("espacos"), API.listar("interacoes")]); }
  catch (e) { throw new Error("Não foi possível calcular os indicadores."); }
  var nomes = {};
  r[0].forEach(function (p) { nomes[p.id] = p.nome; });
  return {
    patrocinadoresEmRisco: r[0].filter(function (p) { return p.status === "em_risco_de_renovacao"; }).length,
    espacosDisponiveis: r[1].filter(function (e) { return e.status === "disponivel"; }).length,
    patrocinadoresAtivos: r[0].filter(function (p) { return p.status === "ativo"; }).length,
    atividadeRecente: r[2].sort(porDataDesc).slice(0, 10).map(function (i) {
      return { id: i.id, data: i.data, observacao: i.observacao, patrocinador: nomes[i.patrocinador_id] || "Patrocinador" };
    }),
  };
}

async function saveSpace(data) {
  var nome = String(data.nome || "").trim();
  var categoria = String(data.categoria || "").trim();
  var ok = nome.length >= 1 && nome.length <= 120 && categoria.length >= 1 && categoria.length <= 120 &&
    isFinite(data.valor) && data.valor >= 0 && ["disponivel", "reservado", "vendido"].indexOf(data.status) >= 0;
  if (!ok) throw new Error("Não foi possível salvar o espaço.");
  var payload = { nome: nome, categoria: categoria, valor: data.valor, status: data.status,
    metragem: data.metragem == null || !isFinite(data.metragem) ? null : data.metragem,
    ocupante_2026: String(data.ocupante2026 || "").trim().slice(0, 120) };
  if (!data.id && data.mapa) {
    // espaco criado a partir do mapa: guarda a posicao para o desenho achar o documento
    payload.mapa = data.mapa; payload.edicao = data.edicao; payload.zona = data.zona; payload.codigo = data.codigo; payload.tipo = data.tipo;
  }
  try {
    if (data.id) await API.atualizar("espacos", data.id, payload);
    else await API.criar("espacos", payload, data.mapa || null);
  } catch (e) { throw new Error("Não foi possível salvar o espaço."); }
}

async function getSponsors() {
  var r;

  var espacos = {};
  r[1].forEach(function (e) { espacos[e.id] = e.nome; });
  return r[0].sort(porNome).map(function (s) {

      dataVencimentoContrato: s.data_vencimento_contrato, status: s.status,

async function getInteractions() {
  var r;
  try { r = await Promise.all([API.listar("interacoes"), API.listar("patrocinadores")]); }
  catch (e) { throw new Error("Não foi possível carregar as interações."); }
  var nomes = {};
  r[1].forEach(function (p) { nomes[p.id] = p.nome; });
  return r[0].sort(porDataDesc).map(function (i) {
    return { id: i.id, data: i.data, observacao: i.observacao, proximoPasso: i.proximo_passo, patrocinadorId: i.patrocinador_id, patrocinador: nomes[i.patrocinador_id] || "Patrocinador" };
  });

async function suggestNextStep(interactionId) {
  var todas, patrocinadores;
  try { var r = await Promise.all([API.listar("interacoes"), API.listar("patrocinadores")]); todas = r[0]; patrocinadores = r[1]; }
  catch (e) { throw new Error("Interação não encontrada."); }
  var current = todas.find(function (i) { return i.id === interactionId; });
  if (!current) throw new Error("Interação não encontrada.");
  var sponsor = patrocinadores.find(function (p) { return p.id === current.patrocinador_id; });
  var previous = todas
    .filter(function (i) { return i.patrocinador_id === current.patrocinador_id && new Date(i.data) < new Date(current.data); })
    .sort(porDataDesc).slice(0, 8);
  var history = previous.length
    ? previous.map(function (item) {
        return new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo" }).format(new Date(item.data)) +
          " — Observação: " + item.observacao + "\nPróximo passo registrado: " + item.proximo_passo;
      }).join("\n\n")
    : "Não há interações anteriores.";
  var system = "Você é um assistente de vendas do Festival Interlagos. Sugira somente um próximo passo comercial em português do Brasil, curto, direto, prático e acionável. Não use título, lista, saudação ou explicação. Não invente fatos.";
  var prompt = "Patrocinador: " + ((sponsor && sponsor.nome) || "Patrocinador") + "\n\nObservação atual:\n" + current.observacao +
    "\n\nHistórico anterior, do mais recente para o mais antigo:\n" + history;
  var suggestion;
  try { suggestion = String((await API.gerarTexto(system, prompt)) || "").trim(); }
  catch (e) { throw new Error("Não foi possível gerar a sugestão."); }
  if (!suggestion) throw new Error("A IA não retornou uma sugestão.");
  var shortSuggestion = suggestion.slice(0, 500);
  try { await API.atualizar("interacoes", current.id, { proximo_passo: shortSuggestion }); }
  catch (e) { throw new Error("A sugestão foi criada, mas não pôde ser salva."); }
  return { suggestion: shortSuggestion };
}

function rotaAtual() {
  var h = location.hash.replace(/^#/, "") || "/";
  var partes = h.split("?");
  var params = new URLSearchParams(partes[1] || "");
  return { caminho: partes[0], params: params };
}
function irPara(caminho, substituir) {
  var alvo = "#" + caminho;
  if (substituir) history.replaceState(null, "", alvo); else location.hash = alvo;
  render();
}
function trocarParametro(nome, valor) {
  var r = rotaAtual();
  if (valor) r.params.set(nome, valor); else r.params.delete(nome);
  var q = r.params.toString();
  history.replaceState(null, "", "#" + r.caminho + (q ? "?" + q : ""));
}

  var filtered = S.spaces.filter(function (space) {

    var texto = [space.nome, space.ocupante2026, space.patrocinador && space.patrocinador.nome, space.codigo].join(" ").toLocaleLowerCase("pt-BR");
    return (f.filter === "todos" || space.status === f.filter) && (!term || texto.indexOf(term) >= 0);
  }).sort(function (a, b) { return (a.mapa ? 0 : 1) - (b.mapa ? 0 : 1) || porNome(a, b); });
  if (!filtered.length) return emptyList("building-2", "Nenhum espaço encontrado", "Ajuste a busca ou o filtro de status.");
  var linhas = filtered.map(function (space) {
    return '<tr class="' + cn(TR, space.patrocinadorEmRisco && "bg-primary/8 hover:bg-primary/12") + '">' +
      '<td class="' + cn(TD, "px-5 py-4 font-bold") + '">' + esc(space.nome) + (space.patrocinadorEmRisco ? riskNote(space.patrocinadorEmRisco) : "") + "</td>" +
      '<td class="' + cn(TD, "whitespace-nowrap") + '">' + esc(rotuloLocal(space)) + "</td>" +
      '<td class="' + TD + '">' + esc(space.categoria) + "</td>" +
      '<td class="' + TD + '">' + (space.patrocinador ? esc(space.patrocinador.nome) : (space.ocupante2026 ? '<span class="text-muted-foreground">2026: ' + esc(space.ocupante2026) + "</span>" : '<span class="text-muted-foreground">Vazio</span>')) + "</td>" +
      '<td class="' + cn(TD, "font-semibold whitespace-nowrap") + '">' + (space.valor ? esc(formatCurrency(space.valor)) : '<span class="text-muted-foreground">A definir</span>') + "</td>" +
      '<td class="' + TD + '">' + statusSelect(space, S.statusMudando) + "</td>" +
      '<td class="' + TD + '"><button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar ' + esc(space.nome) + '" title="Editar espaço" data-acao="editar" data-id="' + esc(space.id) + '">' + icone("pencil") + "</button></td></tr>";
  }).join("");
  var cards = filtered.map(function (space) {
    return '<article class="' + cn("border border-border bg-card p-4", space.patrocinadorEmRisco && "border-primary bg-primary/8") + '">' +
      '<div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="break-words font-bold">' + esc(space.nome) + "</h2>" +
      '<p class="mt-1 text-sm text-muted-foreground">' + esc(rotuloLocal(space)) + " · " + esc(space.categoria) + "</p>" +
      (space.patrocinador ? '<p class="mt-1 text-sm font-semibold">' + esc(space.patrocinador.nome) + "</p>" : (space.ocupante2026 ? '<p class="mt-1 text-sm text-muted-foreground">2026: ' + esc(space.ocupante2026) + "</p>" : "")) + "</div>" +
      '<button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar ' + esc(space.nome) + '" data-acao="editar" data-id="' + esc(space.id) + '">' + icone("pencil") + "</button></div>" +
      (space.patrocinadorEmRisco ? riskNote(space.patrocinadorEmRisco) : "") +
      '<div class="mt-5 flex items-end justify-between gap-4 border-t border-border pt-4"><div><span class="block text-xs font-bold uppercase text-muted-foreground">Valor</span>' +
      '<span class="mt-1 block font-bold">' + (space.valor ? esc(formatCurrency(space.valor)) : '<span class="text-muted-foreground">A definir</span>') + "</span></div>" +
      '<div class="w-44">' + statusSelect(space, S.statusMudando) + "</div></div></article>";
  }).join("");
  var th = function (cls, txt) { return '<th class="' + cn(TH, cls) + '">' + txt + "</th>"; };
  return '<div class="hidden overflow-hidden border border-border bg-card md:block"><div class="relative w-full overflow-auto"><table class="w-full caption-bottom text-sm">' +
    '<thead class="[&_tr]:border-b bg-foreground text-background"><tr class="' + cn(TR, "hover:bg-foreground") + '">' +
      th("px-5 text-xs font-bold uppercase text-background", "Espaço") + th("text-xs font-bold uppercase text-background", "Local") +
      th("text-xs font-bold uppercase text-background", "Categoria") + th("text-xs font-bold uppercase text-background", "Marca") +
      th("text-xs font-bold uppercase text-background", "Valor") + th("text-xs font-bold uppercase text-background", "Status") +
      th("w-14", '<span class="sr-only">Editar</span>') +
    '</tr></thead><tbody class="[&_tr:last-child]:border-0">' + linhas + "</tbody></table></div></div>" +
    '<div class="grid gap-3 md:hidden">' + cards + "</div>";
}


/* ---------------------------------------------------------- mapa de espacos */
function edicaoAtual() {
  var e = rotaAtual().params.get("edicao");
  return EDICOES.some(function (x) { return x.id === e; }) ? e : EDICOES[0].id;
}
function espacosPorChave() {
  var m = {};
  (S.spaces || []).forEach(function (sp) { if (sp.mapa) m[sp.mapa] = sp; });
  return m;
}
function zonaInfo(id) { return ZONAS.find(function (z) { return z.id === id; }) || { id: id, titulo: id }; }
function rotuloLocal(sp) {
  if (!sp.mapa) return "Sem posição no mapa";
  var ed = EDICOES.find(function (e) { return e.id === sp.edicao; });
  return zonaInfo(sp.zona).titulo.split(" · ")[0] + " " + sp.codigo + (ed ? " · " + ed.curto : "");
}
function truncar(txt, max) {
  txt = String(txt || "");
  return txt.length > max ? txt.slice(0, Math.max(1, max - 1)) + "…" : txt;
}
function escXml(v) { return esc(v); }

// Desenha a edicao inteira em SVG: zonas empilhadas, cada espaco e uma celula clicavel.
function desenharMapa(edicao) {
  var W = 1240, PAD = 16, GAP = 6, y = PAD;
  var porChave = espacosPorChave();
  var partes = [];
  var zonas = MAPA[edicao] || {};
  ZONAS.forEach(function (zona) {
    var itens = zonas[zona.id];
    if (!itens || !itens.length) return;
    var x = PAD + 12, linhaY = y + 40, alturaLinha = 0, cont = { disponivel: 0, reservado: 0, vendido: 0, nenhum: 0 };
    var celulas = [];
    itens.forEach(function (item) {
      var t = TIPOS[item.tipo];
      if (x + t.w > W - PAD - 12) { x = PAD + 12; linhaY += alturaLinha + GAP; alturaLinha = 0; }
      var chave = chaveMapa(edicao, zona.id, item.codigo);
      var doc = porChave[chave];
      var st = doc ? doc.status : "nenhum";
      cont[st] = (cont[st] || 0) + 1;
      var risco = doc && doc.patrocinadorEmRisco;
      var patro = doc && doc.patrocinador ? doc.patrocinador.nome : "";
      var ocupante = (doc ? doc.ocupante2026 : item.ocupante) || "";
      var nome = doc ? doc.nome : nomeEspaco(edicao, zona.id, item);
      var maxChars = Math.max(4, Math.floor((t.w - 8) / 5.4));
      var rot = patro || ocupante;
      var tit = nome + "\n" + (doc ? STATUS_ESPACO[doc.status].label : "Sem cadastro") +
        (patro ? "\nPatrocinador: " + patro : "") + (ocupante ? "\nOcupante 2026: " + ocupante : "") +
        (item.m2 ? "\n" + item.m2 + " m²" : "") + (risco ? "\nRisco de renovação: " + risco : "");
      celulas.push(
        '<g class="cel st-' + st + (risco ? " risco" : "") + '" data-acao="mapa-espaco" data-mapa="' + escXml(chave) + '" role="button" tabindex="0" aria-label="' + escXml(nome) + '">' +
          "<title>" + escXml(tit) + "</title>" +
          '<rect x="' + x + '" y="' + linhaY + '" width="' + t.w + '" height="' + t.h + '" rx="4"/>' +
          '<text class="t-cod" x="' + (x + 5) + '" y="' + (linhaY + 14) + '">' + escXml(item.rotulo && t.w >= 88 ? truncar(item.rotulo, maxChars) : item.codigo) + "</text>" +
          (rot ? '<text class="t-rot" x="' + (x + 5) + '" y="' + (linhaY + 27) + '">' + escXml(truncar(rot, maxChars)) + "</text>" : "") +
          (item.m2 && t.h >= 54 ? '<text class="t-m2" x="' + (x + 5) + '" y="' + (linhaY + t.h - 6) + '">' + escXml(item.m2 + " m²") + "</text>" : "") +
        "</g>");
      x += t.w + GAP;
      if (t.h > alturaLinha) alturaLinha = t.h;
    });
    var alturaZona = (linhaY + alturaLinha + 12) - y;
    var resumo = [
      cont.disponivel + " disp.", cont.reservado + " res.", cont.vendido + " vend.",
    ].concat(cont.nenhum ? [cont.nenhum + " sem cadastro"] : []).join(" · ");
    partes.push(
      '<g><rect class="zona" x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + alturaZona + '" rx="8"/>' +
      '<text class="t-zona" x="' + (PAD + 12) + '" y="' + (y + 20) + '">' + escXml(zona.titulo) + "</text>" +
      '<text class="t-nota" x="' + (PAD + 12) + '" y="' + (y + 32) + '">' + escXml(zona.nota || "") + "</text>" +
      '<text class="t-nota" x="' + (W - PAD - 12) + '" y="' + (y + 20) + '" text-anchor="end">' + escXml(resumo) + "</text>" +
      celulas.join("") + "</g>");
    y += alturaZona + 14;
  });
  return '<svg class="mapa-svg" viewBox="0 0 ' + W + " " + (y + 2) + '" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Mapa de espaços da ' + escXml(edicao === "auto" ? "Edição Auto" : "Edição Moto") + '">' + partes.join("") + "</svg>";
}

function contagemEdicao(edicao) {
  var c = { total: 0, disponivel: 0, reservado: 0, vendido: 0, risco: 0, semCadastro: 0 };
  var porChave = espacosPorChave();
  var zonas = MAPA[edicao] || {};
  ZONAS.forEach(function (zona) {
    (zonas[zona.id] || []).forEach(function (item) {
      c.total++;
      var doc = porChave[chaveMapa(edicao, zona.id, item.codigo)];
      if (!doc) { c.semCadastro++; return; }
      c[doc.status] = (c[doc.status] || 0) + 1;
      if (doc.patrocinadorEmRisco) c.risco++;
    });
  });
  return c;
}

function blocoMapa() {
  var edicao = edicaoAtual();
  var abas = EDICOES.map(function (e) {
    var ativo = e.id === edicao;
    return '<button type="button" role="tab" aria-selected="' + ativo + '" data-acao="edicao" data-edicao="' + e.id + '" class="' +
      cn("h-11 border-b-2 px-4 text-sm font-bold uppercase", ativo ? "border-primary text-primary" : "border-transparent text-muted-foreground") + '">' + esc(e.rotulo) + "</button>";
  }).join("");
  var corpo;
  if (S.spacesErro) corpo = errorList(S.spacesErro, "recarregar-espacos", S.spacesCarregando);
  else if (!S.spaces) corpo = '<div role="status" aria-live="polite" aria-busy="true" class="p-4"><span class="sr-only">Carregando mapa...</span><div class="' + SKELETON + ' h-64 w-full rounded-none"></div></div>';
  else {
    var c = contagemEdicao(edicao);
    var chip = function (n, txt, cls) { return '<span class="' + cn(BADGE, "text-foreground", cls) + '">' + n + " " + txt + "</span>"; };
    corpo =
      '<div class="flex flex-wrap items-center gap-2 border-b border-border px-4 py-3 text-xs sm:px-5">' +
        chip(c.disponivel, "disponíveis", STATUS_ESPACO.disponivel.className) + chip(c.reservado, "reservados", STATUS_ESPACO.reservado.className) +
        chip(c.vendido, "vendidos", STATUS_ESPACO.vendido.className) +
        (c.risco ? chip(c.risco, "em risco de renovação", "border-destructive/40 bg-destructive/10 text-destructive") : "") +
        (c.semCadastro ? chip(c.semCadastro, "sem cadastro", "border-dashed text-muted-foreground") : "") +
        '<span class="ml-auto text-muted-foreground">' + c.total + " espaços no mapa · toque em um espaço para ver e mudar o status</span>" +
      "</div>" +
      '<div class="overflow-x-auto p-2 sm:p-3">' + desenharMapa(edicao) + "</div>";
  }
  return '<div class="border border-border bg-card">' +
    '<div class="flex flex-col gap-3 border-b border-border px-4 pt-4 sm:flex-row sm:items-end sm:justify-between sm:px-5">' +
      '<div><div class="flex items-center gap-2">' + icone("map", "size-4 text-primary") + '<h2 class="text-sm font-black uppercase">Mapa de espaços</h2></div>' +
      '<p class="mt-1 text-xs text-muted-foreground">Base: plantas de 2026. Verde = disponível, amarelo = reservado, preto = vendido, borda vermelha = renovação em risco.</p></div>' +
      '<div role="tablist" aria-label="Edição" class="flex">' + abas + "</div>" +
    "</div>" + corpo + "</div>";
}

// Encontra o item do catalogo pela chave "edicao:zona:codigo".
function itemDoMapa(chave) {
  var p = String(chave || "").split(":");
  if (p.length !== 3) return null;
  var itens = ((MAPA[p[0]] || {})[p[1]]) || [];
  var item = itens.find(function (i) { return i.codigo === p[2]; });
  return item ? { edicao: p[0], zona: p[1], item: item } : null;
}

  var ref = itemDoMapa(S.detalhe);

  };

  }

      '<div class="flex flex-col space-y-1.5 text-center sm:text-left"><h2 id="titulo-detalhe" class="text-lg font-semibold leading-none tracking-tight text-2xl font-black uppercase">' + esc(nome) + "</h2>" +
      '<p class="text-sm text-muted-foreground">' + (doc ? badge(STATUS_ESPACO[doc.status]) : '<span class="' + cn(BADGE, "border-dashed text-muted-foreground") + '">Sem cadastro</span>') + "</p></div>" +

    "</div>";
}

          '<button type="button" id="space-status" role="combobox" data-acao="menu-form-status" class="' + SELECT_TRIGGER + '"><span>' + esc(STATUS_ESPACO[statusInicial].label) + "</span>" + icone("chevron-down", "h-4 w-4 opacity-50") + "</button></div>" +
        "</div>" +
        '<div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2 gap-2 pt-3">' +
          '<button type="button" class="' + btnCls("outline") + '" data-acao="fechar-form">Cancelar</button>' +
          '<button type="submit" class="' + btnCls("default", "default", "font-bold uppercase") + '"' + (S.form.salvando ? " disabled" : "") + ">" + (S.form.salvando ? icone("loader-circle", "animate-spin") : "") + " Salvar espaço</button>" +
        "</div>" +
      "</form>" +
      '<button type="button" data-acao="fechar-form" class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background cursor-pointer transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none">' + icone("x", "h-4 w-4") + '<span class="sr-only">Close</span></button>' +
    "</div>";
}

/* ---------------------------------------------- tela: cadastro de patrocinador */

  else if (!S.sponsors.length) corpo = emptyList("handshake", "Nenhum patrocinador cadastrado ainda");
  else {
    var semEspaco = '<span class="text-muted-foreground">Sem espaço</span>';
    var th = function (cls, txt) { return '<th class="' + cn(TH, cls) + '">' + txt + "</th>"; };
    var linhas = S.sponsors.map(function (s) {
      var detail = STATUS_PATROCINADOR[s.status] || STATUS_PATROCINADOR.ativo;
      return '<tr class="' + cn(TR, s.status === "em_risco_de_renovacao" && "bg-primary/8 hover:bg-primary/12") + '">' +

        '<td class="' + cn(TD, "max-w-56 truncate") + '">' + esc(s.contato) + "</td>" +
        '<td class="' + TD + '">' + (s.espacoVinculado ? esc(s.espacoVinculado) : semEspaco) + "</td>" +
        '<td class="' + TD + '">' + esc(s.responsavelComercial) + "</td>" +
        '<td class="' + cn(TD, "whitespace-nowrap") + '">' + esc(formatDateOnly(s.dataVencimentoContrato)) + "</td>" +
        '<td class="' + TD + '">' + badge(detail, "shrink-0 whitespace-nowrap") + "</td></tr>";
    }).join("");
    var cards = S.sponsors.map(function (s) {
      var detail = STATUS_PATROCINADOR[s.status] || STATUS_PATROCINADOR.ativo;
      return '<article class="' + cn("border border-border bg-card p-4", s.status === "em_risco_de_renovacao" && "border-primary bg-primary/8") + '">' +
        '<div class="flex items-start justify-between gap-3"><h2 class="min-w-0 break-words font-bold">' + esc(s.nome) + "</h2>" + badge(detail, "shrink-0 whitespace-nowrap") + "</div>" +
        '<dl class="mt-4 space-y-3 text-sm">' +
          '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Contato</dt><dd class="mt-0.5 break-words">' + esc(s.contato) + "</dd></div>" +
          '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Espaço vinculado</dt><dd class="mt-0.5">' + (s.espacoVinculado ? esc(s.espacoVinculado) : semEspaco) + "</dd></div>" +
          '<div class="flex flex-wrap items-end justify-between gap-3 border-t border-border pt-3">' +
            '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Responsável</dt><dd class="mt-0.5">' + esc(s.responsavelComercial) + "</dd></div>" +
            '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Vencimento</dt><dd class="mt-0.5 flex items-center gap-1.5">' + icone("calendar-days", "size-3.5 text-muted-foreground") + esc(formatDateOnly(s.dataVencimentoContrato)) + "</dd></div>" +
          "</div>" +
        "</dl></article>";
    }).join("");
    corpo = '<div class="hidden overflow-hidden border border-border bg-card md:block"><div class="relative w-full overflow-auto"><table class="w-full caption-bottom text-sm">' +
      '<thead class="[&_tr]:border-b bg-foreground text-background"><tr class="' + cn(TR, "hover:bg-foreground") + '">' +
        th("px-5 text-xs font-bold uppercase text-background", "Patrocinador") + th("text-xs font-bold uppercase text-background", "Contato") +
        th("text-xs font-bold uppercase text-background", "Espaço vinculado") + th("text-xs font-bold uppercase text-background", "Responsável") +
        th("text-xs font-bold uppercase text-background", "Vencimento") + th("text-xs font-bold uppercase text-background", "Status") +
      '</tr></thead><tbody class="[&_tr:last-child]:border-0">' + linhas + "</tbody></table></div></div>" +

  }
  return '<section class="space-y-7"><header class="border-b border-border pb-7">' +
    '<div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase text-primary"><span class="h-1 w-8 bg-primary"></span> Carteira comercial</div>' +
    '<h1 class="text-2xl font-black uppercase sm:text-3xl lg:text-4xl">Cadastro de Patrocinador</h1>' +
    '<p class="mt-2 max-w-2xl text-sm text-muted-foreground">Contato, espaço vinculado, responsável comercial e vencimento de contrato de cada patrocinador.</p>' +
    "</header>" + corpo + "</section>";
}

/* ---------------------------------------------- tela: historico de interacoes */
function telaInteracoes() {
  var corpo;
  if (S.interactionsErro) corpo = errorList(S.interactionsErro, "recarregar-interacoes", S.interactionsCarregando);

          '<button type="button" class="' + btnCls("outline", "default", "w-full shrink-0 font-bold uppercase sm:w-auto") + '" data-acao="sugerir" data-id="' + esc(it.id) + '"' + (S.sugerindo ? " disabled" : "") + ">" +

          '<div><span class="text-xs font-bold uppercase text-muted-foreground">Observação</span><p class="mt-2 break-words text-sm leading-6">' + esc(it.observacao) + "</p></div>" +

            (it.proximoPasso

    '<h1 class="text-2xl font-black uppercase sm:text-3xl lg:text-4xl">Histórico de Interações</h1>' +
    '<p class="mt-2 max-w-2xl text-sm text-muted-foreground">Consulte as conversas registradas e gere abordagens comerciais com base no histórico de cada patrocinador.</p>' +

/* --------------------------------------------------------- carregar dados */
async function carregar(chave, fn) {
  S[chave + "Carregando"] = true;
  S[chave + "Erro"] = null;
  render();
  try { S[chave] = await fn(); }
  catch (e) { S[chave] = null; S[chave + "Erro"] = e.message; }
  S[chave + "Carregando"] = false;
  render();
}
function recarregarEspacos() { return Promise.all([carregar("spaces", getSpaces), carregar("overview", getSpacesOverview)]); }

var TITULOS = {
  "/auth": "Entrar — Painel Comercial Festival Interlagos",
  "/app/espacos": "Painel de Espaços — Painel Comercial Festival Interlagos",
  "/app/patrocinadores": "Cadastro de Patrocinador — Painel Comercial Festival Interlagos",
  "/app/interacoes": "Histórico de Interações — Painel Comercial Festival Interlagos",
};

async function prepararTela(caminho) {
  if (!S.regraAplicada) {
    S.regraAplicada = true;
    try { await aplicarRegraContratos(); } catch (e) {}
  }
  if (caminho === "/app/espacos" && !S.spaces && !S.spacesCarregando) recarregarEspacos();
  if (caminho === "/app/patrocinadores" && !S.sponsors && !S.sponsorsCarregando) carregar("sponsors", getSponsors);
  if (caminho === "/app/interacoes" && !S.interactions && !S.interactionsCarregando) carregar("interactions", getInteractions);
}

/* ------------------------------------------------------------------ render */
var ultimaRota = null;
function render() {
  var raiz = document.getElementById("app");
  var r = rotaAtual();
  var caminho = r.caminho;
  if (!S.authPronto) { raiz.innerHTML = pageLoading(caminho === "/auth" ? "Carregando acesso..." : "Carregando painel..."); return; }
  if (caminho === "/" || !TITULOS[caminho]) { irPara(S.user ? "/app/espacos" : "/auth", true); return; }
  if (caminho === "/auth" && S.user) { irPara("/app/espacos", true); return; }
  if (caminho !== "/auth" && !S.user) { irPara("/auth", true); return; }
  document.title = TITULOS[caminho];

  // preserva o foco e o cursor da busca entre renderizacoes
  var ativo = document.activeElement;
  var foco = ativo && ativo.id ? { id: ativo.id, ini: ativo.selectionStart, fim: ativo.selectionEnd } : null;

  if (caminho === "/auth") raiz.innerHTML = telaAuth();
  else {
    var tela = caminho === "/app/espacos" ? telaEspacos() : caminho === "/app/patrocinadores" ? telaPatrocinadores() : telaInteracoes();
    raiz.innerHTML = casca(tela, caminho);
    if (ultimaRota !== caminho) { prepararTela(caminho); window.scrollTo(0, 0); }
  }
  ultimaRota = caminho;
  document.body.classList.toggle("dialogo-aberto", S.form.aberto || !!S.detalhe);

  if (foco) {
    var el = document.getElementById(foco.id);
    if (el) { el.focus(); try { if (foco.ini != null) el.setSelectionRange(foco.ini, foco.fim); } catch (e) {} }
  }
}

/* --------------------------------------------------------- menu de selecao */
var menuAberto = null;
function fecharMenu() { if (menuAberto) { menuAberto.remove(); menuAberto = null; } }
function abrirMenu(gatilho, opcoes, atual, aoEscolher) {
  fecharMenu();
  var ret = gatilho.getBoundingClientRect();
  var menu = document.createElement("div");
  menu.setAttribute("role", "listbox");
  menu.className = cn(SELECT_CONTENT, "menu-selecao");
  menu.setAttribute("data-state", "open");
  menu.style.left = ret.left + "px";
  menu.style.minWidth = Math.max(ret.width, 128) + "px";
  var abaixo = window.innerHeight - ret.bottom;
  var altura = opcoes.length * 32 + 10;
  if (abaixo < altura + 8 && ret.top > altura) menu.style.bottom = (window.innerHeight - ret.top + 4) + "px";
  else menu.style.top = (ret.bottom + 4) + "px";
  menu.innerHTML = '<div class="p-1">' + opcoes.map(function (o) {
    var sel = o.valor === atual;
    return '<div role="option" tabindex="-1" aria-selected="' + sel + '" data-valor="' + o.valor + '" class="' + cn(SELECT_ITEM, "hover:bg-accent hover:text-accent-foreground cursor-pointer") + '">' +
      '<span class="absolute right-2 flex h-3.5 w-3.5 items-center justify-center">' + (sel ? icone("check", "h-4 w-4") : "") + "</span>" + esc(o.rotulo) + "</div>";
  }).join("") + "</div>";
  menu.addEventListener("click", function (ev) {
    var item = ev.target.closest("[data-valor]");
    if (!item) return;
    fecharMenu();
    aoEscolher(item.getAttribute("data-valor"));
  });
  document.body.appendChild(menu);
  menuAberto = menu;
}
var OPCOES_STATUS = [{ valor: "disponivel", rotulo: "Disponível" }, { valor: "reservado", rotulo: "Reservado" }, { valor: "vendido", rotulo: "Vendido" }];

/* ------------------------------------------------------------------ eventos */
document.addEventListener("click", async function (ev) {
  if (menuAberto && !menuAberto.contains(ev.target) && !ev.target.closest('[role="combobox"]')) fecharMenu();
  var alvo = ev.target.closest("[data-acao]");
  if (!alvo || alvo.disabled) return;
  var acao = alvo.getAttribute("data-acao");
  var id = alvo.getAttribute("data-id");

  if (acao === "modo") { S.auth.mode = alvo.getAttribute("data-modo"); render(); return; }
  if (acao === "sair") {
    S.saindo = true; render();
    await API.sair();
    return;
  }
  if (acao === "novo") { S.form = { aberto: true, espaco: null, salvando: false, prefill: null }; render(); setTimeout(function () { var el = document.getElementById("space-name"); if (el) el.focus(); }, 0); return; }
  if (acao === "novo-mapa") {
    var ref = itemDoMapa(alvo.getAttribute("data-mapa"));
    if (!ref) return;
    var t = TIPOS[ref.item.tipo];
    S.form = { aberto: true, espaco: null, salvando: false, prefill: {
      mapa: chaveMapa(ref.edicao, ref.zona, ref.item.codigo), edicao: ref.edicao, zona: ref.zona, codigo: ref.item.codigo, tipo: ref.item.tipo,
      nome: nomeEspaco(ref.edicao, ref.zona, ref.item), categoria: t.categoria, metragem: ref.item.m2, ocupante_2026: ref.item.ocupante || "",
    } };
    render(); return;
  }
  if (acao === "editar") {
    var sp = (S.spaces || []).find(function (x) { return x.id === id; });
    S.form = { aberto: true, espaco: sp || null, salvando: false, prefill: null }; render(); return;
  }
  if (acao === "fechar-form") { if (!S.form.salvando) { S.form.aberto = false; fecharMenu(); render(); } return; }
  if (acao === "mapa-espaco") { S.detalhe = alvo.getAttribute("data-mapa"); fecharMenu(); render(); return; }
  if (acao === "fechar-detalhe") { S.detalhe = null; fecharMenu(); render(); return; }
  if (acao === "edicao") {
    trocarParametro("edicao", alvo.getAttribute("data-edicao"));
    fecharMenu();
    render();
    return;
  }
  if (acao === "menu-filtro") {
    var f = filtroAtual();
    abrirMenu(alvo, [{ valor: "todos", rotulo: "Todos os status" }].concat(OPCOES_STATUS), f.filter, function (valor) {
      trocarParametro("status", valor);
      alvo.querySelector("span").textContent = ROTULO_FILTRO[valor];
      document.getElementById("bloco-lista").innerHTML = blocoListaEspacos();
    });
    return;
  }
  if (acao === "menu-status") {
    var espaco = (S.spaces || []).find(function (x) { return x.id === id; });
    abrirMenu(alvo, OPCOES_STATUS, espaco && espaco.status, async function (valor) {
      if (!espaco || valor === espaco.status) return;
      S.statusMudando = true; render();
      try {
        await changeSpaceStatus(id, valor);
        S.statusMudando = false;
        await recarregarEspacos();
        toast.success("Status do espaço atualizado.");
      } catch (e) {
        S.statusMudando = false; render();
        toast.error(e.message);
      }
    });
    return;
  }
  if (acao === "menu-form-status") {
    var campo = document.getElementById("space-status-valor");
    abrirMenu(alvo, OPCOES_STATUS, campo.value, function (valor) {
      campo.value = valor;
      alvo.querySelector("span").textContent = STATUS_ESPACO[valor].label;
    });
    return;
  }
  if (acao === "sugerir") {
    S.sugerindo = id; render();
    try {
      await suggestNextStep(id);
      S.sugerindo = null;
      S.overview = null;
      await carregar("interactions", getInteractions);
      toast.success("Próximo passo sugerido e salvo.");
    } catch (e) {
      S.sugerindo = null; render();
      toast.error(e.message);
    }
    return;
  }
  if (acao === "recarregar-espacos") { carregar("spaces", getSpaces); return; }
  if (acao === "recarregar-overview") { carregar("overview", getSpacesOverview); return; }
  if (acao === "recarregar-patrocinadores") { carregar("sponsors", getSponsors); return; }
  if (acao === "recarregar-interacoes") { carregar("interactions", getInteractions); return; }
});

document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (el.id === "busca") {
    trocarParametro("q", el.value);
    document.getElementById("bloco-lista").innerHTML = blocoListaEspacos();
    return;
  }
  if (el.id === "name") S.auth.name = el.value;
  if (el.id === "email") S.auth.email = el.value;
  if (el.id === "password") S.auth.password = el.value;
});

document.addEventListener("submit", async function (ev) {
  if (ev.target.id === "form-auth") { ev.preventDefault(); enviarAuth(); return; }
  if (ev.target.id === "form-espaco") {
    ev.preventDefault();
    var form = new FormData(ev.target);
    var rawValue = String(form.get("valor") || "").replace(/\./g, "").replace(",", ".");
    var space = S.form.espaco;
    var rawM2 = String(form.get("metragem") || "").replace(/\./g, "").replace(",", ".").trim();
    var data = {
      id: space ? space.id : undefined,
      nome: String(form.get("nome") || ""),
      categoria: String(form.get("categoria") || ""),
      valor: Number(rawValue),
      status: String(form.get("status") || "disponivel"),
      metragem: rawM2 === "" ? null : Number(rawM2),
      ocupante2026: String(form.get("ocupante_2026") || ""),
      mapa: form.get("mapa") || null, edicao: form.get("edicao") || null, zona: form.get("zona") || null,
      codigo: form.get("codigo") || null, tipo: form.get("tipo") || null,
    };
    S.form.salvando = true;
    var btn = ev.target.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.insertAdjacentHTML("afterbegin", icone("loader-circle", "animate-spin")); }
    try {
      await saveSpace(data);
      S.form = { aberto: false, espaco: null, salvando: false, prefill: null };
      await recarregarEspacos();
      toast.success(space ? "Espaço atualizado com sucesso." : "Espaço criado com sucesso.");
    } catch (e) {
      S.form.salvando = false;
      if (btn) { btn.disabled = false; var sp = btn.querySelector(".animate-spin"); if (sp) sp.remove(); }
      toast.error(e.message);
    }
  }
});

document.addEventListener("keydown", function (ev) {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.closest && ev.target.closest('[data-acao="mapa-espaco"]')) {
    ev.preventDefault(); ev.target.closest('[data-acao="mapa-espaco"]').click(); return;
  }
  if (ev.key !== "Escape") return;
  if (menuAberto) { fecharMenu(); return; }
  if (S.form.aberto && !S.form.salvando) { S.form.aberto = false; render(); return; }
  if (S.detalhe) { S.detalhe = null; render(); }
});
window.addEventListener("hashchange", render);
window.addEventListener("resize", fecharMenu);
window.addEventListener("scroll", fecharMenu, true);

/* ------------------------------------------------------------------- inicio */
(async function iniciar() {
  render();
  try {
    API = MODO_TESTE ? await criarApiTeste() : await criarApiFirebase();
  } catch (e) {
    document.getElementById("app").innerHTML = pageLoading("Não foi possível carregar o painel. Recarregue a página.");
    return;
  }
  API.aoMudarLogin(async function (user) {
    if (user && !user.emailVerified) user = null;
    S.user = user;
    if (user) {
      S.nome = await API.nomePerfil(user);
    } else {
      S.saindo = false;
      S.regraAplicada = false;
      S.spaces = S.overview = S.sponsors = S.interactions = null;
      S.form = { aberto: false, espaco: null, salvando: false, prefill: null };
      S.detalhe = null;
      ultimaRota = null;
    }
    S.authPronto = true;
    render();
  });
})();

/*
 * Regras do Firestore publicadas no projeto (copia):
 *
 * rules_version = '2';
 * service cloud.firestore {
 *   match /databases/{database}/documents {
 *     function logado() { return request.auth != null && request.auth.token.email_verified == true; }
 *     function tabela() {
 *       return logado() && (
 *         (request.method == 'create' && request.resource.data.criado_por == request.auth.uid) ||
 *         (request.method == 'update' && request.resource.data.criado_por == resource.data.criado_por) ||
 *         request.method == 'delete');
 *     }
 *     match /espacos/{id}        { allow read: if logado(); allow write: if tabela(); }
 *     match /patrocinadores/{id} { allow read: if logado(); allow write: if tabela(); }
 *     match /interacoes/{id}     { allow read: if logado(); allow write: if tabela(); }
 *     match /profiles/{uid}      { allow read, create, update: if request.auth != null && request.auth.uid == uid; }
 *   }
 * }
 */
</script>
</body>
