async function planoDeExclusao(tipo, d) {
  var t = TIPOS_LIXEIRA[tipo];
  var plano = { tipo: tipo, id: d.id, rotulo: rotuloParaLixeira(tipo, d), itens: [{ col: t.col, id: d.id }], avisos: [], forte: "", lote: null };

  };

    var combs = r[1].filter(function (c) { return c.patrocinador_id === d.id; });
    var inters = r[2].filter(function (i) { return i.patrocinador_id === d.id; });
    cts.forEach(function (c) { plano.itens.push({ col: "contratos", id: c.id }); });
    combs.forEach(function (c) { plano.itens.push({ col: "combinados", id: c.id }); });
    inters.forEach(function (i) { plano.itens.push({ col: "interacoes", id: i.id }); });

    if (naBase2026(d)) plano.avisos.push("É da base 2026: sai da Renovação 2027, e os espaços que ocupou em 2026 deixam de ficar guardados para ela.");
    var esp = espacosDaMarca(d);
    if (esp.length) plano.avisos.push("Continua no mapa: " + esp.map(function (e) { return nomeCurto(e) + (e.reservadoParaId === d.id && e.status === "reservado" ? " (reservado para ela)" : " (vinculado)"); }).join(", ") + ". Se for para liberar, mude o status na tela de Espaços.");
    var nf = filasCom("patrocinador");
    if (nf) plano.avisos.push("Sai da fila de " + qtdTexto(nf, "espaço", "espaços") + ".");
    // contrato com o envio aberto na DocuSign nao vai para a lixeira: a marca inteira fica ate

    var naDocu = cts.filter(envelopeAberto);
    if (naDocu.length) {
      var titulos = naDocu.map(function (c) { return "\"" + (c.titulo || "Contrato") + "\""; });
      plano.bloqueio = { patroId: d.id, texto: "Não dá para excluir " + d.nome + ": " +
        (naDocu.length > 1 ? naDocu.length + " contratos da marca estão na DocuSign esperando assinatura (" + titulos.join(", ") + "). Cancele o envio deles antes."
          : "o contrato " + titulos[0] + " está na DocuSign esperando assinatura. Cancele o envio dele antes.") };
    }
    var assinados = cts.filter(foiAssinado);
    if (assinados.length) plano.forte = "Atenção: " + d.nome + " tem " + qtdTexto(assinados.length, "contrato assinado", "contratos assinados") + " (" + assinados.map(function (c) { return c.titulo || "Contrato"; }).join(", ") + ").\n\nContrato assinado tem valor legal. Vai junto para a lixeira e fica guardado lá para sempre: dá para restaurar, mas nunca sai de vez.\n\nExcluir mesmo assim?";
  }
  if (tipo === "espaco") {
    plano.avisos.push("É o cadastro real do mapa. O desenho continua, e o lugar fica sem cadastro até alguém restaurar.");
    if (d.status === "reservado") plano.avisos.push("Está reservado" + (d.reservadoParaNome ? " para " + d.reservadoParaNome : "") + ".");

    var lidas = entregasDoContrato(d.id).length;

    if (foiAssinado(d)) plano.forte = "Atenção: este contrato " + (d.status === "assinado" ? "está ASSINADO" : "já foi ASSINADO") + " e tem valor legal.\n\nEle vai para a lixeira e fica guardado lá para sempre: dá para restaurar, mas nunca sai de vez.\n\nExcluir mesmo assim?";
  }
  if (tipo === "marca") {
    if (d.patrocinadorId) {
      var pt = (S.sponsors || []).find(function (p) { return p.id === d.patrocinadorId; });
      plano.avisos.push("Ela já virou patrocinador" + (pt ? " (" + pt.nome + ")" : "") + ". O patrocinador continua na carteira.");

    if (nInter || combinadosDeMarca(d.id).length) plano.avisos.push("Os contatos e as propriedades registrados com ela saem das listas junto, e voltam se restaurar.");
    var nfm = filasCom("marca");

  }
  plano.pergunta = "Mandar " + plano.rotulo + " para a lixeira?" + (plano.avisos.length ? "\n\n" + plano.avisos.join("\n\n") : "") + "\n\nDá para restaurar depois, na tela Lixeira.";
  return plano;
}

async function excluirItem(tipo, id, botao) {

  if (!podeExcluir(tipo, d)) {
    if (tipo === "contrato" && podeCancelarEnvio(d)) avisoComCancelarEnvio(motivoSemExcluir(tipo, d), d.id);
    else toast.error(motivoSemExcluir(tipo, d));
    return;
  }
  // destrava sem redesenhar (redesenhar apagaria o que a pessoa digitou no formulario aberto)
  var soltar = function () { S.excluindo = false; if (botao) botao.disabled = false; if (!botao || botao.isConnected === false) render(); };
  S.excluindo = true;
  if (botao) botao.disabled = true;
  var plano;
  try { plano = await planoDeExclusao(tipo, d); }
  catch (e) { soltar(); toast.error("Não consegui conferir o que vai junto. Tente de novo."); return; }

  if (plano.bloqueio) {
    soltar();
    if (plano.bloqueio.patroId) toast("error", plano.bloqueio.texto, { rotulo: "Ver contratos", ms: 12000, fn: function () { verContratosDaMarca(plano.bloqueio.patroId); } });

  try { await gravarLixeira(plano.itens, camposLixeira(plano.lote)); }
  catch (e) { soltar(); toast.error(erroDeGravacao(e, "excluir")); return; }
  S.excluindo = false;
  fecharTelasDoItem(tipo, id);
  tirarDaTela(plano.itens);
  render();
  toast("success", maiuscula(plano.rotulo) + " foi para a lixeira.", { rotulo: "Desfazer", fn: function () { desfazerExclusao(plano); } });

// Tudo o que esta na lixeira. Comercial ve o que ele mesmo excluiu; diretoria ve tudo.

    ler(API.listar("prospeccao", { comExcluidos: true }), "marca"),

    marca: function (d) { return { nome: d.nome || "Marca desejo", detalhe: [MERCADOS[d.mercado] || "", (ESTAGIOS[d.estagio] || ESTAGIOS.mapeada).label, rotuloVendedor(d.vendedor_uid, d.vendedor_nome)].filter(Boolean).join(" · ") }; },

    API.listarContratos ? API.listarContratos(true, { comExcluidos: true }) : API.listar("contratos", { comExcluidos: true }),

// Apaga o documento e depois os arquivos dele. Devolve quantos arquivos nao deu para apagar.
async function apagarUmDeVez(x) {

  if (x.tipo === "espaco") { try { await API.apagar("precos", x.id); } catch (e) {} }
  if (x.tipo === "combinado") { try { await API.apagar("combinados_trecho", x.id); } catch (e) {} }
  var falhas = 0;
  if (x.tipo === "contrato") {
    var caminhos = [x.doc.arquivo_path, x.doc.arquivo_original_path].filter(function (c, i, a) { return !!c && a.indexOf(c) === i; });
    for (var i = 0; i < caminhos.length; i++) {
      try { await API.apagarArquivo(caminhos[i]); }

// contrato que nunca sai de vez: ja foi assinado (valor legal) ou esta com o envio aberto na

function contratoFicaNaLixeira(x) { return x.tipo === "contrato" && (foiAssinado(x.doc) || envelopeAberto(x.doc)); }
// Tudo o que precisa ser lido antes de perguntar: o lote de novo (lerLote), os contatos e entregas
// da marca desejo (que nao vao para a lixeira com ela: somem das listas) e as filas dos espacos em
// que a marca esta. Tudo lido na hora: a tela Lixeira pode nao ter o mapa carregado.
async function prepararApagarDeVez(it) {
  var p = { junto: await lerLote(it), escondidos: [], filas: [] };
  if (it.tipo === "marca") {
    var r = await Promise.all([API.listar("interacoes", { comExcluidos: true }), API.listar("combinados", { comExcluidos: true })]);
    [["interacao", r[0]], ["combinado", r[1]]].forEach(function (par) {
      par[1].forEach(function (d) { if (d.prospeccao_id === it.id && !d.patrocinador_id) p.escondidos.push({ tipo: par[0], col: TIPOS_LIXEIRA[par[0]].col, id: d.id, doc: d }); });
    });
  }
  if (it.tipo === "marca" || it.tipo === "patrocinador") {
    var tipoFila = it.tipo === "marca" ? "marca" : "patrocinador";
    (await API.listar("espacos", { comExcluidos: true })).forEach(function (e) {
      var fila = Array.isArray(e.fila) ? e.fila : [];
      var sem = fila.filter(function (f) { return !(f && f.tipo === tipoFila && f.marca_id === it.id); });
      if (sem.length !== fila.length) p.filas.push({ col: "espacos", id: e.id, dados: { fila: sem } });
    });
  }
  p.ficam = p.junto.filter(contratoFicaNaLixeira);
  p.vao = p.junto.filter(function (j) { return p.ficam.indexOf(j) < 0; });
  return p;
}
async function apagarDeVez(id) {
  var it = (S.lixeira || []).find(function (x) { return x.id === id; });
  if (!it || !ehAdmin() || S.lixeiraMexendo) return;
  if (it.tipo === "contrato" && foiAssinado(it.doc)) { toast.error("Contrato que já foi assinado não sai da lixeira: fica guardado para sempre."); return; }
  if (it.tipo === "contrato" && envelopeAberto(it.doc)) { avisoComCancelarEnvio("Este contrato está na DocuSign esperando assinatura: não sai de vez enquanto o envio estiver aberto. Cancele o envio antes.", it.id); return; }
  S.lixeiraMexendo = id; render();
  var p;
  try { p = await prepararApagarDeVez(it); }
  catch (e) { S.lixeiraMexendo = null; render(); toast.error("Não consegui conferir o que vai junto. Recarregue a lixeira e tente de novo."); return; }
  S.lixeiraMexendo = null; render();
  var pdfs = [it].concat(p.vao).filter(function (x) { return x.tipo === "contrato" && x.doc.arquivo_path; }).length;
  var nEsc = contarPorTipo(p.escondidos);
  var msg = "Excluir de vez " + it.nome + (p.vao.length ? " e o que foi junto (" + textoJunto(contarPorTipo(p.vao)) + ")" : "") + "?\n\nNão dá para desfazer: some do painel para sempre." +
    (pdfs ? (pdfs > 1 ? " Os PDFs dos contratos também são apagados." : " O PDF do contrato também é apagado.") : "") +
    (it.tipo === "espaco" ? " O preço do espaço também é apagado." : "") +
    (p.escondidos.length ? "\n\nSomem junto, de vez, os registros feitos com ela: " + textoJunto({ combinado: nEsc.combinado || 0, interacao: nEsc.interacao || 0 }) + "." : "") +
    (p.filas.length ? "\n\nSai da fila de " + qtdTexto(p.filas.length, "espaço", "espaços") + "." : "") +
    (p.ficam.length ? "\n\n" + (p.ficam.length > 1 ? p.ficam.length + " contratos não saem" : "1 contrato não sai") + ": " +
      [p.ficam.some(function (j) { return foiAssinado(j.doc); }) ? "contrato assinado fica na lixeira para sempre" : "",
       p.ficam.some(function (j) { return !foiAssinado(j.doc); }) ? "contrato na DocuSign esperando assinatura fica até alguém cancelar o envio" : ""].filter(Boolean).join(", e ") + "." : "");
  if (!window.confirm(msg)) return;
  if (!window.confirm("Última confirmação: excluir de vez " + it.nome + "? Depois disso não tem volta.")) return;
  S.lixeiraMexendo = id; render();
  var semArquivo = 0;
  try {
    // A ordem deixa tudo para tentar de novo se algo falhar no meio: primeiro os contatos e
    // entregas da marca desejo (a regra so apaga o que esta na lixeira, entao eles entram nela
    // antes), depois o que foi junto, depois a fila dos espacos e, por ultimo, o item, que continua
    // na lixeira (e escondido da fila) se qualquer passo antes falhar.
    var marcar = p.escondidos.filter(function (x) { return !estaExcluido(x.doc); });
    if (marcar.length) await gravarLixeira(marcar, camposLixeira(novoId()));
    var r = await Promise.all(p.escondidos.concat(p.vao).map(apagarUmDeVez));
    r.forEach(function (n) { semArquivo += n; });
    if (p.filas.length) await API.atualizarVarios(p.filas);
    semArquivo += await apagarUmDeVez(it);
  } catch (e) {
    S.lixeiraMexendo = null;
    await recarregarDepoisDaLixeira();
    toast.error(erroDeGravacao(e, "excluir de vez"));
    return;
  }
  S.lixeiraMexendo = null;
  await recarregarDepoisDaLixeira();
  toast.success("Pronto: " + it.nome + " saiu do painel de vez.");
  if (semArquivo) toast.error("Não consegui apagar " + qtdTexto(semArquivo, "PDF", "PDFs") + " do armazenamento. O resto foi excluído.");
}

/* ------------------------------------------------------------------ rotas */
function rotaAtual() {
  var h = location.hash.replace(/^#/, "") || "/";
  var partes = h.split("?");
  var params = new URLSearchParams(partes[1] || "");
  return { caminho: partes[0], params: params };
}
function irPara(caminho, substituir) {
  var alvo = "#" + caminho;
  if (substituir) history.replaceState(null, "", alvo); else location.hash = alvo;
  render();
}
function trocarParametro(nome, valor) {
  var r = rotaAtual();
  if (valor) r.params.set(nome, valor); else r.params.delete(nome);
  var q = r.params.toString();
  history.replaceState(null, "", "#" + r.caminho + (q ? "?" + q : ""));
}

var AVISO_LINK_SENHA = "Se esse e-mail tiver conta no painel, o link para criar uma senha nova chega em alguns minutos. Olhe também a caixa de spam.";
async function enviarRecuperarSenha() {
  var a = S.auth;
  var email = String(a.email || "").trim();
  a.error = ""; a.message = "";
  if (!EMAIL_VALIDO.test(email)) { a.error = "Confira o e-mail: parece que está escrito errado."; render(); return; }
  a.loading = true; render();
  try {
    await API.mandarLinkSenha(email);
    a.message = AVISO_LINK_SENHA;
  } catch (e) {
    var c = (e && e.code) || "";
    // e-mail sem conta recebe o mesmo recado de quem tem conta
    if (c === "auth/user-not-found") a.message = AVISO_LINK_SENHA;
    else a.error = mensagemErroAuth(e) || "Não foi possível mandar o link agora. Tente de novo em alguns minutos.";
  }
  a.loading = false;
  render();
}

function mensagemErroCadastro(e) {
  var c = (e && e.code) || "";
  if (c === "auth/email-already-in-use") return "Este e-mail já tem uma conta.";
  if (c === "auth/invalid-email") return "E-mail inválido.";
  if (c === "auth/weak-password") return "A senha precisa ter pelo menos 6 caracteres.";
  return "Não foi possível criar a conta. Tente novamente.";
}
// Erros do login do Firebase em portugues simples (Minha conta, Esqueci minha senha, Equipe).
// Codigo desconhecido devolve null: quem chama poe o recado padrao dele.
function mensagemErroAuth(e) {
  var c = (e && e.code) || "";
  if (c === "auth/wrong-password" || c === "auth/invalid-credential" || c === "auth/invalid-login-credentials") return "A senha atual não confere. Confira e tente de novo.";
  if (c === "auth/missing-password") return "Digite a sua senha atual.";
  if (c === "auth/invalid-email" || c === "auth/missing-email") return "Confira o e-mail: parece que está escrito errado.";
  if (c === "auth/email-already-in-use") return "Esse e-mail já é usado em outra conta do painel.";
  if (c === "auth/too-many-requests") return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if (c === "auth/requires-recent-login" || c === "auth/user-token-expired" || c === "auth/user-mismatch" || c === "auth/user-not-found")
    return "Por segurança, saia e entre de novo no painel antes de fazer isso.";
  if (c === "auth/weak-password" || c === "auth/password-does-not-meet-requirements") return "Essa senha é fraca. Use pelo menos 8 caracteres, misturando letras e números.";
  if (c === "auth/network-request-failed") return "Sem conexão com a internet. Confira e tente de novo.";
  if (/permission/i.test(String(c || (e && e.message) || ""))) return "Você não tem permissão para mudar isso.";
  return null;
}

async function enviarAuth() {
  var a = S.auth;
  a.error = ""; a.message = ""; a.loading = true;
  render();
  if (a.mode === "signup") {
    try {
      await API.criarConta(a.name.trim(), a.email, a.password);
      a.loading = false;
      a.message = "Conta criada. Confira seu e-mail para confirmar o acesso.";
    } catch (e) {
      a.loading = false;
      a.error = mensagemErroCadastro(e);
    }
    render();
    return;
  }
  try {
    await API.entrar(a.email, a.password);
    a.loading = false; a.password = "";
    irPara("/app/inicio");
  } catch (e) {
    a.loading = false;
    var cLogin = (e && e.code) || "";
    // muitas tentativas e falta de internet tem recado proprio; o resto continua generico
    a.error = cLogin === "auth/too-many-requests" || cLogin === "auth/network-request-failed" ? mensagemErroAuth(e) : "E-mail ou senha incorretos.";
    render();
  }
}

// Botoes Moto | Auto | Tudo no topo: valem para o painel inteiro.
function seletorEdicao() {
  var atual = edicaoEscolhida();
  var botao = function (id, rotulo, titulo) {
    var ativo = atual === id;
    return '<button type="button" role="radio" aria-checked="' + ativo + '" title="' + esc(titulo) + '" data-acao="edicao-global" data-edicao="' + id + '" class="' +
      cn("seg-botao h-7 px-2 text-xs font-medium sm:px-3", ativo ? "seg-ativo" : "text-muted-foreground") + '">' + esc(rotulo) + "</button>";

  return '<div role="radiogroup" aria-label="Edição do festival" class="seg-trilho flex shrink-0">' +
    EDICOES.map(function (e) { return botao(e.id, e.curto, "Mostrar só a edição " + e.rotulo); }).join("") +

// Data de hoje por extenso, do jeito que aparece no topo do Inicio.
function hojePorExtenso() {
  try {
    return new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  } catch (e) { return ""; }
}

// A linha curta ao lado do titulo de cada tela. So contexto: se nao souber, nao escreve nada.
function assuntoDaTela(caminho) {
  if (caminho === "/app/inicio") return hojePorExtenso();
  if (caminho === "/app/espacos") {
    if (!S.spaces) return "";
    var c = contagemEdicao(edicaoAtual());
    return c.total + (filtrandoEdicao() ? " na edição " + rotuloEdicaoEscolhida() : " espaços no mapa");
  }
  if (caminho === "/app/patrocinadores") {
    if (!S.sponsors) return "";
    var marcas = S.sponsors.filter(function (x) { return passaEdicao(edicoesDaMarca(x)); });
    return marcas.length + (marcas.length === 1 ? " marca" : " marcas");
  }
  if (caminho === "/app/renovacao") {
    if (!S.sponsors) return "";
    return S.sponsors.filter(naBase2026).length + " marcas da base 2026";
  }
  if (caminho === "/app/contratos") {
    if (!S.contracts) return "";
    return contratosDaMarcaFiltrada().length + " contratos";
  }
  if (caminho === "/app/marcas") {
    if (!S.prospects) return "";
    return S.prospects.filter(emAndamento).length + " em andamento";
  }
  if (caminho === "/app/propriedades") {
    if (!S.combinados) return "";
    var pend = S.combinados.filter(function (c) { return c.status === "combinado"; }).length;
    return pend + (pend === 1 ? " entrega pendente" : " entregas pendentes");
  }
  if (caminho === "/app/interacoes") return S.interactions ? S.interactions.length + " conversas" : "";
  if (caminho === "/app/valores") return "Só a diretoria vê";
  if (caminho === "/app/equipe") return S.perfis ? S.perfis.length + " com login" : "";
  if (caminho === "/app/conta") return S.email || "";
  return "";
}

// O botao principal de cada tela, que antes morava dentro dela.

    return '<button type="button" class="' + btnCls("default", "default", "h-9 shrink-0 gap-1.5 px-2.5 text-sm font-semibold sm:px-3.5") + '" data-acao="' + acao + '"' +

/* ------------------------------------------------------------------ alertas */
// Le patrocinadores + parametros e devolve a lista do que precisa de acao, do mais grave ao menos grave.
function calcularAlertas() {
  var cfg = configAtual();
  var lista = [];
  (S.sponsors || []).forEach(function (p) {
    var naBase = naBase2026(p);
    // prazos da renovacao 2027 valem para a base de 2026 mesmo com o cadastro encerrado
    alertasRenovacao(p, cfg, lista);
    var base = { patro: p, vendedorUid: p.vendedorUid, vendedorNome: p.responsavelComercial, grupo: "outras" };
    if (p.renovacao === "recusou" && (naBase || p.status !== "encerrado")) {
      var esp = espacos2026De(p).map(function (e) { return e.nome + (e.edicao ? " (" + rotuloEdicao(e.edicao) + ")" : ""); });
      lista.push(Object.assign({}, base, { nivel: "azul", peso: 3, tipo: "recusou", titulo: p.nome + " recusou renovar",
        detalhe: esp.length ? "Pode oferecer a outra marca: " + esp.slice(0, 3).join(", ") + (esp.length > 3 ? " e mais " + (esp.length - 3) : "")
          : p.espacoVinculado ? "O espaço " + p.espacoVinculado + " pode ser oferecido a outra marca" : "Sem espaço vinculado" }));
    }
    if (p.status === "encerrado") return;
    var diasEvento = Math.min(diasAte(cfg.moto_data), diasAte(cfg.auto_data));
    if (p.edicao === "moto") diasEvento = diasAte(cfg.moto_data);
    if (p.edicao === "auto") diasEvento = diasAte(cfg.auto_data);
    var diasVenc = diasAte(p.dataVencimentoContrato);
    var diasContato = p.ultimoContato ? -diasAte(p.ultimoContato) : null;
    var assinou2027 = !!S.contracts && situacao2027(p).assinado;
    if (p.master && respostaDe(p) !== "confirmou" && !assinou2027 && diasEvento !== null && diasEvento <= cfg.dias_gatilho_master) {
      lista.push(Object.assign({}, base, { grupo: "renovacao", tipo: "renovacao", nivel: "vermelho", peso: 0, admin: true, titulo: p.nome + " é Master e ainda não renovou",
        detalhe: (diasEvento < 0 ? "A edição já passou" : "Faltam " + diasEvento + " dias para a edição") + " · Renovação: " + RENOVACAO[p.renovacao].label }));
    }
    // vencimento do contrato: so para quem esta fora da renovacao 2027 (a base ja tem os prazos acima)
    if (!naBase && p.renovacao !== "recusou" && p.renovacao !== "renovado" && diasVenc !== null) {
      var bv = Object.assign({}, base, { tipo: "vencimento" });
      if (diasVenc < 0) lista.push(Object.assign({}, bv, { nivel: "vermelho", peso: 1, titulo: "Contrato de " + p.nome + " venceu " + textoDias(-diasVenc, false), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
      else if (diasVenc <= 30) lista.push(Object.assign({}, bv, { nivel: "vermelho", peso: 1, titulo: "Contrato de " + p.nome + " vence " + textoDias(diasVenc, true), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
      else if (diasVenc <= 90) lista.push(Object.assign({}, bv, { nivel: "amarelo", peso: 2, titulo: "Contrato de " + p.nome + " vence " + textoDias(diasVenc, true), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
    }

// valorAtual: o espaco que ja esta gravado. Se ele nao esta na lista (foi para a lixeira, ou a lista
// ainda nao carregou), entra como opcao mesmo assim: senao o formulario abria em "Sem espaco" e
// salvar apagava o vinculo sem ninguem pedir.
function opcoesEspacos(atualId, valorAtual) {
  var grupos = {};
  (S.spaces || []).forEach(function (sp) {
    var ed = sp.edicao ? (EDICOES.find(function (e) { return e.id === sp.edicao; }) || {}).rotulo : "Sem posição no mapa";

  });
  var opcoes = [{ valor: "", rotulo: "Sem espaço" }];
  if (valorAtual && !(S.spaces || []).some(function (sp) { return sp.id === valorAtual; })) {
    var ref = itemDoMapa(valorAtual);

    opcoes.push({ valor: valorAtual, rotulo: nomeV + motivo });

function espacosPorChave() {

function zonaInfo(id) { return ZONAS.find(function (z) { return z.id === id; }) || { id: id, titulo: id }; }
// Quem esta no espaco, na ordem que importa: marca fechada, reserva feita pelo contrato

  if (space.patrocinador) return esc(space.patrocinador.nome);

  return '<span class="text-muted-foreground">Vazio</span>';

function rotuloLocal(sp) {
  if (!sp.mapa) return "Sem posição no mapa";
  var ed = EDICOES.find(function (e) { return e.id === sp.edicao; });

function truncar(txt, max) {
  txt = String(txt || "");
  return txt.length > max ? txt.slice(0, Math.max(1, max - 1)) + "…" : txt;
}
function escXml(v) { return esc(v); }

// Desenha a edicao inteira em SVG: zonas empilhadas, cada espaco e uma celula clicavel.
function desenharMapa(edicao) {
  var W = 1240, PAD = 16, GAP = 6, y = PAD;

  var zonas = MAPA[edicao] || {};

    var celulas = [];
    itens.forEach(function (item) {
      var t = TIPOS[item.tipo];
      if (x + t.w > W - PAD - 12) { x = PAD + 12; linhaY += alturaLinha + GAP; alturaLinha = 0; }
      var chave = chaveMapa(edicao, zona.id, item.codigo);
      var doc = porChave[chave];
      var st = doc ? doc.status : "nenhum";
      var sit27 = doc ? situacaoEspaco2027(doc) : null;

      var vezM = doc && doc.fila.length ? vezDaFila(doc) : null;
      cont[st] = (cont[st] || 0) + 1;
      var risco = doc && doc.patrocinadorEmRisco;
      var patro = doc && doc.patrocinador ? doc.patrocinador.nome : "";
      var ocupante = (doc ? doc.ocupante2026 : item.ocupante) || "";
      var vendDoc = doc ? nomePessoa(doc.vendedorUid, doc.vendedorNome) : ""; // apelido, se tiver
      var nome = doc ? doc.nome : nomeEspaco(edicao, zona.id, item);
      var maxChars = Math.max(4, Math.floor((t.w - 8) / 5.4));
      var rot = patro || ocupante;
      var tit = nome + "\n" + (doc ? STATUS_ESPACO[doc.status].label : "Sem cadastro") +
        (patro ? "\nPatrocinador: " + patro : "") + (ocupante ? "\nOcupante 2026: " + ocupante : "") + (vendDoc ? "\nVendedor: " + vendDoc : "") +
        (item.m2 ? "\n" + item.m2 + " m²" : "") + (risco ? "\nRisco de renovação: " + risco : "") +
        (reservaNaMao(doc) ? "\nReserva vale até " + formatDateOnly(doc.reservadoAte) : "") + (doc && doc.fila.length ? "\nFila: " + doc.fila.length + (doc.fila.length > 1 ? " marcas" : " marca") : "") +
        (vezM && vezM.atual ? "\nVez de " + vezM.atual.marca_nome + " até " + diaSemanaCurto(vezM.ate) : "") +
        (cls27 ? "\nRenovação 2027: " + textoSitEspaco(sit27) : "");
      celulas.push(
        '<g class="cel st-' + st + (risco ? " risco" : "") + cls27 + '" data-acao="mapa-espaco" data-mapa="' + escXml(chave) + '" role="button" tabindex="0" aria-label="' + escXml(nome) + '">' +
          "<title>" + escXml(tit) + "</title>" +
          '<rect x="' + x + '" y="' + linhaY + '" width="' + t.w + '" height="' + t.h + '" rx="4"/>' +
          '<text class="t-cod" x="' + (x + 5) + '" y="' + (linhaY + 14) + '">' + escXml(item.rotulo && t.w >= 88 ? truncar(item.rotulo, maxChars) : item.codigo) + "</text>" +
          (rot ? '<text class="t-rot" x="' + (x + 5) + '" y="' + (linhaY + 27) + '">' + escXml(truncar(rot, maxChars)) + "</text>" : "") +
          (doc && doc.status !== "disponivel" && vendDoc && t.h >= 58 ? '<text class="t-rot" x="' + (x + 5) + '" y="' + (linhaY + 39) + '">' + escXml(truncar("↳ " + primeiroNome(vendDoc), maxChars)) + "</text>" : "") +
          (item.m2 && t.h >= 54 ? '<text class="t-m2" x="' + (x + 5) + '" y="' + (linhaY + t.h - 6) + '">' + escXml(item.m2 + " m²") + "</text>" : "") +
          (doc && doc.fila.length ? '<circle class="fila-bolha" cx="' + (x + t.w - 9) + '" cy="' + (linhaY + 9) + '" r="7.5"/><text class="t-fila" x="' + (x + t.w - 9) + '" y="' + (linhaY + 12) + '" text-anchor="middle">' + doc.fila.length + "</text>" : "") +

      x += t.w + GAP;

    ].concat(cont.nenhum ? [cont.nenhum + " sem cadastro"] : []).join(" · ");
    partes.push(
      '<g><rect class="zona" x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + alturaZona + '" rx="8"/>' +
      '<text class="t-zona" x="' + (PAD + 12) + '" y="' + (y + 20) + '">' + escXml(zona.titulo) + "</text>" +

function contagemEdicao(edicao) {
  var c = { total: 0, disponivel: 0, reservado: 0, vendido: 0, risco: 0, semCadastro: 0, guardado: 0, renovou: 0, vencido: 0, fila: 0 };
  var porChave = espacosPorChave();
  var zonas = MAPA[edicao] || {};
  ZONAS.forEach(function (zona) {
    (zonas[zona.id] || []).forEach(function (item) {
      c.total++;
      var doc = porChave[chaveMapa(edicao, zona.id, item.codigo)];
      if (!doc) { c.semCadastro++; return; }
      c[doc.status] = (c[doc.status] || 0) + 1;
      if (doc.patrocinadorEmRisco) c.risco++;
      var s27 = situacaoEspaco2027(doc);
      if (s27 && s27.tipo !== "livre") c[s27.tipo]++;
      if (doc.fila.length) c.fila++;
    });
  });
  return c;
}

      "</div>";
  }
  return '<div class="cartao-mapa rounded-md border border-border bg-card shadow-[var(--sombra-cartao)]">' +
    '<div class="flex flex-wrap items-center justify-between gap-2 border-b border-border px-4 py-3">' +
      '<div class="flex items-baseline gap-2.5"><h2 class="text-sm font-semibold">Mapa de espaços</h2>' +
      '<span class="text-xs text-muted-foreground">' + (podeMexer() ? "toque em um espaço para ver e mudar o status" : "toque em um espaço para ver os detalhes") + "</span></div>" +
      '<span class="text-xs text-muted-foreground">' + resumo + "</span>" +
    "</div>" + corpo + "</div>";
}

// Encontra o item do catalogo pela chave "edicao:zona:codigo".
function itemDoMapa(chave) {
  var p = String(chave || "").split(":");
  if (p.length !== 3) return null;
  var itens = ((MAPA[p[0]] || {})[p[1]]) || [];
  var item = itens.find(function (i) { return i.codigo === p[2]; });
  return item ? { edicao: p[0], zona: p[1], item: item } : null;
}

  var t = TIPOS[ref.item.tipo];
  var nome = doc ? doc.nome : nomeEspaco(ref.edicao, ref.zona, ref.item);

  var linha = function (rot, val) {

  };
  var patro = doc && doc.patrocinador

  var ocupante = (doc ? doc.ocupante2026 : ref.item.ocupante) || "";

    linha("Local", esc(zonaInfo(ref.zona).titulo) + " · " + esc(ref.item.codigo) + " · " + esc(ed ? ed.curto : ref.edicao)) +
    linha("Categoria", esc(doc ? doc.categoria : t.categoria)) +
    linha("Metragem", m2 ? esc(String(m2).replace(".", ",")) + " m²" : '<span class="text-muted-foreground">Não informada</span>') +
    linha("Ocupante 2026", ocupante ? esc(ocupante) : '<span class="text-muted-foreground">Vazio em 2026</span>') +
    linha("Patrocinador vinculado", patro) +
    (doc ? linha("Vendedor responsável", nomePessoa(doc.vendedorUid, doc.vendedorNome) ? esc(nomePessoa(doc.vendedorUid, doc.vendedorNome)) : '<span class="text-muted-foreground">Ninguém ainda</span>') : "") +
    (doc && podeVerValores() ? linha("Valor", textoValorEspaco(doc.valor)) : "") +

    (function () { var s27 = doc ? situacaoEspaco2027(doc) : null; return s27 && s27.tipo !== "livre" ? linha("Renovação 2027", esc(textoSitEspaco(s27))) : doc && doc.liberado2027Em ? linha("Renovação 2027", "Liberado para a fila em " + esc(dataCurta(doc.liberado2027Em))) : ""; })() +
    "</dl>" +
    (function () {
      var s27 = doc ? situacaoEspaco2027(doc) : null;
      if (!s27 || s27.tipo !== "vencido" || !podeMexer()) return "";
      return '<div class="mt-2 flex justify-end"><button type="button" class="' + btnCls("default", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="liberar-2027" data-id="' + esc(doc.id) + '"' + (S.filaMexendo ? " disabled" : "") + ">" + icone("users") + " Liberar e avisar a fila</button></div>";
    })() +
    (reservaNaMao(doc) && podeMexer() ? '<div class="mt-2 flex justify-end"><button type="button" class="' + btnCls("outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="prorrogar-reserva" data-id="' + esc(doc.id) + '"' + (S.filaMexendo ? " disabled" : "") + ">" + icone("history") + " Mais " + DIAS_RESERVA + " dias de reserva</button></div>" : "") +
    (doc ? blocoFila(doc) : "");
  var acoes;
  if (doc) {
    acoes = '<div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
      '<div class="w-44">' + statusSelect(doc, S.statusMudando) + "</div>" +
      '<div class="flex flex-wrap gap-2">' + botaoExcluir("espaco", doc) +
      (podeMexer() ? '<button type="button" class="' + btnCls("outline", "default", "font-bold uppercase") + '" data-acao="editar" data-id="' + esc(doc.id) + '">' + icone("pencil") + " Editar espaço</button>" : "") + "</div></div>" +
      (doc.patrocinadorEmRisco ? '<div class="mt-3">' + riskNote(doc.patrocinadorEmRisco) + "</div>" : "");
  } else if (espacoNaLixeira(S.detalhe)) {
    // Cadastrar por cima do que esta na lixeira a regra nega (troca quem criou). O caminho e restaurar,

    var idLixo = espacoNaLixeira(S.detalhe);

      (ehAdmin() ? '<div class="mt-3 flex justify-end"><button type="button" class="' + btnCls("default", "default", "font-bold uppercase") + '" data-acao="restaurar-espaco" data-id="' + esc(idLixo) + '"' + (S.lixeiraMexendo ? " disabled" : "") + ">" +
        (S.lixeiraMexendo === idLixo ? icone("loader-circle", "animate-spin") : icone("rotate-ccw")) + " Restaurar este espaço</button></div>" : "");

    '<div role="dialog" aria-modal="true" aria-labelledby="titulo-detalhe" data-state="open" class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg max-h-[90vh] overflow-y-auto">' +
      '<div class="flex flex-col space-y-1.5 text-center sm:text-left"><h2 id="titulo-detalhe" class="text-lg font-semibold leading-none tracking-tight text-2xl font-black uppercase">' + esc(nome) + "</h2>" +
      '<p class="text-sm text-muted-foreground">' + (doc ? badge(STATUS_ESPACO[doc.status]) : '<span class="' + cn(BADGE, "border-dashed text-muted-foreground") + '">Sem cadastro</span>') + "</p></div>" +
      corpo + acoes +
      '<button type="button" data-acao="fechar-detalhe" class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background cursor-pointer transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none">' + icone("x", "h-4 w-4") + '<span class="sr-only">Close</span></button>' +
    "</div>";
}

// Fila de interessados: marcas que querem o espaco se ele ficar livre. Vale a ordem de
// chegada, e a marca que ocupou o espaco em 2026 (a renovante) fica sempre na frente.
function filaOrdenada(e) {
  // marca (patrocinador ou marca desejo) que esta na lixeira nao conta na fila
  return filaSemLixeira(e.fila).slice().sort(function (a, b) {
    var ra = mesmaMarca(a.marca_nome, e.ocupante2026) ? 0 : 1, rb = mesmaMarca(b.marca_nome, e.ocupante2026) ? 0 : 1;
    return ra - rb || String(a.entrou_em || "").localeCompare(String(b.entrou_em || ""));
  });
}
function textoPrazoReserva(e) {
  var d = diasAte(e.reservadoAte);
  return esc(formatDateOnly(e.reservadoAte)) + " · " + (d < 0 ? '<span class="text-destructive">venceu ' + esc(textoDias(-d, false)) + "</span>" : d === 0 ? '<span class="text-destructive">vence hoje</span>' : "faltam " + d + (d === 1 ? " dia" : " dias"));
}
function blocoFila(e) {
  var fila = filaOrdenada(e);
  var jaNaFila = {};
  fila.forEach(function (f) { jaNaFila[f.tipo + ":" + f.marca_id] = true; });
  var patros = (S.sponsors || []).filter(function (p) { return !jaNaFila["patrocinador:" + p.id]; }).map(function (p) { return { valor: "patrocinador:" + p.id, rotulo: p.nome }; });
  var marcas = (S.prospects || []).filter(emAndamento).filter(function (m) { return !jaNaFila["marca:" + m.id]; }).map(function (m) { return { valor: "marca:" + m.id, rotulo: m.nome }; });
  var opcoes = [{ valor: "", rotulo: "Escolha a marca" }];
  if (patros.length) opcoes.push({ grupo: "Patrocinadores", itens: patros });
  if (marcas.length) opcoes.push({ grupo: "Marcas desejo", itens: marcas });
  // vez na fila: so corre com o espaco livre de verdade (ver vezDaFila)
  var vz = fila.length ? vezDaFila(e) : null, ag = agendaDaFila(e), prazo = prazoVezFila();
  var travado = S.filaMexendo ? " disabled" : "";
  var btnVez = function (variante, acao, f, ic, txt) {
    return '<button type="button" class="' + btnCls(variante, "default", "h-8 text-xs font-bold uppercase") + '" data-acao="' + acao + '" data-id="' + esc(e.id) + '"' + (f ? ' data-item="' + esc(f.id) + '"' : "") + travado + ">" + icone(ic) + " " + txt + "</button>";
  };
  var textoVez = function (f) {
    var a = ag[f.id];
    if (!a) return "";
    if (a.estado === "vez") return '<div class="mt-1 text-xs font-bold ' + (a.dias <= 2 ? "text-destructive" : "text-foreground") + '">Vez até ' + esc(diaSemanaCurto(a.ate)) + ", " + esc(textoFaltaVez(a.dias)) + "</div>";
    if (a.estado === "passou") return '<div class="mt-1 text-xs text-muted-foreground">Passou a vez em ' + esc(diaSemanaCurto(a.em)) + (nomePessoa(f.passou_por_uid, f.passou_por_nome) ? " (" + esc(nomePessoa(f.passou_por_uid, f.passou_por_nome)) + ")" : "") + "</div>";
    if (a.estado === "venceu") return '<div class="mt-1 text-xs text-muted-foreground">A vez acabou em ' + esc(diaSemanaCurto(a.ate)) + " sem fechar</div>";
    return '<div class="mt-1 text-xs text-muted-foreground">Vez prevista a partir de ' + esc(diaSemanaCurto(a.desde)) + "</div>";
  };
  var topoVez = !vz ? "" :
    vz.atual ? '<p class="text-xs">O espaço está livre: cada marca tem ' + qtdTexto(prazo, "dia", "dias") + " para fechar, na ordem da fila. Se não fechar nem passar a vez, a vez vai sozinha para a próxima.</p>"
    : vz.acabou ? '<p class="border border-dashed border-border px-3 py-2 text-xs">A fila terminou em ' + esc(diaSemanaCurto(vz.desde)) + " sem ninguém fechar. O espaço está livre para qualquer marca.</p>"
    : vz.semInicio ? '<div class="flex flex-col gap-2 border border-dashed border-border px-3 py-2 text-xs sm:flex-row sm:items-center sm:justify-between"><span>O espaço está livre, mas a vez da fila ainda não começou a contar.</span>' +
        (podeMexer() ? btnVez("outline", "fila-comecar", null, "history", "Começar a vez") : "") + "</div>"
    : "";
  return '<section class="mt-4 space-y-2 border-t border-border pt-4">' +
    '<h3 class="text-xs font-bold uppercase">Fila de interessados <span class="font-normal text-muted-foreground">(' + fila.length + ")</span></h3>" +
    '<p class="text-xs text-muted-foreground">Marcas que querem este espaço se ele ficar livre. Vale a ordem de chegada, e a marca que ocupou o espaço em 2026 fica sempre na frente.</p>' +
    topoVez +
    (fila.length ? '<ol class="space-y-1.5">' + fila.map(function (f, i) {
      var renov = mesmaMarca(f.marca_nome, e.ocupante2026);
      var daVez = !!(vz && vz.atual && vz.atual.id === f.id);
      var acoesVez = daVez ? (podeMexer() ? btnVez("outline", "fila-reservar", f, "handshake", "Reservar para " + esc(f.marca_nome)) : "") + (podePassarVez(e, f) ? btnVez("ghost", "fila-passar", f, "skip-forward", "Passar a vez") : "") : "";
      return '<li class="' + cn("border bg-card px-3 py-2 text-sm", daVez ? "border-primary" : "border-border") + '"><div class="flex items-center justify-between gap-3">' +
        '<div class="min-w-0"><b>' + (i + 1) + "º " + esc(f.marca_nome) + "</b>" + (renov ? ' <span class="' + cn(BADGE, "ml-1 text-foreground border-primary/30 bg-primary/15") + '">Ocupou em 2026</span>' : "") +
        (daVez ? ' <span class="' + cn(BADGE, "ml-1 text-foreground border-primary/30 bg-primary/15") + '">É a vez</span>' : "") +
        '<div class="text-xs text-muted-foreground">' + (f.tipo === "marca" ? "Marca desejo · " : "") + "entrou em " + esc(formatDateOnly(diaSP(f.entrou_em) || String(f.entrou_em || "").slice(0, 10))) + (nomePessoa(f.por_uid, f.por_nome) ? " por " + esc(nomePessoa(f.por_uid, f.por_nome)) : "") + "</div>" + textoVez(f) + "</div>" +
        (podeMexer() ? '<button type="button" class="' + btnCls("ghost", "icon") + '" data-acao="fila-sair" data-id="' + esc(e.id) + '" data-item="' + esc(f.id) + '" title="Tirar da fila" aria-label="Tirar ' + esc(f.marca_nome) + ' da fila"' + travado + ">" + icone("x", "h-4 w-4") + "</button>" : "") + "</div>" +
        (acoesVez ? '<div class="mt-2 flex flex-wrap gap-2">' + acoesVez + "</div>" : "") + "</li>";
    }).join("") + "</ol>" : "") +
    (podeMexer() ? '<div class="flex flex-col gap-2 sm:flex-row">' + selectNativo("fila-marca", "fila_marca", opcoes, "") +
      '<button type="button" class="' + btnCls("outline", "default", "shrink-0 font-bold uppercase") + '" data-acao="fila-entrar" data-id="' + esc(e.id) + '"' + (S.filaMexendo ? " disabled" : "") + ">" + icone("plus") + " Pôr na fila</button></div>" : "") +
  "</section>";
}

// Zona inteira em tela cheia: e a mesma zona do mapa, so que grande o bastante
// para caber o nome da marca, o status e o vendedor sem cortar nada.
function itensDaZona(edicao, zonaId) {
  var porChave = espacosPorChave();
  return ((MAPA[edicao] || {})[zonaId] || []).map(function (item) {
    var chave = chaveMapa(edicao, zonaId, item.codigo);
    var doc = porChave[chave] || null;
    return {
      item: item, chave: chave, doc: doc,
      status: doc ? doc.status : "nenhum",
      nome: doc ? doc.nome : nomeEspaco(edicao, zonaId, item),
      rotulo: item.rotulo || item.codigo,
      patrocinador: doc && doc.patrocinador ? doc.patrocinador.nome : "",
      ocupante: (doc ? doc.ocupante2026 : item.ocupante) || "",
      vendedor: doc ? nomePessoa(doc.vendedorUid, doc.vendedorNome) : "",
      m2: doc && doc.metragem != null ? doc.metragem : item.m2,
      valor: doc ? doc.valor : null,
      risco: doc && doc.patrocinadorEmRisco ? doc.patrocinadorEmRisco : "",
      sit27: doc ? situacaoEspaco2027(doc) : null,
      fila: doc ? doc.fila.length : 0,
      vez: doc && doc.fila.length ? vezDaFila(doc) : null,
    };
  });
}

function celulaAmpliada(e) {
  var st = STATUS_ESPACO[e.status] || { label: "Sem cadastro" };
  var linha2 = e.patrocinador ? esc(e.patrocinador)
    : e.ocupante ? esc(e.ocupante) + ' <span style="opacity:.7;font-weight:400">· 2026</span>'
    : '<span style="opacity:.7;font-weight:400">' + (e.status === "nenhum" ? "Sem cadastro" : "Sem marca") + "</span>";
  var r27 = e.sit27 && e.sit27.tipo !== "livre" ? e.sit27.tipo : "";
  var detalhe = (e.status === "nenhum" ? "Sem cadastro" : r27 ? ROTULO_SIT_ESPACO[r27] : st.label) + (e.m2 ? " · " + String(e.m2).replace(".", ",") + " m²" : "");
  return '<button type="button" class="' + cn("amp-cel", "st-" + e.status, e.risco && "risco", r27 && "r27-" + r27) + '" data-acao="mapa-espaco" data-mapa="' + esc(e.chave) + '">' +
    '<span class="cod">' + esc(e.rotulo) + (e.fila ? '<span class="amp-fila">' + e.fila + " na fila</span>" : "") + "</span>" +
    '<span class="marca">' + linha2 + "</span>" +
    (e.vendedor ? '<span class="meta sub">' + esc(primeiroNome(e.vendedor)) + "</span>" : "") +
    '<span class="meta">' + esc(detalhe) + "</span>" +
    (e.vez && e.vez.atual ? '<span class="meta sub">Vez de ' + esc(e.vez.atual.marca_nome) + " até " + esc(diaSemanaCurto(e.vez.ate)) + "</span>" : "") +
  "</button>";
}

function tabelaAmpliada(lista) {
  var comValor = podeVerValores(); // Visualizacao: sem a coluna de valor
  var cel = function (v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>"; };
  var vazio = '<span class="text-muted-foreground">—</span>';
  var linhas = lista.map(function (e) {
    var st = STATUS_ESPACO[e.status];
    return '<tr data-acao="mapa-espaco" data-mapa="' + esc(e.chave) + '" style="cursor:pointer">' +
      cel(esc(e.rotulo), "cod") + cel(esc(e.nome)) +
      cel(e.ocupante ? esc(e.ocupante) : vazio) +
      cel(e.patrocinador ? esc(e.patrocinador) : vazio) +
      cel(e.vendedor ? esc(e.vendedor) : vazio) +
      cel(e.m2 ? esc(String(e.m2).replace(".", ",")) + " m²" : vazio) +
      (comValor ? cel(e.valor ? esc(formatCurrency(e.valor)) : vazio) : "") +
      cel(st ? badge(st, "whitespace-nowrap") : '<span class="text-muted-foreground">Sem cadastro</span>') +
      "</tr>";
  }).join("");
  var th = function (t) { return "<th>" + t + "</th>"; };
  return '<div class="overflow-x-auto"><table class="amp-tab"><thead><tr>' +
    th("Espaço") + th("Nome") + th("Ocupante 2026") + th("Patrocinador") + th("Vendedor") + th("Metragem") + (comValor ? th("Valor") : "") + th("Status") +
    "</tr></thead><tbody>" + linhas + "</tbody></table></div>";
}

function telaAmpliada() {
  var p = String(S.ampliada || "").split(":");
  var edicao = p[0], zonaId = p[1];
  var zona = zonaInfo(zonaId);
  var ed = EDICOES.find(function (x) { return x.id === edicao; });
  var lista = itensDaZona(edicao, zonaId);
  if (!lista.length) return "";
  var cont = { disponivel: 0, reservado: 0, vendido: 0, nenhum: 0 };
  lista.forEach(function (e) { cont[e.status] = (cont[e.status] || 0) + 1; });
  var chip = function (n, txt, cls) { return n ? '<span class="' + cn(BADGE, "text-foreground", cls) + '">' + n + " " + txt + "</span>" : ""; };
  var aba = function (modo, txt) {
    return '<button type="button" class="' + btnCls(S.ampliadaModo === modo ? "default" : "outline", "default", "h-9 text-xs font-bold uppercase") + '" data-acao="modo-ampliada" data-modo="' + modo + '" aria-pressed="' + (S.ampliadaModo === modo) + '">' + txt + "</button>";
  };
  return '<div class="amp" role="dialog" aria-modal="true" aria-labelledby="titulo-amp">' +
    '<div class="amp-topo">' +
      '<div class="min-w-0">' +
        '<div class="mb-1 flex items-center gap-2 text-xs font-bold uppercase text-primary"><span class="h-1 w-8 bg-primary"></span> ' + esc(ed ? ed.rotulo : edicao) + "</div>" +
        '<h2 id="titulo-amp" class="text-2xl font-black uppercase">' + esc(zona.titulo) + "</h2>" +
        (zona.nota ? '<p class="mt-1 text-sm text-muted-foreground">' + esc(zona.nota) + "</p>" : "") +
        '<div class="amp-chips mt-2">' +
          chip(cont.disponivel, "disponíveis", "border-success/30 bg-success/10 text-success") +
          chip(cont.reservado, "reservados", "border-warning/30 bg-warning/10 text-warning-foreground") +
          chip(cont.vendido, "vendidos", "border-foreground/20 bg-foreground text-background") +
          chip(cont.nenhum, "sem cadastro", "border-foreground/15 bg-foreground/8") +
        "</div>" +
      "</div>" +
      '<div class="flex shrink-0 flex-wrap items-center gap-2">' + aba("grade", "Grade") + aba("tabela", "Tabela") +
        '<button type="button" class="' + btnCls("ghost", "icon") + '" data-acao="fechar-ampliada" aria-label="Fechar tela ampliada" title="Fechar (Esc)">' + icone("x") + "</button>" +
      "</div>" +
    "</div>" +
    '<div class="amp-corpo">' +
      (S.ampliadaModo === "tabela" ? tabelaAmpliada(lista) : '<div class="amp-grade">' + lista.map(celulaAmpliada).join("") + "</div>") +
      '<p class="mt-5 text-xs text-muted-foreground">' + (podeMexer() ? "Toque em um espaço para ver a ficha e mudar o status." : "Toque em um espaço para ver a ficha.") + " Esc fecha esta tela.</p>" +
    "</div>" +
  "</div>";

function resumoCombinados(patroId) {
  var n = contarEntregas(combinadosDe(patroId));
  if (!n.total && !n.aConferir) return "";
  var partes = [];
  if (n.total) partes.push(n.entregues + " de " + n.total + " entregue" + (n.total === 1 ? "" : "s"));
  if (n.atrasadas) partes.push(n.atrasadas + " atrasada" + (n.atrasadas > 1 ? "s" : ""));
  if (n.aConferir) partes.push(n.aConferir + " a conferir");
  return '<span class="ml-2">· ' + esc(partes.join(" · ")) + "</span>";
}

function badgeMaster() {
  return '<span class="' + cn(BADGE, "text-foreground border-foreground/20 bg-foreground text-background") + '" title="Patrocinador Master: pagou mais e tem mais direitos no festival">' + icone("shield-check", "mr-1 size-3") + "Master</span>";
}

function patrocinadoresFiltrados() {
  var f = S.fp;
  var term = f.q.trim().toLocaleLowerCase("pt-BR");
  return (S.sponsors || []).filter(function (p) {
    if (!passaEdicao(edicoesDaMarca(p))) return false;
    if (f.status !== "todos" && p.status !== f.status) return false;
    if (!passaQuemCuida(p, f.cuida)) return false;
    if (!passaRenovMarca(p, f.renov)) return false;
    if (!passaTipoMarca(p, f.tipoMarca)) return false;
    if (!passaPrazoMarca(p, f.prazo)) return false;
    if (term) {
      var texto = [p.nome, p.contato, p.espacoVinculado, p.responsavelComercial, nomePessoa(p.vendedorUid, p.responsavelComercial)].join(" ").toLocaleLowerCase("pt-BR");
      if (texto.indexOf(term) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return (b.master ? 1 : 0) - (a.master ? 1 : 0) || porNome(a, b); });
}

async function salvarNomeDeOutro() {
  var ed = S.equipeEditando;
  if (!ed || S.equipeSalvando) return;
  var p = perfilPorUid(ed.id);
  if (!p || !ehDono() || p.id === S.uid || p.papel === "dono") { toast.error("Só o dono do sistema muda o nome de outra pessoa (e não o de outro dono)."); return; }
  var nome = limparTexto(ed.nome), apelido = limparTexto(ed.apelido);
  var erro = validarNomeApelido(nome, apelido);
  if (erro) { ed.erro = erro; render(); return; }
  S.equipeSalvando = true; ed.erro = ""; render();
  try { await API.atualizarPerfilDeOutro(p.id, { nome: nome, apelido: apelido || null }); }
  catch (e) { S.equipeSalvando = false; ed.erro = mensagemErroAuth(e) || "Não foi possível salvar. Confira a conexão e tente de novo."; render(); return; }
  S.equipeSalvando = false; S.equipeEditando = null;
  await atualizarPerfis();
  render();
  toast.success("Nome salvo: " + (apelido ? apelido + " (" + nome + ")" : nome) + ".");
}
// o dono tira a foto de outra pessoa (nunca a propria, que e em Minha conta, nem a de outro dono;
// a regra do banco confere o mesmo). O arquivo so e apagado se estiver na pasta da pessoa.
async function tirarFotoDeOutro(uid) {
  var p = perfilPorUid(uid);
  if (!p || !ehDono() || p.id === S.uid || p.papel === "dono" || S.fotoTirando) return;
  if (!window.confirm("Tirar a foto de " + p.nome + "? No lugar dela aparecem as iniciais. A pessoa pode pôr outra em Minha conta.")) return;
  S.fotoTirando = p.id; render();
  try { await API.tirarFotoDeOutro(p.id); }
  catch (e) { S.fotoTirando = null; render(); toast.error(mensagemErroAuth(e) || "Não foi possível tirar a foto. Confira a conexão e tente de novo."); return; }
  // o perfil ja nao aponta para o arquivo: erro ao apagar nao atrapalha
  var arquivo = caminhoDaFoto(p.fotoPath, p.id);
  if (arquivo) { try { await API.apagarArquivo(arquivo); } catch (e2) {} }
  S.fotoTirando = null;
  await atualizarPerfis();
  render();
  toast.success("Foto de " + p.nome + " tirada. Agora aparecem as iniciais.");
}
async function mandarLinkEquipe(uid) {
  var p = perfilPorUid(uid);
  if (!p || !ehDono() || p.id === S.uid || S.linkMandando) return;
  if (!EMAIL_VALIDO.test(p.email || "")) { toast.error(p.nome + " está sem e-mail no cadastro."); return; }
  if (!window.confirm("Mandar para " + p.email + "?\n\n" + p.nome + " vai receber um link para criar uma senha nova. A senha de hoje continua valendo até a pessoa trocar.")) return;
  S.linkMandando = p.id; render();
  try {
    await API.mandarLinkSenha(p.email);
    S.linkMandando = null; render();
    toast.success("Link mandado para " + p.email + ". Peça para olhar também a caixa de spam.");
  } catch (e) {
    S.linkMandando = null; render();
    var c = (e && e.code) || "";
    toast.error(c === "auth/user-not-found" ? "Não existe login com " + p.email + ". A pessoa pode ter trocado o e-mail: peça para ela conferir em Minha conta."

  }
}

// foto: so imagem comum, ate 5 MB na escolha; sobe reduzida (256x256, corte quadrado no centro)
var TIPOS_FOTO = { "image/jpeg": 1, "image/png": 1, "image/webp": 1 };
var LADO_FOTO = 256;
function reduzirFoto(arquivo) {
  return new Promise(function (ok, falha) {
    var url = URL.createObjectURL(arquivo);
    var img = new Image();
    var solta = function () { try { URL.revokeObjectURL(url); } catch (e) {} };
    img.onload = function () {
      try {
        var w = img.naturalWidth, h = img.naturalHeight, lado = Math.min(w, h);
        if (!lado) throw new Error("vazia");
        var tela = document.createElement("canvas");
        tela.width = LADO_FOTO; tela.height = LADO_FOTO;
        var ctx = tela.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, LADO_FOTO, LADO_FOTO); // PNG transparente ganha fundo branco no JPEG
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, (w - lado) / 2, (h - lado) / 2, lado, lado, 0, 0, LADO_FOTO, LADO_FOTO);
        tela.toBlob(function (b) { solta(); if (b) ok(b); else falha(new Error("Não consegui preparar essa foto. Tente outra.")); }, "image/jpeg", 0.85);
      } catch (e) { solta(); falha(new Error("Não consegui preparar essa foto. Tente outra.")); }
    };
    img.onerror = function () { solta(); falha(new Error("Não consegui abrir essa imagem. Tente outra foto, em JPG ou PNG.")); };
    img.src = url;
  });
}
function soltarFotoNova() {
  var c = S.conta;
  if (c.fotoNova && c.fotoNova.url) { try { URL.revokeObjectURL(c.fotoNova.url); } catch (e) {} }
  c.fotoNova = null;
}
async function escolherFotoConta(arquivo) {
  var c = S.conta;
  if (!arquivo || c.fotoSalvando) return;
  c.fotoErro = "";
  if (!TIPOS_FOTO[arquivo.type]) { c.fotoErro = "Escolha uma foto em JPG, PNG ou WebP."; render(); return; }
  if (arquivo.size > 5 * 1024 * 1024) { c.fotoErro = "Essa foto passa de 5 MB. Escolha uma menor."; render(); return; }
  try {
    var blob = await reduzirFoto(arquivo);
    soltarFotoNova();
    c.fotoNova = { blob: blob, url: URL.createObjectURL(blob) };
  } catch (e) { c.fotoErro = e.message || "Não consegui abrir essa foto. Tente outra."; }
  render();
}
function erroFoto(e) {
  var c = String((e && (e.code || e.message)) || "");
  if (/unauthorized|permission/i.test(c)) return "O painel não deixou você subir a foto. Fale com o dono do sistema.";
  return "Não foi possível subir a foto. Confira a conexão e tente de novo.";
}
async function salvarFotoConta() {
  var c = S.conta;
  if (!c.fotoNova || c.fotoSalvando) return;
  c.fotoSalvando = true; c.fotoErro = ""; render();
  var antiga = S.fotoPath, nova;
  try { nova = await API.subirFotoPerfil(c.fotoNova.blob); }
  catch (e) { c.fotoSalvando = false; c.fotoErro = erroFoto(e); render(); return; }
  try { await API.atualizarMeuPerfil({ foto_url: nova.url, foto_path: nova.path }); }
  catch (e) {
    // o perfil nao aceitou: a foto que subiu nao fica largada no Storage
    try { await API.apagarArquivo(nova.path); } catch (e2) {}
    c.fotoSalvando = false; c.fotoErro = mensagemErroAuth(e) || "Não foi possível salvar a foto. Confira a conexão e tente de novo."; render(); return;
  }

async function tirarFotoConta() {

  if (a.status === "cancelado" && a.canceladoEm) return linha("text-muted-foreground", "x", "Envio cancelado em " + esc(dia(a.canceladoEm)) + (a.canceladoPor ? " por " + esc(nomeDeQuemCancelou(a.canceladoPor)) : "") + (a.detalhe ? ": " + esc(a.detalhe) : "") + ". Dá para corrigir e mandar de novo.");
  if (a.status === "cancelado") return linha("text-muted-foreground", "x", "O envio foi cancelado na DocuSign" + (a.detalhe ? ": " + esc(a.detalhe) : "") + ". Dá para mandar de novo.");
  return "";
}
// a funcao grava o e-mail (ou o uid) de quem cancelou: a tela mostra o nome da pessoa
function nomeDeQuemCancelou(v) {
  if (v === S.email || v === S.uid) return "você";
  var p = (S.perfis || []).find(function (x) { return x.id === v || (x.email && x.email === v); });
  return p ? nomePessoa(p.id, p.nome) : v;
}

// Cancelar o envio: anula o envelope na DocuSign (quem recebeu nao consegue mais assinar) e o
// contrato volta para rascunho, para corrigir e mandar de novo, ou excluir. So quem mexe no
// contrato: a diretoria e quem cuida da marca, que sao os que enxergam o contrato. Visualizacao
// nunca (nem ve contrato). A funcao na nuvem confere o mesmo.
function podeCancelarEnvio(c) { return podeMexer() && envelopeAberto(c); }
function botaoCancelarEnvio(c) {
  if (!podeCancelarEnvio(c)) return "";
  var ocupado = S.envioCancelando || S.assinaturaMexendo ? " disabled" : "";
  return '<button type="button" class="' + btnCls("outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="cancelar-envio" data-id="' + esc(c.id) + '"' + ocupado + ' title="Anula o envio na DocuSign. O contrato volta para rascunho">' +
    (S.envioCancelando === c.id ? icone("loader-circle", "animate-spin") + " Cancelando..." : icone("x") + " Cancelar envio") + "</button>";
}
// aviso de erro com o botao Cancelar envio, quando a pessoa pode cancelar
function avisoComCancelarEnvio(texto, contratoId) {
  if (contratoId && podeMexer()) toast("error", texto, { rotulo: "Cancelar envio", ms: 10000, fn: function () { cancelarEnvio(contratoId); } });
  else toast.error(texto);
}
function verContratosDaMarca(patroId) {
  S.ficha = null; S.formPatro.aberto = false;
  irPara("/app/contratos?patro=" + encodeURIComponent(patroId));
}
// o contrato onde ele estiver na tela: listas de contratos ou Lixeira (sozinho ou junto de uma marca).
// Se aparece nos dois lugares (uma das listas ainda nao recarregou), vale o que esta com o envio aberto.
function contratoParaCancelar(id) {
  var achados = (S.contracts || []).filter(function (x) { return x.id === id; });
  (S.lixeira || []).forEach(function (it) {
    [it].concat(it.junto || []).forEach(function (x) { if (x.tipo === "contrato" && x.id === id) achados.push(Object.assign({}, x.doc, { id: x.id })); });
  });
  return achados.filter(envelopeAberto)[0] || achados[0] || null;
}
async function cancelarEnvio(id) {
  if (S.envioCancelando || S.assinaturaMexendo) return;
  var c = contratoParaCancelar(id);
  if (!c) { toast.error("Não achei esse contrato. Recarregue a tela."); return; }
  if (!podeMexer()) { toast.error(AVISO_SO_VER); return; }
  if (!envelopeAberto(c)) { toast.error("Este contrato não está esperando assinatura na DocuSign."); return; }
  var fica = c.status === "assinado" || c.status === "cancelado";
  if (!window.confirm("Cancelar o envio de \"" + (c.titulo || "Contrato") + "\" para a DocuSign? Quem recebeu não vai mais conseguir assinar. " +
    (fica ? "O status do contrato continua " + STATUS_CONTRATO[c.status].label + "." : "O contrato volta para rascunho."))) return;
  var motivo = window.prompt("Motivo do cancelamento (opcional). A DocuSign manda este texto para quem ia assinar. Pode deixar em branco e clicar em OK.", "");
  if (motivo === null) return; // Cancelar aqui desiste de tudo
  motivo = String(motivo).replace(/\s+/g, " ").trim().slice(0, 200);
  S.envioCancelando = id; marcarMexidaPropria(id); render();
  var r = null, erro = null, desistiu = false;
  try { r = await API.assinatura("cancelar", id, { motivo: motivo }); } catch (e) { erro = e; }
  // A DocuSign nao encontra mais o envio (feito por outra conta dela, como a de teste, ou ja
  // apagado por ela). So a diretoria da baixa, e so no painel, depois de confirmar. Quem nao e
  // diretoria recebe so o aviso.
  if (erro && erro.situacao === "envelope-inexistente" && ehAdmin()) {
    if (window.confirm("A DocuSign não encontra mais este envio. Ele pode ter sido feito por outra conta da DocuSign (a de teste, por exemplo) ou já ter sido apagado por ela.\n\n" +
      "Dar baixa só no painel? O envio fica como cancelado" + (fica ? "" : " e o contrato volta para rascunho") + ". Nada é mandado para a DocuSign: se alguém ainda conseguir assinar pelo e-mail antigo, o painel não fica sabendo.")) {
      erro = null;
      try { r = await API.assinatura("cancelar", id, { motivo: motivo, forcar: true }); } catch (e2) { erro = e2; }
    } else { erro = null; desistiu = true; }
  }
  S.envioCancelando = null;
  // deu certo ou nao, o contrato pode ter mudado (a marca pode ter assinado antes): le de novo
  var espera = [];
  if (S.contracts) espera.push(carregar("contracts", getContracts));
  if (erro && erro.situacao === "assinado") {
    if (S.spaces) espera.push(carregar("spaces", getSpaces));
    if (S.sponsors) espera.push(carregar("sponsors", getSponsors));
  }
  if (S.lixeira || rotaAtual().caminho === "/app/lixeira") espera.push(carregar("lixeira", getLixeira));
  if (!espera.length) render();
  await Promise.all(espera);
  // o formulario do contrato, se estiver aberto, passa a mostrar o contrato de agora
  if (S.formContrato.aberto && S.formContrato.contrato && S.formContrato.contrato.id === id) {
    var novo = (S.contracts || []).find(function (x) { return x.id === id; });
    if (novo) { S.formContrato.contrato = novo; render(); }
  }
  if (erro) { toast.error(erro.message); return; }
  if (desistiu) { toast.error("Nada mudou. O envio continua aberto no painel."); return; }
  var comoFicou = r && r.status && r.status !== "rascunho" && STATUS_CONTRATO[r.status]
    ? "O contrato continua " + STATUS_CONTRATO[r.status].label + "." : "O contrato voltou para rascunho.";
  toast.success((r && r.situacao === "baixa" ? "Baixa feita só no painel. " : "Envio cancelado. ") + comoFicou);
}

function espacosQueSeriamReservados(c) {
  if (!c || c.status === "assinado" || c.status === "cancelado" || !c.edicao || !S.spaces || !S.sponsors) return [];
  var marca = S.sponsors.find(function (p) { return p.id === c.patrocinadorId; });
  if (!marca) return [];

  var quem = c.signatarios.length ? "Assina: " + esc(c.signatarios.map(function (x) { return x.nome; }).join(", ")) : '<span class="text-muted-foreground">Sem signatários informados</span>';
  return '<article class="' + cn("border border-border bg-card px-4 py-3", c.status === "enviado" && "alerta-amarelo", c.status === "assinado" && c.diasParaVencer !== null && c.diasParaVencer < 0 && "alerta-vermelho") + '">' +

      '<p class="mt-0.5 text-xs text-muted-foreground">' + quem + (c.assinadoEm ? " · assinado em " + esc(formatDateOnly(c.assinadoEm)) : "") + "</p>" +

      (c.arquivoPath ? '<button type="button" class="' + btnCls("outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="abrir-contrato" data-id="' + esc(c.id) + '" title="' + esc(c.arquivoNome) + '">' + icone("paperclip") + " PDF</button>" : '<span class="text-xs text-muted-foreground">sem PDF</span>') +

    "</div></div></article>";

// A data de fim e o que dispara o alerta de vencimento. Se o PDF disser outra coisa do
// que esta preenchido, ninguem percebe sozinho: o numero na tela continua bonitinho.
function divergenciasContrato(c) {

// #/app/contratos?patro=ID: a tela abre so com os contratos daquela marca (botao Contratos dos
// alertas). O filtro mora no endereco: sair pelo menu ou por "Ver todos" limpa sozinho.
function patroFiltroContratos() { return rotaAtual().params.get("patro") || ""; }
function nomeDoPatroFiltro(id) {
  var p = (S.sponsors || []).find(function (x) { return x.id === id; });
  if (p) return p.nome;
  var c = (S.contracts || []).find(function (x) { return x.patrocinadorId === id; });
  return c ? c.patrocinador : "esta marca";
}
function contratosDaMarcaFiltrada() {
  var patro = patroFiltroContratos();
  // a edicao escolhida no topo vale aqui: assim os numeros e a lista contam a mesma coisa
  return (S.contracts || []).filter(function (c) { return (!patro || c.patrocinadorId === patro) && passaEdicao(c.edicao ? [c.edicao] : []); });
}
// Tudo menos o status: e deste recorte que saem os quatro numeros do topo (que sao a
// divisao por status) e, com o status junto, a lista.
function contratosDoRecorte() {
  var f = S.fc, term = f.q.trim().toLocaleLowerCase("pt-BR");
  return contratosDaMarcaFiltrada().filter(function (c) {
    var marca = marcaPorId(c.patrocinadorId);
    if (!passaQuemCuida(marca, f.cuida)) return false;
    if (!passaRenovMarca(marca, f.renov)) return false;
    if (!passaTipoMarca(marca, f.tipo)) return false;
    if (!passaPrazoContrato(c, f.prazo)) return false;
    if (term && [c.patrocinador, c.titulo, c.observacao].concat(c.signatarios.map(function (x) { return x.nome; })).join(" ").toLocaleLowerCase("pt-BR").indexOf(term) < 0) return false;
    return true;
  });
}
function contratosFiltrados() {
  var f = S.fc;
  return contratosDoRecorte().filter(function (c) { return f.status === "todos" || c.status === f.status; });
}
// algum filtro de marca ligado? serve para mostrar o "Limpar filtros"
function filtrosContratoLigados() {
  var f = S.fc;
  return !!(f.q.trim() || f.status !== "todos" || f.cuida !== "todos" || f.renov !== "todos" || f.tipo !== "todos" || f.prazo !== "todos" || patroFiltroContratos());

function blocoListaContratos() {

}

function telaContratos() {

  var status = [{ valor: "todos", rotulo: "Todos os status" }].concat(Object.keys(STATUS_CONTRATO).map(function (k) { return { valor: k, rotulo: STATUS_CONTRATO[k].label }; }));
  var cartao = function (num, rot, cls) { return '<div class="border border-border bg-card px-5 py-4"><span class="' + cn("block text-3xl font-black leading-none", cls) + '">' + num + '</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">' + rot + "</span></div>"; };
  return '<section class="space-y-6">' +

function patroDoContrato(c) { return (S.sponsors || []).find(function (p) { return p.id === c.patrocinadorId; }) || null; }
// contrato sem edicao preenchida usa a edicao do espaco vinculado da marca
function edicaoDoContrato(c) {
  if (c.edicao) return c.edicao;

  return p && p.edicao ? p.edicao : "";
}
function contratosDosValores() {
  var f = S.fv;
  return (S.contracts || []).filter(function (c) {
    if (c.status === "cancelado") return false;
    if (f.tipo === "2027" && !eContrato2027(c)) return false;
    return f.edicao === "todas" || edicaoDoContrato(c) === f.edicao;
  });
}
function temValorContrato(c) { return c.valor != null && isFinite(c.valor); }
// soma por status; contrato sem valor conta na quantidade e fica fora da soma
function somarContratos(lista) {
  var s = { assinado: { n: 0, total: 0 }, enviado: { n: 0, total: 0 }, rascunho: { n: 0, total: 0 }, todos: { n: 0, total: 0 } };
  lista.forEach(function (c) {
    var g = s[c.status];
    if (!g) return;
    var v = temValorContrato(c) ? c.valor : 0;
    g.n++; g.total += v; s.todos.n++; s.todos.total += v;
  });
  return s;
}
// vendedor da marca na carteira; marca sem vendedor devolve chave vazia
function vendedorDoContrato(c) {
  var p = patroDoContrato(c);
  if (!p) return { chave: "", nome: "" };
  var pf = p.vendedorUid ? perfilPorUid(p.vendedorUid) : null;
  var nome = pf ? nomePessoa(pf.id, pf.nome) : String(p.responsavelComercial || "").trim();
  if (p.vendedorUid) return { chave: p.vendedorUid, nome: nome || "Vendedor sem cadastro" };
  return { chave: nome ? "nome:" + chaveMarca(nome) : "", nome: nome };
}
function valoresPorVendedor(lista) {
  var grupos = {};
  lista.forEach(function (c) {
    var v = vendedorDoContrato(c), k = v.chave;
    (grupos[k] = grupos[k] || { chave: k, nome: k ? v.nome : "Sem vendedor", itens: [] }).itens.push(c);
  });
  return Object.keys(grupos).map(function (k) { var g = grupos[k]; g.soma = somarContratos(g.itens); return g; })
    .sort(function (a, b) { return (a.chave ? 0 : 1) - (b.chave ? 0 : 1) || a.nome.localeCompare(b.nome, "pt-BR"); });
}
function valoresPorEdicao(lista) {
  var ed = S.fv.edicao;
  var grupos = EDICOES.filter(function (e) { return ed === "todas" || e.id === ed; }).map(function (e) {
    return { chave: e.id, nome: e.curto, soma: somarContratos(lista.filter(function (c) { return edicaoDoContrato(c) === e.id; })) };
  });
  var sem = lista.filter(function (c) { return !edicaoDoContrato(c); });
  if (sem.length) grupos.push({ chave: "", nome: "Sem edição", soma: somarContratos(sem) });

// espacos pela tabela de precos; disponivel ainda segurado para a marca de 2026 conta a parte
function blocoEspacosValores() {
  if (S.spacesErro) return errorList(S.spacesErro, "recarregar-espacos", S.spacesCarregando);

// renovacao 2027 da base: o painel guarda so a forma de pagamento de cada marca, nao o valor

  var linha2 = [esc(CATEGORIA_ENTREGA[c.categoria]), esc(ORIGEM_ENTREGA[c.origem].label), prazo].filter(Boolean).join(" · ");

        (c.status === "a_conferir" ? '<button type="button" class="' + btnCls("default", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="confirmar-entrega" data-id="' + esc(c.id) + '">' + icone("check") + " Confirmar</button>" : "") +
        '<button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar entrega" title="Editar entrega" data-acao="editar-entrega" data-id="' + esc(c.id) + '">' + icone("pencil") + "</button>" : "") +

function blocoNumerosEntregas(n, extra) {

function entregasDoRecorte() {
  var f = S.fe, term = f.q.trim().toLocaleLowerCase("pt-BR");
  return (S.combinados || []).filter(function (c) {
    if (!passaEdicao(edicoesDaEntrega(c))) return false;
    if (f.patro !== "todos" && (c.patrocinadorId || "p:" + c.prospeccaoId) !== f.patro) return false;
    var marca = marcaPorId(c.patrocinadorId);
    if (!passaQuemCuida(marca, f.cuida)) return false;
    if (!passaRenovMarca(marca, f.renov)) return false;
    if (!passaTipoMarca(marca, f.tipo)) return false;
    if (!passaPrazoEntrega(c, f.prazo)) return false;
    if (term) {
      var pa = (S.sponsors || []).find(function (x) { return x.id === c.patrocinadorId; });
      var ma = (S.prospects || []).find(function (x) { return x.id === c.prospeccaoId; });
      if ([c.descricao, c.comprovacao, pa && pa.nome, ma && ma.nome, CATEGORIA_ENTREGA[c.categoria]].join(" ").toLocaleLowerCase("pt-BR").indexOf(term) < 0) return false;
    }
    return true;
  });
}
function filtrosEntregaLigados() {
  var f = S.fe;
  return !!(f.q.trim() || f.status !== "todos" || f.origem !== "todas" || f.patro !== "todos" || f.cuida !== "todos" || f.renov !== "todos" || f.tipo !== "todos" || f.prazo !== "todos");
}
function entregasFiltradas() {
  var f = S.fe;
  return entregasDoRecorte().filter(function (c) {
    if (f.status === "pendentes" ? c.status !== "combinado" : f.status !== "todos" && c.status !== f.status) return false;
    if (f.origem !== "todas" && c.origem !== f.origem) return false;
    return true;
  });
}

    "</div>" +

        selectNativo("combinado-" + c.id, "status", Object.keys(STATUS_ENTREGA).map(function (k) { return { valor: k, rotulo: STATUS_ENTREGA[k].label }; }), c.status, { className: "h-8 w-36 text-xs", disabled: S.combinadoMudando }) +
        (c.status === "a_conferir" ? '<button type="button" class="' + btnCls("default", "default", "h-8 text-xs font-semibold") + '" data-acao="confirmar-entrega" data-id="' + esc(c.id) + '">' + icone("check") + " Confirmar</button>" : "") +

// Propriedades: marcas a esquerda, entregas da marca escolhida a direita. No celular vira duas
// telas: a lista, e ao tocar numa marca, as entregas dela com a seta de voltar.
function blocoListaEntregas() {
  if (S.combinadosErro) return errorList(S.combinadosErro, "recarregar-entregas", S.combinadosCarregando);
  if (!S.combinados) return loadingList("Carregando entregas...", 3);
  if (!S.combinados.length) return emptyList("package-check", "Nenhuma entrega registrada ainda", podeMexer() ? "Use Nova entrega, ou leia um contrato com a IA para trazer tudo de uma vez." : "");
  var lista = entregasFiltradas();
  if (!lista.length) return emptyList("package-check", "Nenhuma entrega encontrada", "Ajuste a busca ou os filtros.");

  var grupos = {}, ordem = [];
  lista.forEach(function (c) {
    var chave = c.patrocinadorId || "p:" + c.prospeccaoId;
    if (!grupos[chave]) { grupos[chave] = []; ordem.push(chave); }
    grupos[chave].push(c);
  });
  var nomeDe = function (chave) {
    if (chave.indexOf("p:") === 0) {
      var m = (S.prospects || []).find(function (x) { return x.id === chave.slice(2); });
      return { nome: m ? m.nome : "Marca desejo", sufixo: " · marca desejo", acao: "ficha-marca", id: chave.slice(2) };
    }
    var pt = (S.sponsors || []).find(function (x) { return x.id === chave; });
    return { nome: pt ? pt.nome : "Patrocinador", sufixo: "", acao: "ficha", id: chave };
  };
  var marcas = ordem.map(function (chave) { return { chave: chave, ref: nomeDe(chave), n: contarEntregas(grupos[chave]), itens: grupos[chave] }; });
  // quem tem atraso vem primeiro, depois quem tem mais coisa faltando, depois o nome
  marcas.sort(function (x, y) { return y.n.atrasadas - x.n.atrasadas || y.n.faltam - x.n.faltam || x.ref.nome.localeCompare(y.ref.nome, "pt-BR"); });

  // a marca aberta: a escolhida, se ainda esta na lista; senao a primeira (que e a de mais atraso)
  var escolhida = S.marcaEntregas && grupos[S.marcaEntregas] ? S.marcaEntregas : marcas[0].chave;
  var ativa = marcas.find(function (m) { return m.chave === escolhida; });

  var linhasMarcas = marcas.map(function (m) {
    var ativo = m.chave === escolhida;
    return '<button type="button" class="' + cn("marca-linha", ativo && "marca-linha-ativa") + '" data-acao="entregas-marca" data-chave="' + esc(m.chave) + '" aria-current="' + (ativo ? "true" : "false") + '">' +
      '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">' + esc(m.ref.nome) + (m.ref.sufixo ? '<span class="font-normal text-muted-foreground">' + m.ref.sufixo + "</span>" : "") + "</span>" +
      '<span class="barra-entrega mt-1.5"><i style="width:' + m.n.pct + '%"></i></span></span>' +
      (m.n.total ? '<span class="shrink-0 text-xs text-muted-foreground">' + m.n.entregues + "/" + m.n.total + "</span>" : "") +
      (m.n.aConferir ? '<span class="selo-conferir" title="Lidas do contrato pela IA, esperando conferência">' + m.n.aConferir + " a conferir</span>" : "") +
      (m.n.atrasadas ? '<span class="selo-atraso" title="' + m.n.atrasadas + (m.n.atrasadas > 1 ? " entregas atrasadas" : " entrega atrasada") + '">' + m.n.atrasadas + "</span>" : "") +
      icone("chevron-right", "size-4 shrink-0 text-muted-foreground md:hidden") + "</button>";
  }).join("");

  if (!p) return '<section class="space-y-4"><p class="text-sm text-muted-foreground">' + (marcaNaLixeira("patrocinador", id) ? "Esta marca está na lixeira. Quem excluiu ou a diretoria pode restaurar pela tela Lixeira." : "Não achei esta marca. Abra o relatório pela ficha do patrocinador.") + "</p>" + voltar + "</section>";

  var faltam = ents.filter(function (e) { return e.status === "combinado"; });
  var entregues = ents.filter(function (e) { return e.status === "entregue"; }).sort(function (a, b) { return (b.entregueEm || "").localeCompare(a.entregueEm || ""); });
  var conferir = ents.filter(function (e) { return e.status === "a_conferir"; });
  var inters = (S.interactions || []).filter(function (i) { return i.patrocinadorId === p.id; }).slice(0, 8);

  };

    carregando(S.contracts, "Carregando contratos...") || (cts.length ? tabela(
    [{ t: "Contrato" }, { t: "Status" }, { t: "Vigência" }, { t: "Valor", num: true }, { t: "Quem assina" }],

      return "<tr><td><b>" + esc(c.titulo) + "</b>" + (c.edicao ? '<div class="text-xs text-muted-foreground">Edição ' + esc(rotuloEdicao(c.edicao)) + "</div>" : "") + "</td>" +
