<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comercial · Suhai Festival Interlagos</title>
<meta name="theme-color" content="#0B0C0A">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<noscript><meta http-equiv="refresh" content="0; url=https://interlagos-sponsor-cloud.lovable.app/"></noscript>
<style>
  html,body{margin:0;height:100%;background:#0B0C0A}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;
       color:#f5f5f0;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;box-sizing:border-box}
  a{color:#0B0C0A;background:#A6EC4D;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:800;text-transform:uppercase}
</style>
</head>
<body>
<!--
  Painel Comercial do Festival Interlagos.

  O sistema mora no Lovable (interlagos-sponsor-cloud.lovable.app), porque precisa
  de servidor, banco e login, coisas que o GitHub Pages nao roda. Esta pagina so
  leva quem abre /comercial/ direto para o painel.

  Por que redireciona em vez de abrir dentro da pagina (iframe): testado em
  15/09/2026, o painel do Lovable carrega em branco dentro de iframe no Chrome.
  Um iframe de outro site (example.com) aparecia normal no mesmo teste, entao o
  problema e do app do Lovable dentro de moldura, nao da Central.

  Link direto para uma tela: /comercial/#/app/interacoes (o que vem depois do #
  vira o caminho dentro do painel).
-->
<main>
  <span>Abrindo o painel comercial...</span>
  <a id="abrir" href="https://interlagos-sponsor-cloud.lovable.app/">Abrir o painel comercial</a>
</main>
<script>
var VERSAO = "2026-09-15.2";
var ORIGEM = "https://interlagos-sponsor-cloud.lovable.app";

(function(){
  var caminho = (location.hash || "").replace(/^#/, "");
  // so aceita caminho interno do painel, nunca endereco de outro site
  if (!/^\/[A-Za-z0-9\/_\-]*$/.test(caminho)) caminho = "/";
  var destino = ORIGEM + caminho;
  document.getElementById("abrir").href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
