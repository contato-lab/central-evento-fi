    })) : vazio("Nenhum contrato guardado para esta marca."));

  var secEspacos = carregando(S.spaces, "Carregando espaços...") || (esp.length ? tabela(
    [{ t: "Espaço" }, { t: "Edição" }, { t: "Categoria" }, { t: "Tamanho", num: true }, { t: "Status" }],
    esp.map(function (e) {
      return "<tr><td><b>" + esc(e.nome) + "</b></td><td>" + esc(rotuloEdicao(e.edicao) || "—") + "</td><td>" + esc(e.categoria || "—") + "</td>" +
        '<td class="rel-num">' + (e.metragem ? esc(String(e.metragem).replace(".", ",")) + " m²" : "—") + "</td><td>" + esc((STATUS_ESPACO[e.status] || { label: e.status }).label) + "</td></tr>";
    })) : vazio("Nenhum espaço reservado ou vendido para esta marca no mapa."));

  var secFaltam = carregando(S.combinados, "Carregando entregas...") || (faltam.length ? tabela(
    [{ t: "O que falta entregar" }, { t: "Qtd.", num: true }, { t: "Tipo" }, { t: "Prazo" }],
    faltam.map(function (e) {
      return "<tr><td>" + esc(e.descricao) + '<div class="text-xs text-muted-foreground">' + esc(ORIGEM_ENTREGA[e.origem].label) + "</div></td>" +
        '<td class="rel-num">' + esc(qtd(e)) + "</td><td>" + esc(CATEGORIA_ENTREGA[e.categoria]) + "</td>" +
        "<td" + (e.atrasada ? ' class="rel-atrasada"' : "") + ">" + (e.prazo ? (e.atrasada ? "venceu " + esc(textoDias(-diasAte(e.prazo), false)) : esc(formatDateOnly(e.prazo))) : "sem prazo") + "</td></tr>";
    })) : vazio("Nada pendente. Tudo o que foi combinado com esta marca já foi entregue."));

  var secEntregues = S.combinados === null ? "" : (entregues.length ? tabela(
    [{ t: "O que já foi entregue" }, { t: "Qtd.", num: true }, { t: "Tipo" }, { t: "Entregue" }],
    entregues.map(function (e) {
      return "<tr><td>" + esc(e.descricao) + (e.comprovacao ? '<div class="text-xs text-muted-foreground">' + esc(e.comprovacao) + "</div>" : "") + "</td>" +
        '<td class="rel-num">' + esc(qtd(e)) + "</td><td>" + esc(CATEGORIA_ENTREGA[e.categoria]) + "</td>" +
        "<td>" + (e.entregueEm ? esc(formatDateOnly(String(e.entregueEm).slice(0, 10))) : "—") + (nomePessoa(e.entreguePorUid, e.entreguePorNome) ? '<div class="text-xs text-muted-foreground">por ' + esc(nomePessoa(e.entreguePorUid, e.entreguePorNome)) + "</div>" : "") + "</td></tr>";
    })) : vazio("Nenhuma entrega marcada como feita ainda."));

  var secConferir = conferir.length
    ? '<p class="text-sm text-muted-foreground">' + conferir.length + (conferir.length > 1 ? " itens lidos pela IA ainda não foram conferidos" : " item lido pela IA ainda não foi conferido") + " e não entram nas contas acima. Confira em Propriedades.</p>"
    : "";

  var secContatos = carregando(S.interactions, "Carregando contatos...") || (inters.length ? tabela(
    [{ t: "Quando" }, { t: "Como" }, { t: "O que foi falado" }, { t: "Quem" }],
    inters.map(function (i) {
      return '<tr><td style="white-space:nowrap">' + esc(formatDateOnly(String(i.data).slice(0, 10))) + "</td><td>" + esc(i.tipo ? TIPO_INTERACAO[i.tipo] : "Contato") + "</td><td>" + esc(i.observacao || "") + "</td><td>" + esc(quemRegistrou(i) || "—") + "</td></tr>";
    })) : vazio("Nenhum contato registrado com esta marca."));

  return '<section class="relatorio space-y-7">' +
    '<header class="border-b border-border pb-6">' +
      '<div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase text-primary"><span class="h-1 w-8 bg-primary"></span> Relatório do patrocinador</div>' +
      '<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">' +
        '<div class="min-w-0"><h1 class="break-words text-2xl font-black uppercase sm:text-3xl lg:text-4xl">' + esc(p.nome) + "</h1>" +
        '<p class="mt-2 text-sm text-muted-foreground">' + esc(TIPO_PATROCINADOR[p.tipo]) + " · " + esc(st.label) + " · Renovação: " + esc(RENOVACAO[p.renovacao].label) + (p.master ? " · Master" : "") +
          (nomePessoa(p.vendedorUid, p.responsavelComercial) ? " · Vendedor: " + esc(nomePessoa(p.vendedorUid, p.responsavelComercial)) : "") + "</p>" +
        '<p class="mt-1 text-xs text-muted-foreground">Gerado em ' + esc(formatDateTime(agoraIso())) + " por " + esc(S.nome || "") + " · Painel Comercial Festival Interlagos</p></div>" +
        '<div class="nao-imprimir flex shrink-0 flex-wrap gap-2">' + voltar +
          '<button type="button" class="' + btnCls("default", "default", "font-bold uppercase") + '" data-acao="imprimir-relatorio">' + icone("printer") + " Imprimir ou salvar em PDF</button></div>" +
      "</div>" +
    "</header>" +
    '<div class="' + cn("rel-bloco grid gap-3 sm:grid-cols-2", veContratos ? "lg:grid-cols-4" : "lg:grid-cols-3") + '">' +
      (veContratos ? numero(assinados.length ? esc(formatCurrency(valorAssinado)) : "—", "Em contratos assinados") : "") +
      numero(esp.length + (esp.length === 1 ? " espaço" : " espaços"), "Reservados ou vendidos no mapa") +
      '<div class="border border-border bg-card px-5 py-4"><span class="block text-3xl font-black leading-none">' + n.entregues + " de " + n.total + '</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">Entregas feitas (' + n.pct + "%)</span>" +
        (n.total ? '<div class="barra-entrega mt-3"><i style="width:' + n.pct + '%"></i></div>' : "") + "</div>" +
      numero(n.atrasadas + (n.atrasadas === 1 ? " entrega" : " entregas"), "Passaram do prazo", n.atrasadas ? "text-destructive" : "") +
    "</div>" +
    (ehVisualizacao() ? "" : bloco("Contratos", !veContratos || S.contracts === null ? null : cts.length, secContratos)) +
    bloco("Espaços", S.spaces === null ? null : esp.length, secEspacos) +
    bloco("Falta entregar", S.combinados === null ? null : faltam.length, secFaltam + secConferir) +
    (S.combinados === null ? "" : bloco("Já entregue", entregues.length, secEntregues)) +
    (veConversas ? bloco("Últimos contatos", S.interactions === null ? null : inters.length, secContatos) : "") +
  "</section>";
}

/* ------------------------------------------------------ tela: marcas desejo */
function marcasFiltradas() {
  var f = S.fpr;
  var term = f.q.trim().toLocaleLowerCase("pt-BR");
  return (S.prospects || []).filter(function (m) {
    if (!passaEdicao(edicoesDaMarcaDesejo(m))) return false;
    if (f.estagio === "andamento") { if (!emAndamento(m)) return false; }
    else if (f.estagio !== "todos" && m.estagio !== f.estagio) return false;
    if (f.mercado !== "todos" && m.mercado !== f.mercado) return false;
    if (f.vendedor !== "todos" && (m.vendedorUid || "") !== f.vendedor) return false;
    if (term) {
      var texto = [m.nome, m.contato, m.espacoInteresse, m.vendedorNome, nomePessoa(m.vendedorUid, m.vendedorNome), MERCADOS[m.mercado], m.proximaAcao].join(" ").toLocaleLowerCase("pt-BR");
      if (texto.indexOf(term) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return ordemEstagio(a) - ordemEstagio(b) || porNome(a, b); });
}

function blocoFunil() {
  var f = S.fpr;
  var lista = (S.prospects || []).filter(function (m) { return passaEdicao(edicoesDaMarcaDesejo(m)); });
  var andamento = lista.filter(emAndamento);
  var esfr = andamento.filter(function (m) { return m.esfriando; }).length;
  var atras = andamento.filter(function (m) { return m.atrasada; }).length;
  var caixa = function (k) {
    var n = lista.filter(function (m) { return m.estagio === k; }).length;
    var ativo = f.estagio === k;
    return '<button type="button" class="' + cn("border px-3 py-3 text-left transition-colors", ativo ? "border-primary bg-primary/15" : "border-border bg-card hover:bg-muted/50") + '" data-acao="filtro-estagio" data-estagio="' + k + '" aria-pressed="' + (ativo ? "true" : "false") + '">' +
      '<span class="block text-2xl font-black leading-none">' + n + '</span><span class="mt-1 block text-xs font-bold uppercase text-muted-foreground">' + esc(ESTAGIOS[k].label) + "</span></button>";
  };
  return '<div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-6">' + Object.keys(ESTAGIOS).map(caixa).join("") + "</div>" +
    '<p class="mt-2 text-xs text-muted-foreground">' + andamento.length + " em andamento" + (esfr ? " · " + esfr + " esfriando" : "") + (atras ? " · " + atras + " com ação atrasada" : "") +
    ' · <button type="button" class="underline" data-acao="filtro-estagio" data-estagio="andamento">ver só em andamento</button> · <button type="button" class="underline" data-acao="filtro-estagio" data-estagio="todos">ver todas</button></p>';
}

function blocoListaMarcas() {
  if (S.prospectsErro) return errorList(S.prospectsErro, "recarregar-marcas", S.prospectsCarregando);
  if (!S.prospects) return loadingList("Carregando marcas desejo...");
  if (!S.prospects.length) return emptyList("target", "Nenhuma marca desejo ainda", podeMexer() ? "Use o botão Nova marca desejo para começar o funil." : "");
  var lista = marcasFiltradas();
  if (!lista.length) return emptyList("target", "Nenhuma marca encontrada", "Ajuste a busca ou os filtros.");
  var th = function (cls, txt) { return '<th class="' + cn(TH, cls) + '">' + txt + "</th>"; };
  // Visualizacao: estagio vira selo, sem lapis e sem a coluna de contato (vem do historico de conversas)
  var mexe = podeMexer(), conversas = podeVerConversas();
  var editar = function (m) { if (!mexe) return ""; return '<button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar ' + esc(m.nome) + '" title="Editar marca desejo" data-acao="editar-marca" data-id="' + esc(m.id) + '">' + icone("pencil") + "</button>"; };
  var nomeBtn = function (m) { return '<button type="button" class="text-left font-bold hover:underline" data-acao="ficha-marca" data-id="' + esc(m.id) + '">' + esc(m.nome) + "</button>"; };
  var estagioCtl = function (m) {
    if (m.estagio === "fechada") return badge(ESTAGIOS.fechada, "whitespace-nowrap") + (m.patrocinadorId ? '<div class="mt-1 text-xs"><button type="button" class="text-primary hover:underline" data-acao="ficha" data-id="' + esc(m.patrocinadorId) + '">ver patrocinador</button></div>' : "");
    if (!mexe) return badge(ESTAGIOS[m.estagio], "whitespace-nowrap");
    return selectNativo("estagio-" + m.id, "estagio", Object.keys(ESTAGIOS).map(function (k) { return { valor: k, rotulo: ESTAGIOS[k].label }; }), m.estagio, { className: "h-8 w-40", disabled: S.estagioMudando });
  };
  var proxima = function (m) {
    if (!m.proximaAcao && !m.proximaAcaoData) return '<span class="text-muted-foreground">Nada marcado</span>';
    return '<div class="' + cn(m.atrasada && "font-semibold text-destructive") + '">' + esc(m.proximaAcao || "Ação sem descrição") + "</div>" +
      (m.proximaAcaoData ? '<div class="' + cn("mt-0.5 text-xs", m.atrasada ? "text-destructive" : "text-muted-foreground") + '">' + (m.atrasada ? "venceu " + esc(textoDias(-diasAte(m.proximaAcaoData), false)) : esc(formatDateOnly(m.proximaAcaoData))) + "</div>" : "");
  };
  var contato = function (m) {
    var txt = m.ultimoContato ? "contato " + esc(textoDias(m.diasParado, false)) : "sem contato" + (m.diasParado !== null ? ", no funil " + esc(textoDias(m.diasParado, false)) : "");
    return '<span class="' + (emAndamento(m) ? "" : "text-muted-foreground") + '">' + txt + "</span>" + (m.esfriando ? '<div class="mt-1">' + badge(SELO_ESFRIANDO, "whitespace-nowrap") + "</div>" : "");
  };
  var vend = function (m) { var n = nomePessoa(m.vendedorUid, m.vendedorNome); return n ? esc(n) : '<span class="text-muted-foreground">Ninguém ainda</span>'; };
  var esp = function (m) { return m.espacoInteresse ? esc(m.espacoInteresse) : '<span class="text-muted-foreground">A definir</span>'; };
  var linhas = lista.map(function (m) {
    return '<tr class="' + cn(TR, m.atrasada && "bg-primary/8 hover:bg-primary/12") + '">' +
      '<td class="' + cn(TD, "px-5 py-4") + '">' + nomeBtn(m) + '<div class="text-xs text-muted-foreground">' + esc(MERCADOS[m.mercado]) + (m.contato ? " · " + esc(m.contato) : "") + "</div></td>" +
      '<td class="' + TD + '">' + estagioCtl(m) + "</td>" +
      '<td class="' + TD + '">' + vend(m) + "</td>" +
      '<td class="' + TD + '">' + esp(m) + "</td>" +
      '<td class="' + cn(TD, "max-w-56") + '">' + proxima(m) + "</td>" +
      (conversas ? '<td class="' + cn(TD, "whitespace-nowrap text-xs") + '">' + contato(m) + "</td>" : "") +
      (mexe ? '<td class="' + TD + '">' + editar(m) + "</td>" : "") + "</tr>";
  }).join("");
  var cards = lista.map(function (m) {
    return '<article class="' + cn("border border-border bg-card p-4", m.atrasada && "border-primary bg-primary/8") + '">' +
      '<div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="break-words">' + nomeBtn(m) + "</h2>" +
      '<div class="mt-1 text-xs text-muted-foreground">' + esc(MERCADOS[m.mercado]) + (m.contato ? " · " + esc(m.contato) : "") + "</div></div>" +
      '<div class="flex shrink-0 items-center gap-1">' + editar(m) + "</div></div>" +
      '<div class="mt-3">' + estagioCtl(m) + "</div>" +
      (conversas ? '<div class="mt-2 text-xs">' + contato(m) + "</div>" : "") +
      '<dl class="mt-4 space-y-3 text-sm">' +
        '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Próxima ação</dt><dd class="mt-0.5">' + proxima(m) + "</dd></div>" +
        '<div class="flex flex-wrap items-end justify-between gap-3 border-t border-border pt-3">' +
          '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Vendedor</dt><dd class="mt-0.5">' + vend(m) + "</dd></div>" +
          '<div><dt class="text-xs font-bold uppercase text-muted-foreground">Espaço de interesse</dt><dd class="mt-0.5">' + esp(m) + "</dd></div>" +
        "</div>" +
      "</dl></article>";
  }).join("");
  return '<div class="hidden overflow-hidden border border-border bg-card md:block"><div class="relative w-full overflow-auto"><table class="w-full caption-bottom text-sm">' +
    '<thead class="[&_tr]:border-b bg-muted"><tr class="' + cn(TR, "hover:bg-muted") + '">' +
      th("px-5 text-xs font-bold uppercase text-background", "Marca") + th("text-xs font-bold uppercase text-background", "Estágio") +
      th("text-xs font-bold uppercase text-background", "Vendedor") + th("text-xs font-bold uppercase text-background", "Espaço de interesse") +
      th("text-xs font-bold uppercase text-background", "Próxima ação") + (conversas ? th("text-xs font-bold uppercase text-background", "Contato") : "") +
      (mexe ? th("w-14", '<span class="sr-only">Editar</span>') : "") +
    '</tr></thead><tbody class="[&_tr:last-child]:border-0">' + linhas + "</tbody></table></div></div>" +
    '<div class="grid gap-3 md:hidden">' + cards + "</div>";
}

function telaMarcas() {
  var f = S.fpr;
  var vendedores = [{ valor: "todos", rotulo: "Todos os vendedores" }].concat((S.perfis || []).map(function (p) { return { valor: p.id, rotulo: rotuloPessoa(p) }; }));
  var estagios = [{ valor: "andamento", rotulo: "Em andamento" }, { valor: "todos", rotulo: "Todos os estágios" }].concat(Object.keys(ESTAGIOS).map(function (k) { return { valor: k, rotulo: ESTAGIOS[k].label }; }));
  var mercados = [{ valor: "todos", rotulo: "Todos os mercados" }].concat(Object.keys(MERCADOS).map(function (k) { return { valor: k, rotulo: MERCADOS[k] }; }));
  return '<section class="space-y-6">' +
    '<section class="space-y-3 rounded-md border border-border bg-card p-4">' +
      '<h2 class="text-sm font-semibold">Por setor</h2><div id="bloco-setores">' + blocoSetores() + "</div>" +
      '<h2 class="pt-1 text-sm font-semibold">Por estágio do funil</h2><div id="bloco-funil">' + blocoFunil() + "</div></section>" +
    '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">' +
      '<div class="relative">' + icone("search", "absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground") +
      '<input id="busca-marca" aria-label="Buscar marca desejo" placeholder="Buscar por marca, contato ou espaço" class="' + cn(INPUT, "h-11 bg-card pl-10") + '" value="' + esc(f.q) + '"></div>' +
      selectNativo("filtro-marca-mercado", "filtro-marca-mercado", mercados, f.mercado, { className: "h-11 bg-card" }) +
      selectNativo("filtro-marca-vendedor", "filtro-marca-vendedor", vendedores, f.vendedor, { className: "h-11 bg-card" }) +
      selectNativo("filtro-marca-estagio", "filtro-marca-estagio", estagios, f.estagio, { className: "h-11 bg-card" }) +
    "</div>" +
    '<div id="bloco-lista-marca">' + blocoListaMarcas() + "</div>" +
  "</section>";
}

function cartaoMarcaAcao(m) {
  var motivos = [];
  if (m.atrasada) motivos.push("próxima ação venceu " + textoDias(-diasAte(m.proximaAcaoData), false) + (m.proximaAcao ? ": " + m.proximaAcao : ""));
  if (m.esfriando) motivos.push(m.ultimoContato ? "sem contato " + textoDias(m.diasParado, false) : "nenhum contato desde que entrou no funil, " + textoDias(m.diasParado, false));
  var nomeVendM = nomePessoa(m.vendedorUid, m.vendedorNome);
  var vend = nomeVendM ? esc(nomeVendM) : '<span class="text-muted-foreground">sem responsável</span>';
  return '<article class="cartao-alerta">' +
    '<span class="ponto mt-[7px]" style="background:' + (m.atrasada ? "var(--destructive)" : "var(--warning)") + '"></span>' +
    '<div class="flex min-w-0 flex-1 flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
      '<div class="min-w-0"><h3 class="break-words font-semibold">' + esc(m.nome) + ' <span class="font-normal text-muted-foreground">· ' + esc(ESTAGIOS[m.estagio].label) + "</span></h3>" +
      '<p class="mt-0.5 text-sm text-muted-foreground">' + esc(motivos.join(" · ")) + " · Vendedor: " + vend + "</p></div>" +
      '<div class="flex shrink-0 flex-wrap gap-2">' +
        (podeMexer() ? '<button type="button" class="' + btnCls("outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="nova-interacao" data-patro="p:' + esc(m.id) + '">' + icone("message-square-plus") + " Registrar contato</button>" : "") +
        '<button type="button" class="' + btnCls(podeMexer() ? "ghost" : "outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="ficha-marca" data-id="' + esc(m.id) + '">' + icone("target") + " Abrir</button>" +
      "</div></div></article>";
}

function dialogoProspeccao() {
  var m = S.formProsp.prosp;
  var fechada = !!(m && m.estagio === "fechada");
  var estagios = Object.keys(ESTAGIOS).filter(function (k) { return k !== "fechada" || fechada; }).map(function (k) { return { valor: k, rotulo: ESTAGIOS[k].label }; });
  var mercados = Object.keys(MERCADOS).map(function (k) { return { valor: k, rotulo: MERCADOS[k] }; });
  return '<div class="fixed inset-0 z-50 bg-foreground/80" data-state="open" data-acao="fechar-form-marca"></div>' +
    '<div role="dialog" aria-modal="true" aria-labelledby="titulo-form-marca" data-state="open" class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg max-h-[90vh] overflow-y-auto sm:max-w-xl">' +
      '<div class="flex flex-col space-y-1.5 text-center sm:text-left"><h2 id="titulo-form-marca" class="text-lg font-semibold leading-none tracking-tight text-2xl font-black uppercase">' + (m ? "Editar marca desejo" : "Nova marca desejo") + "</h2>" +
      '<p class="text-sm text-muted-foreground">Marca que queremos trazer: de que mercado, quem corre atrás e qual é o próximo passo.</p></div>' +
      '<form id="form-marca" class="space-y-5 pt-2">' +
        '<div class="space-y-2"><label class="' + LABEL + '" for="marca-nome">Nome da marca</label><input id="marca-nome" name="nome" class="' + INPUT + '" value="' + esc(m ? m.nome : "") + '" required maxlength="120"></div>' +
        '<div class="space-y-2"><label class="' + LABEL + '" for="marca-contato">Contato (opcional)</label><input id="marca-contato" name="contato" placeholder="Nome · e-mail ou telefone" class="' + INPUT + '" value="' + esc(m ? m.contato : "") + '" maxlength="200"></div>' +
        '<div class="grid gap-5 sm:grid-cols-2">' +
          '<div class="space-y-2"><label class="' + LABEL + '" for="marca-mercado">Mercado</label>' + selectNativo("marca-mercado", "mercado", mercados, m ? m.mercado : "telefonia") + "</div>" +
          '<div class="space-y-2"><label class="' + LABEL + '" for="marca-vendedor">Vendedor responsável</label>' + selectVendedor("marca-vendedor", "vendedor_uid", m ? m.vendedorUid : S.uid, true) + "</div>" +

function dialogoFichaProspeccao() {
  var m = (S.prospects || []).find(function (x) { return x.id === S.fichaProsp; });

  var linha = function (rot, val) { return '<div class="flex justify-between gap-4 border-b border-border py-2 text-sm"><dt class="text-xs font-bold uppercase text-muted-foreground">' + rot + '</dt><dd class="text-right">' + val + "</dd></div>"; };
  var combs = combinadosDeMarca(m.id);
  var inters = (S.interactions || []).filter(function (i) { return i.prospeccaoId === m.id; }).slice(0, 5);
  var pend = combs.filter(function (c) { return c.status === "combinado"; }).length;
  var andamento = emAndamento(m);
  var patro = m.patrocinadorId ? (S.sponsors || []).find(function (p) { return p.id === m.patrocinadorId; }) : null;

  var mexe = podeMexer(), conversas = podeVerConversas();
  var botoes = (mexe && andamento ? '<button type="button" class="' + btnCls("outline", "default", "font-bold uppercase") + '" data-acao="nova-interacao" data-patro="p:' + esc(m.id) + '">' + icone("message-square-plus") + " Registrar contato</button>" : "") +
    (mexe ? '<button type="button" class="' + btnCls("outline", "default", "font-bold uppercase") + '" data-acao="editar-marca" data-id="' + esc(m.id) + '">' + icone("pencil") + " Editar</button>" : "") +
    (mexe && andamento ? '<button type="button" class="' + btnCls("default", "default", "font-bold uppercase") + '" data-acao="virou-patro" data-id="' + esc(m.id) + '">' + icone("handshake") + " Virou patrocinador</button>" : "") +
    botaoExcluir("marca", m);
  var proxima = m.proximaAcao || m.proximaAcaoData
    ? '<span class="' + (m.atrasada ? "font-semibold text-destructive" : "") + '">' + esc(m.proximaAcao || "Ação sem descrição") + (m.proximaAcaoData ? " · " + (m.atrasada ? "venceu " + esc(textoDias(-diasAte(m.proximaAcaoData), false)) : esc(formatDateOnly(m.proximaAcaoData))) : "") + "</span>"
    : '<span class="text-muted-foreground">Nada marcado</span>';
  return '<div class="fixed inset-0 z-50 bg-foreground/80" data-state="open" data-acao="fechar-ficha-marca"></div>' +
    '<div role="dialog" aria-modal="true" aria-labelledby="titulo-ficha-marca" data-state="open" class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg max-h-[90vh] overflow-y-auto sm:max-w-xl">' +
      '<div class="flex flex-col space-y-1.5 text-center sm:text-left"><h2 id="titulo-ficha-marca" class="text-lg font-semibold leading-none tracking-tight text-2xl font-black uppercase">' + esc(m.nome) + "</h2>" +
      '<div class="flex flex-wrap items-center gap-2 pt-1">' + badge(ESTAGIOS[m.estagio]) + '<span class="' + cn(BADGE, "text-foreground") + '">' + esc(MERCADOS[m.mercado]) + "</span>" + (m.esfriando ? badge(SELO_ESFRIANDO) : "") + (m.atrasada ? badge(SELO_ATRASADA) : "") + '<span class="' + cn(BADGE, "text-foreground border-primary/30 bg-primary/15") + '">Marca desejo</span></div></div>' +
      "<dl>" +
        linha("Contato", m.contato ? esc(m.contato) : '<span class="text-muted-foreground">Ainda não temos</span>') +
        linha("Vendedor responsável", nomePessoa(m.vendedorUid, m.vendedorNome) ? esc(nomePessoa(m.vendedorUid, m.vendedorNome)) : '<span class="text-muted-foreground">Ninguém ainda</span>') +
        linha("Espaço de interesse", m.espacoInteresse ? esc(m.espacoInteresse) : '<span class="text-muted-foreground">A definir</span>') +
        linha("Próxima ação", proxima) +
        (conversas ? linha("Último contato", m.ultimoContato ? esc(formatDateTime(m.ultimoContato)) : '<span class="text-muted-foreground">Nenhum registrado</span>') : "") +
        (m.observacao ? linha("Por que queremos", esc(m.observacao)) : "") +
        (m.estagio === "fechada" ? linha("Virou patrocinador", (m.fechadaEm ? "em " + esc(formatDateOnly(m.fechadaEm)) + " · " : "") + (patro ? '<button type="button" class="font-bold text-primary hover:underline" data-acao="ficha" data-id="' + esc(patro.id) + '">ver na carteira</button>' : '<span class="text-muted-foreground">cadastro não encontrado</span>')) : "") +
      "</dl>" +
      (botoes ? '<div class="flex flex-wrap gap-2">' + botoes + "</div>" : "") +
      blocoFilaDaMarca("marca", m.id, andamento) +
      (m.estagio === "fechada" ? "" :
      '<section class="space-y-3"><h3 class="flex items-center gap-2 text-sm font-black uppercase">' + icone("package-check", "size-4 text-primary") + " Propriedades " +
        '<span class="font-normal text-muted-foreground">(' + combs.length + (pend ? ", " + pend + " a entregar" : "") + ")</span></h3>" +

      "</section>") +
      (conversas ? '<section class="space-y-3"><h3 class="flex items-center gap-2 text-sm font-black uppercase">' + icone("history", "size-4 text-primary") + " Últimas interações</h3>" +
        (S.interactions === null ? loadingList("Carregando interações...", 1) : (inters.length ? inters.map(function (i) { return cartaoInteracao(i, true); }).join("") : '<p class="border border-dashed border-border px-4 py-4 text-center text-sm text-muted-foreground">Nenhuma interação registrada com esta marca.</p>')) +
      "</section>" : "") +
      '<button type="button" data-acao="fechar-ficha-marca" class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background cursor-pointer transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none">' + icone("x", "h-4 w-4") + '<span class="sr-only">Close</span></button>' +
    "</div>";
}

function iniciarTour() {
  marcarTutorialVisto();
  S.ficha = null; S.fichaProsp = null; S.tourAbriuFicha = false;
  S.tour = { ativo: true, passo: 0, esperando: false };
  irPassoTour(0);
}
function sairTour() {
  S.tour = { ativo: false, passo: 0, esperando: false };
  if (S.tourAbriuFicha) { S.ficha = null; S.tourAbriuFicha = false; }
  var t = document.getElementById("tour");
  if (t) t.remove();
  render();
}
function esperarAlvo(seletor, ms) {
  return new Promise(function (res) {
    var inicio = Date.now();
    (function tenta() {
      var el = document.querySelector(seletor);
      var carregando = el && el.querySelector('[aria-busy="true"]');
      if (el && !carregando) return res(el);
      if (Date.now() - inicio > ms) return res(el || null);
      setTimeout(tenta, 150);
    })();
  });
}
async function irPassoTour(n) {
  var passos = passosTour();
  if (n < 0) n = 0;
  if (n >= passos.length) { sairTour(); return; }
  var p = passos[n];
  S.tour.passo = n; S.tour.esperando = !!p.alvo;
  if (S.tourAbriuFicha && p.abrir !== "ficha") { S.ficha = null; S.tourAbriuFicha = false; }
  if (p.rota && rotaAtual().caminho !== p.rota) irPara(p.rota); else render();
  desenharTour();
  var el = null;
  if (p.alvo) {
    if (p.abrir === "ficha") {
      var botao = await esperarAlvo("#bloco-lista-patro [data-acao=ficha]", 6000);
      if (S.tour.passo !== n || !S.tour.ativo) return;
      if (botao) { S.ficha = botao.getAttribute("data-id"); S.tourAbriuFicha = true; render(); }
    }
    el = await esperarAlvo(p.alvo, 6000);
    if (S.tour.passo !== n || !S.tour.ativo) return;
    if (el) {
      // trecho mais alto que a tela: alinha o topo logo abaixo do cabecalho; senao centraliza
      var alto = el.getBoundingClientRect().height > window.innerHeight * 0.75;
      try {
        if (alto) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" });
        else el.scrollIntoView({ block: "center", behavior: "smooth" });
      } catch (e) { el.scrollIntoView(); }
      await new Promise(function (r) { setTimeout(r, 420); });
      if (S.tour.passo !== n || !S.tour.ativo) return;
    }
  }
  S.tour.esperando = false;
  desenharTour();
}
function desenharTour() {
  var t = document.getElementById("tour");
  if (!S.tour.ativo) { if (t) t.remove(); return; }
  if (!t) { t = document.createElement("div"); t.id = "tour"; document.body.appendChild(t); }
  var passos = passosTour();
  var n = S.tour.passo, p = passos[n];
  var marca = n + ":" + (S.tour.esperando ? "1" : "0");
  if (t.getAttribute("data-marca") !== marca) {
    t.setAttribute("data-marca", marca);
    t.innerHTML = '<div class="tour-escuro"></div>' +
      '<div class="tour-cartao" role="dialog" aria-modal="false" aria-labelledby="tour-titulo">' +
        '<div class="flex items-center justify-between gap-3"><span class="tour-passo">Tutorial de uso · ' + (n + 1) + " de " + passos.length + '</span>' +
          '<button type="button" class="text-xs font-bold uppercase text-muted-foreground hover:text-foreground" data-acao="tour-sair">Sair</button></div>' +
        '<h3 id="tour-titulo">' + esc(p.titulo) + "</h3>" + p.texto +
        (S.tour.esperando ? '<p class="text-xs text-muted-foreground">Abrindo a tela...</p>' : "") +
        '<div class="mt-4 flex items-center justify-between gap-2">' +
          '<button type="button" class="' + btnCls("outline", "default", "h-9 text-xs font-bold uppercase") + '" data-acao="tour-voltar"' + (n === 0 ? " disabled" : "") + ">Voltar</button>" +
          '<button type="button" class="' + btnCls("default", "default", "h-9 text-xs font-bold uppercase") + '" data-acao="tour-proximo">' + (n === passos.length - 1 ? "Concluir" : "Próximo") + "</button>" +
        "</div></div>";
  }
  posicionarTour();
}
function posicionarTour() {
  var t = document.getElementById("tour");
  if (!t || !S.tour.ativo) return;
  var p = passosTour()[S.tour.passo];
  var el = p && p.alvo && !S.tour.esperando ? document.querySelector(p.alvo) : null;
  var escuro = t.querySelector(".tour-escuro, .tour-foco");
  var cartao = t.querySelector(".tour-cartao");
  if (!escuro || !cartao) return;
  if (el) {
    var r = el.getBoundingClientRect(), pad = 6;
    escuro.className = "tour-foco";
    escuro.style.cssText = "top:" + (r.top - pad) + "px;left:" + (r.left - pad) + "px;width:" + (r.width + 2 * pad) + "px;height:" + (r.height + 2 * pad) + "px";
    var largura = Math.min(420, window.innerWidth - 32);
    var altura = cartao.offsetHeight || 240;
    var left = Math.max(16, Math.min(r.left, window.innerWidth - largura - 16));
    var top;
    if (r.bottom + 12 + altura <= window.innerHeight) top = r.bottom + 12;
    else if (r.top - 12 - altura >= 0) top = r.top - 12 - altura;
    else if (r.right + 12 + largura <= window.innerWidth) { top = Math.max(16, Math.min(r.top, window.innerHeight - altura - 16)); left = r.right + 12; }
    else top = Math.max(16, window.innerHeight - altura - 16);
    cartao.style.cssText = "top:" + top + "px;left:" + left + "px";
  } else {
    escuro.className = "tour-escuro";
    escuro.style.cssText = "";
    cartao.style.cssText = "top:50%;left:50%;transform:translate(-50%,-50%)";
  }
}
window.addEventListener("resize", function () { if (S.tour.ativo) requestAnimationFrame(posicionarTour); });
window.addEventListener("scroll", function () { if (S.tour.ativo) requestAnimationFrame(posicionarTour); }, true);

var FORA_DA_VISUALIZACAO = { contracts: 1, interactions: 1, lixeira: 1 };
async function carregar(chave, fn) {
  if (ehVisualizacao() && FORA_DA_VISUALIZACAO[chave]) return;
  S[chave + "Carregando"] = true;
  S[chave + "Erro"] = null;
  render();
  try { S[chave] = await fn(); }
  catch (e) { S[chave] = null; S[chave + "Erro"] = e.message; }
  S[chave + "Carregando"] = false;
  render();
  // assim que contratos, espacos e marcas estiverem na mao, uma vez por sessao
  if (!S.reservasConferidas && S.contracts && S.spaces && S.sponsors) {

  }

  if (!S.leiturasConferidas && S.contracts && S.combinados) {

  }
}

/* ------------------------------------------------------ atualizacao ao vivo */
// Nas telas de Contratos e Espacos o painel escuta o banco. Quando a DocuSign devolve um
// contrato assinado, a funcao reserva um espaco ou outra pessoa muda alguma coisa, a tela
// se refaz sozinha, sem F5. Nunca redesenha com formulario aberto ou com alguem digitando,
// para nao apagar o que a pessoa escreveu: espera ela terminar.
var AO_VIVO = {
  "/app/contratos": { colecoes: ["contratos", "espacos", "patrocinadores"], dados: ["contracts", "spaces", "sponsors"] },
  "/app/espacos": { colecoes: ["espacos", "patrocinadores"], dados: ["spaces", "overview"] },
};
var CARREGADORES = { contracts: getContracts, spaces: getSpaces, sponsors: getSponsors, overview: getSpacesOverview };
var aoVivo = { rota: null, desligar: [], timer: null, esperando: null, rodando: false, denovo: false };

function ligarAoVivo(caminho) {
  var rota = AO_VIVO[caminho] && S.user && API && API.escutar ? caminho : null;
  if (aoVivo.rota === rota) return;
  aoVivo.desligar.forEach(function (f) { try { f(); } catch (e) {} });
  aoVivo.desligar = [];
  aoVivo.rota = rota;
  clearTimeout(aoVivo.timer); clearTimeout(aoVivo.esperando);
  if (!rota) return;
  AO_VIVO[rota].colecoes.forEach(function (col) {
    try { aoVivo.desligar.push(API.escutar(col, agendarAoVivo)); } catch (e) {}
  });
  // voltou para a tela com dados guardados de antes: confere uma vez se algo mudou nesse meio tempo
  if (AO_VIVO[rota].dados.some(function (k) { return S[k]; })) agendarAoVivo();
}

// varias gravacoes em sequencia (uma reserva mexe em varios espacos) viram uma atualizacao so
function agendarAoVivo() {
  clearTimeout(aoVivo.timer);
  aoVivo.timer = setTimeout(atualizarAoVivo, 800);
}

async function atualizarAoVivo() {
  var cfg = AO_VIVO[aoVivo.rota];
  if (!cfg) return;
  if (aoVivo.rodando) { aoVivo.denovo = true; return; }
  aoVivo.rodando = true;
  try {
    // so o que ja esta na tela; o que ainda esta carregando pela primeira vez fica com o carregar()
    var chaves = cfg.dados.filter(function (k) { return S[k] && !S[k + "Carregando"]; });
    var novos = await Promise.all(chaves.map(function (k) { return CARREGADORES[k]().catch(function () { return null; }); }));
    if (AO_VIVO[aoVivo.rota] !== cfg) return; // saiu da tela no meio
    var antes = S.contracts;
    chaves.forEach(function (k, i) { if (novos[i]) S[k] = novos[i]; });
    if (S.contracts !== antes) avisarContratoQueMudou(antes, S.contracts);
    redesenharQuandoLivre();
  } finally {
    aoVivo.rodando = false;
    if (aoVivo.denovo) { aoVivo.denovo = false; agendarAoVivo(); }
  }
}

// O que a propria pessoa fez nesta tela ja ganha aviso no clique; aqui so o que veio de fora.
function marcarMexidaPropria(id) { if (id) S.mexidaPropria[id] = Date.now(); }
function avisarContratoQueMudou(antes, depois) {
  if (!antes || !depois) return;
  var velho = {};
  antes.forEach(function (c) { velho[c.id] = c; });
  depois.forEach(function (c) {
    var v = velho[c.id];
    if (!v || Date.now() - (S.mexidaPropria[c.id] || 0) < 30000) return;
    var qual = c.titulo + " (" + c.patrocinador + ")";
    if (c.status === "assinado" && v.status !== "assinado") toast.success("Contrato assinado agora: " + qual + ".");
    else if (c.assinatura && c.assinatura.status === "recusado" && !(v.assinatura && v.assinatura.status === "recusado")) toast.error("Recusaram assinar: " + qual + ".");
  });
}

function ocupadoParaRedesenhar() {
  if (S.form.aberto || S.formPatro.aberto || S.formInter.aberto || S.formProsp.aberto || S.formContrato.aberto || S.formEntrega.aberto) return true;
  if (S.ficha || S.fichaProsp || menuAberto) return true;
  var a = document.activeElement;
  return !!(a && a.matches && a.matches('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]), textarea, select, [contenteditable="true"]'));
}

function redesenharQuandoLivre() {
  clearTimeout(aoVivo.esperando);
  if (!aoVivo.rota) return;
  if (ocupadoParaRedesenhar()) { aoVivo.esperando = setTimeout(redesenharQuandoLivre, 1500); return; }
  // janela com rolagem propria (detalhe do espaco, zona ampliada) volta para onde estava
  var rolagens = [];
  document.querySelectorAll('#app [role="dialog"]').forEach(function (d, i) {
    var chave = d.getAttribute("aria-labelledby") || "janela-" + i;
    [d].concat(Array.prototype.slice.call(d.querySelectorAll(".overflow-y-auto, .overflow-auto"))).forEach(function (el, j) {
      if (el.scrollTop) rolagens.push({ chave: chave, i: i, j: j, topo: el.scrollTop });
    });
  });
  render();
  rolagens.forEach(function (r) {
    var janelas = document.querySelectorAll('#app [role="dialog"]');
    var d = document.querySelector('#app [role="dialog"][aria-labelledby="' + r.chave + '"]') || janelas[r.i];
    if (!d) return;
    var el = [d].concat(Array.prototype.slice.call(d.querySelectorAll(".overflow-y-auto, .overflow-auto")))[r.j];
    if (el) el.scrollTop = r.topo;
  });
}

var menuAberto = null;
function fecharMenu() { if (menuAberto) { menuAberto.remove(); menuAberto = null; } }
function abrirMenu(gatilho, opcoes, atual, aoEscolher) {
  fecharMenu();
  var ret = gatilho.getBoundingClientRect();
  var menu = document.createElement("div");
  menu.setAttribute("role", "listbox");
  menu.className = cn(SELECT_CONTENT, "menu-selecao");
  menu.setAttribute("data-state", "open");
  menu.style.left = ret.left + "px";
  menu.style.minWidth = Math.max(ret.width, 128) + "px";
  var abaixo = window.innerHeight - ret.bottom;
  var altura = opcoes.length * 32 + 10;
  if (abaixo < altura + 8 && ret.top > altura) menu.style.bottom = (window.innerHeight - ret.top + 4) + "px";
  else menu.style.top = (ret.bottom + 4) + "px";
  menu.innerHTML = '<div class="p-1">' + opcoes.map(function (o) {
    var sel = o.valor === atual;
    return '<div role="option" tabindex="-1" aria-selected="' + sel + '" data-valor="' + o.valor + '" class="' + cn(SELECT_ITEM, "hover:bg-accent hover:text-accent-foreground cursor-pointer") + '">' +
      '<span class="absolute right-2 flex h-3.5 w-3.5 items-center justify-center">' + (sel ? icone("check", "h-4 w-4") : "") + "</span>" + esc(o.rotulo) + "</div>";
  }).join("") + "</div>";
  menu.addEventListener("click", function (ev) {
    var item = ev.target.closest("[data-valor]");
    if (!item) return;
    fecharMenu();
    aoEscolher(item.getAttribute("data-valor"));
  });
  document.body.appendChild(menu);
  menuAberto = menu;
}

    if (tela === "entregas") S.fe = { q: "", status: "todos", origem: "todas", patro: "todos", cuida: "todos", renov: "todos", tipo: "todos", prazo: "todos" };
    render();
    return;
  }
  if (acao === "filtro-espaco") { trocarParametro("status", alvo.getAttribute("data-filtro")); render(); return; }
  if (acao === "alerta-aba") { S.alertaAba = alvo.getAttribute("data-aba") || "meus"; render(); return; }
  if (acao === "tema") { mudarTema(temaValendo() === "escuro" ? "claro" : "escuro"); return; }
  if (acao === "tema-escolher") { mudarTema(alvo.getAttribute("data-tema")); return; }
  if (acao === "edicao-global") {
    mudarEdicao(alvo.getAttribute("data-edicao"));
    trocarParametro("edicao", "");
    if (S.fv) S.fv.edicao = filtrandoEdicao() ? edicaoEscolhida() : "todas";
    fecharMenu();
    render();
    return;
  }
  if (acao === "edicao") {
    // aba do mapa: muda a escolha do painel inteiro, para nao ficarem duas verdades
    mudarEdicao(alvo.getAttribute("data-edicao"));
    if (S.fv) S.fv.edicao = edicaoEscolhida();
    trocarParametro("edicao", alvo.getAttribute("data-edicao"));
    fecharMenu();
    render();
    return;
  }
  if (acao === "menu-filtro") {
    var f = filtroAtual();
    abrirMenu(alvo, [{ valor: "todos", rotulo: "Todos os status" }].concat(OPCOES_STATUS), f.filter, function (valor) {
      trocarParametro("status", valor);
      alvo.querySelector("span").textContent = ROTULO_FILTRO[valor];
      document.getElementById("bloco-lista").innerHTML = blocoListaEspacos();
    });
    return;
  }
  if (acao === "menu-status") {
    var espaco = (S.spaces || []).find(function (x) { return x.id === id; });
    abrirMenu(alvo, OPCOES_STATUS, espaco && espaco.status, async function (valor) {
      if (!espaco || valor === espaco.status) return;
      // mudar o status mexe na vez da fila, que depende das marcas: espera elas chegarem
      if (espaco.fila.length && !marcasProntasParaFila()) return;
      S.statusMudando = true; render();
      try {
        await changeSpaceStatus(id, valor, espaco);
        S.statusMudando = false;
        await recarregarEspacos();
        toast.success("Status do espaço atualizado.");
      } catch (e) {
        S.statusMudando = false; render();
        toast.error(e.message);
      }
    });
    return;
  }
  if (acao === "menu-form-status") {
    var campo = document.getElementById("space-status-valor");
    abrirMenu(alvo, OPCOES_STATUS, campo.value, function (valor) {
      campo.value = valor;
      alvo.querySelector("span").textContent = STATUS_ESPACO[valor].label;
    });
    return;
  }
  if (acao === "sugerir") {
    S.sugerindo = id; render();
    try {
      await suggestNextStep(id);
      S.sugerindo = null;
      S.overview = null;
      await carregar("interactions", getInteractions);
      toast.success("Próximo passo sugerido e salvo.");
    } catch (e) {
      S.sugerindo = null; render();
      toast.error(e.message);
    }
    return;
  }
  // lixeira: excluir (manda para a lixeira), restaurar, excluir de vez e filtro da tela
  if (acao === "excluir") { await excluirItem(alvo.getAttribute("data-tipo"), id, alvo); return; }
  if (acao === "lixeira-restaurar") { await restaurarDaLixeira(id); return; }
  if (acao === "lixeira-apagar") { await apagarDeVez(id); return; }
  // espaco na lixeira aberto pelo mapa: a diretoria restaura dali mesmo (so os campos da lixeira)
  if (acao === "restaurar-espaco") {
    if (!ehAdmin()) { toast.error("Só a diretoria restaura espaço."); return; }
    if (!id || S.lixeiraMexendo) return;
    S.lixeiraMexendo = id; render();
    try { await gravarLixeira([{ col: "espacos", id: id }], CAMPOS_RESTAURAR); }
    catch (e) { S.lixeiraMexendo = null; render(); toast.error(erroDeGravacao(e, "restaurar")); return; }
    S.lixeiraMexendo = null;
    toast.success("O espaço voltou para o mapa, com o preço e a fila de antes.");
    await recarregarDepoisDaLixeira();
    if (!S.spaces) await recarregarEspacos();
    return;
  }
  if (acao === "filtro-lixeira") { S.flx = alvo.getAttribute("data-tipo") || "todos"; render(); return; }
  if (acao === "recarregar-lixeira") { carregar("lixeira", getLixeira); return; }
  // tela Valores: contratos de 2027 ou todos, e a edicao
  if (acao === "filtro-valores") {
    var campoV = alvo.getAttribute("data-campo"), valorV = alvo.getAttribute("data-valor");
    if ((campoV === "tipo" && (valorV === "2027" || valorV === "todos")) || (campoV === "edicao" && (valorV === "todas" || EDICOES_IDS.indexOf(valorV) >= 0))) { S.fv[campoV] = valorV; render(); }
    return;
  }
  // equipe: o dono tira ou devolve o acesso (a pessoa nao e apagada, o historico dela fica)
  if (acao === "tirar-acesso" || acao === "devolver-acesso") {
    var pa = perfilPorUid(id);
    if (!pa || !ehDono() || pa.id === S.uid || pa.papel === "dono" || S.papelMudando) return;
    var tirar = acao === "tirar-acesso";
    if (tirar && !window.confirm("Tirar o acesso de " + pa.nome + " ao painel?\n\nA pessoa não entra mais e sai das listas de escolher vendedor e atendimento. O nome continua onde já estava: nas marcas, nos contatos e no histórico.\n\nDá para devolver o acesso depois, aqui mesmo.")) return;
    S.papelMudando = true; render();
    try {
      await API.atualizar("profiles", pa.id, { papel: tirar ? "inativo" : "visualizacao" });
      S.perfis = await getProfiles();
      S.papelMudando = false; render();
      toast.success(tirar ? pa.nome + " não tem mais acesso ao painel." : pa.nome + " voltou a ter acesso, como Visualização. Suba o nível se precisar.");
    } catch (e) { S.papelMudando = false; render(); toast.error("Não foi possível mudar o acesso de " + pa.nome + "."); }
    return;
  }
  if (acao === "recarregar-espacos") { carregar("spaces", getSpaces); return; }
  if (acao === "recarregar-overview") { carregar("overview", getSpacesOverview); return; }
  if (acao === "recarregar-patrocinadores") { carregar("sponsors", getSponsors); return; }
  if (acao === "recarregar-interacoes") { carregar("interactions", getInteractions); return; }
});

      }
      S.formContrato = { aberto: false, contrato: null, patroId: null, salvando: false, modo: "ia", lendo: false, lido: null };

  if (ev.target.id === "form-marca") {

    if (btnM) { btnM.disabled = true; btnM.insertAdjacentHTML("afterbegin", icone("loader-circle", "animate-spin")); }

      await saveProspect(dadosM);
      S.formProsp = { aberto: false, prosp: null, salvando: false };

    } catch (e) {
      S.formProsp.salvando = false;
      if (btnM) { btnM.disabled = false; var spM = btnM.querySelector(".animate-spin"); if (spM) spM.remove(); }
      toast.error(e.message);
    }
    return;
  }
  if (ev.target.id === "form-config") {
    ev.preventDefault();
    var fc = new FormData(ev.target);
    S.configSalvando = true; render();
    try {
      await saveConfig({ moto_data: fc.get("moto_data"), auto_data: fc.get("auto_data"), dias_sem_contato: fc.get("dias_sem_contato"), dias_gatilho_master: fc.get("dias_gatilho_master"),
        prazo_confirmacao: fc.get("prazo_confirmacao"), prazo_sinal: fc.get("prazo_sinal"), prazo_assinatura: fc.get("prazo_assinatura"), prazo_vez_fila: fc.get("prazo_vez_fila") });
      S.configSalvando = false; render();
      toast.success("Parâmetros salvos.");
    } catch (e) { S.configSalvando = false; render(); toast.error(e.message); }
    return;
  }
  if (ev.target.id === "form-patro") {
    ev.preventDefault();
    var fp = new FormData(ev.target);
    var atual = S.formPatro.patro;
    // select travado (quem nao pode trocar os responsaveis) nao vai no envio: ficam os de antes
    var travaP = !!atual && !podeTrocarResponsaveis(atual);
    var dadosP = {
      id: atual ? atual.id : undefined,
      nome: String(fp.get("nome") || ""), contato: String(fp.get("contato") || ""),
      tipo: String(fp.get("tipo") || "patrocinador"), status: String(fp.get("status") || "ativo"),
      vendedorUid: travaP ? atual.vendedorUid : fp.get("vendedor_uid") || null, atendimentoUid: travaP ? atual.atendimentoUid : fp.get("atendimento_uid") || null,
      espacoVinculadoId: fp.get("espaco_vinculado_id") || null,
      contratou: String(fp.get("contratou") || ""),
      renovacao: String(fp.get("renovacao") || "sem_contato"),
      dataVencimentoContrato: String(fp.get("data_vencimento_contrato") || ""),
      master: ehAdmin() ? fp.get("master") === "sim" : (atual ? atual.master : false),
      responsavelComercial: atual ? atual.responsavelComercial : "",
    };
    S.formPatro.salvando = true;
    var btnP = ev.target.querySelector('button[type="submit"]');
    if (btnP) { btnP.disabled = true; btnP.insertAdjacentHTML("afterbegin", icone("loader-circle", "animate-spin")); }
    var deProsp = S.formPatro.deProspeccao || null;
    try {
      var idSalvo = await saveSponsor(dadosP);
      S.formPatro = { aberto: false, patro: null, salvando: false };
      S.spaces = null; S.overview = null;
      var esperasP = [];
      if (deProsp && idSalvo) {
        // primeiro leva o historico junto, depois recarrega (senao o "ultimo contato" do patrocinador novo sai vazio)
        try {
          await concluirFechamento(deProsp, idSalvo);
          S.fichaProsp = null; S.interactions = null; S.combinados = null;
          esperasP.push(carregar("prospects", getProspects), carregar("interactions", getInteractions), carregar("combinados", getCombinados));
        } catch (e2) { toast.error("Patrocinador criado, mas a marca desejo não foi marcada como fechada. Ajuste o estágio na lista."); }
      }
      esperasP.push(carregar("sponsors", getSponsors), carregar("spaces", getSpaces));
      await Promise.all(esperasP);
      toast.success(deProsp ? "Marca desejo fechada. Agora ela é patrocinador." : atual ? "Patrocinador atualizado com sucesso." : "Patrocinador criado com sucesso.");
    } catch (e) {
      S.formPatro.salvando = false;
      if (btnP) { btnP.disabled = false; var spP = btnP.querySelector(".animate-spin"); if (spP) spP.remove(); }
      toast.error(e.message);
    }
    return;
  }
  if (ev.target.id === "form-espaco") {
    ev.preventDefault();
    var form = new FormData(ev.target);
    var rawValue = String(form.get("valor") || "").replace(/\./g, "").replace(",", ".");
    var space = S.form.espaco;
    var rawM2 = String(form.get("metragem") || "").replace(/\./g, "").replace(",", ".").trim();
    var data = {
      id: space ? space.id : undefined,
      statusAntes: space ? space.status : null,
      nome: String(form.get("nome") || ""),
      categoria: String(form.get("categoria") || ""),
      valor: Number(rawValue),
      status: String(form.get("status") || "disponivel"),
      metragem: rawM2 === "" ? null : Number(rawM2),
      ocupante2026: String(form.get("ocupante_2026") || ""),
      vendedorUid: form.get("vendedor_uid") || null,
      mapa: form.get("mapa") || null, edicao: form.get("edicao") || null, zona: form.get("zona") || null,
      codigo: form.get("codigo") || null, tipo: form.get("tipo") || null,
    };
    // mudar o status de espaco com fila mexe na vez, que depende das marcas: espera elas chegarem
    if (space && data.status !== space.status && space.fila.length && !marcasProntasParaFila()) return;
    S.form.salvando = true;
    var btn = ev.target.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.insertAdjacentHTML("afterbegin", icone("loader-circle", "animate-spin")); }
    try {
      await saveSpace(data);
      S.form = { aberto: false, espaco: null, salvando: false, prefill: null };
      await recarregarEspacos();
      toast.success(space ? "Espaço atualizado com sucesso." : "Espaço criado com sucesso.");
    } catch (e) {
      S.form.salvando = false;
      if (btn) { btn.disabled = false; var sp = btn.querySelector(".animate-spin"); if (sp) sp.remove(); }
      toast.error(e.message);
    }
  }
});

document.addEventListener("keydown", function (ev) {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.closest && ev.target.closest('[data-acao="mapa-espaco"], [data-acao="ampliar-zona"]')) {
    ev.preventDefault(); ev.target.closest('[data-acao="mapa-espaco"], [data-acao="ampliar-zona"]').click(); return;
  }
  if (S.tour.ativo && !ev.target.matches("input, textarea, select")) {
    if (ev.key === "Escape") { sairTour(); return; }
    if (ev.key === "ArrowRight") { ev.preventDefault(); irPassoTour(S.tour.passo + 1); return; }
    if (ev.key === "ArrowLeft") { ev.preventDefault(); irPassoTour(S.tour.passo - 1); return; }
  }
  if (ev.key !== "Escape") return;
  if (menuAberto) { fecharMenu(); return; }
  if (S.equipeEditando && !S.equipeSalvando) { S.equipeEditando = null; render(); return; }
  if (S.form.aberto && !S.form.salvando) { S.form.aberto = false; render(); return; }
  if (S.formPatro.aberto && !S.formPatro.salvando) { S.formPatro.aberto = false; render(); return; }
  if (S.formInter.aberto && !S.formInter.salvando) { S.formInter.aberto = false; render(); return; }
  if (S.formProsp.aberto && !S.formProsp.salvando) { S.formProsp.aberto = false; render(); return; }
  if (S.formContrato.aberto && !S.formContrato.salvando) { S.formContrato.aberto = false; render(); return; }
  if (S.formEntrega.aberto && !S.formEntrega.salvando) { S.formEntrega.aberto = false; render(); return; }
  if (S.ficha) { S.ficha = null; render(); return; }
  if (S.fichaProsp) { S.fichaProsp = null; render(); return; }
  if (S.detalhe) { S.detalhe = null; render(); return; }
  if (S.ampliada) { S.ampliada = null; render(); }
});

/* ------------------------------------------------------------------- inicio */
// Aviso de versao nova: o painel e uma pagina so e nao recarrega sozinho, e o navegador guarda a
// versao antiga por um tempo. A cada 5 minutos confere a versao publicada; se mudou, avisa e
// oferece atualizar (o aviso fica 10 minutos e volta na proxima conferencia se ninguem clicar).
var avisandoVersao = false;
function conferirVersao() {
  if (avisandoVersao || MODO_TESTE) return;
  fetch("index.html?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
    var m = t.match(/var VERSAO = "([^"]+)"/);
    if (!m || m[1] === VERSAO) return;
    avisandoVersao = true;
    setTimeout(function () { avisandoVersao = false; }, 600000);
    toast("success", "Tem uma versão nova do painel.", { rotulo: "Atualizar", ms: 600000, fn: function () { location.reload(); } });
  }).catch(function () {});
}
// fora do navegador (conferencia de codigo) nao existe timer: so liga quando existe
if (typeof setInterval === "function") setInterval(conferirVersao, 5 * 60 * 1000);

(async function iniciar() {
  ouvirTemaDoComputador();
  render();
  try {
    API = MODO_TESTE ? await criarApiTeste() : await criarApiFirebase();
  } catch (e) {
    document.getElementById("app").innerHTML = pageLoading("Não foi possível carregar o painel. Recarregue a página.");
    return;
  }
  API.aoMudarLogin(async function (user) {
    if (user && !user.emailVerified) user = null;
    S.user = user;
    if (user) {
      var perfil = await API.perfil(user);
      S.uid = user.uid; S.nome = perfil.nome; S.papel = perfil.papel;
      S.apelido = perfil.apelido || ""; S.fotoUrl = perfil.fotoUrl || ""; S.fotoPath = perfil.fotoPath || ""; S.email = perfil.email || user.email || "";
      try { S.perfis = await getProfiles(); } catch (e) { S.perfis = []; }
    } else {
      S.uid = null; S.papel = "vendedor"; S.perfis = null; S.config = null; S.combinados = null; S.ficha = null;
      S.prospects = null; S.fichaProsp = null; S.formProsp = { aberto: false, prosp: null, salvando: false };
      S.tour = { ativo: false, passo: 0, esperando: false }; S.tourAbriuFicha = false;
      S.ampliada = null; S.ampliadaModo = "grade";
      S.contracts = null; S.formContrato = { aberto: false, contrato: null, patroId: null, salvando: false, modo: "ia", lendo: false, lido: null }; S.fc = { q: "", status: "todos", vendedor: "todos" }; S.fv = { tipo: "2027", edicao: "todas" };
      S.formEntrega = { aberto: false, entrega: null, patroId: null, marcaId: null, salvando: false }; S.fe = { q: "", status: "todos", origem: "todas", patro: "todos" };
      var tourEl = document.getElementById("tour"); if (tourEl) tourEl.remove();
      S.fpr = { q: "", mercado: "todos", vendedor: "todos", estagio: "andamento" };
      S.formInter = { aberto: false, patroId: null, salvando: false };
      S.formPatro = { aberto: false, patro: null, salvando: false };
      S.saindo = false;
      S.regraAplicada = false;
      S.spaces = S.overview = S.sponsors = S.interactions = null;
      S.form = { aberto: false, espaco: null, salvando: false, prefill: null };
      S.detalhe = null;
      S.lixeira = null; S.lixeiraErro = null; S.flx = "todos"; S.lixeiraMexendo = null; S.excluindo = false; EXCLUIDOS = {};
      // Minha conta e Equipe: nada da pessoa anterior fica na tela
      soltarFotoNova(); S.conta = contaVazia(); S.apelido = ""; S.fotoUrl = ""; S.fotoPath = ""; S.email = "";
      S.equipeEditando = null; S.equipeSalvando = false; S.linkMandando = null; S.fotoTirando = null;
      if (S.auth.mode === "recuperar") S.auth.mode = "login";
      ultimaRota = null;
    }
    S.authPronto = true;
    render();
  });
})();

/*
 * Regras do Firestore publicadas no projeto (copia):
 *
 * rules_version = '2';
 * service cloud.firestore {
 *   match /databases/{database}/documents {
 *     function logado() { return request.auth != null && request.auth.token.email_verified == true; }
 *     function tabela() {
 *       return logado() && (
 *         (request.method == 'create' && request.resource.data.criado_por == request.auth.uid) ||
 *         (request.method == 'update' && request.resource.data.criado_por == resource.data.criado_por) ||
 *         request.method == 'delete');
 *     }
 *     match /espacos/{id}        { allow read: if logado(); allow write: if tabela(); }
 *     match /patrocinadores/{id} { allow read: if logado(); allow write: if tabela(); }
 *     match /interacoes/{id}     { allow read: if logado(); allow write: if tabela(); }

 *   }
 * }
 */
