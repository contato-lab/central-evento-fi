<!-- Tipografia das diretrizes: Anton (titulos), Bebas Neue (subtitulos).
     O texto longo pede AmsiPro, que e paga; Barlow e a substituta livre mais proxima. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  /* O app.css e o CSS compilado do app original (Tailwind). Aqui so entra o que
     no original vinha de biblioteca em tempo de execucao: toasts (sonner),
     posicao do menu de selecao e trava de rolagem do dialogo. */
  /* ====================================================================
     Identidade Suhai Festival Interlagos 2026 (diretrizes de marca).
     Cores oficiais: verde #B0F867, preto #000000, branco #FFFFFF.
     As cores de alerta (ambar e vermelho) nao estao na paleta da marca:
     existem so para status e sao usadas em area pequena.
     ==================================================================== */
  :root{
    --marca-verde:#B0F867;
    /* textura de tecido das pecas da marca: gradientes em vez de filtro SVG,
       que numa pagina alta custa caro para o navegador redesenhar. */
    --textura:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
    --background:#000000;
    --foreground:#FFFFFF;
    --card:#0D0D0D;
    --card-foreground:#FFFFFF;
    --popover:#0D0D0D;
    --popover-foreground:#FFFFFF;
    --primary:#B0F867;
    --primary-foreground:#000000;
    --secondary:rgba(255,255,255,.08);
    --secondary-foreground:#FFFFFF;
    --muted:rgba(255,255,255,.07);
    --muted-foreground:rgba(255,255,255,.88);
    --accent:rgba(255,255,255,.1);
    --accent-foreground:#FFFFFF;
    --border:rgba(255,255,255,.2);
    --input:rgba(255,255,255,.32);
    --ring:#B0F867;
    --destructive:#FF5F5F;
    --destructive-foreground:#000000;
    --warning:#FFC24B;
    --warning-foreground:#FFD98A;
    --success:#B0F867;
    --success-foreground:#000000;
    --sidebar:#070707;
    --sidebar-foreground:#FFFFFF;
    --sidebar-primary:#B0F867;
    --sidebar-primary-foreground:#000000;
    --sidebar-accent:rgba(255,255,255,.08);
    --sidebar-accent-foreground:#FFFFFF;
    --sidebar-border:rgba(255,255,255,.18);
    --sidebar-ring:#B0F867;
    --font-sans:"Barlow","Helvetica Neue",Arial,sans-serif;
    --radius:.25rem;
  }
  html{background:#000;color-scheme:dark}
  body{background:#000;color:#fff;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  ::selection{background:var(--marca-verde);color:#000}
  /* textura de fundo das pecas da marca */
  .bg-background{background-image:var(--textura)}
  aside.bg-sidebar,nav.bg-background{background-image:var(--textura)}
  /* Titulos em Anton, subtitulos em Bebas Neue, como no manual */
  h1{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.005em}
  h2,h3{font-family:var(--font-sans);font-weight:700;letter-spacing:0}
  h2.uppercase,h3.uppercase{font-family:"Bebas Neue","Barlow",sans-serif;font-weight:400;letter-spacing:.04em}
  h1,h1[class]{line-height:1.16}
  h2,h3,h2[class],h3[class]{line-height:1.3}
  h2.uppercase,h3.uppercase,h2.uppercase[class],h3.uppercase[class]{line-height:1.2}
  h1,h2,h3{text-wrap:balance}
  p{text-wrap:pretty}
  h2.break-words,h3.break-words{letter-spacing:.03em}
  .text-4xl.font-black,.text-2xl.font-black,.text-3xl.font-black{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.1}
  .text-xs.font-bold.uppercase,thead th{letter-spacing:.07em}
  /* ---- legibilidade e uso ----
     Texto de apoio sempre claro, alvos de toque grandes no celular,
     foco visivel no teclado e respeito a quem pediu menos animacao. */
  body{line-height:1.5;text-rendering:optimizeLegibility}
  .text-xs{font-size:.78rem}
  p,dd,td,li{line-height:1.55}
  table{font-variant-numeric:tabular-nums;min-width:1060px}
  td,th{vertical-align:middle}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,.7)}
  :focus-visible{outline:2px solid var(--marca-verde);outline-offset:2px;border-radius:2px}
  button:disabled,select:disabled,input:disabled{opacity:.6}
  header.sticky{background:rgba(0,0,0,.96);backdrop-filter:blur(10px)}
  input,select,textarea{color:#fff}
  p .inline-flex,dd .inline-flex,h2 .inline-flex,h3 .inline-flex{vertical-align:middle;line-height:1.15}
  label{color:#fff}
  @media (max-width:767px){
    button{min-height:44px}
    select,input,textarea{min-height:44px;font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }

  /* tarja de velocidade abaixo do cabecalho */

  header.sticky::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--marca-verde);opacity:.9}

  .text-sidebar-foreground\/65{color:rgba(255,255,255,.85)}
  .text-background\/65{color:rgba(255,255,255,.85)}
  .toast{opacity:1}
  /* menu lateral: item ativo com aresta verde */
  aside nav a[aria-current="page"]{box-shadow:inset 3px 0 0 #000,0 0 22px -6px var(--marca-verde)}
  nav.fixed a[aria-current="page"]{box-shadow:0 0 22px -8px var(--marca-verde)}

  .bg-card{transition:border-color .15s,background-color .15s}
  button{transition:background-color .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
  button:active{transform:translateY(1px)}
  .bg-primary:hover{box-shadow:0 0 26px -8px var(--marca-verde)}
  /* barra de rolagem no tom da marca */
  *{scrollbar-color:rgba(255,255,255,.25) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border:3px solid #000;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:var(--marca-verde)}
  /* tela de acesso */
  .marca-hero{position:relative;overflow:hidden;background:#000;background-image:var(--textura)}
  .marca-hero::before{content:"";position:absolute;inset:-10%;background:
    radial-gradient(60% 50% at 18% 12%,rgba(176,248,103,.16),transparent 70%),
    radial-gradient(45% 45% at 88% 88%,rgba(176,248,103,.1),transparent 70%)}
  .marca-chevron{position:absolute;border:2px solid rgba(176,248,103,.35);border-radius:26px;transform:skewX(-20deg)}
  .marca-degrade{display:flex;align-items:flex-end;gap:7px;height:26px}
  .marca-degrade i{display:block;background:var(--marca-verde);height:100%}
  .tracking-wider{letter-spacing:.05em}.text-6xl{font-size:3.75rem;line-height:1.16}.w-56{width:14rem}.self-start{align-self:flex-start}
  .marca-pilula{display:inline-flex;align-items:center;border:1.5px solid #fff;border-radius:999px;padding:5px 16px;font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:.09em;line-height:1.1}
  .toaster{position:fixed;top:24px;right:24px;z-index:999999;display:flex;flex-direction:column;gap:14px;width:356px;max-width:calc(100vw - 32px);pointer-events:none}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:16px;border-radius:8px;border:1px solid;font-size:13px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.1);font-family:inherit;animation:toast-in .35s cubic-bezier(.21,1.02,.73,1)}
  .toast svg{width:20px;height:20px;flex-shrink:0}
  .toast{background:#0D0D0D;color:#fff;border-color:rgba(255,255,255,.16);box-shadow:0 14px 34px rgba(0,0,0,.6)}
  .toast.sucesso{background:#0f1a08;color:var(--marca-verde);border-color:rgba(176,248,103,.4)}
  .toast.erro{background:#1a0b0b;color:#FF8A8A;border-color:rgba(255,95,95,.4)}
  .toast.saindo{opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
  @keyframes toast-in{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
  @media (max-width:600px){.toaster{top:16px;right:16px;left:16px;width:auto}}
  .menu-selecao{position:fixed}
  body.dialogo-aberto{overflow:hidden}
  /* classes que o app original nao usava e por isso nao estao no app.css */
  .overflow-x-auto{overflow-x:auto}
  .justify-end{justify-content:flex-end}
  .h-64{height:16rem}
  .bg-destructive\/10{background-color:color-mix(in oklab,var(--destructive) 10%,transparent)}
  @media (min-width:640px){.sm\:p-3{padding:.75rem}}
  .gap-x-3{column-gap:.75rem}.gap-y-1{row-gap:.25rem}.mr-1{margin-right:.25rem}
  .bg-muted\/40{background-color:color-mix(in oklab,var(--muted) 40%,transparent)}.ml-2{margin-left:.5rem}.pt-1{padding-top:.25rem}.text-right{text-align:right}.w-36{width:9rem}
  .min-h-\[60px\]{min-height:60px}.grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}.grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  /* menu do celular: com muitos itens ele rola de lado em vez de espremer */
  .nav-inferior{display:flex;overflow-x:auto;scrollbar-width:none}
  .nav-inferior::-webkit-scrollbar{display:none}
  .nav-inferior>a{flex:1 0 auto;min-width:70px}
  .nav-inferior{position:relative;-webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 22px),transparent 100%)}
  .nav-inferior span{font-size:10px;letter-spacing:-.01em}
  .barra-entrega{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
  .barra-entrega i{display:block;height:6px;background:var(--primary)}
  @media (min-width:1024px){.lg\:flex-row{flex-direction:row}.lg\:items-start{align-items:flex-start}}
  .border-l-2{border-left-width:2px}.italic{font-style:italic}.h-6{height:1.5rem}.w-48{width:12rem}.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}.w-40{width:10rem}
  @media (min-width:1024px){.lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.lg\:grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}}
  @media (min-width:640px){.sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.sm\:items-start{align-items:flex-start}.sm\:p-5{padding:1.25rem}}
  @media (min-width:768px){.md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1024px){.lg\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.lg\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .lg\:grid-cols-\[minmax\(200px\,1\.3fr\)_1fr_1fr_1fr_1fr_1fr\]{grid-template-columns:minmax(200px,1.3fr) 1fr 1fr 1fr 1fr 1fr}}
  /* tutorial de uso: escurece a tela e deixa so o trecho explicado aceso */
  #tour{position:fixed;inset:0;z-index:70;pointer-events:none}
  .tour-foco{position:fixed;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.8),0 0 0 2px var(--marca-verde);pointer-events:none}
  .tour-escuro{position:fixed;inset:0;background:rgba(0,0,0,.8)}
  .tour-cartao{position:fixed;z-index:71;width:min(420px,calc(100vw - 32px));pointer-events:auto;background:var(--background);color:var(--foreground);border:1px solid var(--border);border-top:4px solid var(--primary);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:16px 20px 18px}
  .tour-cartao{background:#0D0D0D;background-image:var(--textura)}
  .tour-cartao h3{font-family:"Bebas Neue",sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-size:1.35rem;line-height:1.18;margin:.5rem 0 .5rem}
  .tour-cartao p{font-size:.875rem;line-height:1.5}
  .tour-cartao p+p{margin-top:.5rem}
  .tour-passo{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--muted-foreground)}
  @media (max-width:767px){.tour-cartao{left:16px!important;right:16px;width:auto;top:auto!important;transform:none!important;bottom:calc(env(safe-area-inset-bottom) + 5.25rem);max-height:55vh;overflow-y:auto}}
  .bloco-lido{position:relative}
  .bloco-lido>.aviso-lido{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:22rem;max-width:calc(100vw - 2.5rem);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s ease,transform .12s ease}
  .bloco-lido:hover>.aviso-lido,.bloco-lido:focus-within>.aviso-lido{opacity:1;visibility:visible;transform:translateY(0)}
  .alerta-vermelho{border-left:4px solid var(--destructive)}.alerta-amarelo{border-left:4px solid var(--warning)}.alerta-azul{border-left:4px solid rgba(255,255,255,.6)}
  @media (min-width:1024px){.lg\:grid-cols-\[minmax\(220px\,1\.4fr\)_1fr_1fr_1fr_1fr\]{grid-template-columns:minmax(220px,1.4fr) 1fr 1fr 1fr 1fr}}
  /* zona ampliada: a mesma zona do mapa em tela cheia, sem nome cortado */
  .mapa-svg .botao-ampliar{cursor:pointer}
  .mapa-svg .botao-ampliar rect{fill:color-mix(in oklab,var(--primary) 16%,transparent);stroke:var(--primary);stroke-width:1}
  .mapa-svg .botao-ampliar:hover rect{fill:var(--primary)}
  .mapa-svg .botao-ampliar:hover text{fill:#000}
  .mapa-svg .botao-ampliar text{fill:var(--primary);font-size:10px;font-weight:800;letter-spacing:.06em}
  .amp{position:fixed;inset:0;z-index:45;background:#000;overflow-y:auto;overscroll-behavior:contain}
  .amp-topo{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.97);backdrop-filter:blur(10px);border-bottom:2px solid var(--primary);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .amp-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .amp-corpo{padding:18px 20px 48px}
  .amp-grade{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
  .amp-cel{text-align:left;border:1px solid;border-radius:4px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:108px;transition:transform .12s,box-shadow .15s;font-family:inherit}

  .amp-cel .meta{font-size:12px;line-height:1.45;margin-top:auto}
  .amp-cel.st-disponivel{background:rgba(176,248,103,.12);border-color:var(--primary);color:#fff}
  .amp-cel.st-disponivel .cod{color:var(--primary)}
  .amp-cel.st-reservado{background:rgba(255,194,75,.15);border-color:var(--warning);color:#fff}

  .amp-cel.st-vendido{background:#fff;border-color:#fff;color:#0a0a0a}
  .amp-cel.st-vendido .cod{color:#0a0a0a}
  .amp-cel.st-vendido .meta{color:#4a4a4a}
  .amp-cel.st-nenhum{background:#0c0c0c;border-color:rgba(255,255,255,.28);border-style:dashed;color:rgba(255,255,255,.8)}

  .amp-cel.risco{outline:2px dashed var(--destructive);outline-offset:2px}
  .amp-cel .meta.sub{margin-top:0;opacity:.85}
  .amp-tab{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  .amp-tab th{position:sticky;top:0;background:#fff;color:#000;text-align:left;padding:9px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .amp-tab td{padding:10px;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:middle}
  .amp-tab tr:hover td{background:rgba(255,255,255,.05)}
  .amp-tab .cod{font-weight:700}
  @media (max-width:767px){
    .amp-grade{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
    .amp-corpo{padding:14px 14px 40px}
    .amp-topo{padding:12px 14px}
    .amp-cel{min-height:96px}
  }
  /* mapa de espacos: cores por status, mesmas dos selos da lista */
  .mapa-svg{display:block;width:100%;min-width:1100px;height:auto;font-family:inherit}

  .mapa-svg .cel{cursor:pointer}

  .mapa-svg .cel:hover rect,.mapa-svg .cel:focus-visible rect{opacity:.8}
  .mapa-svg .cel:focus-visible{outline:none}
  .mapa-svg .cel:focus-visible rect{stroke:var(--ring);stroke-width:3}
  .mapa-svg .zona{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.12)}
  .mapa-svg .st-disponivel rect{fill:rgba(176,248,103,.16);stroke:var(--success)}
  .mapa-svg .st-disponivel text{fill:#e9ffd2}
  .mapa-svg .st-reservado rect{fill:rgba(255,194,75,.17);stroke:var(--warning)}
  .mapa-svg .st-reservado text{fill:#ffe6b8}
  .mapa-svg .st-vendido rect{fill:var(--foreground);stroke:var(--foreground)}

  .mapa-svg .t-cod{font-weight:800;font-size:11px}

  .campo-falta{border-color:var(--warning)}
</style>
</head>
<body>
<div id="app"></div>
<section id="toasts" class="toaster" aria-label="Notificações" aria-live="polite"></section>

<script type="module">
import { EDICOES, ZONAS, TIPOS, MAPA, chaveMapa, nomeEspaco, todosEspacos } from "./mapa.js";
/*
 * Painel Comercial Festival Interlagos.
 *
 * Copia do app que estava no Lovable (interlagos-partner-hub), agora sem o
 * Lovable: pagina estatica no GitHub Pages da Central e dados no Firebase.
 * Telas, textos e classes sao os mesmos do original; o app.css e o CSS
 * compilado dele.
 *
 * O que no original era servidor e virou o que:
 *  - tabelas do Supabase  -> colecoes do Firestore com os mesmos campos
 *  - login Supabase       -> Firebase Authentication (e-mail e senha, com
 *                            confirmacao por e-mail)
 *  - RLS "logado le e grava" -> regras do Firestore (ver regras no fim)
 *  - regra dos 30 dias (trigger + cron diario) -> roda ao abrir o painel,
 *                            antes de carregar os dados. Mesmo efeito para
 *                            quem olha a tela, sem servidor.
 *  - Lovable AI           -> Firebase AI Logic (Gemini), sem chave na pagina
 */
var VERSAO = "2026-09-18.3";

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function comPrazo(promessa, ms, recado) {

  return d.toISOString().slice(0, 10);
}

var API = null;

async function criarApiFirebase() {
  var appMod = await import(SDK + "firebase-app.js");
  var authMod = await import(SDK + "firebase-auth.js");
  var fsMod = await import(SDK + "firebase-firestore.js");
  var stMod = await import(SDK + "firebase-storage.js");
  var app = appMod.initializeApp(FIREBASE_CONFIG);
  var auth = authMod.getAuth(app);
  auth.languageCode = "pt-BR";
  var db = fsMod.getFirestore(app);
  var storage = stMod.getStorage(app);
  var modeloIa = null;

  async function listar(col) {
    var snap = await fsMod.getDocs(fsMod.collection(db, col));
    return snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
  }

  return {
    aoMudarLogin: function (cb) { return authMod.onAuthStateChanged(auth, cb); },
    usuario: function () { return auth.currentUser; },
    entrar: async function (email, senha) {
      var cred = await authMod.signInWithEmailAndPassword(auth, email, senha);
      if (!cred.user.emailVerified) {
        await authMod.signOut(auth);
        var e = new Error("email-nao-confirmado");
        e.code = "email-nao-confirmado";
        throw e;
      }
      return cred.user;
    },
    criarConta: async function (nome, email, senha) {
      var cred = await authMod.createUserWithEmailAndPassword(auth, email, senha);
      try { await authMod.updateProfile(cred.user, { displayName: nome }); } catch (e) {}
      try {
        await fsMod.setDoc(fsMod.doc(db, "profiles", cred.user.uid), { nome: nome, email: email, papel: "vendedor", created_at: agoraIso(), updated_at: agoraIso() });
      } catch (e) {}
      await authMod.sendEmailVerification(cred.user, { url: URL_APP });
      await authMod.signOut(auth);
      return { confirmar: true };
    },
    sair: function () { return authMod.signOut(auth); },
    perfil: async function (user) {
      var nomePadrao = user.displayName || (user.email ? user.email.split("@")[0] : "Usuário");
      try {
        var s = await fsMod.getDoc(fsMod.doc(db, "profiles", user.uid));
        if (s.exists()) {
          var d = s.data();
          if (!d.email && user.email) { try { await fsMod.updateDoc(fsMod.doc(db, "profiles", user.uid), { email: user.email }); } catch (e2) {} }
          return { nome: d.nome || nomePadrao, papel: d.papel || "vendedor", email: d.email || user.email || "" };
        }
        // conta antiga sem perfil: cria como vendedor
        await fsMod.setDoc(fsMod.doc(db, "profiles", user.uid), { nome: nomePadrao, email: user.email || "", papel: "vendedor", created_at: agoraIso(), updated_at: agoraIso() });
      } catch (e) {}
      return { nome: nomePadrao, papel: "vendedor", email: user.email || "" };
    },
    listar: listar,
    obter: async function (col, id) {
      var d = await fsMod.getDoc(fsMod.doc(db, col, id));
      return d.exists() ? Object.assign({}, d.data(), { id: d.id }) : null;
    },
    definir: async function (col, id, dados) {
      await fsMod.setDoc(fsMod.doc(db, col, id), Object.assign({}, dados, { updated_at: agoraIso() }), { merge: true });
    },
    criar: async function (col, dados, idFixo) {
      var id = idFixo || novoId();
      var agora = agoraIso();
      var doc = Object.assign({}, dados, { criado_por: auth.currentUser.uid, created_at: agora, updated_at: agora });
      await fsMod.setDoc(fsMod.doc(db, col, id), doc);
      return Object.assign({}, doc, { id: id });
    },
    atualizar: async function (col, id, dados) {
      await fsMod.updateDoc(fsMod.doc(db, col, id), Object.assign({}, dados, { updated_at: agoraIso() }));
    },
    atualizarVarios: async function (lista) {
      if (!lista.length) return;
      var lote = fsMod.writeBatch(db);
      var agora = agoraIso();
      lista.forEach(function (it) { lote.update(fsMod.doc(db, it.col, it.id), Object.assign({}, it.dados, { updated_at: agora })); });
      await lote.commit();
    },
    // Avisa quando o servidor ou outra pessoa mexe na colecao. O que este navegador mesmo
    // gravou nao conta: quem gravou ja recarrega a tela por conta propria.
    escutar: function (col, aoMudar) {
      var primeira = true;
      return fsMod.onSnapshot(fsMod.collection(db, col), function (snap) {
        if (primeira) { primeira = false; return; }
        var deFora = snap.docChanges().some(function (m) { return !m.doc.metadata.hasPendingWrites; });
        if (deFora) aoMudar();
      }, function () {});
    },
    // Arquivos (PDF dos contratos) ficam no Storage; a leitura passa pelas regras, sem link publico.
    subirArquivo: async function (caminho, arquivo) {
      await stMod.uploadBytes(stMod.ref(storage, caminho), arquivo, { contentType: arquivo.type || "application/pdf" });
      return caminho;
    },
    // getBlob precisa de CORS liberado no bucket, o que nao da para fazer pelo console.
    // getDownloadURL nao precisa: o link abre direto no navegador.
    urlArquivo: async function (caminho) { return await stMod.getDownloadURL(stMod.ref(storage, caminho)); },
    gerarTexto: async function (sistema, prompt) {
      if (!modeloIa) {
        var aiMod = await import(SDK + "firebase-ai.js");
        var ai = aiMod.getAI(app, { backend: new aiMod.GoogleAIBackend() });
        modeloIa = aiMod.getGenerativeModel(ai, { model: MODELO_IA, systemInstruction: sistema });
      }
      var r = await modeloIa.generateContent(prompt);
      return r.response.text();
    },
    // A IA le o PDF direto do Storage (gs://), sem baixar no navegador. Isso exige
    // o backend Vertex AI, que e o unico que aceita arquivo do proprio projeto.
    // A funcao so atende quem esta logado: vai junto o comprovante de login do Firebase.
    assinatura: async function (acao, contratoId) {
      if (!auth.currentUser) throw new Error("Entre no painel de novo para continuar.");
      var token = await auth.currentUser.getIdToken();
      var r;
      try {
        r = await fetch(URL_ASSINATURA + "/" + acao, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ contratoId: contratoId }),
        });
      } catch (e) { throw new Error("Não consegui falar com o serviço de assinatura. Confira a internet e tente de novo."); }
      var j = {};
      try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(j.erro || "O serviço de assinatura respondeu com erro " + r.status + ".");
      return j;
    },
    lerPdf: async function (sistema, prompt, caminho) {
      var aiMod = await import(SDK + "firebase-ai.js");
      var ai = aiMod.getAI(app, { backend: new aiMod.VertexAIBackend() });
      var modelo = aiMod.getGenerativeModel(ai, {
        model: MODELO_IA, systemInstruction: sistema,
        generationConfig: { responseMimeType: "application/json", temperature: 0 },
      });
      var uri = "gs://" + FIREBASE_CONFIG.storageBucket + "/" + caminho;
      var r = await modelo.generateContent([{ fileData: { mimeType: "application/pdf", fileUri: uri } }, prompt]);
      return r.response.text();
    },
  };
}

var ERRO_ESPACOS = "Não foi possível carregar os espaços.";

// Equivale ao atualizar_contratos_em_risco() do banco original.
async function aplicarRegraContratos() {
  var limite = hojeMais(30);
  var patrocinadores = await API.listar("patrocinadores");
  var espacos = await API.listar("espacos");
  var mudancas = [];
  var emRisco = {};
  patrocinadores.forEach(function (p) {
    var vence = p.data_vencimento_contrato && p.data_vencimento_contrato <= limite;
    if (p.status !== "encerrado" && vence && p.status !== "em_risco_de_renovacao") {
      mudancas.push({ col: "patrocinadores", id: p.id, dados: { status: "em_risco_de_renovacao" } });
      p.status = "em_risco_de_renovacao";
    }
    if (p.status === "em_risco_de_renovacao" && vence && p.espaco_vinculado_id) emRisco[p.espaco_vinculado_id] = true;
  });
  espacos.forEach(function (e) {
    if (emRisco[e.id] && e.status !== "disponivel") mudancas.push({ col: "espacos", id: e.id, dados: { status: "disponivel" } });
  });
  await API.atualizarVarios(mudancas);
}

async function getSpaces() {
  var r;
  try { r = await Promise.all([API.listar("espacos"), API.listar("patrocinadores")]); }
  catch (e) { throw new Error(ERRO_ESPACOS); }
  var risco = {}, vinculado = {};
  r[1].forEach(function (s) {
    if (!s.espaco_vinculado_id) return;
    if (s.status !== "encerrado" || !vinculado[s.espaco_vinculado_id]) vinculado[s.espaco_vinculado_id] = { nome: s.nome, status: s.status };
    if (s.status === "em_risco_de_renovacao") risco[s.espaco_vinculado_id] = s.nome;
  });
  return r[0].sort(porNome).map(function (space) {
    return {
      id: space.id, nome: space.nome, categoria: space.categoria, valor: Number(space.valor), status: space.status, updated_at: space.updated_at,
      patrocinadorEmRisco: space.status === "disponivel" ? (risco[space.id] || null) : null,
      patrocinador: vinculado[space.id] || null,
      mapa: space.mapa || null, edicao: space.edicao || null, zona: space.zona || null, codigo: space.codigo || null, tipo: space.tipo || null,
      metragem: space.metragem == null ? null : Number(space.metragem),
      ocupante2026: space.ocupante_2026 || "",
      // reserva feita pelo contrato assinado: o vinculo do patrocinador so cabe um espaco,
      // e uma marca pode ter varios, entao a reserva mora no proprio espaco
      reservadoParaId: space.reservado_para_id || null,
      reservadoParaNome: space.reservado_para_nome || "",
      reservadoPorContrato: space.reservado_por_contrato || null,
      vendedorUid: space.vendedor_uid || null,
      vendedorNome: space.vendedor_nome || "",
    };
  });
}

async function saveSpace(data) {
  var nome = String(data.nome || "").trim();
  var categoria = String(data.categoria || "").trim();
  var ok = nome.length >= 1 && nome.length <= 120 && categoria.length >= 1 && categoria.length <= 120 &&
    isFinite(data.valor) && data.valor >= 0 && ["disponivel", "reservado", "vendido"].indexOf(data.status) >= 0;
  if (!ok) throw new Error("Não foi possível salvar o espaço.");
  var vend = data.vendedorUid ? perfilPorUid(data.vendedorUid) : null;
  var payload = { nome: nome, categoria: categoria, valor: data.valor, status: data.status,
    metragem: data.metragem == null || !isFinite(data.metragem) ? null : data.metragem,
    ocupante_2026: String(data.ocupante2026 || "").trim().slice(0, 120),
    vendedor_uid: vend ? vend.id : null, vendedor_nome: vend ? vend.nome : "" };
  // mesma regra do seletor de status: espaco liberado nao guarda o nome de quem estava nele
  if (data.status === "disponivel") { payload.reservado_para_id = null; payload.reservado_para_nome = ""; }
  if (!data.id && data.mapa) {
    // espaco criado a partir do mapa: guarda a posicao para o desenho achar o documento
    payload.mapa = data.mapa; payload.edicao = data.edicao; payload.zona = data.zona; payload.codigo = data.codigo; payload.tipo = data.tipo;
  }
  try {
    if (data.id) await API.atualizar("espacos", data.id, payload);
    else await API.criar("espacos", payload, data.mapa || null);
  } catch (e) { throw new Error("Não foi possível salvar o espaço."); }
}

async function changeSpaceStatus(id, status, espaco) {
  var dados = { status: status };
  // quem reserva ou vende vira o responsavel; espaco liberado fica sem responsavel
  if (status === "disponivel") {
    dados.vendedor_uid = null; dados.vendedor_nome = "";
    // some o nome de quem estava reservado, senao o espaco fica Disponivel com marca em cima.
    // reservado_por_contrato fica de proposito: e a marca de que aquele contrato ja agiu uma
    // vez, e e o que impede a conferencia automatica de reservar de novo por cima da pessoa.
    dados.reservado_para_id = null; dados.reservado_para_nome = "";
  }
  else if (!espaco || !espaco.vendedorUid) { dados.vendedor_uid = S.uid; dados.vendedor_nome = S.nome; }
  try { await API.atualizar("espacos", id, dados); }
  catch (e) { throw new Error("Não foi possível alterar o status."); }
}

  }).sort(function (a, b) { return (a.prazo || "9999").localeCompare(b.prazo || "9999") || (b.data || "").localeCompare(a.data || ""); });

// Conta o que interessa para o time: o que falta, o que atrasou e o que veio fora do contrato.
function contarEntregas(lista) {
  var n = { total: 0, entregues: 0, faltam: 0, atrasadas: 0, aConferir: 0, extras: 0, canceladas: 0 };
  (lista || []).forEach(function (e) {
    if (e.status === "a_conferir") { n.aConferir++; return; }
    if (e.status === "cancelado") { n.canceladas++; return; }
    n.total++;
    if (e.status === "entregue") n.entregues++;
    else { n.faltam++; if (e.atrasada) n.atrasadas++; }
    if (e.origem !== "contrato") n.extras++;
  });
  n.pct = n.total ? Math.round(100 * n.entregues / n.total) : 0;
  return n;
}

async function suggestNextStep(interactionId) {
  var todas, patrocinadores, prospeccao;
  try { var r = await Promise.all([API.listar("interacoes"), API.listar("patrocinadores"), API.listar("prospeccao")]); todas = r[0]; patrocinadores = r[1]; prospeccao = r[2]; }
  catch (e) { throw new Error("Interação não encontrada."); }
  var current = todas.find(function (i) { return i.id === interactionId; });
  if (!current) throw new Error("Interação não encontrada.");
  var sponsor = current.patrocinador_id ? patrocinadores.find(function (p) { return p.id === current.patrocinador_id; }) : prospeccao.find(function (m) { return m.id === current.prospeccao_id; });
  var mesmoAlvo = function (i) { return current.patrocinador_id ? i.patrocinador_id === current.patrocinador_id : i.prospeccao_id === current.prospeccao_id; };
  var previous = todas
    .filter(function (i) { return mesmoAlvo(i) && new Date(i.data) < new Date(current.data); })
    .sort(porDataDesc).slice(0, 8);
  var history = previous.length
    ? previous.map(function (item) {
        return new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo" }).format(new Date(item.data)) +
          " — Observação: " + item.observacao + "\nPróximo passo registrado: " + item.proximo_passo;
      }).join("\n\n")
    : "Não há interações anteriores.";
  var system = "Você é um assistente de vendas do Festival Interlagos. Sugira somente um próximo passo comercial em português do Brasil, curto, direto, prático e acionável. Não use título, lista, saudação ou explicação. Não invente fatos.";
  var prompt = (current.patrocinador_id ? "Patrocinador: " : "Marca desejo (ainda não patrocina, estamos tentando trazer): ") + ((sponsor && sponsor.nome) || "Marca") + "\n\nObservação atual:\n" + current.observacao +
    "\n\nHistórico anterior, do mais recente para o mais antigo:\n" + history;
  var suggestion;
  try { suggestion = String((await API.gerarTexto(system, prompt)) || "").trim(); }
  catch (e) { throw new Error("Não foi possível gerar a sugestão."); }
  if (!suggestion) throw new Error("A IA não retornou uma sugestão.");
  var shortSuggestion = suggestion.slice(0, 500);
  try { await API.atualizar("interacoes", current.id, { proximo_passo: shortSuggestion }); }
  catch (e) { throw new Error("A sugestão foi criada, mas não pôde ser salva."); }
  return { suggestion: shortSuggestion };
}

  var ok = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || ""); };
  var inicio = ok(data.inicio) ? data.inicio : "", fim = ok(data.fim) ? data.fim : "";
  if (inicio && fim && fim < inicio) throw new Error("A data de fim vem antes do início.");
  var valor = data.valor === "" || data.valor == null ? null : Number(data.valor);
  if (valor !== null && !(isFinite(valor) && valor >= 0)) throw new Error("Confira o valor.");
  if (arquivo && arquivo.size > 20 * 1024 * 1024) throw new Error("O PDF passa de 20 MB.");
  if (arquivo && arquivo.type && arquivo.type !== "application/pdf") throw new Error("Só aceitamos PDF.");

  }
  if (data.status === "assinado" && !data.assinadoEm) payload.assinado_em = hojeMais(0);
  var id = data.id || null;

// A IA nao sabe o que a marca ja tem cadastrado, e escreve a mesma entrega com outras
// palavras a cada leitura. Entao a comparacao e por palavra que importa, nao por texto igual.
var PALAVRAS_VAZIAS = { para: 1, como: 1, cada: 1, toda: 1, todo: 1, todos: 1, todas: 1, seus: 1, suas: 1, pelo: 1, pela: 1, pelos: 1, pelas: 1, sera: 1, serao: 1, sobre: 1, esse: 1, essa: 1, este: 1, esta: 1, deste: 1, desta: 1, evento: 1, marca: 1, contrato: 1, durante: 1, conforme: 1, ainda: 1, mesmo: 1, sendo: 1, tera: 1, terao: 1, havera: 1, ficara: 1, que: 1, com: 1, por: 1, uma: 1, uns: 1, dos: 1, das: 1, nos: 1, nas: 1, aos: 1, seu: 1, sua: 1, sob: 1, ser: 1, sao: 1, tem: 1, ate: 1, mais: 1, entre: 1, quando: 1, onde: 1, qualquer: 1, deve: 1, devera: 1, deverao: 1, podera: 1, poderao: 1, item: 1, itens: 1 };
function palavrasChave(txt) {
  return String(txt || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[-'\u2019.]/g, "")
    .replace(/[^a-z0-9]+/g, " ").split(" ")
    .filter(function (p) { return (/^[0-9]{2,}$/.test(p) || p.length >= 3) && !PALAVRAS_VAZIAS[p]; });
}
function pareceMesmaEntrega(a, b) {
  // Quantidade diferente e entrega diferente: 2 posts nao e a mesma coisa que 6 posts.
  if (a.quantidade != null && b.quantidade != null && a.quantidade !== b.quantidade) return false;
  var A = palavrasChave(a.descricao), B = palavrasChave(b.descricao);
  if (!A.length || !B.length) return false;
  var uniA = {}, uniB = {};
  A.forEach(function (p) { uniA[p] = 1; });
  B.forEach(function (p) { uniB[p] = 1; });
  var listaA = Object.keys(uniA), listaB = Object.keys(uniB);
  var repetidas = listaA.filter(function (p) { return uniB[p]; });
  var iguais = repetidas.length;
  var juntos = listaA.length + listaB.length - iguais;
  var menor = Math.min(listaA.length, listaB.length);
  var semNumero = repetidas.filter(function (p) { return !/^[0-9]+$/.test(p); });
  // Na duvida o certo e deixar passar e a pessoa cancelar o repetido. Sumir com uma
  // entrega de verdade ninguem percebe, e e o erro que machuca.

  // 1) quase toda palavra bate nos dois lados: e a mesma entrega escrita de novo.
  if (iguais / juntos >= 0.5) return true;

  // 2) a frase curta cabe quase inteira dentro da longa, e o que se repete nao e so
  //    numero. Pega o caso de a IA reescrever o comeco: "Nome da arena" e "Direito de
  //    nomear a arena de provas na comunicacao oficial".
  if (iguais / menor >= 0.75 && semNumero.length >= 2) return true;

  // 3) as duas comecam pelo mesmo assunto e dividem metade das palavras. Assunto e a
  //    primeira palavra que nao e numero: em "60 credenciais VIP" o assunto e
  //    credenciais, nao o 60. Exige ainda dividir algo alem do assunto e do numero,
  //    senao "25 credenciais de staff" e "25 credenciais de area VIP" virariam iguais.
  var assunto = function (l) { for (var i = 0; i < l.length; i++) if (!/^[0-9]+$/.test(l[i])) return l[i]; return l[0]; };
  var chave = assunto(A);

// Le o PDF e devolve o que a IA entendeu, sem gravar nada. Serve tanto para o botao do

// Grava em Propriedades o que a leitura trouxe. pularCabecalho serve para quando a
// pessoa ja conferiu vigencia e valor na tela antes de salvar.
async function gravarEntregasLidas(c, dados, pularCabecalho) {
  var itens = (dados && dados.entregas) || [];
  var dia = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(String(d || "")) ? d : ""; };
  // O que a marca ja tem vale como referencia, menos o que foi cancelado.
  var jaTem = combinadosDe(c.patrocinadorId).filter(function (e) { return e.status !== "cancelado"; })
    .map(function (e) { return { descricao: e.descricao, quantidade: e.quantidade }; });
  var criados = 0, repetidos = 0, pulados = [];
  for (var k = 0; k < itens.length && k < 40; k++) {
    var it = itens[k] || {};
    var desc = String(it.descricao || "").trim().slice(0, 300);
    if (desc.length < 3) continue;
    var bruta = it.quantidade == null || it.quantidade === "" ? null : Number(it.quantidade);
    var qtd = bruta !== null && isFinite(bruta) && bruta >= 0 ? bruta : null;
    // "15 · 15 vagas" fica feio: se a descricao comeca pelo proprio numero, tira.
    if (qtd !== null) {
      var semNumero = desc.replace(new RegExp("^" + String(qtd).replace(/\./g, "\\.") + "\\s+(?![m²x×])", "i"), "");
      if (semNumero !== desc && semNumero.length > 3) desc = semNumero.charAt(0).toLocaleUpperCase("pt-BR") + semNumero.slice(1);
    }
    var novo = { descricao: desc, quantidade: qtd };
    var repetida = jaTem.some(function (e) { return pareceMesmaEntrega(novo, e); });
    if (repetida) { repetidos++; pulados.push(desc); continue; }
    try {
      await API.criar("combinados", {
        patrocinador_id: c.patrocinadorId, prospeccao_id: null,
        descricao: desc, status: "a_conferir", origem: "contrato",
        categoria: CATEGORIA_ENTREGA[it.categoria] ? it.categoria : "outro",
        quantidade: qtd,
        prazo: dia(it.prazo), contrato_id: c.id, trecho: String(it.trecho || "").trim().slice(0, 400),
        data: hojeMais(0), entregue_em: null, comprovacao: "",
        prometido_por_uid: S.uid, prometido_por_nome: S.nome,
      });
      criados++;
      jaTem.push(novo);
    } catch (e) {}
  }
  if (!criados && !repetidos) throw new Error("Não foi possível guardar as entregas lidas.");

  if (pularCabecalho) return { criados: criados, completou: [], repetidos: repetidos, pulados: pulados, divergiu: [] };

  // Campo vazio a IA preenche. Campo que uma pessoa digitou ela nunca sobrescreve: se
  // o PDF disser outra coisa, ela so guarda o que leu e o cartao mostra o recado.
  var completou = [], divergiu = [];
  var mudanca = {};
  var iaIni = dia(dados.vigencia_inicio), iaFim = dia(dados.vigencia_fim);
  var iaVal = dados.valor != null && isFinite(Number(dados.valor)) && Number(dados.valor) > 0 ? Number(dados.valor) : null;

  if (iaIni) { if (!c.inicio) { mudanca.inicio = iaIni; completou.push("início"); mudanca.ia_inicio = null; } else if (c.inicio !== iaIni) { mudanca.ia_inicio = iaIni; divergiu.push("início"); } else mudanca.ia_inicio = null; }
  if (iaFim) { if (!c.fim) { mudanca.fim = iaFim; completou.push("fim"); mudanca.ia_fim = null; } else if (c.fim !== iaFim) { mudanca.ia_fim = iaFim; divergiu.push("fim"); } else mudanca.ia_fim = null; }
  if (iaVal !== null) { if (c.valor == null) { mudanca.valor = iaVal; completou.push("valor"); mudanca.ia_valor = null; } else if (Number(c.valor) !== iaVal) { mudanca.ia_valor = iaVal; divergiu.push("valor"); } else mudanca.ia_valor = null; }

  if (Object.keys(mudanca).length) { try { await API.atualizar("contratos", c.id, mudanca); } catch (e) { completou = []; divergiu = []; } }
  return { criados: criados, completou: completou, repetidos: repetidos, pulados: pulados, divergiu: divergiu };
}

// Contrato assinado reserva o lugar fisico da marca no mapa. Acha o espaco por duas
// vias: o vinculo que o vendedor ja fez, e a planta de 2026, onde cada espaco guarda a
// marca que estava nele. Nunca encosta em espaco que ja e de outra marca.
// Razao social tem um monte de enfeite que o painel nao usa: "CFMOTO DO BRASIL
// IMPORTACAO E COMERCIO LTDA" e "CFMOTO" sao a mesma marca.
var ENFEITE_RAZAO_SOCIAL = /\b(ltda|limitada|me|epp|eireli|sa|s a|cia|companhia|comercio|comercial|industria|industrial|importacao|exportacao|distribuidora|participacoes|holding|group|grupo|do brasil|brasil|latam|inc|corp|e)\b/g;

  var t = String(txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(ENFEITE_RAZAO_SOCIAL, " ").replace(/\s+/g, " ").trim();
  return t;
}
// true = bate, false = nao bate, null = nao deu para comparar
function marcaBate(nomeNoPainel, nomeNoContrato) {
  var a = nucleoDaMarca(nomeNoPainel), b = nucleoDaMarca(nomeNoContrato);
  if (!a || !b) return null;
  if (a === b || b.indexOf(a + " ") === 0 || a.indexOf(b + " ") === 0) return true;
  var pa = a.split(" ").filter(function (x) { return x.length >= 3; });
  var pb = b.split(" ").filter(function (x) { return x.length >= 3; });
  if (!pa.length || !pb.length) return null;
  var menor = pa.length <= pb.length ? pa : pb, maior = pa.length <= pb.length ? pb : pa;
  var dentro = menor.filter(function (x) { return maior.indexOf(x) >= 0; }).length;
  return dentro / menor.length >= 0.6;
}

function mesmaMarca(a, b) {
  var limpa = function (t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); };
  var x = limpa(a), y = limpa(b);
  return !!x && x === y;

async function reservarEspacosDoContrato(contrato) {
  var vazio = { reservados: [], conflitos: [], marca: "" };
  if (!contrato || contrato.status !== "assinado" || !contrato.patrocinadorId) return vazio;
  // quem chega pela tela de Contratos ainda nao carregou espacos nem marcas
  var faltando = [];
  if (!S.sponsors) faltando.push(carregar("sponsors", getSponsors));
  if (!S.spaces) faltando.push(carregar("spaces", getSpaces));
  if (faltando.length) { try { await Promise.all(faltando); } catch (e) { return vazio; } }
  var marca = (S.sponsors || []).find(function (p) { return p.id === contrato.patrocinadorId; });
  if (!marca) return vazio;
  var espacos = S.spaces || [];
  if (!espacos.length) return vazio;

  var candidatos = [];
  var junta = function (e) { if (e && candidatos.indexOf(e) < 0) candidatos.push(e); };
  // 1) o espaco que ja esta amarrado na ficha da marca
  if (marca.espacoVinculadoId) junta(espacos.find(function (e) { return e.id === marca.espacoVinculadoId; }));
  // 2) os espacos em que essa marca estava em 2026, na edicao do contrato
  if (contrato.edicao) {
    espacos.forEach(function (e) { if (e.edicao === contrato.edicao && mesmaMarca(e.ocupante2026, marca.nome)) junta(e); });
  }
  if (!candidatos.length) return { reservados: [], conflitos: [], marca: marca.nome };

  var reservados = [], conflitos = [], mudancas = [];
  candidatos.forEach(function (e) {
    var deOutro = (e.patrocinador && e.patrocinador.nome && !mesmaMarca(e.patrocinador.nome, marca.nome)) ||
      (e.reservadoParaId && e.reservadoParaId !== marca.id);
    if (deOutro) { conflitos.push(e.nome + " (já é de " + ((e.patrocinador && e.patrocinador.nome) || e.reservadoParaNome) + ")"); return; }
    if (e.status === "vendido") return; // ja esta fechado com a propria marca, nao rebaixa
    if (e.status === "reservado" && e.reservadoParaId === marca.id) return; // ja estava reservado para ela
    mudancas.push({ col: "espacos", id: e.id, dados: { status: "reservado", reservado_para_id: marca.id, reservado_para_nome: marca.nome, reservado_por_contrato: contrato.id } });
    reservados.push(e.nome);
  });
  if (mudancas.length) {
    try { await API.atualizarVarios(mudancas); } catch (e) { return { reservados: [], conflitos: conflitos, marca: marca.nome, falhou: true }; }
    // a ficha da marca aponta para um espaco so: preenche se ainda estiver vazia
    if (!marca.espacoVinculadoId) { try { await API.atualizar("patrocinadores", marca.id, { espaco_vinculado_id: mudancas[0].id }); } catch (e) {} }
  }
  return { reservados: reservados, conflitos: conflitos, marca: marca.nome };
}

// Mostra na tela o que a reserva automatica fez, sempre com o nome dos espacos.

// Ao abrir o painel, procura contrato assinado que nunca reservou espaco nenhum e
// resolve. Pega o contrato assinado de outro computador e, amanha, o que voltar assinado

// So mexe em contrato que NUNCA reservou nada. Se ele ja reservou uma vez e alguem

function contratoJaReservouAlgumaVez(c) {

}

  var assinados = (S.contracts || []).filter(function (c) {
    return c.status === "assinado" && c.edicao && c.patrocinadorId && !contratoJaReservouAlgumaVez(c);
  });

  var feitos = [];
  for (var i = 0; i < assinados.length && i < 20; i++) {

  var total = feitos.reduce(function (n, x) { return n + x.espacos.length; }, 0);
  var quem = feitos.map(function (x) { return x.marca }).join(", ");
  toast.success(total + " espaço" + (total > 1 ? "s foram reservados" : " foi reservado") + " por contrato assinado fora daqui: " + quem + ".");
}

      ultimoContato: ultimoContato, diasParado: diasParado,

      atrasada: andamento && !!m.proxima_acao_data && m.proxima_acao_data < hoje,

}

async function saveProspect(data) {
  var nome = String(data.nome || "").trim();
  if (!(nome.length >= 1 && nome.length <= 120 && MERCADOS[data.mercado] && ESTAGIOS[data.estagio])) throw new Error("Confira o nome, o mercado e o estágio.");
  var vend = data.vendedorUid ? perfilPorUid(data.vendedorUid) : null;
  var payload = {
    nome: nome, mercado: data.mercado, estagio: data.estagio, contato: String(data.contato || "").trim().slice(0, 200),
    vendedor_uid: vend ? vend.id : (data.vendedorUid || null), vendedor_nome: vend ? vend.nome : (data.vendedorNome || ""),
    espaco_interesse_id: data.espacoInteresseId || null,
    proxima_acao: String(data.proximaAcao || "").trim().slice(0, 300),
    proxima_acao_data: /^\d{4}-\d{2}-\d{2}$/.test(data.proximaAcaoData || "") ? data.proximaAcaoData : null,
    observacao: String(data.observacao || "").trim().slice(0, 1000),
  };
  try {
    if (data.id) { await API.atualizar("prospeccao", data.id, payload); return data.id; }
    return (await API.criar("prospeccao", Object.assign({}, payload, { patrocinador_id: null, fechada_em: null }))).id;
  } catch (e) { throw new Error("Não foi possível salvar a marca desejo."); }
}

async function changeProspectStage(id, estagio) {
  if (!ESTAGIOS[estagio] || estagio === "fechada") return;
  try { await API.atualizar("prospeccao", id, { estagio: estagio, perdida_em: estagio === "perdida" ? hojeMais(0) : null }); }
  catch (e) { throw new Error("Não foi possível mudar o estágio."); }
}

  var cfg = configAtual();

  var venc = sp && sp.edicao === "auto" ? cfg.auto_data : cfg.moto_data;

    dataVencimentoContrato: venc, status: "ativo", renovacao: "renovado", master: false } };
  render();

// Depois de salvar o patrocinador: marca a prospeccao como fechada e leva o historico junto.
async function concluirFechamento(prospId, patroId) {
  var r = await Promise.all([API.listar("interacoes"), API.listar("combinados")]);
  var mudancas = [{ col: "prospeccao", id: prospId, dados: { estagio: "fechada", patrocinador_id: patroId, fechada_em: hojeMais(0) } }];

  r[1].forEach(function (c) { if (c.prospeccao_id === prospId && !c.patrocinador_id) mudancas.push({ col: "combinados", id: c.id, dados: { patrocinador_id: patroId } }); });
  await API.atualizarVarios(mudancas);
}

function rotaAtual() {
  var h = location.hash.replace(/^#/, "") || "/";
  var partes = h.split("?");
  var params = new URLSearchParams(partes[1] || "");
  return { caminho: partes[0], params: params };
}
function irPara(caminho, substituir) {
  var alvo = "#" + caminho;
  if (substituir) history.replaceState(null, "", alvo); else location.hash = alvo;
  render();
}
function trocarParametro(nome, valor) {
  var r = rotaAtual();
  if (valor) r.params.set(nome, valor); else r.params.delete(nome);
  var q = r.params.toString();
  history.replaceState(null, "", "#" + r.caminho + (q ? "?" + q : ""));
}

      a.loading = false;
      a.message = "Conta criada. Confira seu e-mail para confirmar o acesso.";
    } catch (e) {
      a.loading = false;
      a.error = mensagemErroCadastro(e);

      '<td class="' + TD + '">' + statusSelect(space, S.statusMudando) + "</td>" +
      '<td class="' + TD + '"><button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar ' + esc(space.nome) + '" title="Editar espaço" data-acao="editar" data-id="' + esc(space.id) + '">' + icone("pencil") + "</button></td></tr>";

      '<div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="break-words font-bold">' + esc(space.nome) + "</h2>" +
      '<p class="mt-1 text-sm text-muted-foreground">' + esc(rotuloLocal(space)) + " · " + esc(space.categoria) + "</p>" +

      '<button type="button" class="' + btnCls("ghost", "icon") + '" aria-label="Editar ' + esc(space.nome) + '" data-acao="editar" data-id="' + esc(space.id) + '">' + icone("pencil") + "</button></div>" +
      (space.patrocinadorEmRisco ? riskNote(space.patrocinadorEmRisco) : "") +
      '<div class="mt-5 flex items-end justify-between gap-4 border-t border-border pt-4"><div><span class="block text-xs font-bold uppercase text-muted-foreground">Valor</span>' +

      '<div class="w-44">' + statusSelect(space, S.statusMudando) + "</div></div></article>";

  var th = function (cls, txt) { return '<th class="' + cn(TH, cls) + '">' + txt + "</th>"; };
  return '<div class="hidden overflow-hidden border border-border bg-card md:block"><div class="relative w-full overflow-auto"><table class="w-full caption-bottom text-sm">' +

      th("px-5 text-xs font-bold uppercase text-background", "Espaço") + th("text-xs font-bold uppercase text-background", "Local") +
      th("text-xs font-bold uppercase text-background", "Categoria") + th("text-xs font-bold uppercase text-background", "Marca") +

    '<div class="grid gap-3 md:hidden">' + cards + "</div>";
}


/* ------------------------------------------------------------------ alertas */
// Le patrocinadores + parametros e devolve a lista do que precisa de acao, do mais grave ao menos grave.
function calcularAlertas() {
  var cfg = configAtual();
  var lista = [];
  (S.sponsors || []).forEach(function (p) {
    if (p.status === "encerrado") return;
    var diasEvento = Math.min(diasAte(cfg.moto_data), diasAte(cfg.auto_data));
    if (p.edicao === "moto") diasEvento = diasAte(cfg.moto_data);
    if (p.edicao === "auto") diasEvento = diasAte(cfg.auto_data);
    var diasVenc = diasAte(p.dataVencimentoContrato);
    var diasContato = p.ultimoContato ? -diasAte(p.ultimoContato) : null;
    var base = { patro: p, vendedorUid: p.vendedorUid, vendedorNome: p.responsavelComercial };
    if (p.master && p.renovacao !== "renovado" && diasEvento !== null && diasEvento <= cfg.dias_gatilho_master) {
      lista.push(Object.assign({}, base, { nivel: "vermelho", peso: 0, admin: true, titulo: p.nome + " é Master e ainda não renovou",
        detalhe: (diasEvento < 0 ? "A edição já passou" : "Faltam " + diasEvento + " dias para a edição") + " · Renovação: " + RENOVACAO[p.renovacao].label }));
    }
    if (p.renovacao === "recusou") {
      lista.push(Object.assign({}, base, { nivel: "azul", peso: 3, titulo: p.nome + " recusou renovar",
        detalhe: p.espacoVinculado ? "O espaço " + p.espacoVinculado + " pode ser oferecido a outra marca" : "Sem espaço vinculado" }));
    } else if (p.renovacao !== "renovado" && diasVenc !== null) {
      if (diasVenc < 0) lista.push(Object.assign({}, base, { nivel: "vermelho", peso: 1, titulo: "Contrato de " + p.nome + " venceu " + textoDias(-diasVenc, false), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
      else if (diasVenc <= 30) lista.push(Object.assign({}, base, { nivel: "vermelho", peso: 1, titulo: "Contrato de " + p.nome + " vence " + textoDias(diasVenc, true), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
      else if (diasVenc <= 90) lista.push(Object.assign({}, base, { nivel: "amarelo", peso: 2, titulo: "Contrato de " + p.nome + " vence " + textoDias(diasVenc, true), detalhe: "Renovação: " + RENOVACAO[p.renovacao].label }));
    }
    if (p.renovacao === "sem_contato" || p.renovacao === "em_negociacao") {
      if (diasContato === null) lista.push(Object.assign({}, base, { nivel: "amarelo", peso: 2, titulo: "Nenhum contato registrado com " + p.nome, detalhe: "Registre a primeira conversa para sair deste alerta" }));
      else if (diasContato > cfg.dias_sem_contato) lista.push(Object.assign({}, base, { nivel: "amarelo", peso: 2, titulo: p.nome + " está sem contato " + textoDias(diasContato, false), detalhe: "Limite combinado: " + cfg.dias_sem_contato + " dias" }));
    }
  });
  return lista.sort(function (a, b) { return a.peso - b.peso || porNome(a.patro, b.patro); });
}

function cartaoAlerta(a) {
  var vend = a.vendedorNome ? esc(a.vendedorNome) : '<span class="text-muted-foreground">sem responsável</span>';
  return '<article class="' + cn("border border-border bg-card px-4 py-3", "alerta-" + a.nivel) + '">' +
    '<div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">' +
      '<div class="min-w-0"><h3 class="break-words font-bold">' + esc(a.titulo) + "</h3>" +
      '<p class="mt-0.5 text-sm text-muted-foreground">' + esc(a.detalhe) + " · Vendedor: " + vend + (a.patro.master ? " · " + badgeMaster() : "") + "</p></div>" +
      '<div class="flex shrink-0 flex-wrap gap-2">' +
        '<button type="button" class="' + btnCls("outline", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="nova-interacao" data-patro="' + esc(a.patro.id) + '">' + icone("message-square-plus") + " Registrar contato</button>" +
        '<button type="button" class="' + btnCls("ghost", "default", "h-8 text-xs font-bold uppercase") + '" data-acao="editar-patro" data-id="' + esc(a.patro.id) + '">' + icone("pencil") + " Abrir</button>" +
      "</div></div></article>";
}

function telaInicio() {
  var cfg = configAtual();
  var corpo;
  if (S.sponsorsErro) corpo = errorList(S.sponsorsErro, "recarregar-patrocinadores", S.sponsorsCarregando);
  else if (!S.sponsors) corpo = loadingList("Carregando alertas...", 3);
  else {
    var alertas = calcularAlertas();
    var meus = alertas.filter(function (a) { return a.vendedorUid === S.uid; });
    var admin = alertas.filter(function (a) { return a.admin; });
    var outros = alertas.filter(function (a) { return a.vendedorUid !== S.uid && !(ehAdmin() && a.admin); });
    var n = { vermelho: 0, amarelo: 0, azul: 0 };
    alertas.forEach(function (a) { n[a.nivel]++; });
    var elegiveis = S.sponsors.filter(function (p) { return p.status !== "encerrado"; });
    var pendentes = (S.combinados || []).filter(function (c) { return c.status === "combinado"; }).slice().sort(function (a, b) { return (b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0) || (a.prazo || "9999").localeCompare(b.prazo || "9999"); });
    var porRen = {}; elegiveis.forEach(function (p) { porRen[p.renovacao] = (porRen[p.renovacao] || 0) + 1; });
    var pct = elegiveis.length ? Math.round(100 * (porRen.renovado || 0) / elegiveis.length) : 0;
    var merch = elegiveis.filter(function (p) { return p.tipo === "merchandising"; });
    var merchRen = merch.filter(function (p) { return p.renovacao === "renovado"; }).length;
    var andamento = (S.prospects || []).filter(emAndamento);
    var precisam = andamento.filter(function (m) { return m.esfriando || m.atrasada; });
    var nEsfriando = andamento.filter(function (m) { return m.esfriando; }).length;
    var nAtrasada = andamento.filter(function (m) { return m.atrasada; }).length;
    var secao = function (titulo, lista, vazio, id) {
      return '<section class="space-y-3"' + (id ? ' id="' + id + '"' : "") + '><h2 class="text-sm font-black uppercase">' + titulo + ' <span class="font-normal text-muted-foreground">(' + lista.length + ")</span></h2>" +
        (lista.length ? lista.map(cartaoAlerta).join("") : '<p class="border border-dashed border-border px-4 py-6 text-center text-sm text-muted-foreground">' + vazio + "</p>") + "</section>";
    };
    corpo =
      '<div id="inicio-contadores" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">' +
        '<div class="border border-border bg-card px-5 py-5"><span class="block text-4xl font-black leading-none text-destructive">' + n.vermelho + '</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">Alertas vermelhos</span></div>' +
        '<div class="border border-border bg-card px-5 py-5"><span class="block text-4xl font-black leading-none">' + n.amarelo + '</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">Alertas amarelos</span></div>' +
        '<div class="border border-border bg-card px-5 py-5"><span class="block text-4xl font-black leading-none">' + pct + '%</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">Da base renovada · meta 100%</span>' +
          '<div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-muted"><div class="h-2 bg-success" style="width:' + pct + '%"></div></div>' +
          '<p class="mt-2 text-xs text-muted-foreground">' + Object.keys(RENOVACAO).map(function (k) { return (porRen[k] || 0) + " " + RENOVACAO[k].label.toLowerCase(); }).join(" · ") + "</p>" +
          '<p class="mt-1 text-xs text-muted-foreground">Merchandising: ' + merch.length + (merch.length === 1 ? " marca" : " marcas") + (merch.length ? ", " + merchRen + (merchRen === 1 ? " renovada" : " renovadas") : "") + "</p></div>" +
        '<div class="border border-border bg-card px-5 py-5"><span class="block text-4xl font-black leading-none">' + andamento.length + '</span><span class="mt-2 block text-xs font-bold uppercase text-muted-foreground">Marcas desejo em andamento</span>' +
          '<p class="mt-2 text-xs text-muted-foreground">' + (S.prospects === null ? "Carregando..." : nEsfriando + " esfriando · " + nAtrasada + " com ação atrasada") + "</p>" +
          '<a href="#/app/marcas" class="mt-1 inline-block text-xs font-bold uppercase text-primary hover:underline">Ver o funil</a></div>' +
      "</div>" +
      (ehAdmin() ? secao("Para administradores", admin, "Nenhum patrocinador Master em risco.") : "") +
      secao("Meus alertas", meus, "Nada pendente com você hoje.", "secao-meus-alertas") +
      secao("Alertas do resto da equipe", outros, "Nada pendente com os outros vendedores.", "secao-alertas-equipe") +
      '<section id="secao-marcas-acao" class="space-y-3"><h2 class="text-sm font-black uppercase">Marcas desejo que precisam de ação <span class="font-normal text-muted-foreground">(' + precisam.length + ")</span></h2>" +
        (S.prospects === null && !S.prospectsErro ? loadingList("Carregando marcas desejo...", 2) : (precisam.length ? precisam.map(cartaoMarcaAcao).join("") : '<p class="border border-dashed border-border px-4 py-6 text-center text-sm text-muted-foreground">Nenhuma marca desejo esfriando nem com ação atrasada.</p>')) +
      "</section>" +
      (function () {
        var esperando = (S.contracts || []).filter(function (c) { return c.status === "enviado"; });
        return '<section id="secao-contratos" class="space-y-3"><h2 class="text-sm font-black uppercase">Contratos aguardando assinatura <span class="font-normal text-muted-foreground">(' + esperando.length + ")</span></h2>" +
          (S.contracts === null && !S.contractsErro ? loadingList("Carregando contratos...", 1) : (esperando.length ? esperando.map(function (c) { return cartaoContrato(c, true); }).join("") : '<p class="border border-dashed border-border px-4 py-6 text-center text-sm text-muted-foreground">Nenhum contrato esperando assinatura.</p>')) +
          "</section>";
      })() +
      (function () {

/* ------------------------------------------------------- selects nativos */
var SELECT_NATIVO = "flex h-9 w-full items-center rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm cursor-pointer focus:outline-none focus:ring-1 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50";
function selectNativo(id, name, opcoes, valor, extra) {

}
function selectVendedor(id, name, valor, permitirVazio, extra) {

}
function opcoesEspacos(atualId) {

    var ed = sp.edicao ? (EDICOES.find(function (e) { return e.id === sp.edicao; }) || {}).rotulo : "Sem posição no mapa";

/* ---------------------------------------------------------- mapa de espacos */
function edicaoAtual() {
  var e = rotaAtual().params.get("edicao");
  return EDICOES.some(function (x) { return x.id === e; }) ? e : EDICOES[0].id;
}
function espacosPorChave() {
  var m = {};
  (S.spaces || []).forEach(function (sp) { if (sp.mapa) m[sp.mapa] = sp; });
  return m;
}
function zonaInfo(id) { return ZONAS.find(function (z) { return z.id === id; }) || { id: id, titulo: id }; }
// Quem esta no espaco, na ordem que importa: marca fechada, reserva feita pelo contrato
// assinado, e por ultimo quem estava ali em 2026.
function nomeNoEspaco(space) {
  if (space.patrocinador) return esc(space.patrocinador.nome);
  if (space.reservadoParaNome) return esc(space.reservadoParaNome) + ' <span class="text-xs font-normal text-muted-foreground">· reservado pelo contrato</span>';
  if (space.ocupante2026) return '<span class="text-muted-foreground">2026: ' + esc(space.ocupante2026) + "</span>";
  return '<span class="text-muted-foreground">Vazio</span>';
}

function rotuloLocal(sp) {
  if (!sp.mapa) return "Sem posição no mapa";
  var ed = EDICOES.find(function (e) { return e.id === sp.edicao; });
  return zonaInfo(sp.zona).titulo.split(" · ")[0] + " " + sp.codigo + (ed ? " · " + ed.curto : "");
}
function truncar(txt, max) {
  txt = String(txt || "");
  return txt.length > max ? txt.slice(0, Math.max(1, max - 1)) + "…" : txt;
}
function escXml(v) { return esc(v); }

// Desenha a edicao inteira em SVG: zonas empilhadas, cada espaco e uma celula clicavel.
function desenharMapa(edicao) {
  var W = 1240, PAD = 16, GAP = 6, y = PAD;
  var porChave = espacosPorChave();
  var partes = [];
  var zonas = MAPA[edicao] || {};
  ZONAS.forEach(function (zona) {
    var itens = zonas[zona.id];
    if (!itens || !itens.length) return;
    var x = PAD + 12, linhaY = y + 40, alturaLinha = 0, cont = { disponivel: 0, reservado: 0, vendido: 0, nenhum: 0 };
    var celulas = [];
    itens.forEach(function (item) {
      var t = TIPOS[item.tipo];
      if (x + t.w > W - PAD - 12) { x = PAD + 12; linhaY += alturaLinha + GAP; alturaLinha = 0; }
      var chave = chaveMapa(edicao, zona.id, item.codigo);
      var doc = porChave[chave];
      var st = doc ? doc.status : "nenhum";
      cont[st] = (cont[st] || 0) + 1;
      var risco = doc && doc.patrocinadorEmRisco;
      var patro = doc && doc.patrocinador ? doc.patrocinador.nome : "";
      var ocupante = (doc ? doc.ocupante2026 : item.ocupante) || "";
      var nome = doc ? doc.nome : nomeEspaco(edicao, zona.id, item);
      var maxChars = Math.max(4, Math.floor((t.w - 8) / 5.4));
      var rot = patro || ocupante;
      var tit = nome + "\n" + (doc ? STATUS_ESPACO[doc.status].label : "Sem cadastro") +
        (patro ? "\nPatrocinador: " + patro : "") + (ocupante ? "\nOcupante 2026: " + ocupante : "") + (doc && doc.vendedorNome ? "\nVendedor: " + doc.vendedorNome : "") +
        (item.m2 ? "\n" + item.m2 + " m²" : "") + (risco ? "\nRisco de renovação: " + risco : "");
      celulas.push(
        '<g class="cel st-' + st + (risco ? " risco" : "") + '" data-acao="mapa-espaco" data-mapa="' + escXml(chave) + '" role="button" tabindex="0" aria-label="' + escXml(nome) + '">' +
          "<title>" + escXml(tit) + "</title>" +
          '<rect x="' + x + '" y="' + linhaY + '" width="' + t.w + '" height="' + t.h + '" rx="4"/>' +
          '<text class="t-cod" x="' + (x + 5) + '" y="' + (linhaY + 14) + '">' + escXml(item.rotulo && t.w >= 88 ? truncar(item.rotulo, maxChars) : item.codigo) + "</text>" +
          (rot ? '<text class="t-rot" x="' + (x + 5) + '" y="' + (linhaY + 27) + '">' + escXml(truncar(rot, maxChars)) + "</text>" : "") +
          (doc && doc.status !== "disponivel" && doc.vendedorNome && t.h >= 58 ? '<text class="t-rot" x="' + (x + 5) + '" y="' + (linhaY + 39) + '">' + escXml(truncar("↳ " + primeiroNome(doc.vendedorNome), maxChars)) + "</text>" : "") +
          (item.m2 && t.h >= 54 ? '<text class="t-m2" x="' + (x + 5) + '" y="' + (linhaY + t.h - 6) + '">' + escXml(item.m2 + " m²") + "</text>" : "") +
        "</g>");
      x += t.w + GAP;
      if (t.h > alturaLinha) alturaLinha = t.h;
    });
    var alturaZona = (linhaY + alturaLinha + 12) - y;
    var resumo = [
      cont.disponivel + " disp.", cont.reservado + " res.", cont.vendido + " vend.",
    ].concat(cont.nenhum ? [cont.nenhum + " sem cadastro"] : []).join(" · ");
    partes.push(
      '<g><rect class="zona" x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + alturaZona + '" rx="8"/>' +
      '<text class="t-zona" x="' + (PAD + 12) + '" y="' + (y + 20) + '">' + escXml(zona.titulo) + "</text>" +
      '<text class="t-nota" x="' + (PAD + 12) + '" y="' + (y + 32) + '">' + escXml(zona.nota || "") + "</text>" +
      '<text class="t-nota" x="' + (W - PAD - 118) + '" y="' + (y + 20) + '" text-anchor="end">' + escXml(resumo) + "</text>" +
      '<g class="botao-ampliar" data-acao="ampliar-zona" data-zona="' + escXml(zona.id) + '" role="button" tabindex="0" aria-label="Ampliar ' + escXml(zona.titulo) + '">' +
        "<title>Clique para ver esta zona inteira em tela cheia</title>" +
        '<rect x="' + (W - PAD - 108) + '" y="' + (y + 8) + '" width="96" height="21" rx="4"/>' +
        '<text x="' + (W - PAD - 60) + '" y="' + (y + 22) + '" text-anchor="middle">AMPLIAR</text></g>' +
      celulas.join("") + "</g>");
    y += alturaZona + 14;
  });
  return '<svg class="mapa-svg" viewBox="0 0 ' + W + " " + (y + 2) + '" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Mapa de espaços da ' + escXml(edicao === "auto" ? "Edição Auto" : "Edição Moto") + '">' + partes.join("") + "</svg>";
}

function contagemEdicao(edicao) {
  var c = { total: 0, disponivel: 0, reservado: 0, vendido: 0, risco: 0, semCadastro: 0 };
  var porChave = espacosPorChave();
  var zonas = MAPA[edicao] || {};
  ZONAS.forEach(function (zona) {
    (zonas[zona.id] || []).forEach(function (item) {
      c.total++;
      var doc = porChave[chaveMapa(edicao, zona.id, item.codigo)];
      if (!doc) { c.semCadastro++; return; }
      c[doc.status] = (c[doc.status] || 0) + 1;
      if (doc.patrocinadorEmRisco) c.risco++;
    });
  });
  return c;
}

      '<p class="mt-1 text-xs text-muted-foreground">Base: plantas de 2026. Verde = disponível, amarelo = reservado, branco = vendido, borda vermelha = renovação em risco.</p></div>' +

    "</div>" + corpo + "</div>";
}

// Encontra o item do catalogo pela chave "edicao:zona:codigo".

}

// Zona inteira em tela cheia: e a mesma zona do mapa, so que grande o bastante
// para caber o nome da marca, o status e o vendedor sem cortar nada.
function itensDaZona(edicao, zonaId) {
  var porChave = espacosPorChave();
  return ((MAPA[edicao] || {})[zonaId] || []).map(function (item) {
    var chave = chaveMapa(edicao, zonaId, item.codigo);
    var doc = porChave[chave] || null;
    return {
      item: item, chave: chave, doc: doc,
      status: doc ? doc.status : "nenhum",
      nome: doc ? doc.nome : nomeEspaco(edicao, zonaId, item),
      rotulo: item.rotulo || item.codigo,
      patrocinador: doc && doc.patrocinador ? doc.patrocinador.nome : "",
      ocupante: (doc ? doc.ocupante2026 : item.ocupante) || "",
      vendedor: doc && doc.vendedorNome ? doc.vendedorNome : "",
      m2: doc && doc.metragem != null ? doc.metragem : item.m2,
      valor: doc ? doc.valor : null,
      risco: doc && doc.patrocinadorEmRisco ? doc.patrocinadorEmRisco : "",
    };
  });
}

function celulaAmpliada(e) {
  var st = STATUS_ESPACO[e.status] || { label: "Sem cadastro" };
  var linha2 = e.patrocinador ? esc(e.patrocinador)
    : e.ocupante ? esc(e.ocupante) + ' <span style="opacity:.7;font-weight:400">· 2026</span>'
    : '<span style="opacity:.7;font-weight:400">' + (e.status === "nenhum" ? "Sem cadastro" : "Sem marca") + "</span>";
  var detalhe = (e.status === "nenhum" ? "Sem cadastro" : st.label) + (e.m2 ? " · " + String(e.m2).replace(".", ",") + " m²" : "");
  return '<button type="button" class="' + cn("amp-cel", "st-" + e.status, e.risco && "risco") + '" data-acao="mapa-espaco" data-mapa="' + esc(e.chave) + '">' +
    '<span class="cod">' + esc(e.rotulo) + "</span>" +
    '<span class="marca">' + linha2 + "</span>" +
    (e.vendedor ? '<span class="meta sub">' + esc(primeiroNome(e.vendedor)) + "</span>" : "") +

}

function tabelaAmpliada(lista) {
  var cel = function (v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</td>"; };

      cel(esc(e.rotulo), "cod") + cel(esc(e.nome)) +

function resumoCombinados(patroId) {
  var n = contarEntregas(combinadosDe(patroId));
  if (!n.total && !n.aConferir) return "";
  var partes = [];
  if (n.total) partes.push(n.entregues + " de " + n.total + " entregue" + (n.total === 1 ? "" : "s"));
  if (n.atrasadas) partes.push(n.atrasadas + " atrasada" + (n.atrasadas > 1 ? "s" : ""));
  if (n.aConferir) partes.push(n.aConferir + " a conferir");
  return '<span class="ml-2">· ' + esc(partes.join(" · ")) + "</span>";
}

function badgeMaster() {
  return '<span class="' + cn(BADGE, "text-foreground border-foreground/20 bg-foreground text-background") + '" title="Patrocinador Master: pagou mais e tem mais direitos no festival">' + icone("shield-check", "mr-1 size-3") + "Master</span>";
}

function patrocinadoresFiltrados() {
  var f = S.fp;
  var term = f.q.trim().toLocaleLowerCase("pt-BR");
  return (S.sponsors || []).filter(function (p) {
    if (f.tipo !== "todos" && p.tipo !== f.tipo) return false;
    if (f.status !== "todos" && p.status !== f.status) return false;
    if (f.vendedor !== "todos" && (p.vendedorUid || "") !== f.vendedor) return false;
    if (f.master === "sim" && !p.master) return false;
    if (f.master === "nao" && p.master) return false;
    if (f.renovacao !== "todos" && p.renovacao !== f.renovacao) return false;
    if (term) {
      var texto = [p.nome, p.contato, p.espacoVinculado, p.responsavelComercial].join(" ").toLocaleLowerCase("pt-BR");
      if (texto.indexOf(term) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return (b.master ? 1 : 0) - (a.master ? 1 : 0) || porNome(a, b); });
}
