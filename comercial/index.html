<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Comercial Festival Interlagos</title>
<meta name="description" content="Gestão comercial de espaços, patrocinadores e interações do Festival Interlagos.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="icone-festival.png?v=1">
<link rel="apple-touch-icon" href="icone-festival.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografia: Geist, a fonte livre mais proxima da que a Apple usa no Mac.
     Uma familia so, em caixa normal, com os pesos 400 a 700. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  /* O app.css e o CSS compilado do app original (Tailwind). Aqui so entra o que
     no original vinha de biblioteca em tempo de execucao: toasts (sonner),
     posicao do menu de selecao e trava de rolagem do dialogo. */
  /* ====================================================================
     Identidade Suhai Festival Interlagos 2026 (diretrizes de marca).
     Cores oficiais: verde #B0F867, preto #000000, branco #FFFFFF.
     As cores de alerta (ambar e vermelho) nao estao na paleta da marca:
     existem so para status e sao usadas em area pequena.
     ==================================================================== */
  /* Dois temas, mesma estrutura: claro (padrao) e escuro. A escolha fica no
     navegador de cada pessoa (chave fi-tema) e o atributo data-tema entra no
     <html> antes da pagina desenhar, para nao piscar branco. */
  :root{
    --marca-verde:#B0F867;
    --background:#F5F5F7;
    --foreground:#1D1D1F;
    --card:#FFFFFF;
    --card-foreground:#1D1D1F;
    --popover:#FFFFFF;
    --popover-foreground:#1D1D1F;
    --primary:#9BE83F;
    --primary-foreground:#0F1408;
    --secondary:#ECECF0;
    --secondary-foreground:#1D1D1F;
    --muted:#ECECF0;
    --muted-foreground:#65656B;
    --accent:#E8E8ED;
    --accent-foreground:#1D1D1F;
    --border:#E1E1E6;
    --input:#D5D5DB;
    --ring:#7CC42A;
    --destructive:#C9342C;
    --destructive-foreground:#FFFFFF;
    --warning:#E08C00;
    --warning-foreground:#7A4A00;
    --success:#2E8B3C;
    --success-foreground:#FFFFFF;
    --sidebar:#EDEDF0;
    --sidebar-foreground:#1D1D1F;
    --sidebar-primary:#FFFFFF;
    --sidebar-primary-foreground:#1D1D1F;
    --sidebar-accent:#E4E4E9;
    --sidebar-accent-foreground:#1D1D1F;
    --sidebar-border:#E0E0E5;
    --font-sans:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --radius:.75rem;
    /* peças do tema */
    --vidro:rgba(245,245,247,.72);
    --vidro-borda:rgba(0,0,0,.08);
    --sombra-cartao:0 1px 2px rgba(0,0,0,.05);
    --sombra-flutua:0 12px 34px rgba(0,0,0,.14);
    --nav-ativo:#FFFFFF;
    --nav-ativo-sombra:0 1px 2px rgba(0,0,0,.08);
    --trilho:#E4E4E9;
    --mapa-chao:#EDEEF1;
    --mapa-vendido:#E3E3E8;
    --mapa-vendido-texto:#3C3C43;
    --mapa-zona:rgba(0,0,0,.03);
    --mapa-zona-borda:rgba(0,0,0,.1);
    --am-livre-fundo:#E7F6EA;--am-livre-borda:#9FD7AB;
    --am-guardado-fundo:#FFFFFF;--am-guardado-borda:#8E8E93;
    --am-reservado-fundo:#FFF4DC;--am-reservado-borda:#F0C36A;
    --am-vendido-fundo:#E3E3E8;--am-vendido-borda:#C7C7CC;
    --am-fila:#F5A524;
    --vidro-dock:rgba(255,255,255,.62);--vidro-dock-borda:rgba(255,255,255,.75);
    --dock-divisor:rgba(0,0,0,.12);
    --verde-fraco:rgba(124,196,42,.14);
    --verde-texto:#2E8B3C;
    --ambar-fraco:rgba(224,140,0,.14);
    --ambar-texto:#8A5200;
    --vermelho-texto:#C9342C;
    color-scheme:light;
  }
  html[data-tema="escuro"]{
    --background:#121214;
    --foreground:#F5F5F7;
    --card:#1E1E21;
    --card-foreground:#F5F5F7;
    --popover:#1E1E21;
    --popover-foreground:#F5F5F7;
    --primary:#B0F867;
    --primary-foreground:#0F1408;
    --secondary:rgba(255,255,255,.08);
    --secondary-foreground:#F5F5F7;
    --muted:rgba(255,255,255,.07);
    --muted-foreground:#A1A1A8;
    --accent:rgba(255,255,255,.1);
    --accent-foreground:#F5F5F7;
    --border:rgba(255,255,255,.1);
    --input:rgba(255,255,255,.18);
    --ring:#B0F867;
    --destructive:#FF6B5E;
    --destructive-foreground:#0F1408;
    --warning:#FFC24B;
    --warning-foreground:#FFD98A;
    --success:#8FE39B;
    --success-foreground:#0F1408;
    --sidebar:#1A1A1D;
    --sidebar-foreground:#F5F5F7;
    --sidebar-primary:rgba(255,255,255,.1);
    --sidebar-primary-foreground:#F5F5F7;
    --sidebar-accent:rgba(255,255,255,.08);
    --sidebar-accent-foreground:#F5F5F7;
    --sidebar-border:rgba(255,255,255,.08);
    --am-livre-fundo:rgba(143,227,155,.2);--am-livre-borda:#6FBF7F;
    --am-guardado-fundo:transparent;--am-guardado-borda:rgba(255,255,255,.45);
    --am-reservado-fundo:rgba(255,194,75,.2);--am-reservado-borda:#C9973A;
    --am-vendido-fundo:rgba(255,255,255,.14);--am-vendido-borda:rgba(255,255,255,.26);
    --am-fila:#FFC24B;
    --vidro-dock:rgba(40,40,44,.72);--vidro-dock-borda:rgba(255,255,255,.14);
    --dock-divisor:rgba(255,255,255,.16);
    --vidro:rgba(18,18,20,.72);
    --vidro-borda:rgba(255,255,255,.1);
    --sombra-cartao:0 1px 2px rgba(0,0,0,.4);
    --sombra-flutua:0 14px 38px rgba(0,0,0,.55);
    --nav-ativo:rgba(255,255,255,.1);
    --nav-ativo-sombra:none;
    --trilho:rgba(255,255,255,.08);
    --mapa-chao:#17171A;
    --mapa-vendido:rgba(255,255,255,.1);
    --mapa-vendido-texto:#C7C7CC;
    --mapa-zona:rgba(255,255,255,.035);
    --mapa-zona-borda:rgba(255,255,255,.1);
    --verde-fraco:rgba(176,248,103,.14);
    --verde-texto:#8FE39B;
    --ambar-fraco:rgba(255,194,75,.14);
    --ambar-texto:#FFC24B;
    --vermelho-texto:#FF8A8A;
    color-scheme:dark;
  }
  html{background:var(--background)}
  body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  ::selection{background:var(--primary);color:var(--primary-foreground)}
  /* Uma familia so, em caixa normal: nada de titulo gritado em maiusculas */
  h1,h2,h3{font-family:var(--font-sans);text-wrap:balance}
  h1,h1[class]{font-weight:600;letter-spacing:-.021em;line-height:1.15}
  h2,h3,h2[class],h3[class]{font-weight:600;letter-spacing:-.011em;line-height:1.3}
  p{text-wrap:pretty}
  .uppercase{text-transform:none}
  .font-black{font-weight:600}
  .text-4xl.font-black,.text-3xl.font-black{letter-spacing:-.022em;line-height:1.1}
  .text-2xl.font-black{letter-spacing:-.018em;line-height:1.15}
  .tracking-wider,.tracking-widest{letter-spacing:.005em}
  .text-xs.font-bold,thead th{letter-spacing:0;font-weight:600}
  /* ---- legibilidade e uso ----
     Texto de apoio sempre claro, alvos de toque grandes no celular,
     foco visivel no teclado e respeito a quem pediu menos animacao. */
  body{line-height:1.5;text-rendering:optimizeLegibility}
  .text-xs{font-size:.78rem}
  p,dd,td,li{line-height:1.55}
  table{font-variant-numeric:tabular-nums;min-width:1060px}
  td,th{vertical-align:middle}
  input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
  button:disabled,select:disabled,input:disabled{opacity:.6}
  input,select,textarea{color:var(--foreground)}
  p .inline-flex,dd .inline-flex,h2 .inline-flex,h3 .inline-flex{vertical-align:middle;line-height:1.15}
  label{color:var(--foreground)}
  @media (max-width:767px){
    button{min-height:44px}
    select,input,textarea{min-height:44px;font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
  /* "///" do logotipo no lugar do tracinho dos rotulos de secao */
  .h-1.w-8.bg-primary{height:10px;width:24px;background:repeating-linear-gradient(to right,var(--verde-texto) 0 4px,transparent 4px 7px);transform:skewX(-20deg)}
  /* cabecalho translucido, como as janelas do Mac */
  header.sticky{position:sticky;background:var(--vidro);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--vidro-borda)}
  .text-sidebar-foreground\/65{color:var(--muted-foreground)}
  .text-background\/65{color:var(--muted-foreground)}
  .toast{opacity:1}
  /* menu lateral: item escolhido como uma pilula discreta, nao um bloco verde */
  aside nav a[aria-current="page"],nav.fixed a[aria-current="page"]{background:var(--nav-ativo);color:var(--foreground);box-shadow:var(--nav-ativo-sombra);font-weight:600}
  aside nav a,nav.fixed a{border-radius:10px}
  /* cartoes arredondados, com sombra quase invisivel */
  .bg-card{border-radius:var(--radius);box-shadow:var(--sombra-cartao);transition:border-color .15s,background-color .15s}
  .bg-card .bg-card{box-shadow:none}
  button{transition:background-color .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
  button:active{transform:translateY(1px)}
  /* barra de rolagem no tom da marca */
  *{scrollbar-color:var(--input) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--input);border:3px solid var(--background);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground)}
  /* tela de acesso */
  /* a peca da marca na tela de entrar e sempre escura, nos dois temas */
  .marca-hero{position:relative;overflow:hidden;background:#000;color:#fff}
  .marca-hero h1,.marca-hero p,.marca-hero span{color:#fff}
  .marca-hero .text-muted-foreground{color:rgba(255,255,255,.72)}
  .marca-hero .text-primary{color:var(--marca-verde)}
  .marca-hero .marca-pilula{border-color:var(--marca-verde);color:var(--marca-verde)}
  .marca-hero::before{content:"";position:absolute;inset:-10%;background:
    radial-gradient(60% 50% at 18% 12%,rgba(176,248,103,.16),transparent 70%),
    radial-gradient(45% 45% at 88% 88%,rgba(176,248,103,.1),transparent 70%)}
  .marca-chevron{position:absolute;border:2px solid rgba(176,248,103,.35);border-radius:26px;transform:skewX(-20deg)}
  .marca-degrade{display:flex;align-items:flex-end;gap:7px;height:26px}
  .marca-degrade i{display:block;background:var(--marca-verde);height:100%}
  .tracking-wider{letter-spacing:.05em}.text-6xl{font-size:3.75rem;line-height:1.16}.w-56{width:14rem}.self-start{align-self:flex-start}
  .marca-pilula{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:500;letter-spacing:0;line-height:1.2}
  .toaster{position:fixed;top:24px;right:24px;z-index:999999;display:flex;flex-direction:column;gap:14px;width:356px;max-width:calc(100vw - 32px);pointer-events:none}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:16px;border-radius:8px;border:1px solid;font-size:13px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.1);font-family:inherit;animation:toast-in .35s cubic-bezier(.21,1.02,.73,1)}
  .toast svg{width:20px;height:20px;flex-shrink:0}
  .toast{background:var(--card);color:var(--foreground);border-color:var(--border);box-shadow:var(--sombra-flutua);border-radius:12px}
  .toast.sucesso{background:var(--card);color:var(--foreground);border-color:var(--border)}
  .toast.sucesso svg{color:var(--verde-texto)}
  .toast.erro{background:var(--card);color:var(--foreground);border-color:var(--border)}
  .toast.erro svg{color:var(--vermelho-texto)}
  .toast.saindo{opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
  @keyframes toast-in{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
  @media (max-width:600px){.toaster{top:16px;right:16px;left:16px;width:auto}}
  .menu-selecao{position:fixed}
  /* seletor no estilo do Mac: trilho cinza, pilula clara no escolhido */
  /* o logotipo nao pode ser espremido pelo resto do cabecalho */
  .topo-pagina .logo-simbolo{width:28px;height:28px;border-radius:8px}
  /* em tela media os cartoes de dinheiro ficam estreitos: numero menor em vez de quebrado no meio */
  @media (min-width:768px) and (max-width:1100px){ .text-3xl.break-words{font-size:1.375rem} }
  /* no celular o cabecalho e apertado: tudo um pouco menor, sem rolar de lado */
  @media (max-width:520px){
    .topo-pagina{padding-left:12px;padding-right:12px;gap:8px}
    .topo-pagina button.h-9.w-9{width:34px;min-width:34px}
    .topo-pagina .seg-botao{padding-left:7px;padding-right:7px}
  }
  .logo-simbolo{width:32px;height:32px;border-radius:9px;flex-shrink:0}
  .logo-largo{display:none}
  /* o app.css compilado nao tem md:inline-flex nem xs:inline; estas duas fazem o mesmo papel */
  .so-desktop{display:none}
  @media (min-width:768px){ .so-desktop{display:inline-flex} }
  .seg-trilho{gap:2px;padding:3px;border-radius:10px;background:var(--trilho)}
  .seg-botao{border:0;background:transparent;border-radius:7px;color:var(--muted-foreground);white-space:nowrap}
  .seg-botao:hover{color:var(--foreground)}
  .seg-ativo,.seg-ativo:hover{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  /* campos e botoes: cantos e alturas do jeito do Mac */
  input,select,textarea,button,.rounded-md{border-radius:10px}
  .rounded-none{border-radius:0}
  table input,table select{border-radius:8px}
  .inline-flex.rounded-md{border-radius:999px}
  thead th{font-weight:600;color:var(--muted-foreground);font-size:.78rem}
  thead.bg-muted{background:var(--muted)}
  /* a tabela dentro do cartao segue o canto arredondado */
  .bg-card>.overflow-x-auto:first-child,.bg-card>div>.overflow-x-auto:first-child{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
  tbody tr:last-child{border-bottom:0}
  body.dialogo-aberto{overflow:hidden}
  /* classes que o app original nao usava e por isso nao estao no app.css */
  .overflow-x-auto{overflow-x:auto}
  .justify-end{justify-content:flex-end}
  .h-64{height:16rem}
  .bg-destructive\/10{background-color:color-mix(in oklab,var(--destructive) 10%,transparent)}
  @media (min-width:640px){.sm\:p-3{padding:.75rem}}
  .gap-x-3{column-gap:.75rem}.gap-y-1{row-gap:.25rem}.mr-1{margin-right:.25rem}
  .bg-muted\/40{background-color:color-mix(in oklab,var(--muted) 40%,transparent)}.ml-2{margin-left:.5rem}.pt-1{padding-top:.25rem}.text-right{text-align:right}.w-36{width:9rem}
  .min-h-\[60px\]{min-height:60px}.grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}.grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}.grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  /* menu do celular: com muitos itens ele rola de lado em vez de espremer */
  /* larguras de coluna proprias: o app.css compilado so traz as que o visual antigo usava */
  @media (min-width:768px){ .casca-grade{display:grid;grid-template-columns:224px minmax(0,1fr)} }
  @media (min-width:1100px){ .grade-inicio{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start} }
  /* ---- mapa: barra flutuante em vidro, como o Dock do Mac ---- */
  .cartao-mapa{overflow:visible}
  .cartao-mapa>div:first-child{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
  .area-mapa{position:relative;background:var(--mapa-chao);
    border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
  .dock-mapa{position:sticky;bottom:14px;z-index:5;margin:-60px auto 14px;width:max-content;
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;max-width:calc(100% - 28px);
    flex-wrap:wrap;justify-content:center;font-size:12px;
    background:var(--vidro-dock);border:1px solid var(--vidro-dock-borda);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.55)}
  .dock-mapa .seg-trilho{background:rgba(0,0,0,.06)}
  html[data-tema="escuro"] .dock-mapa .seg-trilho{background:rgba(255,255,255,.08)}
  .divisor-dock{width:1px;height:22px;background:var(--dock-divisor);flex-shrink:0}
  .legenda-dock{display:flex;align-items:center;gap:12px;color:var(--foreground);white-space:nowrap}
  .legenda-dock>span{display:flex;align-items:center;gap:6px}
  .amostra{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
  .amostra-fila{min-width:16px;height:16px;border-radius:8px;background:var(--am-fila);color:#1d1d1f;
    font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 3px}
  /* o app.css compilado nao tem w-80: a busca fica com largura fixa so a partir do tablet */
  .busca-curta{width:100%}
  @media (min-width:640px){ .busca-curta{width:320px;flex-shrink:0} }
  @media (max-width:640px){ .dock-mapa{position:static;margin:0;width:auto;max-width:100%;border-radius:0;
    border-left:0;border-right:0;border-bottom:0;box-shadow:none} }
  /* quatro numeros lado a lado ja no notebook, nao so em tela grande */
  @media (min-width:1024px){ .grade-numeros{grid-template-columns:repeat(4,minmax(0,1fr))} }
  /* ---- Propriedades: marcas a esquerda, entregas a direita ---- */
  .mestre-detalhe{display:grid;grid-template-columns:1fr;gap:12px}
  .lista-marcas{display:flex;flex-direction:column;gap:2px}
  .marca-linha{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;
    background:transparent;text-align:left;cursor:pointer;color:var(--foreground)}
  .marca-linha:hover{background:var(--accent)}
  .marca-linha-ativa,.marca-linha-ativa:hover{background:var(--nav-ativo);box-shadow:var(--sombra-cartao)}
  .selo-atraso{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--destructive);color:#fff;
    font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .detalhe-marca{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);box-shadow:var(--sombra-cartao);min-width:0}
  .linha-entrega{display:flex;align-items:center;gap:12px;padding:10px 16px}
  .linha-entrega-atrasada{box-shadow:inset 3px 0 0 var(--destructive)}
  .linha-entrega select{width:9rem}
  .selo-conferir{font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--verde-fraco);color:var(--foreground);white-space:nowrap;flex-shrink:0}
  /* celular: ou a lista, ou a marca aberta */
  @media (max-width:767px){
    .mestre-detalhe.escolhida .lista-marcas{display:none}
    .mestre-detalhe:not(.escolhida) .detalhe-marca{display:none}
    .lista-marcas{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:6px}
    /* no celular o texto ocupa a linha inteira e os controles descem para a linha de baixo */
    .linha-entrega{flex-wrap:wrap;gap:8px 12px}
    .linha-entrega>div:first-child{flex-basis:100%}
  }
  /* computador: as duas colunas, a lista parada enquanto o lado direito rola */
  @media (min-width:768px){
    .mestre-detalhe{grid-template-columns:260px minmax(0,1fr);align-items:start}
    .lista-marcas{position:sticky;top:72px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px}
  }

}

/* ------------------------------------------------- estilo (claro ou escuro) */
// Tres opcoes: Claro, Escuro e Automatico (segue o computador). Fica guardado no
// navegador de cada pessoa, nao no banco: e gosto de cada um, nao dado do painel.
var TEMA_CHAVE = "fi-tema";
var TEMAS = { claro: "Claro", escuro: "Escuro", auto: "Automático" };
function temaGuardado() {
  var v = null;
  try { v = localStorage.getItem(TEMA_CHAVE); } catch (e) {}
  return TEMAS[v] ? v : "auto";
}
function temaDoComputador() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
}
function temaValendo() { var t = temaGuardado(); return t === "auto" ? temaDoComputador() : t; }
function aplicarTema() { document.documentElement.setAttribute("data-tema", temaValendo()); }
function mudarTema(v) {
  if (!TEMAS[v]) v = "auto";
  try { localStorage.setItem(TEMA_CHAVE, v); } catch (e) {}
  aplicarTema();
  render();
}
// o computador mudou de claro para escuro (ou o contrario) com a pessoa em "Automático"
function ouvirTemaDoComputador() {
  if (!window.matchMedia) return;
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var aoTrocar = function () { if (temaGuardado() === "auto") { aplicarTema(); render(); } };
  if (mq.addEventListener) mq.addEventListener("change", aoTrocar);
  else if (mq.addListener) mq.addListener(aoTrocar);
}

/* ------------------------------------------------- edicao (Moto e Auto) */
// O painel inteiro pode ficar so numa edicao, como o mapa ja fazia. "tudo" mostra as duas.
// O que nao tem edicao no cadastro (marca sem espaco e sem contrato, por exemplo) aparece
// sempre: nada some sem a pessoa saber. A escolha fica guardada no navegador.
var EDICAO_TUDO = "tudo";
var EDICAO_CHAVE = "fi-edicao";
function edicaoValida(v) { return v === EDICAO_TUDO || EDICOES_IDS.indexOf(v) >= 0 ? v : null; }
function edicaoEscolhida() {
  if (!S.edicao) {
    var g = null;
    try { g = localStorage.getItem(EDICAO_CHAVE); } catch (e) {}
    S.edicao = edicaoValida(g) || EDICAO_TUDO;
  }
  return S.edicao;
}
function mudarEdicao(v) {
  S.edicao = edicaoValida(v) || EDICAO_TUDO;
  try { localStorage.setItem(EDICAO_CHAVE, S.edicao); } catch (e) {}
}
function filtrandoEdicao() { return edicaoEscolhida() !== EDICAO_TUDO; }
// eds e a lista de edicoes daquela coisa. Vazia quer dizer "nao da para saber": passa sempre.
function passaEdicao(eds) {
  if (!filtrandoEdicao()) return true;
  if (!eds || !eds.length) return true;
  return eds.indexOf(edicaoEscolhida()) >= 0;
}
function rotuloEdicaoEscolhida() { var e = edicaoEscolhida(); return e === EDICAO_TUDO ? "Moto e Auto" : rotuloEdicao(e); }
function agoraIso() { return new Date().toISOString(); }

function comPrazo(promessa, ms, recado) {

}

function formatCurrency(value) {

}
function formatDateTime(value) {

}

}

// acao (opcional): { rotulo, fn, ms } poe um botao no aviso, ex.: "Desfazer" depois de excluir
function toast(tipo, texto, acao) {
  var el = document.createElement("div");
  el.className = "toast " + (tipo === "success" ? "sucesso" : "erro");
  el.setAttribute("role", "status");
  var svg = tipo === "success"
    ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/></svg>'
    : '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>';
  el.innerHTML = svg + "<span>" + esc(texto) + "</span>" + (acao ? '<button type="button" class="toast-acao">' + esc(acao.rotulo) + "</button>" : "");
  var box = document.getElementById("toasts");
  box.prepend(el);
  var sair = function () { el.classList.add("saindo"); setTimeout(function () { el.remove(); }, 260); };
  var timer = setTimeout(sair, acao ? (acao.ms || 6000) : 4000);
  if (acao) el.querySelector(".toast-acao").addEventListener("click", function (ev) {
    ev.stopPropagation(); clearTimeout(timer); sair();
    try { acao.fn(); } catch (e) {}
  });
}
toast.success = function (t) { toast("success", t); };
toast.error = function (t) { toast("error", t); };

/* ------------------------------------------------ lixeira na leitura */
// Excluir manda para a lixeira: o documento ganha excluido_em e some das listas normais.
// O filtro mora na leitura da API (as duas, Firebase e teste), entao vale para todas as
// telas de uma vez. listar(col, { comExcluidos: true }) devolve tudo: so a Lixeira usa.
// EXCLUIDOS guarda, por colecao, o que estava na lixeira na ultima leitura completa: a fila
// dos espacos e os contatos/entregas/contratos de marca excluida usam isso para sumir junto.
var EXCLUIDOS = {};
// EXISTEM: por colecao, todos os ids da ultima leitura completa (na lixeira ou nao). Marca
// excluida de vez some do banco, e a entrada dela na fila de um espaco deixa de contar.
var EXISTEM = {};
// espaco na lixeira pela chave do mapa (moto:box:07): o detalhe do mapa nao oferece cadastrar por cima
var ESPACOS_LIXO_MAPA = {};
function estaExcluido(d) { return !!(d && d.excluido_em); }
function separarExcluidos(col, lista, opcoes, completa) {
  if (completa) {
    var ids = {}, todos = {}, porMapa = {};
    lista.forEach(function (d) { todos[d.id] = true; if (estaExcluido(d)) { ids[d.id] = true; if (d.mapa) porMapa[d.mapa] = d.id; } });
    EXCLUIDOS[col] = ids; EXISTEM[col] = todos;
    if (col === "espacos") ESPACOS_LIXO_MAPA = porMapa;
  }
  return opcoes && opcoes.comExcluidos ? lista : lista.filter(function (d) { return !estaExcluido(d); });
}
// documento criado agora entra na lista dos que existem (senao a fila esconderia a marca nova)
function lembrarCriado(col, id) { if (EXISTEM[col] && id) EXISTEM[col][id] = true; }
// id do documento do espaco que esta na lixeira nesta posicao do mapa (ou null)
function espacoNaLixeira(chave) {
  if (!chave) return null;
  if (ESPACOS_LIXO_MAPA[chave]) return ESPACOS_LIXO_MAPA[chave];
  return EXCLUIDOS.espacos && EXCLUIDOS.espacos[chave] ? chave : null;
}
// tipo como na fila dos espacos: "patrocinador" ou "marca" (marca desejo)
function marcaNaLixeira(tipo, id) {
  var m = EXCLUIDOS[tipo === "marca" ? "prospeccao" : "patrocinadores"];
  return !!(id && m && m[id]);
}
// marca que foi excluida de vez: o documento nao existe mais (so conta depois de uma leitura completa)
function marcaSumiu(tipo, id) {
  var m = EXISTEM[tipo === "marca" ? "prospeccao" : "patrocinadores"];
  return !!(id && m && !m[id]);
}
// contato, entrega ou contrato cuja marca esta na lixeira some junto com ela
function daMarcaNaLixeira(d) {
  if (d.patrocinador_id) return marcaNaLixeira("patrocinador", d.patrocinador_id);
  return !!d.prospeccao_id && marcaNaLixeira("marca", d.prospeccao_id);
}
function filaSemLixeira(lista) { return (lista || []).filter(function (f) { return !marcaNaLixeira(f.tipo, f.marca_id) && !marcaSumiu(f.tipo, f.marca_id); }); }

var API = null;

async function criarApiFirebase() {
  var appMod = await import(SDK + "firebase-app.js");
  var authMod = await import(SDK + "firebase-auth.js");
  var fsMod = await import(SDK + "firebase-firestore.js");
  var stMod = await import(SDK + "firebase-storage.js");
  var app = appMod.initializeApp(FIREBASE_CONFIG);
  var auth = authMod.getAuth(app);
  auth.languageCode = "pt-BR";
  var db = fsMod.getFirestore(app);
  var storage = stMod.getStorage(app);
  var modeloIa = null;

  // sem opcoes: so o que nao esta na lixeira. { comExcluidos: true }: tudo (tela Lixeira)
  async function listar(col, opcoes) {
    var snap = await fsMod.getDocs(fsMod.collection(db, col));
    return separarExcluidos(col, snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); }), opcoes, true);
  }

  return {
    aoMudarLogin: function (cb) { return authMod.onAuthStateChanged(auth, cb); },
    usuario: function () { return auth.currentUser; },
    entrar: async function (email, senha) {
      var cred = await authMod.signInWithEmailAndPassword(auth, email, senha);
      if (!cred.user.emailVerified) {
        await authMod.signOut(auth);
        var e = new Error("email-nao-confirmado");
        e.code = "email-nao-confirmado";
        throw e;
      }
      return cred.user;
    },
    criarConta: async function (nome, email, senha) {
      nome = limparTexto(nome).slice(0, 80); // o perfil aceita ate 80 caracteres
      var cred = await authMod.createUserWithEmailAndPassword(auth, email, senha);
      try { await authMod.updateProfile(cred.user, { displayName: nome }); } catch (e) {}
      try {
        await fsMod.setDoc(fsMod.doc(db, "profiles", cred.user.uid), { nome: nome, email: email, papel: "visualizacao", created_at: agoraIso(), updated_at: agoraIso() });
      } catch (e) {}
      await authMod.sendEmailVerification(cred.user, { url: URL_APP });
      await authMod.signOut(auth);
      return { confirmar: true };
    },
    sair: function () { return authMod.signOut(auth); },
    perfil: async function (user) {
      // o perfil aceita nome de 1 a 80 caracteres: nome maior faria o perfil novo falhar e a pessoa
      // ficaria sem perfil (fora da Equipe, sem o dono conseguir subir o nivel dela)
      var nomePadrao = limparTexto(user.displayName || (user.email ? user.email.split("@")[0] : "")).slice(0, 80) || "Usuário";
      try {
        var s = await fsMod.getDoc(fsMod.doc(db, "profiles", user.uid));
        if (s.exists()) {
          var d = s.data();
          // o e-mail do perfil acompanha o do login: quem trocou o e-mail em Minha conta e clicou no
          // link passa a receber o e-mail diario no endereco novo (antes so gravava se estivesse vazio)
          if (user.email && d.email !== user.email) { try { await fsMod.updateDoc(fsMod.doc(db, "profiles", user.uid), { email: user.email, updated_at: agoraIso() }); } catch (e2) {} }
          // nome e apelido so valem se forem texto (perfil gravado errado nao quebra a tela)
          return { nome: textoDoPerfil(d.nome) || nomePadrao, apelido: textoDoPerfil(d.apelido), papel: d.papel || "vendedor", email: user.email || textoDoPerfil(d.email),
            fotoUrl: fotoConfiavel(d.foto_url, user.uid), fotoPath: textoDoPerfil(d.foto_path) };
        }
        // conta sem perfil: cria como visualizacao; quem sobe de nivel e o dono, na Equipe
        await fsMod.setDoc(fsMod.doc(db, "profiles", user.uid), { nome: nomePadrao, email: user.email || "", papel: "visualizacao", created_at: agoraIso(), updated_at: agoraIso() });
      } catch (e) {}
      return { nome: nomePadrao, apelido: "", papel: "visualizacao", email: user.email || "", fotoUrl: "", fotoPath: "" };
    },
    // ---- Minha conta: cada pessoa arruma o proprio perfil e o proprio login ----
    // nome, apelido e foto no perfil; o nome e a foto vao tambem para o login do Firebase
    atualizarMeuPerfil: async function (dados) {
      var u = auth.currentUser;
      if (!u) throw erroSemLogin();
      var campos = { updated_at: agoraIso() };
      ["nome", "apelido", "foto_url", "foto_path"].forEach(function (k) { if (k in dados) campos[k] = dados[k]; });
      await fsMod.updateDoc(fsMod.doc(db, "profiles", u.uid), campos);
      var doLogin = {};
      if ("nome" in dados) doLogin.displayName = dados.nome;
      if ("foto_url" in dados) doLogin.photoURL = dados.foto_url || null;
      // o perfil ja esta gravado: erro aqui so deixa o login com o nome ou a foto de antes
      if (Object.keys(doLogin).length) { try { await authMod.updateProfile(u, doLogin); } catch (e) {} }
    },
    // a foto ja chega reduzida (256x256, JPEG); devolve o link e o caminho no Storage
    subirFotoPerfil: async function (blob) {
      var u = auth.currentUser;
      if (!u) throw erroSemLogin();
      var caminho = "perfis/" + u.uid + "/foto-" + Date.now() + ".jpg";
      var ref = stMod.ref(storage, caminho);
      await stMod.uploadBytes(ref, blob, { contentType: "image/jpeg" });
      return { url: await stMod.getDownloadURL(ref), path: caminho };
    },
    // o Firebase so troca o e-mail depois que a pessoa clica no link que chega no endereco novo
    trocarEmail: async function (novo, senhaAtual) {
      var u = auth.currentUser;
      if (!u || !u.email) throw erroSemLogin();
      await authMod.reauthenticateWithCredential(u, authMod.EmailAuthProvider.credential(u.email, senhaAtual));
      await authMod.verifyBeforeUpdateEmail(u, novo, { url: URL_APP });
    },
    trocarSenha: async function (atual, nova) {
      var u = auth.currentUser;
      if (!u || !u.email) throw erroSemLogin();
      await authMod.reauthenticateWithCredential(u, authMod.EmailAuthProvider.credential(u.email, atual));
      await authMod.updatePassword(u, nova);
    },
    // link para criar uma senha nova (tela de entrar, Minha conta e o dono na Equipe)
    mandarLinkSenha: async function (email) { await authMod.sendPasswordResetEmail(auth, email, { url: URL_APP }); },
    // o dono muda o nome e o apelido de outra pessoa (o e-mail de login so a propria pessoa troca)
    atualizarPerfilDeOutro: async function (uid, dados) {
      await fsMod.updateDoc(fsMod.doc(db, "profiles", uid), { nome: dados.nome, apelido: dados.apelido || null, updated_at: agoraIso() });
    },
    // o dono tira a foto de outra pessoa (a regra so deixa gravar as duas vazias; o arquivo o painel apaga)
    tirarFotoDeOutro: async function (uid) {
      await fsMod.updateDoc(fsMod.doc(db, "profiles", uid), { foto_url: null, foto_path: null, updated_at: agoraIso() });
    },
    listar: listar,
    // diretoria le todos; o resto le so os contratos em que e vendedor ou atendimento
    listarContratos: async function (todos, opcoes) {
      if (todos) return listar("contratos", opcoes);
      var uid = auth.currentUser.uid, col = fsMod.collection(db, "contratos"), vistos = {};
      var snaps = await Promise.all(["vendedor_uid", "atendimento_uid"].map(function (campo) { return fsMod.getDocs(fsMod.query(col, fsMod.where(campo, "==", uid))); }));
      var lista = [];
      snaps.forEach(function (s) { s.docs.forEach(function (d) { if (!vistos[d.id]) { vistos[d.id] = true; lista.push(Object.assign({}, d.data(), { id: d.id })); } }); });
      return separarExcluidos("contratos", lista, opcoes, false);
    },
    // devolve o documento mesmo se estiver na lixeira (com excluido_em): quem chama decide
    obter: async function (col, id) {
      var d = await fsMod.getDoc(fsMod.doc(db, col, id));
      return d.exists() ? Object.assign({}, d.data(), { id: d.id }) : null;
    },
    definir: async function (col, id, dados) {
      await fsMod.setDoc(fsMod.doc(db, col, id), Object.assign({}, dados, { updated_at: agoraIso() }), { merge: true });
    },
    criar: async function (col, dados, idFixo) {
      var id = idFixo || novoId();
      var agora = agoraIso();
      var doc = Object.assign({}, dados, { criado_por: auth.currentUser.uid, created_at: agora, updated_at: agora });
      await fsMod.setDoc(fsMod.doc(db, col, id), doc);
      lembrarCriado(col, id);
      return Object.assign({}, doc, { id: id });
    },
    atualizar: async function (col, id, dados) {
      await fsMod.updateDoc(fsMod.doc(db, col, id), Object.assign({}, dados, { updated_at: agoraIso() }));
    },
    atualizarVarios: async function (lista) {
      if (!lista.length) return;
      var agora = agoraIso();
      // o Firestore aceita ate 500 gravacoes por lote: lista maior vai em partes
      for (var i = 0; i < lista.length; i += 450) {
        var lote = fsMod.writeBatch(db);
        lista.slice(i, i + 450).forEach(function (it) { lote.update(fsMod.doc(db, it.col, it.id), Object.assign({}, it.dados, { updated_at: agora })); });
        await lote.commit();
      }
    },
    // exclusao definitiva (so a diretoria, pela Lixeira)
    apagar: async function (col, id) { await fsMod.deleteDoc(fsMod.doc(db, col, id)); },
    apagarArquivo: async function (caminho) { await stMod.deleteObject(stMod.ref(storage, caminho)); },
    // Avisa quando o servidor ou outra pessoa mexe na colecao. O que este navegador mesmo
    // gravou nao conta: quem gravou ja recarrega a tela por conta propria.
    escutar: function (col, aoMudar) {
      var ouvir = function (alvo) {
        var primeira = true;
        return fsMod.onSnapshot(alvo, function (snap) {
          if (primeira) { primeira = false; return; }
          var deFora = snap.docChanges().some(function (m) { return !m.doc.metadata.hasPendingWrites; });
          if (deFora) aoMudar();
        }, function () {});
      };
      var colecao = fsMod.collection(db, col);
      if (col !== "contratos" || ehAdmin()) return ouvir(colecao);
      var uid = auth.currentUser.uid;
      var parar = ["vendedor_uid", "atendimento_uid"].map(function (campo) { return ouvir(fsMod.query(colecao, fsMod.where(campo, "==", uid))); });
      return function () { parar.forEach(function (f) { f(); }); };
    },
    // Arquivos (PDF dos contratos) ficam no Storage; a leitura passa pelas regras, sem link publico.
    subirArquivo: async function (caminho, arquivo) {
      await stMod.uploadBytes(stMod.ref(storage, caminho), arquivo, { contentType: arquivo.type || "application/pdf" });
      return caminho;
    },
    // getBlob precisa de CORS liberado no bucket, o que nao da para fazer pelo console.
    // getDownloadURL nao precisa: o link abre direto no navegador.
    urlArquivo: async function (caminho) { return await stMod.getDownloadURL(stMod.ref(storage, caminho)); },
    gerarTexto: async function (sistema, prompt) {
      if (!modeloIa) {
        var aiMod = await import(SDK + "firebase-ai.js");
        var ai = aiMod.getAI(app, { backend: new aiMod.GoogleAIBackend() });
        modeloIa = aiMod.getGenerativeModel(ai, { model: MODELO_IA, systemInstruction: sistema });
      }
      var r = await modeloIa.generateContent(prompt);
      return r.response.text();
    },
    // A IA le o PDF direto do Storage (gs://), sem baixar no navegador. Isso exige
    // o backend Vertex AI, que e o unico que aceita arquivo do proprio projeto.
    // A funcao so atende quem esta logado: vai junto o comprovante de login do Firebase.
    // extra (opcional): dados a mais para a funcao, ex.: { motivo } no cancelar.
    // O erro leva a situacao que a funcao devolve (ex.: 409 do cancelar quando a marca ja assinou).
    assinatura: async function (acao, contratoId, extra) {
      if (!auth.currentUser) throw new Error("Entre no painel de novo para continuar.");
      var token = await auth.currentUser.getIdToken();
      var r;
      try {
        r = await fetch(URL_ASSINATURA + "/" + acao, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify(Object.assign({}, extra || {}, { contratoId: contratoId })),
        });
      } catch (e) { throw new Error("Não consegui falar com o serviço de assinatura. Confira a internet e tente de novo."); }
      var j = {};
      try { j = await r.json(); } catch (e) {}
      if (!r.ok) {
        var erro = new Error(j.erro || "O serviço de assinatura respondeu com erro " + r.status + ".");
        erro.situacao = j.situacao || "";
        throw erro;
      }
      return j;
    },
    lerPdf: async function (sistema, prompt, caminho) {
      var aiMod = await import(SDK + "firebase-ai.js");
      var ai = aiMod.getAI(app, { backend: new aiMod.VertexAIBackend() });
      var modelo = aiMod.getGenerativeModel(ai, {
        model: MODELO_IA, systemInstruction: sistema,
        generationConfig: { responseMimeType: "application/json", temperature: 0 },
      });
      var uri = "gs://" + FIREBASE_CONFIG.storageBucket + "/" + caminho;
      var r = await modelo.generateContent([{ fileData: { mimeType: "application/pdf", fileUri: uri } }, prompt]);
      return r.response.text();
    },
  };
}

var ERRO_ESPACOS = "Não foi possível carregar os espaços.";

// Equivale ao atualizar_contratos_em_risco() do banco original.
async function aplicarRegraContratos() {
  var limite = hojeMais(30);
  var patrocinadores = await API.listar("patrocinadores");
  var espacos = await API.listar("espacos");
  var mudancas = [];
  var emRisco = {};
  patrocinadores.forEach(function (p) {
    var vence = p.data_vencimento_contrato && p.data_vencimento_contrato <= limite;
    if (p.status !== "encerrado" && vence && p.status !== "em_risco_de_renovacao") {
      mudancas.push({ col: "patrocinadores", id: p.id, dados: { status: "em_risco_de_renovacao" } });
      p.status = "em_risco_de_renovacao";
    }
    if (p.status === "em_risco_de_renovacao" && vence && p.espaco_vinculado_id) emRisco[p.espaco_vinculado_id] = true;
  });
  // Voltou sozinho para Disponivel com marca na fila: a vez recomeca hoje se o espaco fica livre de
  // verdade, ou fica esperando a dona de 2026 (null) se continua guardado para ela. Mesma conta de
  // situacaoEspaco2027, feita com o que foi lido aqui (no login as marcas da tela ainda nao chegaram).
  var inicioVezAoVoltar = function (e) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(e.liberado_2027_em || "")) return hojeMais(0);
    var k = chaveMarca(e.ocupante_2026);
    var dona = k ? patrocinadores.find(function (p) { return chaveMarca(p.nome) === k && p.base_2026 !== false; }) : null;
    if (!dona) return hojeMais(0);
    var confirmou = /^\d{4}-\d{2}-\d{2}$/.test(dona.renovacao_2027_em || "") || dona.renovacao === "renovado";
    return !confirmou && dona.renovacao === "recusou" ? hojeMais(0) : null;
  };
  espacos.forEach(function (e) {
    if (!emRisco[e.id] || e.status === "disponivel") return;
    var dados = { status: "disponivel" };
    if (filaSemLixeira(Array.isArray(e.fila) ? e.fila : []).length) dados.fila_vez_desde = inicioVezAoVoltar(e);
    mudancas.push({ col: "espacos", id: e.id, dados: dados });
  });
  await API.atualizarVarios(mudancas);
}

  var precos = {};

      ocupante2026: space.ocupante_2026 || "",

      reservadoParaNome: space.reservado_para_nome || "",
      reservadoPorContrato: space.reservado_por_contrato || null,
      // reserva feita na mao tem prazo; a de contrato assinado (reservado_para_id preenchido) nao
      reservadoAte: /^\d{4}-\d{2}-\d{2}$/.test(space.reservado_ate || "") ? space.reservado_ate : null,
      // filaBruta e o que esta gravado (e o que se grava de volta); fila, logo abaixo, e a mesma

      filaBruta: filaBruta,

      // dia em que a vez da fila comecou a contar (ver vezDaFila); cada entrada da fila pode ter passou_em
      filaVezDesde: /^\d{4}-\d{2}-\d{2}$/.test(space.fila_vez_desde || "") ? space.fila_vez_desde : null,
      vendedorUid: space.vendedor_uid || null,
      vendedorNome: space.vendedor_nome || "",
    };
    Object.defineProperty(o, "fila", { enumerable: true, configurable: true,
      get: function () { return filaSemLixeira(o.filaBruta); },

async function saveSpace(data) {
  var nome = String(data.nome || "").trim();
  var categoria = String(data.categoria || "").trim();
  var ok = nome.length >= 1 && nome.length <= 120 && categoria.length >= 1 && categoria.length <= 120 &&
    isFinite(data.valor) && data.valor >= 0 && ["disponivel", "reservado", "vendido"].indexOf(data.status) >= 0;
  if (!ok) throw new Error("Não foi possível salvar o espaço.");
  // cadastrar por cima do espaco que esta na lixeira a regra nega: quem traz de volta e a diretoria, restaurando
  if (!data.id && data.mapa && espacoNaLixeira(data.mapa)) throw new Error("O cadastro deste espaço está na lixeira. " + (ehAdmin() ? "Restaure pelo detalhe do espaço ou pela tela Lixeira." : "Peça para a diretoria restaurar."));
  var vend = data.vendedorUid ? perfilPorUid(data.vendedorUid) : null;
  var payload = { nome: nome, categoria: categoria, status: data.status,
    metragem: data.metragem == null || !isFinite(data.metragem) ? null : data.metragem,
    ocupante_2026: String(data.ocupante2026 || "").trim().slice(0, 120),
    vendedor_uid: vend ? vend.id : null, vendedor_nome: vend ? vend.nome : "" };
  // mesma regra do seletor de status: espaco liberado nao guarda o nome de quem estava nele
  if (data.status === "disponivel") { payload.reservado_para_id = null; payload.reservado_para_nome = ""; }
  // mesma regra do seletor: virou reservado agora, ganha prazo; deixou de ser reservado, perde
  if (data.status === "reservado") { if (data.statusAntes !== "reservado") payload.reservado_ate = hojeMais(DIAS_RESERVA); }
  else payload.reservado_ate = null;
  // voltou para Disponivel: a vez da fila recomeca (mesma regra do seletor de status)
  if (data.id && data.status === "disponivel") {
    var antesE = (S.spaces || []).find(function (x) { return x.id === data.id; });
    var inicioVez = antesE ? inicioVezAoLiberar(Object.assign({}, antesE, { ocupante2026: payload.ocupante_2026 })) : undefined;
    if (inicioVez !== undefined) payload.fila_vez_desde = inicioVez;
  }
  // saiu de Disponivel com a vez correndo: guarda quem ja perdeu a vez (ver filaAoSairDeDisponivel)
  if (data.id && data.status !== "disponivel" && data.statusAntes === "disponivel") {
    var antesR = (S.spaces || []).find(function (x) { return x.id === data.id; });
    var filaFeita = antesR ? filaAoSairDeDisponivel(antesR) : null;
    if (filaFeita) payload.fila = filaFeita;
  }
  if (!data.id && data.mapa) {
    // espaco criado a partir do mapa: guarda a posicao para o desenho achar o documento
    payload.mapa = data.mapa; payload.edicao = data.edicao; payload.zona = data.zona; payload.codigo = data.codigo; payload.tipo = data.tipo;
  }
  try {
    var idEspaco = data.id;
    if (data.id) await API.atualizar("espacos", data.id, payload);
    else idEspaco = (await API.criar("espacos", payload, data.mapa || null)).id;
    await API.definir("precos", idEspaco, { valor: data.valor });
  } catch (e) { throw new Error("Não foi possível salvar o espaço."); }
}

// Reserva feita na mao vale DIAS_RESERVA dias. Quando vence, o painel so avisa: quem decide
// se renova ou libera e o vendedor. Reserva de contrato assinado nao tem prazo.
var DIAS_RESERVA = 15;
function reservaNaMao(e) { return !!e && e.status === "reservado" && !e.reservadoParaId && !!e.reservadoAte; }
function reservaDeContrato(e) { return !!e && e.status === "reservado" && !!e.reservadoParaId; }

async function changeSpaceStatus(id, status, espaco) {
  var dados = { status: status };
  if (status === "reservado") { if (!espaco || espaco.status !== "reservado") dados.reservado_ate = hojeMais(DIAS_RESERVA); }
  else dados.reservado_ate = null;
  // quem reserva ou vende vira o responsavel; espaco liberado fica sem responsavel
  if (status === "disponivel") {
    dados.vendedor_uid = null; dados.vendedor_nome = "";
    // some o nome de quem estava reservado, senao o espaco fica Disponivel com marca em cima.
    // reservado_por_contrato fica de proposito: e a marca de que aquele contrato ja agiu uma
    // vez, e e o que impede a conferencia automatica de reservar de novo por cima da pessoa.
    dados.reservado_para_id = null; dados.reservado_para_nome = "";
    // voltou para Disponivel: a vez da fila recomeca hoje (ou espera a renovacao, se guardado)
    var inicioVez = inicioVezAoLiberar(espaco);
    if (inicioVez !== undefined) dados.fila_vez_desde = inicioVez;
  }
  else if (!espaco || !espaco.vendedorUid) { dados.vendedor_uid = S.uid; dados.vendedor_nome = S.nome; }
  // saiu de Disponivel com a vez correndo: guarda quem ja perdeu a vez (ver filaAoSairDeDisponivel)
  if (status !== "disponivel" && espaco && espaco.status === "disponivel") { var filaFeita = filaAoSairDeDisponivel(espaco); if (filaFeita) dados.fila = filaFeita; }
  try { await API.atualizar("espacos", id, dados); }
  catch (e) { throw new Error("Não foi possível alterar o status."); }
}

// abrir o painel, passa para combinados_trecho e apaga do combinado. Uma vez so por sessao; se
// falhar, tenta de novo na proxima leitura das entregas. Nao segura a tela.
async function migrarTrechos(lista, jaTem) {
  var velhos = (lista || []).filter(function (c) { return c.trecho; });
  if (!velhos.length || !ehAdmin() || S.trechosMigrados) return;
  S.trechosMigrados = true;
  try {
    for (var i = 0; i < velhos.length; i++) {
      var c = velhos[i];
      if (!jaTem[c.id]) await API.definir("combinados_trecho", c.id, { trecho: String(c.trecho).slice(0, 400), contrato_id: c.contrato_id || null, patrocinador_id: c.patrocinador_id || null });
    }
    await API.atualizarVarios(velhos.map(function (c) { return { col: "combinados", id: c.id, dados: { trecho: "" } }; }));
  } catch (e) { S.trechosMigrados = false; }
}
function combinadosDe(patroId) { return (S.combinados || []).filter(function (c) { return c.patrocinadorId === patroId; }); }
function combinadosDeMarca(marcaId) { return (S.combinados || []).filter(function (c) { return c.prospeccaoId === marcaId && !c.patrocinadorId; }); }

// Conta o que interessa para o time: o que falta, o que atrasou e o que veio fora do contrato.
function contarEntregas(lista) {
  var n = { total: 0, entregues: 0, faltam: 0, atrasadas: 0, aConferir: 0, extras: 0, canceladas: 0 };
  (lista || []).forEach(function (e) {
    if (e.status === "a_conferir") { n.aConferir++; return; }
    if (e.status === "cancelado") { n.canceladas++; return; }
    n.total++;
    if (e.status === "entregue") n.entregues++;
    else { n.faltam++; if (e.atrasada) n.atrasadas++; }
    if (e.origem !== "contrato") n.extras++;
  });
  n.pct = n.total ? Math.round(100 * n.entregues / n.total) : 0;
  return n;
}

async function saveCombinado(data) {
  var desc = String(data.descricao || "").trim();
  if ((!data.patrocinadorId && !data.prospeccaoId) || desc.length < 3 || desc.length > 300) throw new Error("Escreva o que foi combinado (até 300 letras).");
  var quem = data.prometidoPorUid ? perfilPorUid(data.prometidoPorUid) : null;
  var dia = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d : ""; };
  var qtd = data.quantidade === "" || data.quantidade == null ? null : Number(data.quantidade);
  if (qtd !== null && !(isFinite(qtd) && qtd >= 0)) throw new Error("Confira a quantidade.");
  var payload = {
    patrocinador_id: data.patrocinadorId || null, prospeccao_id: data.prospeccaoId || null,
    descricao: desc, data: dia(data.data) || hojeMais(0),
    origem: ORIGEM_ENTREGA[data.origem] ? data.origem : "acordo",
    categoria: CATEGORIA_ENTREGA[data.categoria] ? data.categoria : "outro",
    quantidade: qtd, prazo: dia(data.prazo),
    comprovacao: String(data.comprovacao || "").trim().slice(0, 500),
    prometido_por_uid: quem ? quem.id : S.uid, prometido_por_nome: quem ? quem.nome : S.nome,
  };
  try {
    if (data.id) await API.atualizar("combinados", data.id, payload);
    else await API.criar("combinados", Object.assign({ status: "combinado", entregue_em: null, contrato_id: null, trecho: "" }, payload));
  } catch (e) { throw new Error("Não foi possível salvar a entrega."); }
}
async function changeCombinadoStatus(id, status) {
  if (!STATUS_ENTREGA[status]) return;
  var dados = { status: status };
  if (status === "entregue") { dados.entregue_em = hojeMais(0); dados.entregue_por_uid = S.uid; dados.entregue_por_nome = S.nome; }
  else { dados.entregue_em = null; dados.entregue_por_uid = null; dados.entregue_por_nome = ""; }
  try { await API.atualizar("combinados", id, dados); }
  catch (e) { throw new Error("Não foi possível mudar a entrega."); }
}

async function saveSponsor(data) {
  var nome = String(data.nome || "").trim();
  var contato = String(data.contato || "").trim();
  var venc = String(data.dataVencimentoContrato || "").trim();
  var ok = nome.length >= 1 && nome.length <= 120 && contato.length >= 1 && contato.length <= 200 &&
    /^\d{4}-\d{2}-\d{2}$/.test(venc) && TIPO_PATROCINADOR[data.tipo] && STATUS_PATROCINADOR[data.status];
  if (!ok) throw new Error("Não foi possível salvar o patrocinador. Confira os campos.");
  var antes = data.id ? (S.sponsors || []).find(function (x) { return x.id === data.id; }) : null;
  // pessoa que nao esta na lista de perfis (lista ainda carregando ou cadastro sumiu) continua como
  // estava: gravar vazio trocaria o responsavel sem ninguem pedir (e a regra nega para quem nao cuida)
  var vend = data.vendedorUid ? perfilPorUid(data.vendedorUid) : null;
  var mesmoVend = !vend && antes && data.vendedorUid && antes.vendedorUid === data.vendedorUid;
  var payload = {
    nome: nome, contato: contato, tipo: data.tipo, status: data.status, data_vencimento_contrato: venc,
    renovacao: RENOVACAO[data.renovacao] ? data.renovacao : "sem_contato",
    espaco_vinculado_id: data.espacoVinculadoId || null,
    vendedor_uid: vend ? vend.id : mesmoVend ? antes.vendedorUid : null, vendedor_nome: vend ? vend.nome : mesmoVend ? antes.vendedorNome : "",
    responsavel_comercial: vend ? vend.nome : (data.responsavelComercial || ""),
  };
  payload.contratou = String(data.contratou || "").trim().slice(0, 500);
  var atend = data.atendimentoUid ? perfilPorUid(data.atendimentoUid) : null;
  var mesmoAtend = !atend && antes && data.atendimentoUid && antes.atendimentoUid === data.atendimentoUid;
  payload.atendimento_uid = atend ? atend.id : mesmoAtend ? antes.atendimentoUid : null;
  payload.atendimento_nome = atend ? atend.nome : mesmoAtend ? antes.atendimentoNome : "";
  // trocar o vendedor ou o atendimento: so a diretoria, quem ja cuida da marca, ou marca sem ninguem
  if (antes && !podeTrocarResponsaveis(antes) && ((payload.vendedor_uid || null) !== (antes.vendedorUid || null) || (payload.atendimento_uid || null) !== (antes.atendimentoUid || null)))
    throw new Error(AVISO_RESPONSAVEIS);
  // "Renovado" no formulario e a mesma coisa que confirmar a renovacao 2027: guarda a data
  payload.renovacao_2027_em = payload.renovacao === "renovado" ? ((antes && antes.renov2027Em) || hojeMais(0)) : null;
  if (ehAdmin()) payload.master = data.master === true;
  else if (!data.id) payload.master = false;
  var idSalvo = data.id || null;
  try {
    if (data.id) await API.atualizar("patrocinadores", data.id, payload);
    else idSalvo = (await API.criar("patrocinadores", payload)).id;
  } catch (e) { throw new Error("Não foi possível salvar o patrocinador."); }
  // marcou Recusou agora: o espaco de 2026 dela fica livre e a vez da fila comeca hoje
  if (payload.renovacao === "recusou" && (!antes || antes.renovacao !== "recusou")) await comecarVezDepoisDaRecusa(Object.assign({}, antes || {}, { nome: payload.nome }));
  try { await aplicarRegraContratos(); } catch (e) {}
  if (data.id) await sincronizarResponsaveisContratos(data.id, payload.vendedor_uid, payload.atendimento_uid);
  return idSalvo;
}

async function getInteractions() {
  var r;
  try { r = await Promise.all([API.listar("interacoes"), API.listar("patrocinadores"), API.listar("prospeccao")]); }

      registradoPor: nomePessoa(quemUid, i.registrado_por_nome || ""), registradoPorGravado: i.registrado_por_nome || "",

async function suggestNextStep(interactionId) {
  var todas, patrocinadores, prospeccao;
  try { var r = await Promise.all([API.listar("interacoes"), API.listar("patrocinadores"), API.listar("prospeccao")]); todas = r[0]; patrocinadores = r[1]; prospeccao = r[2]; }
  catch (e) { throw new Error("Interação não encontrada."); }
  var current = todas.find(function (i) { return i.id === interactionId; });
  if (!current) throw new Error("Interação não encontrada.");
  var sponsor = current.patrocinador_id ? patrocinadores.find(function (p) { return p.id === current.patrocinador_id; }) : prospeccao.find(function (m) { return m.id === current.prospeccao_id; });
  var mesmoAlvo = function (i) { return current.patrocinador_id ? i.patrocinador_id === current.patrocinador_id : i.prospeccao_id === current.prospeccao_id; };
  var previous = todas
    .filter(function (i) { return mesmoAlvo(i) && new Date(i.data) < new Date(current.data); })
    .sort(porDataDesc).slice(0, 8);
  var history = previous.length
    ? previous.map(function (item) {
        return new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo" }).format(new Date(item.data)) +
          " — Observação: " + item.observacao + "\nPróximo passo registrado: " + item.proximo_passo;
      }).join("\n\n")
    : "Não há interações anteriores.";
  var system = "Você é um assistente de vendas do Festival Interlagos. Sugira somente um próximo passo comercial em português do Brasil, curto, direto, prático e acionável. Não use título, lista, saudação ou explicação. Não invente fatos.";
  var prompt = (current.patrocinador_id ? "Patrocinador: " : "Marca desejo (ainda não patrocina, estamos tentando trazer): ") + ((sponsor && sponsor.nome) || "Marca") + "\n\nObservação atual:\n" + current.observacao +
    "\n\nHistórico anterior, do mais recente para o mais antigo:\n" + history;
  var suggestion;
  try { suggestion = String((await API.gerarTexto(system, prompt)) || "").trim(); }
  catch (e) { throw new Error("Não foi possível gerar a sugestão."); }
  if (!suggestion) throw new Error("A IA não retornou uma sugestão.");
  var shortSuggestion = suggestion.slice(0, 500);
  try { await API.atualizar("interacoes", current.id, { proximo_passo: shortSuggestion }); }
  catch (e) { throw new Error("A sugestão foi criada, mas não pôde ser salva."); }
  return { suggestion: shortSuggestion };
}

// "Nome, e-mail" por linha vira lista de quem assina. Vale so nome, sem e-mail.
function lerSignatarios(texto) {
  return String(texto || "").split(/\n+/).map(function (l) {
    var partes = l.split(/[,;|·]/);
    var nome = (partes[0] || "").trim(), email = (partes[1] || "").trim();
    return nome ? { nome: nome.slice(0, 120), email: email.slice(0, 160) } : null;
  }).filter(Boolean).slice(0, 10);
}

// Quem assina: cada pessoa numa linha com nome e e-mail em campos separados. Sem o e-mail a
// DocuSign nao tem para onde mandar, e um campo proprio deixa isso claro para quem preenche.
function limparAssinantes(lista) {
  return (lista || []).map(function (x) {
    var nome = String(x.nome || "").trim().slice(0, 120), email = String(x.email || "").trim().slice(0, 160);
    return { nome: nome || email.split("@")[0], email: email };
  }).filter(function (x) { return x.nome; }).slice(0, 10);
}
function faltaEmail(x) { return !!x.nome && !EMAIL_VALIDO.test(x.email || ""); }
function linhaAssinante(p) {
  p = p || { nome: "", email: "" };
  var falta = faltaEmail(p) && !p.email;
  return '<div class="linha-assinante">' +
    '<input name="sig_nome" class="' + cn(INPUT, "la-nome") + '" value="' + esc(p.nome || "") + '" placeholder="Nome de quem assina" maxlength="120" aria-label="Nome de quem assina">' +
    '<input name="sig_email" type="email" class="' + cn(INPUT, "la-email", falta && "campo-falta") + '" value="' + esc(p.email || "") + '" placeholder="' + (falta ? "Falta o e-mail" : "E-mail de quem assina") + '" maxlength="160" aria-label="E-mail de quem assina">' +
    '<button type="button" class="' + btnCls("ghost", "icon", "la-tirar") + '" data-acao="remover-assinante" title="Tirar esta pessoa" aria-label="Tirar esta pessoa">' + icone("x", "h-4 w-4") + "</button>" +
  "</div>";
}
function textoFaltaEmail(lista) {
  var sem = (lista || []).filter(faltaEmail);

async function saveContract(data, arquivo, arquivoPronto) {
  var titulo = String(data.titulo || "").trim();
  if (!data.patrocinadorId || titulo.length < 2 || titulo.length > 160 || !STATUS_CONTRATO[data.status]) throw new Error("Escolha o patrocinador, dê um título ao contrato e confira o status.");
  var cAntes = data.id ? (S.contracts || []).find(function (x) { return x.id === data.id; }) : null;
  if (cAntes && opcoesStatusContrato(cAntes).indexOf(data.status) < 0) throw new Error(AVISO_STATUS_CONTRATO);
  var ok = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || ""); };
  var inicio = ok(data.inicio) ? data.inicio : "", fim = ok(data.fim) ? data.fim : "";
  if (inicio && fim && fim < inicio) throw new Error("A data de fim vem antes do início.");
  var valor = data.valor === "" || data.valor == null ? null : Number(data.valor);
  if (valor !== null && !(isFinite(valor) && valor >= 0)) throw new Error("Confira o valor.");
  if (arquivo && arquivo.size > 20 * 1024 * 1024) throw new Error("O PDF passa de 20 MB.");
  if (arquivo && arquivo.type && arquivo.type !== "application/pdf") throw new Error("Só aceitamos PDF.");
  var dono = (S.sponsors || []).find(function (x) { return x.id === data.patrocinadorId; });
  var payload = {
    patrocinador_id: data.patrocinadorId, titulo: titulo, status: data.status, inicio: inicio, fim: fim, valor: valor,
    vendedor_uid: dono ? dono.vendedorUid || null : null, atendimento_uid: dono ? dono.atendimentoUid || null : null,
    edicao: EDICOES_IDS.indexOf(data.edicao) >= 0 ? data.edicao : "",
    signatarios: Array.isArray(data.signatarios) ? limparAssinantes(data.signatarios) : lerSignatarios(data.signatarios), observacao: String(data.observacao || "").trim().slice(0, 1000),
  };
  if (arquivoPronto && arquivoPronto.path) { payload.arquivo_path = arquivoPronto.path; payload.arquivo_nome = arquivoPronto.nome; }
  if (arquivo) {
    var limpo = arquivo.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "-").slice(0, 80) || "contrato.pdf";
    var caminho = "contratos/" + data.patrocinadorId + "/" + Date.now() + "-" + limpo;
    try { await API.subirArquivo(caminho, arquivo); } catch (e) { throw new Error("Não foi possível guardar o PDF. Tente de novo."); }
    payload.arquivo_path = caminho; payload.arquivo_nome = arquivo.name;
  }
  if (data.status === "assinado" && !data.assinadoEm) payload.assinado_em = hojeMais(0);
  var id = data.id || null;
  marcarMexidaPropria(id);
  try {
    if (id) await API.atualizar("contratos", id, payload);
    else id = (await API.criar("contratos", Object.assign({ arquivo_path: "", arquivo_nome: "", assinado_em: null }, payload))).id;
  } catch (e) { throw new Error("Não foi possível salvar o contrato."); }
  // contrato assinado com data de fim atualiza o vencimento do patrocinador, que alimenta os alertas
  var venc = null;
  if (data.status === "assinado" && fim) {
    var p = (S.sponsors || []).find(function (x) { return x.id === data.patrocinadorId; });
    if (p && (!p.dataVencimentoContrato || fim > p.dataVencimentoContrato)) {
      try { await API.atualizar("patrocinadores", p.id, { data_vencimento_contrato: fim, status: p.status === "encerrado" ? "encerrado" : "ativo" }); venc = fim; } catch (e) {}
    }
  }
  return { id: id, vencimentoAtualizado: venc };
}

// Trocou o vendedor ou o atendimento da marca: os contratos dela passam a ser vistos pela pessoa nova.
// Le os contratos na hora, inclusive os que estao na lixeira (senao o contrato excluido ficava com o
// responsavel antigo, que continuava vendo e podia restaurar). Quem nao e da diretoria so alcanca os

async function sincronizarResponsaveisContratos(patroId, vendedorUid, atendimentoUid) {

    var mudar = todos.filter(function (c) {

// Status que quem nao e da diretoria pode escolher (a regra confere o mesmo): contrato assinado
// fica assinado, e o que ja saiu do rascunho nao volta para rascunho. Voltar para rascunho era o
// caminho para quem criou excluir um contrato enviado ou assinado.
function opcoesStatusContrato(c) {
  var todos = Object.keys(STATUS_CONTRATO);
  if (ehAdmin() || !c) return todos;
  if (c.status === "assinado") return ["assinado"];
  return todos.filter(function (k) { return k !== "rascunho" || c.status === "rascunho"; });
}
var AVISO_STATUS_CONTRATO = "Só a diretoria tira um contrato do assinado ou volta para rascunho.";
async function changeContractStatus(id, status) {
  if (!STATUS_CONTRATO[status]) return;

  if (atualC && opcoesStatusContrato(atualC).indexOf(status) < 0) throw new Error(AVISO_STATUS_CONTRATO);

// A IA nao sabe o que a marca ja tem cadastrado, e escreve a mesma entrega com outras
// palavras a cada leitura. Entao a comparacao e por palavra que importa, nao por texto igual.
var PALAVRAS_VAZIAS = { para: 1, como: 1, cada: 1, toda: 1, todo: 1, todos: 1, todas: 1, seus: 1, suas: 1, pelo: 1, pela: 1, pelos: 1, pelas: 1, sera: 1, serao: 1, sobre: 1, esse: 1, essa: 1, este: 1, esta: 1, deste: 1, desta: 1, evento: 1, marca: 1, contrato: 1, durante: 1, conforme: 1, ainda: 1, mesmo: 1, sendo: 1, tera: 1, terao: 1, havera: 1, ficara: 1, que: 1, com: 1, por: 1, uma: 1, uns: 1, dos: 1, das: 1, nos: 1, nas: 1, aos: 1, seu: 1, sua: 1, sob: 1, ser: 1, sao: 1, tem: 1, ate: 1, mais: 1, entre: 1, quando: 1, onde: 1, qualquer: 1, deve: 1, devera: 1, deverao: 1, podera: 1, poderao: 1, item: 1, itens: 1 };
function palavrasChave(txt) {
  return String(txt || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[-'\u2019.]/g, "")
    .replace(/[^a-z0-9]+/g, " ").split(" ")
    .filter(function (p) { return (/^[0-9]{2,}$/.test(p) || p.length >= 3) && !PALAVRAS_VAZIAS[p]; });
}
function pareceMesmaEntrega(a, b) {
  // Quantidade diferente e entrega diferente: 2 posts nao e a mesma coisa que 6 posts.
  if (a.quantidade != null && b.quantidade != null && a.quantidade !== b.quantidade) return false;
  var A = palavrasChave(a.descricao), B = palavrasChave(b.descricao);
  if (!A.length || !B.length) return false;
  var uniA = {}, uniB = {};
  A.forEach(function (p) { uniA[p] = 1; });
  B.forEach(function (p) { uniB[p] = 1; });
  var listaA = Object.keys(uniA), listaB = Object.keys(uniB);
  var repetidas = listaA.filter(function (p) { return uniB[p]; });
  var iguais = repetidas.length;
  var juntos = listaA.length + listaB.length - iguais;
  var menor = Math.min(listaA.length, listaB.length);
  var semNumero = repetidas.filter(function (p) { return !/^[0-9]+$/.test(p); });
  // Na duvida o certo e deixar passar e a pessoa cancelar o repetido. Sumir com uma
  // entrega de verdade ninguem percebe, e e o erro que machuca.

  // 1) quase toda palavra bate nos dois lados: e a mesma entrega escrita de novo.
  if (iguais / juntos >= 0.5) return true;

  // 2) a frase curta cabe quase inteira dentro da longa, e o que se repete nao e so
  //    numero. Pega o caso de a IA reescrever o comeco: "Nome da arena" e "Direito de
  //    nomear a arena de provas na comunicacao oficial".
  if (iguais / menor >= 0.75 && semNumero.length >= 2) return true;

  // 3) as duas comecam pelo mesmo assunto e dividem metade das palavras. Assunto e a
  //    primeira palavra que nao e numero: em "60 credenciais VIP" o assunto e
  //    credenciais, nao o 60. Exige ainda dividir algo alem do assunto e do numero,
  //    senao "25 credenciais de staff" e "25 credenciais de area VIP" virariam iguais.
  var assunto = function (l) { for (var i = 0; i < l.length; i++) if (!/^[0-9]+$/.test(l[i])) return l[i]; return l[0]; };
  var chave = assunto(A);
  if (chave !== assunto(B) || iguais < 2 || iguais / menor < 0.5) return false;
  return semNumero.some(function (p) { return p !== chave; });
}

// Grava em Propriedades o que a leitura trouxe. pularCabecalho serve para quando a
// pessoa ja conferiu vigencia e valor na tela antes de salvar.
async function gravarEntregasLidas(c, dados, pularCabecalho) {
  var itens = (dados && dados.entregas) || [];
  var dia = function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(String(d || "")) ? d : ""; };
  // O que a marca ja tem vale como referencia, menos o que foi cancelado.
  var jaTem = combinadosDe(c.patrocinadorId).filter(function (e) { return e.status !== "cancelado"; })
    .map(function (e) { return { descricao: e.descricao, quantidade: e.quantidade }; });
  var criados = 0, repetidos = 0, pulados = [];
  for (var k = 0; k < itens.length && k < 40; k++) {
    var it = itens[k] || {};
    var desc = String(it.descricao || "").trim().slice(0, 300);
    if (desc.length < 3) continue;
    var bruta = it.quantidade == null || it.quantidade === "" ? null : Number(it.quantidade);
    var qtd = bruta !== null && isFinite(bruta) && bruta >= 0 ? bruta : null;
    // "15 · 15 vagas" fica feio: se a descricao comeca pelo proprio numero, tira.
    if (qtd !== null) {
      var semNumero = desc.replace(new RegExp("^" + String(qtd).replace(/\./g, "\\.") + "\\s+(?![m²x×])", "i"), "");
      if (semNumero !== desc && semNumero.length > 3) desc = semNumero.charAt(0).toLocaleUpperCase("pt-BR") + semNumero.slice(1);
    }
    var novo = { descricao: desc, quantidade: qtd };
    var repetida = jaTem.some(function (e) { return pareceMesmaEntrega(novo, e); });
    if (repetida) { repetidos++; pulados.push(desc); continue; }
    try {
      var criado = await API.criar("combinados", {
        patrocinador_id: c.patrocinadorId, prospeccao_id: null,
        descricao: desc, status: "a_conferir", origem: "contrato",
        categoria: CATEGORIA_ENTREGA[it.categoria] ? it.categoria : "outro",
        quantidade: qtd,
        prazo: dia(it.prazo), contrato_id: c.id, trecho: "",
        data: hojeMais(0), entregue_em: null, comprovacao: "",
        prometido_por_uid: S.uid, prometido_por_nome: S.nome,
      });
      criados++;
      jaTem.push(novo);
      // o trecho e texto do contrato: fica em combinados_trecho, que a Visualizacao nao le
      var trecho = String(it.trecho || "").trim().slice(0, 400);
      if (trecho && criado && criado.id) { try { await API.definir("combinados_trecho", criado.id, { trecho: trecho, contrato_id: c.id, patrocinador_id: c.patrocinadorId }); } catch (e2) {} }
    } catch (e) {}
  }
  if (!criados && !repetidos) throw new Error("Não foi possível guardar as entregas lidas.");

  // A leitura foi feita (na mao ou sozinha): a leitura automatica nao repete este contrato, mesmo
  // que depois a pessoa mande as entregas para a lixeira ou cancele todas
  var lidoEm = agoraIso();
  if (pularCabecalho) {
    try { await API.atualizar("contratos", c.id, { ia_lido_em: lidoEm }); } catch (e) {}
    return { criados: criados, completou: [], repetidos: repetidos, pulados: pulados, divergiu: [] };
  }

  // Campo vazio a IA preenche. Campo que uma pessoa digitou ela nunca sobrescreve: se
  // o PDF disser outra coisa, ela so guarda o que leu e o cartao mostra o recado.
  var completou = [], divergiu = [];
  var mudanca = { ia_lido_em: lidoEm };
  var iaIni = dia(dados.vigencia_inicio), iaFim = dia(dados.vigencia_fim);
  var iaVal = dados.valor != null && isFinite(Number(dados.valor)) && Number(dados.valor) > 0 ? Number(dados.valor) : null;

  if (iaIni) { if (!c.inicio) { mudanca.inicio = iaIni; completou.push("início"); mudanca.ia_inicio = null; } else if (c.inicio !== iaIni) { mudanca.ia_inicio = iaIni; divergiu.push("início"); } else mudanca.ia_inicio = null; }
  if (iaFim) { if (!c.fim) { mudanca.fim = iaFim; completou.push("fim"); mudanca.ia_fim = null; } else if (c.fim !== iaFim) { mudanca.ia_fim = iaFim; divergiu.push("fim"); } else mudanca.ia_fim = null; }
  if (iaVal !== null) { if (c.valor == null) { mudanca.valor = iaVal; completou.push("valor"); mudanca.ia_valor = null; } else if (Number(c.valor) !== iaVal) { mudanca.ia_valor = iaVal; divergiu.push("valor"); } else mudanca.ia_valor = null; }

  if (Object.keys(mudanca).length) { try { await API.atualizar("contratos", c.id, mudanca); } catch (e) { completou = []; divergiu = []; } }
  return { criados: criados, completou: completou, repetidos: repetidos, pulados: pulados, divergiu: divergiu };
}

// Contrato assinado reserva o lugar fisico da marca no mapa. Acha o espaco por duas
// vias: o vinculo que o vendedor ja fez, e a planta de 2026, onde cada espaco guarda a
// marca que estava nele. Nunca encosta em espaco que ja e de outra marca.
// Razao social tem um monte de enfeite que o painel nao usa: "CFMOTO DO BRASIL
// IMPORTACAO E COMERCIO LTDA" e "CFMOTO" sao a mesma marca.
var ENFEITE_RAZAO_SOCIAL = /\b(ltda|limitada|me|epp|eireli|sa|s a|cia|companhia|comercio|comercial|industria|industrial|importacao|exportacao|distribuidora|participacoes|holding|group|grupo|do brasil|brasil|latam|inc|corp|e)\b/g;
function nucleoDaMarca(txt) {
  var t = String(txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(ENFEITE_RAZAO_SOCIAL, " ").replace(/\s+/g, " ").trim();
  return t;
}
// true = bate, false = nao bate, null = nao deu para comparar
function marcaBate(nomeNoPainel, nomeNoContrato) {
  var a = nucleoDaMarca(nomeNoPainel), b = nucleoDaMarca(nomeNoContrato);
  if (!a || !b) return null;
  if (a === b || b.indexOf(a + " ") === 0 || a.indexOf(b + " ") === 0) return true;
  var pa = a.split(" ").filter(function (x) { return x.length >= 3; });
  var pb = b.split(" ").filter(function (x) { return x.length >= 3; });
  if (!pa.length || !pb.length) return null;
  var menor = pa.length <= pb.length ? pa : pb, maior = pa.length <= pb.length ? pb : pa;
  var dentro = menor.filter(function (x) { return maior.indexOf(x) >= 0; }).length;
  return dentro / menor.length >= 0.6;
}

function mesmaMarca(a, b) {
  var limpa = function (t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); };
  var x = limpa(a), y = limpa(b);
  return !!x && x === y;
}
async function reservarEspacosDoContrato(contrato) {
  var vazio = { reservados: [], conflitos: [], marca: "" };
  if (!contrato || contrato.status !== "assinado" || !contrato.patrocinadorId) return vazio;
  // quem chega pela tela de Contratos ainda nao carregou espacos nem marcas
  var faltando = [];
  if (!S.sponsors) faltando.push(carregar("sponsors", getSponsors));
  if (!S.spaces) faltando.push(carregar("spaces", getSpaces));
  if (faltando.length) { try { await Promise.all(faltando); } catch (e) { return vazio; } }
  var marca = (S.sponsors || []).find(function (p) { return p.id === contrato.patrocinadorId; });
  if (!marca) return vazio;
  var espacos = S.spaces || [];
  if (!espacos.length) return vazio;

  var candidatos = [];
  var junta = function (e) { if (e && candidatos.indexOf(e) < 0) candidatos.push(e); };
  // 1) o espaco que ja esta amarrado na ficha da marca
  if (marca.espacoVinculadoId) junta(espacos.find(function (e) { return e.id === marca.espacoVinculadoId; }));
  // 2) os espacos em que essa marca estava em 2026, na edicao do contrato
  if (contrato.edicao) {
    espacos.forEach(function (e) { if (e.edicao === contrato.edicao && mesmaMarca(e.ocupante2026, marca.nome)) junta(e); });
  }
  if (!candidatos.length) return { reservados: [], conflitos: [], marca: marca.nome };

  var reservados = [], conflitos = [], mudancas = [];
  candidatos.forEach(function (e) {
    var deOutro = (e.patrocinador && e.patrocinador.nome && !mesmaMarca(e.patrocinador.nome, marca.nome)) ||
      (e.reservadoParaId && e.reservadoParaId !== marca.id);
    if (deOutro) { conflitos.push(e.nome + " (já é de " + ((e.patrocinador && e.patrocinador.nome) || e.reservadoParaNome) + ")"); return; }
    if (e.status === "vendido") return; // ja esta fechado com a propria marca, nao rebaixa
    if (e.status === "reservado" && e.reservadoParaId === marca.id) return; // ja estava reservado para ela
    mudancas.push({ col: "espacos", id: e.id, dados: { status: "reservado", reservado_para_id: marca.id, reservado_para_nome: marca.nome, reservado_por_contrato: contrato.id, reservado_ate: null } });
    reservados.push(e.nome);
  });
  if (mudancas.length) {
    try { await API.atualizarVarios(mudancas); } catch (e) { return { reservados: [], conflitos: conflitos, marca: marca.nome, falhou: true }; }
    // a ficha da marca aponta para um espaco so: preenche se ainda estiver vazia
    if (!marca.espacoVinculadoId) { try { await API.atualizar("patrocinadores", marca.id, { espaco_vinculado_id: mudancas[0].id }); } catch (e) {} }
  }
  return { reservados: reservados, conflitos: conflitos, marca: marca.nome };
}

// Mostra na tela o que a reserva automatica fez, sempre com o nome dos espacos.
async function avisarReservaDeEspacos(contrato) {
  var r;
  try { r = await reservarEspacosDoContrato(contrato); } catch (e) { return; }
  if (r.falhou) { toast.error("Não consegui reservar os espaços da " + r.marca + ". Faça na mão na tela de Espaços."); return; }
  if (r.reservados.length) {

// Ao abrir o painel, procura contrato assinado que nunca reservou espaco nenhum e
// resolve. Pega o contrato assinado de outro computador e, amanha, o que voltar assinado
// sozinho pela assinatura automatica.
//
// So mexe em contrato que NUNCA reservou nada. Se ele ja reservou uma vez e alguem
// devolveu o espaco para Disponivel de proposito, foi decisao de gente e fica como esta.
function contratoJaReservouAlgumaVez(c) {
  return (S.spaces || []).some(function (e) { return e.reservadoPorContrato === c.id; });
}
async function conferirReservasPendentes() {
  if (!podeMexer()) return; // reserva espaco (grava): quem so visualiza nao dispara
  var assinados =(S.contracts || []).filter(function (c) {
    return c.status === "assinado" && c.edicao && c.patrocinadorId && !contratoJaReservouAlgumaVez(c);
  });
  if (!assinados.length) return;
  var feitos = [];
  for (var i = 0; i < assinados.length && i < 20; i++) {
    var r;
    try { r = await reservarEspacosDoContrato(assinados[i]); } catch (e) { continue; }
    if (r && r.reservados.length) feitos.push({ marca: r.marca, espacos: r.reservados });
  }
  if (!feitos.length) return;
  try { await Promise.all([carregar("spaces", getSpaces), carregar("sponsors", getSponsors)]); } catch (e) {}
  var total = feitos.reduce(function (n, x) { return n + x.espacos.length; }, 0);
  var quem = feitos.map(function (x) { return x.marca }).join(", ");
  toast.success(total + " espaço" + (total > 1 ? "s foram reservados" : " foi reservado") + " por contrato assinado fora daqui: " + quem + ".");
}

// Vermelho = passou do prazo sem confirmar ou sem assinar. Amarelo = prazo chegando. O resto

var FORMA_PAGAMENTO = {

};

var DIAS_SEMANA = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
function dataCurta(iso) { var d = String(iso || ""); return /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(8, 10) + "/" + d.slice(5, 7) : ""; }
function dataComDia(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return "";
  return dataCurta(iso) + "/" + iso.slice(0, 4) + " (" + DIAS_SEMANA[new Date(iso + "T12:00:00Z").getUTCDay()] + ")";
}
function chaveMarca(t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
// A base de 2026 sao as marcas que ocuparam algum espaco na planta de 2026 (ocupante_2026).
// Marca nova para 2027 nao "renova": fica fora da conta e dos alertas de renovacao.
var cacheBase = { fonte: null, porMarca: null };
function espacos2026PorMarca() {
  if (!S.spaces) return null;
  if (cacheBase.fonte !== S.spaces) {
    var m = {};
    S.spaces.forEach(function (e) { var k = chaveMarca(e.ocupante2026); if (k) (m[k] = m[k] || []).push(e); });
    cacheBase = { fonte: S.spaces, porMarca: m };
  }
  return cacheBase.porMarca;
}
function naBase2026(p) {
  if (p.base2026 === true || p.base2026 === false) return p.base2026;
  var m = espacos2026PorMarca();
  if (!m) return true; // sem os espacos na mao ainda: quase toda a carteira e da base
  return !!m[chaveMarca(p.nome)];
}
function espacos2026De(p) { var m = espacos2026PorMarca(); return (m && m[chaveMarca(p.nome)]) || []; }
// De que edicao e cada coisa. Marca: pelos espacos de 2026, pelo espaco vinculado e pelos
// contratos dela. Quem nao tem nada disso fica sem edicao e aparece nas duas.
function juntaEdicao(lista, ed) { if (ed && lista.indexOf(ed) < 0) lista.push(ed); }
function edicoesDaMarca(p) {
  if (!p) return [];
  var eds = [];
  espacos2026De(p).forEach(function (e) { juntaEdicao(eds, e.edicao); });
  if (p.espacoVinculadoId) {
    var v = (S.spaces || []).find(function (e) { return e.id === p.espacoVinculadoId; });
    if (v) juntaEdicao(eds, v.edicao);
  }
  (S.contracts || []).forEach(function (c) { if (c.patrocinadorId === p.id) juntaEdicao(eds, c.edicao); });
  return eds;
}
function edicoesDaMarcaDesejo(m) {
  if (!m || !m.espacoInteresseId) return [];
  var e = (S.spaces || []).find(function (x) { return x.id === m.espacoInteresseId; });
  return e && e.edicao ? [e.edicao] : [];
}

// Monta o que vai para a lixeira e os avisos da confirmacao. Patrocinador leva junto, com o
