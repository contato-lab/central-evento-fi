<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Resultado · Pesquisa Imprensa · Suhai Festival Interlagos</title>
<style>
  :root{
    --bg:#0B0C0A; --panel:#141613; --panel-2:#1B1E18; --raise:#23271F;
    --line:#2B3026; --ink:#F4F6EF; --ink-2:#A9AFA2; --ink-3:#767C6E;
    --lime:#A6EC4D; --lime-ink:#0B0C0A; --red:#F5453F; --amber:#FBBF24;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(166,236,77,.07),transparent 60%),var(--bg);
    color:var(--ink);font:15px/1.5 var(--font)}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 16px 60px}
  header img{height:40px;display:block;margin-bottom:12px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .desc{color:var(--ink-2);margin:0 0 16px;font-size:.92rem}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{min-height:42px;padding:9px 16px;border-radius:999px;border:2px solid var(--line);
    background:var(--panel-2);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card .rot{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
  .card .big{font-size:2.1rem;font-weight:800;line-height:1.1;margin-top:4px}
  .card .sub{color:var(--ink-3);font-size:.8rem;margin-top:4px}
  .bloco{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .bloco h2{font-size:1rem;margin:0 0 12px}
  .linha{display:flex;align-items:center;gap:10px;margin:7px 0}
  .linha .op{width:150px;flex:0 0 auto;font-size:.85rem;color:var(--ink-2)}
  .linha .barra{flex:1;background:var(--panel-2);border-radius:6px;height:26px;overflow:hidden}
  .linha .fill{height:100%;background:var(--lime);border-radius:6px;min-width:2px}
  .linha .fill.neg{background:var(--red)}
  .linha .fill.meio{background:var(--amber)}
  .linha .n{width:86px;flex:0 0 auto;font-family:var(--mono);font-size:.8rem;text-align:right}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){ .duas{grid-template-columns:1fr} }
  .fala{background:var(--panel-2);border-left:3px solid var(--line);border-radius:8px;
    padding:10px 12px;margin:8px 0;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
  .fala .ed{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);display:block;margin-top:6px}
  .vazio{color:var(--ink-3);padding:8px 0}
  .npsfaixa{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:10px}
  .npsfaixa i{display:block}
  .npsleg{display:flex;gap:14px;margin-top:8px;font-size:.78rem;color:var(--ink-2);flex-wrap:wrap}
  .pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../logo.png" alt="Suhai Festival Interlagos">
    <h1>Pesquisa de satisfação · Imprensa · Resultado</h1>
    <p class="desc" id="quando">Carregando…</p>
  </header>

  <div class="chips" role="group" aria-label="Filtrar por edição">
    <button class="chip" data-f="todas" aria-pressed="true">Todas</button>
    <button class="chip" data-f="moto" aria-pressed="false">Cobriu a Moto</button>
    <button class="chip" data-f="auto" aria-pressed="false">Cobriu a Auto</button>
  </div>

  <div class="cards">
    <div class="card"><span class="rot">Respostas</span><div class="big" id="cRespostas">–</div><div class="sub" id="cEdicoes"></div></div>
    <div class="card"><span class="rot">NPS</span><div class="big" id="cNps">–</div>
      <div class="npsfaixa" id="npsFaixa"></div>
      <div class="npsleg"><span><i class="pt" style="background:var(--lime)"></i>promotores <b id="nProm">–</b></span>
        <span><i class="pt" style="background:var(--amber)"></i>neutros <b id="nNeu">–</b></span>
        <span><i class="pt" style="background:var(--red)"></i>detratores <b id="nDet">–</b></span></div></div>
    <div class="card"><span class="rot">Nota geral média</span><div class="big" id="cMedia">–</div><div class="sub">de 1 a 5</div></div>
  </div>

  <div id="blocos"></div>

  <div class="bloco"><h2>Quem se identificou</h2><div id="lIdent"></div></div>

  <div class="duas">
    <div class="bloco"><h2>O que mais atrapalhou</h2><div id="lAtrapalhou"></div></div>
    <div class="bloco"><h2>O que mais ajudou</h2><div id="lAjudou"></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";
  var VERSAO = "2026-09-02.2";
  var firebaseConfig = {
    apiKey: "AIzaSyBMY82Mcp1rhNXHt6gQhTvyV4VAjIkU0bI",
    authDomain: "festival-interlagos-2026.firebaseapp.com",
    projectId: "festival-interlagos-2026",
    storageBucket: "festival-interlagos-2026.firebasestorage.app",
    messagingSenderId: "31705575491",
    appId: "1:31705575491:web:fcf7ef1b01d05b71c9a4f6"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  function $(q){ return document.querySelector(q); }
  function esc(t){ var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }

  // mesmos campos e valores do formulario; positivo primeiro, negativo no fim
  var BLOCOS = [
    { campo:"credenciamento", titulo:"Retirada do credenciamento",
      ops:[["muito_facil","Muito fácil"],["facil","Fácil"],["dificil","Difícil"],["muito_dificil","Muito difícil"]] },
    { campo:"sala", titulo:"Sala de imprensa",
      ops:[["muito_boa","Muito boa"],["boa","Boa"],["ruim","Ruim"],["muito_ruim","Muito ruim"]] },
    { campo:"agenda", titulo:"Agenda de coletivas na Central",
      ops:[["muito_boa","Muito boa"],["boa","Boa"],["ruim","Ruim"],["muito_ruim","Muito ruim"]] },
    { campo:"disparos", titulo:"Disparos no WhatsApp",
      ops:[["muito_bem","Muito bem"],["bem","Bem"],["mal","Mal"],["muito_mal","Muito mal"]] },
    { campo:"avisos", titulo:"Avisos operacionais",
      ops:[["muito_bons","Muito bons"],["bons","Bons"],["ruins","Ruins"],["muito_ruins","Muito ruins"]] },
    { campo:"quantidade", titulo:"Quantidade de mensagens", tom:"meio",
      ops:[["pouca","Pouca"],["na_medida","Na medida"],["demais","Demais"]] },
    { campo:"canal", titulo:"Canal preferido", tom:"neutro",
      ops:[["whatsapp","WhatsApp"],["email","E-mail"],["central","Central no navegador"],["push","Notificação pela Central"]] }
  ];
  var EDI = { moto:"Moto", auto:"Auto", ambas:"As duas" };

  var todas = [], filtro = "todas";

  document.addEventListener("click", function(ev){
    var c = ev.target.closest(".chip"); if(!c) return;
    filtro = c.getAttribute("data-f");
    var cs = document.querySelectorAll(".chip");
    for(var i=0;i<cs.length;i++) cs[i].setAttribute("aria-pressed", cs[i] === c ? "true" : "false");
    pintar();
  });

  function visiveis(){
    if(filtro === "todas") return todas;
    // quem cobriu as duas conta nos dois recortes
    return todas.filter(function(r){ return r.edicao === filtro || r.edicao === "ambas"; });
  }

  function pintar(){
    var v = visiveis();
    $("#cRespostas").textContent = v.length;
    var porEd = {};
    v.forEach(function(r){ porEd[r.edicao] = (porEd[r.edicao] || 0) + 1; });
    $("#cEdicoes").textContent = Object.keys(porEd).map(function(k){
      return (EDI[k] || k) + ": " + porEd[k];
    }).join(" · ");

    // NPS: promotor 9-10, neutro 7-8, detrator 0-6
    var prom = 0, neu = 0, det = 0;
    v.forEach(function(r){
      if(typeof r.nps !== "number") return;
      if(r.nps >= 9) prom++; else if(r.nps >= 7) neu++; else det++;
    });
    var nv = prom + neu + det;
    $("#cNps").textContent = nv ? Math.round(100 * (prom - det) / nv) : "–";
    $("#nProm").textContent = prom; $("#nNeu").textContent = neu; $("#nDet").textContent = det;
    $("#npsFaixa").innerHTML = nv
      ? '<i style="width:' + (100*prom/nv) + '%;background:var(--lime)"></i>' +
        '<i style="width:' + (100*neu/nv)  + '%;background:var(--amber)"></i>' +
        '<i style="width:' + (100*det/nv)  + '%;background:var(--red)"></i>'
      : "";

    var notas = v.filter(function(r){ return typeof r.nota_geral === "number"; });
    $("#cMedia").textContent = notas.length
      ? (notas.reduce(function(s,r){ return s + r.nota_geral; }, 0) / notas.length).toFixed(1).replace(".", ",")
      : "–";

    var h = "";
    BLOCOS.forEach(function(b){
      var cont = {}, total = 0;
      v.forEach(function(r){ var x = r[b.campo]; if(x){ cont[x] = (cont[x] || 0) + 1; total++; } });
      h += '<div class="bloco"><h2>' + b.titulo + (total ? ' <span style="color:var(--ink-3);font-weight:400">· ' + total + ' resposta' + (total===1?'':'s') + '</span>' : '') + '</h2>';
      if(!total){ h += '<p class="vazio">Sem respostas ainda.</p></div>'; return; }
      b.ops.forEach(function(o, i){
        var n = cont[o[0]] || 0, pc = Math.round(100 * n / total);
        var classe = "fill";
        if(b.tom === "neutro"){ /* ranking, tudo lime */ }
        else if(b.tom === "meio"){ classe += (o[0] === "na_medida" ? "" : " meio"); }
        else { classe += (i >= b.ops.length - 2 ? " neg" : ""); }
        h += '<div class="linha"><span class="op">' + o[1] + '</span>' +
             '<div class="barra"><div class="' + classe + '" style="width:' + pc + '%"></div></div>' +
             '<span class="n">' + n + ' · ' + pc + '%</span></div>';
      });
      h += '</div>';
    });
    $("#blocos").innerHTML = h;

    function listar(alvo, campo){
      var hh = "";
      v.slice().sort(function(a,b){ return (b.criadoEm||0) - (a.criadoEm||0); }).forEach(function(r){
        if(r[campo]){
          var quem = [r.nome, r.veiculo].filter(Boolean).join(" · ");
          hh += '<div class="fala">' + esc(r[campo]) +
            '<span class="ed">' + esc([EDI[r.edicao] || "", quem].filter(Boolean).join(" · ")) + '</span></div>';
        }
      });
      $(alvo).innerHTML = hh || '<p class="vazio">Nenhum comentário ainda.</p>';
    }
    listar("#lAtrapalhou", "atrapalhou");
    listar("#lAjudou", "ajudou");

    var hi = "";
    v.forEach(function(r){
      if(!(r.nome || r.telefone || r.veiculo)) return;
      hi += '<div class="fala">' + esc([r.nome, r.veiculo, r.telefone].filter(Boolean).join(" · ")) +
        '<span class="ed">' + esc(EDI[r.edicao] || "") + '</span></div>';
    });
    $("#lIdent").innerHTML = hi || '<p class="vazio">Ninguém se identificou ainda. A identificação é opcional.</p>';
  }

  db.collection("pesq_imprensa").onSnapshot(function(snap){
    todas = [];
    snap.forEach(function(d){ todas.push(d.data()); });
    $("#quando").textContent = todas.length
      ? "Atualiza sozinho. " + todas.length + " resposta" + (todas.length===1?"":"s") + " até agora."
      : "Nenhuma resposta ainda. A página atualiza sozinha quando chegarem.";
    pintar();
  }, function(){
    $("#quando").textContent = "Perdemos a conexão com o banco. Recarregue a página.";
  });
})();
</script>
</body>
</html>
